<script>
  class Evt {
    // --- マルチセレクト切替 ---
    static tglMulti(tgt, statePath) {
      const cntr = tgt.closest('ob-multi-select');
      if (!cntr) return;
      const itemCbs = [...cntr.querySelectorAll('.dataset-cb')], allCb = cntr.querySelector('.select-all-cb');
      if (allCb) allCb.checked = itemCbs.length > 0 && itemCbs.every(cb => cb.checked);
      State.set(statePath, itemCbs.filter(cb => cb.checked).map(cb => cb.value));
    }
    // --- 全選択切替 ---
    static tglAllMulti(tgt, statePath) {
      const cntr = tgt.closest('ob-multi-select');
      if (!cntr) return;
      const itemCbs = cntr.querySelectorAll('.dataset-cb');
      itemCbs.forEach(cb => cb.checked = tgt.checked);
      State.set(statePath, tgt.checked ? [...itemCbs].map(cb => cb.value) : []);
    }
    static #bindMulti = path => tgt => this.tglMulti(tgt, path);
    static #bindAll = path => tgt => this.tglAllMulti(tgt, path);
    // --- Tab1イベント群 ---
    static T1 = {
      checkT1Pref: mode => {
        if (!mode) return;
        const modeText = mode === "Dual" ? "セット抽出対応" : "1ファイル単位抽出";
        const phs = State.get("T1ST.phase"), isInit = phs === T1_PHS.INIT, isInvalid = phs >= T1_PHS.INVALID;
        isInvalid && State.set("T1ST.raw.status", ["error", "モード変更検知"]); // 再検証要求
        State.set({ "T1ST.pref.status": ["message", modeText], ...(isInit || isInvalid ? { "T1ST.phase": isInit ? T1_PHS.READY : T1_PHS.INVALID } : {}) });
      },
      renewRawRefs: tgt => {
        State.set(`T1ST.raw.refs.${tgt.dataset.field}`, tgt.value);
        Evt.T1.checkRawRefs();
      },
      checkRawRefs: () => {
        const flags = Mtd.Util.validateSelect(GLB.Conf.fileFields.map(f => State.get(`T1ST.raw.refs.${f.key}`) || ""), 3);
        State.set({ "T1ST.raw.hasRefErr": flags, "T1ST.raw.status": flags.some(Boolean) ? ["error", "エラー: 列選択"] : State.get("T1ST.raw.cachedStatus") });
      },
      checkExtrRefs: () => {
        const isErr = !(State.get("T1ST.extr.refs.DB")?.trim());
        State.set({ "T1ST.extr.hasRefErr": [isErr, false, false], "T1ST.extr.status": isErr ? ["error", "エラー: DB未入力"] : State.get("T1ST.extr.cachedStatus") });
      }
    };
    // --- Tab2イベント群 ---
    static T2 = {
      tglDB: this.#bindMulti("T2ST.asgn.filter"),
      tglAllDB: this.#bindAll("T2ST.asgn.filter"),
      checkAxis: async tgtSelect => {
        const newVal = tgtSelect.value, oldVal = State.get("T2ST.symb.baseKey");
        if (newVal === oldVal) return;
        if (!await NewDOM.confirm("確認", "リセットしますか？")) return (tgtSelect.value = oldVal); // 元に戻す
        State.set({ "T2ST.symb.baseKey": newVal }); State.reset("T2ST.symb.rls");
      },
      addSymb: () => State.set("T2ST.symb.rls", [...(State.get("T2ST.symb.rls") || []), { key: `rule_${Date.now()}`, target: "", shp: "circle", clr: "var(--grey600)" }]),
      removeSymb: tgtBtn => {
        const key = tgtBtn.dataset.ruleKey;
        if (key) State.set("T2ST.symb.rls", (State.get("T2ST.symb.rls") || []).filter(r => r.key !== key));
      },
      renewSymb: tgtBtn => {
        const idx = tgtBtn.dataset.symbolIdx, type = tgtBtn.dataset.symbolType;
        if (idx == null || !type) return;
        const rls = [...(State.get("T2ST.symb.rls") || [])];
        if (rls[idx]) { rls[idx][type] = tgtBtn.value; State.set("T2ST.symb.rls", rls); } // ルール更新
      },
      tglPrevMode: this.#bindMulti("T2ST.prev.modeMap"),
      tglAllPrevMode: this.#bindAll("T2ST.prev.modeMap"),
      tglCalElm: this.#bindMulti("T2ST.prev.calElms"),
      tglAllCalElm: this.#bindAll("T2ST.prev.calElms"),
      tglPrevItem: this.#bindMulti("T2ST.prev.itemMap"),
      tglAllPrevItem: this.#bindAll("T2ST.prev.itemMap")
    };
    // --- クリック監視 ---
    static #handleClick(e) {
      const tabBtn = e.target.closest('.tab-btn');
      if (tabBtn) return this.switchTab(tabBtn.dataset.target);
      const actionBtn = e.target.closest('[data-action]');
      if (!actionBtn) return;
      const [ns, method] = actionBtn.dataset.action.split('.');
      (Ctrl[ns]?.[method] || this[ns]?.[method])?.(actionBtn); // 処理委譲
    }
    // --- 変更監視 ---
    static #handleChange(e) {
      const tgt = e.target, bindPath = tgt.dataset.bind, changePath = tgt.dataset.change;
      if (bindPath) State.set(bindPath, tgt.type === "checkbox" ? tgt.checked : tgt.value);
      if (changePath) {
        const [ns, method] = changePath.split('.');
        this[ns]?.[method]?.(tgt); // 変更委譲
      }
    }
    // --- タブ切替 ---
    static switchTab(tabId) {
      document.querySelectorAll(".tab-btn, .tab-content").forEach(el => el.classList.remove("active"));
      document.querySelector(`[data-target="${tabId}"]`)?.classList.add("active");
      document.getElementById(tabId)?.classList.add("active");
      document.body.setAttribute('data-theme', tabId);
      State.set("GLB.activeTab", tabId);
    }
    // --- 初期化 ---
    static async init() {
      UI.Init.build();
      State.subscribe("T1ST.pref.mode", Evt.T1.checkT1Pref);
      State.subscribe("T1ST.extr.refs.DB", Evt.T1.checkExtrRefs);
      this.switchTab(State.get("GLB.activeTab"));
      State.set({ "GLB.isLocked": false, "T1ST.pref.status": ["hidden", ""], "T1ST.phase": T1_PHS.INIT });
      UI.Phs.renewT1Phs(State.get("T1ST.phase")); UI.Phs.renewT2Phs(State.get("T2ST.phase"));
      document.addEventListener("click", this.#handleClick.bind(this)); document.addEventListener("change", this.#handleChange.bind(this));
    }
  }
  window.addEventListener("DOMContentLoaded", () => Evt.init());
</script>
