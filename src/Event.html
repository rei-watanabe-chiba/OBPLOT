<script>
  // --- イベント管理・初期化クラス ---
  class EventManager {
    // --- Tab1変更移譲 ---
    static Tab1 = {
      updateFileMap: (target) => {
        const field = target.getAttribute('data-field');
        State.set(`Tab1ST.file.map.${field}`, target.value);
        EventManager.Tab1.validateFileMap();
      },
      // --- リアクティブ状態監視：設定モード ---
      validateConfigMode: (mode) => {
        if (!mode) return;
        const modeText = mode === "Dual" ? "obsidian + mudrockのセット抽出に対応" : "1ファイル単位で抽出（モード混在可）";
        const phase = State.get("Tab1ST.phase");
        if (phase === TAB1_PHASE.INIT) {
          State.set({ "Tab1ST.config.status": ["message", modeText], "Tab1ST.phase": TAB1_PHASE.READY });
        } else if (phase >= TAB1_PHASE.INVALID) {
          State.set({ "Tab1ST.file.status": ["error", "モード変更検知: 再検証"], "Tab1ST.config.status": ["message", modeText], "Tab1ST.phase": TAB1_PHASE.INVALID });
        } else {
          State.set("Tab1ST.config.status", ["message", modeText]);
        }
      },
      // --- リアクティブ状態監視：ファイルマップ ---
      validateFileMap: () => {
        const map = State.get("Tab1ST.file.map");
        const flags = Mtd.Utils.validateSelect(GLOBAL_CONFIG.fileFields.map(f => map[f.key] || ""), 3);
        const isErr = flags.some(Boolean);
        State.set({
          "Tab1ST.file.isMapError": flags,
          "Tab1ST.file.status": isErr ? ["error", "エラー: 列選択"] : State.get("Tab1ST.file.cachedStatus")
        });
      },
      // --- リアクティブ状態監視：抽出マップ ---
      validateExacMap: () => {
        const isErr = !(State.get("Tab1ST.exac.map.dataset")?.trim());
        State.set({
          "Tab1ST.exac.isMapError": [isErr, false, false],
          "Tab1ST.exac.status": isErr ? ["error", "エラー: Dataset未入力"] : State.get("Tab1ST.exac.cachedStatus")
        });
      }
    };

    // --- Tab2変更移譲 ---
    static Tab2 = {
      // リアクティブ状態監視：チェックボックス群
      toggleDataset: () => {
        const itemCbs = [...document.querySelectorAll(`#${Tab2UI.datasetBox} .dataset-cb`)];
        if (!itemCbs.length) return;
        const allCb = document.getElementById("selectAll");
        if (allCb) allCb.checked = itemCbs.every(cb => cb.checked);
        State.set("Tab2ST.filter.datasets", itemCbs.filter(cb => cb.checked).map(cb => cb.value));
      },
      toggleAllDataset: (target) => {
        document.querySelectorAll(`#${Tab2UI.datasetBox} .dataset-cb`).forEach(cb => cb.checked = target.checked);
        EventManager.Tab2.toggleDataset();
      },
      // リアクティブ状態監視：シンボル設定群
      updateSymbol: (target) => {
        const idx = target.getAttribute('data-symbol-idx');
        if (!idx) return;
        const getVal = type => document.querySelector(`select[data-symbol-idx="${idx}"][data-symbol-type="${type}"]`)?.value;
        const tVal = getVal("target");
        if (tVal) {
          State.set("Tab2ST.symbol.mapping", {
            ...(State.get("Tab2ST.symbol.mapping") || {}),
            [tVal]: { shape: getVal("shape"), color: getVal("color") }
          });
        }
      },
      // リアクティブ状態監視：optionalモード
      updatePreviewMode: () => {
        const cbs = [...document.querySelectorAll(`#${Tab2UI.previewModeBox} .dataset-cb`)];
        State.set("Tab2ST.modeMap", cbs.filter(cb => cb.checked).map(cb => cb.value));
      }
    };

    // --- ボタン監視登録 ---
    static #handleClick(e) {
      const target = e.target;
      const tabBtn = target.closest('.tab-btn');
      if (tabBtn) { this.switchTab(tabBtn.getAttribute('data-target')); return; }
      const actionBtn = target.closest('[data-action]');
      if (actionBtn) {
        const [namespace, methodName] = actionBtn.getAttribute('data-action').split('.');
        if (Ctrl[namespace] && typeof Ctrl[namespace][methodName] === 'function') {
          Ctrl[namespace][methodName]();
        }
      }
    }

    // --- DOM更新監視登録 ---
    static #handleChange(e) {
      const target = e.target;
      const bindPath = target.getAttribute('data-bind');
      if (bindPath) State.set(bindPath, target.value);
      const changePath = target.getAttribute('data-change');
      if (changePath) {
        const [namespace, methodName] = changePath.split('.');
        if (this[namespace] && typeof this[namespace][methodName] === 'function') {
          this[namespace][methodName](target);
        }
      }
    }

    // --- タブ切替 UI制御 ---
    static switchTab(tabId) {
      document.querySelectorAll(".tab-btn, .tab-content").forEach(el => el.classList.remove("active"));
      document.querySelector(`[data-target="${tabId}"]`)?.classList.add("active");
      document.getElementById(tabId)?.classList.add("active");
      document.body.setAttribute('data-theme', tabId);
      State.set("GLB.activeTab", tabId);
    }

    // --- アプリケーション初期化 ---
    static async init() {
      UINew.build();
      State.subscribe("Tab1ST.config.mode", EventManager.Tab1.validateConfigMode);
      State.subscribe("Tab1ST.exac.map.dataset", EventManager.Tab1.validateExacMap);
      this.switchTab(State.get("GLB.activeTab"));
      State.set({
        "GLB.isLocked": false, 
        "Tab1ST.config.status": ["hidden", ""],
        "Tab1ST.phase": TAB1_PHASE.INIT
      });
      UIPhase.updateTab1PhaseUI(State.get("Tab1ST.phase"));
      UIPhase.updateTab2PhaseUI(State.get("Tab2ST.phase"));
      document.addEventListener("click", this.#handleClick.bind(this));
      document.addEventListener("change", this.#handleChange.bind(this));
    }
  }

  window.addEventListener("DOMContentLoaded", () => EventManager.init());
  const Evt = EventManager;
</script>
