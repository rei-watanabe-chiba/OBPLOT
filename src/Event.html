<script>
  // --- イベント管理・初期化クラス ---
  class EventManager {
    // --- Tab1変更移譲 ---
    static Tab1 = {
      updateFileMap: (target) => {
        State.set(`Tab1ST.file.map.${target.dataset.field}`, target.value);
        EventManager.validateFileMap();
      }
    };

    // --- Tab2変更移譲 ---
    static Tab2 = {
      toggleDataset: () => {
        const container = document.getElementById(Tab2UI.datasetBox);
        if (!container) return;
        const allCb = container.querySelector("#selectAll");
        const itemCbs = [...container.querySelectorAll(".dataset-cb")];
        allCb.checked = itemCbs.every(cb => cb.checked);
        State.set("Tab2ST.filter.datasets", itemCbs.filter(cb => cb.checked).map(cb => cb.value));
      },
      toggleAllDataset: (target) => {
        const container = document.getElementById(Tab2UI.datasetBox);
        if (!container) return;
        container.querySelectorAll(".dataset-cb").forEach(cb => cb.checked = target.checked);
        EventManager.Tab2.toggleDataset();
      },
      updateSymbol: (target) => {
        const idx = target.dataset.symbolIdx;
        if (!idx) return;
        const tVal = document.querySelector(`select[data-symbol-idx="${idx}"][data-symbol-type="target"]`)?.value;
        const sVal = document.querySelector(`select[data-symbol-idx="${idx}"][data-symbol-type="shape"]`)?.value;
        const cVal = document.querySelector(`select[data-symbol-idx="${idx}"][data-symbol-type="color"]`)?.value;
        if (tVal) {
          const currentMap = State.get("Tab2ST.symbol.mapping") || {};
          currentMap[tVal] = { shape: sVal, color: cVal };
          State.set("Tab2ST.symbol.mapping", { ...currentMap });
        }
      }
    };

    // --- ボタン監視 ---
    static #handleClick(e) {
      const target = e.target;
      const tabBtn = target.closest('.tab-btn');
      if (tabBtn) { this.switchTab(tabBtn.dataset.target); return; }
      const actionBtn = target.closest('[data-action]');
      if (actionBtn) {
        const [namespace, methodName] = actionBtn.dataset.action.split('.');
        if (Ctrl[namespace] && typeof Ctrl[namespace][methodName] === 'function') {
          Ctrl[namespace][methodName]();
        }
      }
    }

    // --- 変更監視 ---
    static #handleChange(e) {
      const target = e.target;
      // 単純同期
      const bindPath = target.dataset.bind;
      if (bindPath) State.set(bindPath, target.value);
      // カスタム属性同期
      const changePath = target.dataset.change;
      if (changePath) {
        const [namespace, methodName] = changePath.split('.');
        if (this[namespace] && typeof this[namespace][methodName] === 'function') {
          this[namespace][methodName](target);
        }
      }
    }

    // --- リアクティブ状態監視：ファイルマップ ---
    static validateFileMap() {
      const map = State.get("Tab1ST.file.map");
      const flags = Mtd.Utils.validateSelect(GLOBAL_CONFIG.fileFields.map(f => map[f.key] || ""), 3);
      const isErr = flags.some(Boolean);
      State.set({
        "Tab1ST.file.isMapError": flags,
        "Tab1ST.file.status": [isErr ? "error" : "success", isErr ? "エラー: 列選択" : State.get("Tab1ST.file.cachedStatus")[1]]
      });
    }

    // --- リアクティブ状態監視：抽出マップ ---
    static validateExacMap() {
      const isErr = !(State.get("Tab1ST.exac.map.dataset")?.trim());
      State.set({
        "Tab1ST.exac.isMapError": [isErr, false, false],
        "Tab1ST.exac.status": isErr ? ["error", "エラー: Dataset未入力"] : State.get("Tab1ST.exac.cachedStatus")
      });
    }

    // --- タブ切替 UI制御 ---
    static switchTab(tabId) {
      document.querySelectorAll(".tab-btn, .tab-content").forEach(el => el.classList.remove("active"));
      document.querySelector(`[data-target="${tabId}"]`)?.classList.add("active");
      document.getElementById(tabId)?.classList.add("active");
      document.body.dataset.theme = tabId;
      State.set("GLB.activeTab", tabId);
    }

    // --- アプリケーション初期化 ---
    static async init() {
      UI.buildInitUI(); // 初期UI生成
      Ctrl.Core.init(); 
      this.switchTab(State.get("GLB.activeTab"));
      State.set({
        "GLB.isLocked": false, 
        "Tab1ST.config.status": ["hidden", ""],
        "Tab1ST.phase": TAB1_PHASE.INIT
      });
      UIPhase.updateTab1PhaseUI(State.get("Tab1ST.phase"));
      UIPhase.updateTab2PhaseUI(State.get("Tab2ST.phase"));
      document.addEventListener("click", this.#handleClick.bind(this));
      document.addEventListener("change", this.#handleChange.bind(this));
    }
  }

  window.addEventListener("DOMContentLoaded", () => EventManager.init());
  const Evt = EventManager;
</script>
