<!-- Event.html -->
<script>
  class Evt {
    // --- マルチセレクト切替 ---
    static toggleMultiSelect(target, statePath) {
      const container = target.closest('ob-multi-select');
      if (!container) return;
      const itemCbs = [...container.querySelectorAll('.dataset-cb')], allCb = container.querySelector('.select-all-cb');
      if (allCb) allCb.checked = itemCbs.length > 0 && itemCbs.every(cb => cb.checked);
      State.set(statePath, itemCbs.filter(cb => cb.checked).map(cb => cb.value));
    }
    // --- 全選択切替 ---
    static toggleAllMultiSelect(target, statePath) {
      const container = target.closest('ob-multi-select');
      if (!container) return;
      const itemCbs = container.querySelectorAll('.dataset-cb');
      itemCbs.forEach(cb => cb.checked = target.checked);
      State.set(statePath, target.checked ? [...itemCbs].map(cb => cb.value) : []);
    }
    static #bindMulti = path => target => this.toggleMultiSelect(target, path);
    static #bindAll = path => target => this.toggleAllMultiSelect(target, path);
    // --- Tab1イベント群 ---
    static Tab1 = {
      validateConfigMode: mode => {
        if (!mode) return;
        const modeText = mode === "Dual" ? "セット抽出対応" : "1ファイル単位抽出";
        const phase = State.get("Tab1ST.phase"), isInit = phase === TAB1_PHASE.INIT, isInvalid = phase >= TAB1_PHASE.INVALID;
        isInvalid && State.set("Tab1ST.raw.status", ["error", "モード変更検知"]); // 再検証要求
        State.set({ "Tab1ST.config.status": ["message", modeText], ...(isInit || isInvalid ? { "Tab1ST.phase": isInit ? TAB1_PHASE.READY : TAB1_PHASE.INVALID } : {}) });
      },
      updateRawRefs: target => {
        State.set(`Tab1ST.raw.refs.${target.dataset.field}`, target.value);
        Evt.Tab1.validateRawRefs();
      },
      validateRawRefs: () => {
        const flags = Mtd.Utils.validateSelect(GLOBAL_CONFIG.fileFields.map(f => State.get(`Tab1ST.raw.refs.${f.key}`) || ""), 3);
        State.set({ "Tab1ST.raw.isRefsErr": flags, "Tab1ST.raw.status": flags.some(Boolean) ? ["error", "エラー: 列選択"] : State.get("Tab1ST.raw.cachedStatus") });
      },
      validateExtrRefs: () => {
        const isErr = !(State.get("Tab1ST.extr.refs.dset")?.trim());
        State.set({ "Tab1ST.extr.isRefsErr": [isErr, false, false], "Tab1ST.extr.status": isErr ? ["error", "エラー: dset未入力"] : State.get("Tab1ST.extr.cachedStatus") });
      }
    };
    // --- Tab2イベント群 ---
    static Tab2 = {
      toggleDataset: this.#bindMulti("Tab2ST.dset.filter"),
      toggleAllDataset: this.#bindAll("Tab2ST.dset.filter"),
      confirmAndChangeAxis: async targetSelect => {
        const newVal = targetSelect.value, oldVal = State.get("Tab2ST.symb.baseKey");
        if (newVal === oldVal) return;
        if (!await NewDOM.confirm("確認", "リセットしますか？")) return (targetSelect.value = oldVal); // 元に戻す
        State.set({ "Tab2ST.symb.baseKey": newVal }); State.reset("Tab2ST.symb.rules");
      },
      addSymbolRule: () => State.set("Tab2ST.symb.rules", [...(State.get("Tab2ST.symb.rules") || []), { key: `rule_${Date.now()}`, target: "", shape: "circle", color: "var(--grey600)" }]),
      removeSymbolRule: targetBtn => {
        const key = targetBtn.dataset.ruleKey;
        if (key) State.set("Tab2ST.symb.rules", (State.get("Tab2ST.symb.rules") || []).filter(r => r.key !== key));
      },
      updateSymbolRule: targetBtn => {
        const idx = targetBtn.dataset.symbolIdx, type = targetBtn.dataset.symbolType;
        if (idx == null || !type) return;
        const rules = [...(State.get("Tab2ST.symb.rules") || [])];
        if (rules[idx]) { rules[idx][type] = targetBtn.value; State.set("Tab2ST.symb.rules", rules); } // ルール更新
      },
      togglePreviewMode: this.#bindMulti("Tab2ST.prev.modeMap"),
      toggleAllPreviewMode: this.#bindAll("Tab2ST.prev.modeMap"),
      toggleCalElement: this.#bindMulti("Tab2ST.prev.calElementMap"),
      toggleAllCalElement: this.#bindAll("Tab2ST.prev.calElementMap"),
      togglePreviewItem: this.#bindMulti("Tab2ST.prev.itemMap"),
      toggleAllPreviewItem: this.#bindAll("Tab2ST.prev.itemMap")
    };
    // --- クリック監視 ---
    static #handleClick(e) {
      const tabBtn = e.target.closest('.tab-btn');
      if (tabBtn) return this.switchTab(tabBtn.dataset.target);
      const actionBtn = e.target.closest('[data-action]');
      if (!actionBtn) return;
      const [ns, method] = actionBtn.dataset.action.split('.');
      (Ctrl[ns]?.[method] || this[ns]?.[method])?.(actionBtn); // 処理委譲
    }
    // --- 変更監視 ---
    static #handleChange(e) {
      const target = e.target, bindPath = target.dataset.bind, changePath = target.dataset.change;
      if (bindPath) State.set(bindPath, target.type === "checkbox" ? target.checked : target.value);
      if (changePath) {
        const [ns, method] = changePath.split('.');
        this[ns]?.[method]?.(target); // 変更委譲
      }
    }
    // --- タブ切替 ---
    static switchTab(tabId) {
      document.querySelectorAll(".tab-btn, .tab-content").forEach(el => el.classList.remove("active"));
      document.querySelector(`[data-target="${tabId}"]`)?.classList.add("active");
      document.getElementById(tabId)?.classList.add("active");
      document.body.setAttribute('data-theme', tabId);
      State.set("GLB.activeTab", tabId);
    }
    // --- 初期化 ---
    static async init() {
      UIInit.build();
      State.subscribe("Tab1ST.config.mode", Evt.Tab1.validateConfigMode);
      State.subscribe("Tab1ST.extr.refs.dset", Evt.Tab1.validateExtrRefs);
      this.switchTab(State.get("GLB.activeTab"));
      State.set({ "GLB.isLocked": false, "Tab1ST.config.status": ["hidden", ""], "Tab1ST.phase": TAB1_PHASE.INIT });
      UIPhase.updateTab1PhaseUI(State.get("Tab1ST.phase")); UIPhase.updateTab2PhaseUI(State.get("Tab2ST.phase"));
      document.addEventListener("click", this.#handleClick.bind(this)); document.addEventListener("change", this.#handleChange.bind(this));
    }
  }
  window.addEventListener("DOMContentLoaded", () => Evt.init());
</script>
