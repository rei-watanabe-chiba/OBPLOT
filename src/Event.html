<!-- Event.html -->
<script>
  class Evt {
    // --- マルチセレクト切替 ---
    static toggleMultiSelect(target, statePath) {
      const container = target.closest('ob-multi-select');
      if (!container) return;
      const itemCbs = [...container.querySelectorAll('.dataset-cb')];
      const allCb = container.querySelector('.select-all-cb');
      if (allCb) allCb.checked = itemCbs.length > 0 && itemCbs.every(cb => cb.checked);
      State.set(statePath, itemCbs.filter(cb => cb.checked).map(cb => cb.value));
    }
    // --- 全選択切替 ---
    static toggleAllMultiSelect(target, statePath) {
      const container = target.closest('ob-multi-select');
      if (!container) return;
      const itemCbs = container.querySelectorAll('.dataset-cb');
      itemCbs.forEach(cb => cb.checked = target.checked);
      State.set(statePath, target.checked ? [...itemCbs].map(cb => cb.value) : []);
    }
    static #bindMulti = path => target => this.toggleMultiSelect(target, path);
    static #bindAll = path => target => this.toggleAllMultiSelect(target, path);
    // --- Tab1イベント群 ---
    static Tab1 = {
      validateConfigMode: mode => {
        if (!mode) return;
        const modeText = mode === "Dual" ? "obsidian + mudrockのセット抽出に対応" : "1ファイル単位で抽出（モード混在可）";
        const phase = State.get("Tab1ST.phase");
        const isInit = phase === TAB1_PHASE.INIT;
        const isInvalid = phase >= TAB1_PHASE.INVALID;
        isInvalid && State.set("Tab1ST.file.status", ["error", "モード変更検知: 再検証"]); // モード変更検証
        State.set({ "Tab1ST.config.status": ["message", modeText], ...(isInit || isInvalid ? { "Tab1ST.phase": isInit ? TAB1_PHASE.READY : TAB1_PHASE.INVALID } : {}) });
      },
      updateFileMap: target => {
        State.set(`Tab1ST.file.map.${target.getAttribute('data-field')}`, target.value);
        Evt.Tab1.validateFileMap();
      },
      validateFileMap: () => {
        const flags = Mtd.Utils.validateSelect(GLOBAL_CONFIG.fileFields.map(f => State.get(`Tab1ST.file.map.${f.key}`) || ""), 3);
        State.set({ "Tab1ST.file.isMapError": flags, "Tab1ST.file.status": flags.some(Boolean) ? ["error", "エラー: 列選択"] : State.get("Tab1ST.file.cachedStatus") });
      },
      validateExacMap: () => {
        const isErr = !(State.get("Tab1ST.exac.map.dataset")?.trim());
        State.set({ "Tab1ST.exac.isMapError": [isErr, false, false], "Tab1ST.exac.status": isErr ? ["error", "エラー: Dataset未入力"] : State.get("Tab1ST.exac.cachedStatus") });
      }
    };
    // --- Tab2イベント群 ---
    static Tab2 = {
      toggleDataset: this.#bindMulti("Tab2ST.dataset.filter"),
      toggleAllDataset: this.#bindAll("Tab2ST.dataset.filter"),
      confirmAndChangeAxis: async targetSelect => {
        const newVal = targetSelect.value, oldVal = State.get("Tab2ST.symbol.baseKey");
        if (newVal === oldVal) return;
        if (!await NewDOM.confirm("確認", "シンボル設定をリセットしますか？")) return (targetSelect.value = oldVal); // 元に戻す
        State.set({ "Tab2ST.symbol.baseKey": newVal });
        State.reset("Tab2ST.symbol.rules");
      },
      addSymbolRule: () => State.set("Tab2ST.symbol.rules", [...(State.get("Tab2ST.symbol.rules") || []), { id: `rule_${Date.now()}`, target: "", shape: "circle", color: "var(--grey600)" }]),
      removeSymbolRule: targetBtn => {
        const id = targetBtn.getAttribute('data-rule-id');
        if (id) State.set("Tab2ST.symbol.rules", (State.get("Tab2ST.symbol.rules") || []).filter(r => r.id !== id));
      },
      updateSymbolRule: targetBtn => {
        const idx = targetBtn.getAttribute('data-symbol-idx'), type = targetBtn.getAttribute('data-symbol-type');
        if (idx == null || !type) return;
        const rules = [...(State.get("Tab2ST.symbol.rules") || [])];
        if (rules[idx]) { rules[idx][type] = targetBtn.value; State.set("Tab2ST.symbol.rules", rules); } // ルール更新
      },
      togglePreviewMode: this.#bindMulti("Tab2ST.preview.modeMap"),
      toggleAllPreviewMode: this.#bindAll("Tab2ST.preview.modeMap"),
      toggleCalElement: this.#bindMulti("Tab2ST.preview.calElementMap"),
      toggleAllCalElement: this.#bindAll("Tab2ST.preview.calElementMap"),
      togglePreviewItem: this.#bindMulti("Tab2ST.preview.itemMap"),
      toggleAllPreviewItem: this.#bindAll("Tab2ST.preview.itemMap")
    };
    // --- クリック監視 ---
    static #handleClick(e) {
      const tabBtn = e.target.closest('.tab-btn');
      if (tabBtn) return this.switchTab(tabBtn.getAttribute('data-target'));
      const actionBtn = e.target.closest('[data-action]');
      if (!actionBtn) return;
      const [ns, method] = actionBtn.getAttribute('data-action').split('.');
      (Ctrl[ns]?.[method] || this[ns]?.[method])?.(actionBtn); // 処理委譲
    }
    // --- 変更監視 ---
    static #handleChange(e) {
      const target = e.target, bindPath = target.getAttribute('data-bind'), changePath = target.getAttribute('data-change');
      if (bindPath) State.set(bindPath, target.type === "checkbox" ? target.checked : target.value);
      if (changePath) {
        const [ns, method] = changePath.split('.');
        this[ns]?.[method]?.(target); // 変更委譲
      }
    }
    // --- タブ切替 ---
    static switchTab(tabId) {
      document.querySelectorAll(".tab-btn, .tab-content").forEach(el => el.classList.remove("active"));
      document.querySelector(`[data-target="${tabId}"]`)?.classList.add("active");
      document.getElementById(tabId)?.classList.add("active");
      document.body.setAttribute('data-theme', tabId);
      State.set("GLB.activeTab", tabId);
    }
    // --- 初期化 ---
    static async init() {
      UIInit.build();
      State.subscribe("Tab1ST.config.mode", Evt.Tab1.validateConfigMode);
      State.subscribe("Tab1ST.exac.map.dataset", Evt.Tab1.validateExacMap);
      this.switchTab(State.get("GLB.activeTab"));
      State.set({ "GLB.isLocked": false, "Tab1ST.config.status": ["hidden", ""], "Tab1ST.phase": TAB1_PHASE.INIT });
      UIPhase.updateTab1PhaseUI(State.get("Tab1ST.phase"));
      UIPhase.updateTab2PhaseUI(State.get("Tab2ST.phase"));
      document.addEventListener("click", this.#handleClick.bind(this));
      document.addEventListener("change", this.#handleChange.bind(this));
    }
  }
  window.addEventListener("DOMContentLoaded", () => Evt.init());
</script>
