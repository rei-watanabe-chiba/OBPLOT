<!-- Event.html -->
<script>
  // --- イベント管理・初期化クラス ---
  class EventManager {
    // --- ボタン監視 ---
    static #handleClick(e) {
      const target = e.target;
      // タブ切替処理
      const tabBtn = target.closest('.tab-btn');
      if (tabBtn) { this.switchTab(tabBtn.dataset.target); return; }
      // data-action のルーティング
      const actionBtn = target.closest('[data-action]');
      if (actionBtn) {
        const actionPath = actionBtn.dataset.action;
        const [namespace, methodName] = actionPath.split('.');
        if (Ctrl[namespace] && typeof Ctrl[namespace][methodName] === 'function') {
          Ctrl[namespace][methodName]();
        }
      }
    }

    // --- 変更監視 ---
    static #handleChange(e) {
      const target = e.target;
      // データバインディング
      const bindPath = target.dataset.bind;
      if (bindPath) {
        State.set(bindPath, target.value);
        return; 
      }
      // FileAreaの処理移譲
      const fieldKey = target.dataset.field;
      if (fieldKey && target.closest('#fileBox')) {
        State.set(`Tab1ST.file.map.${fieldKey}`, target.value);
        this.validateFileMap();
      }
      // datasetBoxの処理移譲
      if (target.closest("#datasetBox")) {
        this.handleDatasetSelection(target);
        return;
      }
    }

    // --- リアクティブ状態監視：ファイルマップ ---
    static validateFileMap() {
      const map = State.get("Tab1ST.file.map");
      const flags = Mtd.Utils.validateSelect(GLOBAL_CONFIG.fileFields.map(f => map[f.key] || ""), 3);
      const isErr = flags.some(Boolean);
      State.set({
        "Tab1ST.file.isMapError": flags,
        "Tab1ST.file.status": [isErr ? "error" : "success", isErr ? "エラー: 列選択" : State.get("Tab1ST.file.cachedStatus")[1]]
      });
    }

    // --- リアクティブ状態監視：抽出マップ ---
    static validateExacMap() {
      const isErr = !(State.get("Tab1ST.exac.map.dataset")?.trim());
      State.set({
        "Tab1ST.exac.isMapError": [isErr, false, false],
        "Tab1ST.exac.status": isErr ? ["error", "エラー: Dataset未入力"] : State.get("Tab1ST.exac.cachedStatus")
      });
    }

    // --- リアクティブ状態監視：データセット選択 ---
    static handleDatasetSelection(target) {
      const container = target.closest("#datasetBox");
      if (target.id === "selectAll") {
        container.querySelectorAll(".dataset-cb").forEach(cb => cb.checked = target.checked);
      } else if (target.classList.contains("dataset-cb")) {
        container.querySelector("#selectAll").checked = [...container.querySelectorAll(".dataset-cb")].every(i => i.checked);
      }
    }

    // --- タブ切替 UI制御 ---
    static switchTab(tabId) {
      document.querySelectorAll(".tab-btn, .tab-content").forEach(el => el.classList.remove("active"));
      document.querySelector(`[data-target="${tabId}"]`)?.classList.add("active");
      document.getElementById(tabId)?.classList.add("active");
      document.body.dataset.theme = tabId;
      State.set("GLB.activeTab", tabId);
    }

    // --- アプリケーション初期化 ---
    static async init() {
      Ctrl.Core.init(); 
      this.switchTab(State.get("GLB.activeTab"));
      State.set({
        "GLB.isLocked": false, 
        "Tab1ST.config.status": ["hidden", ""],
        "Tab1ST.phase": TAB1_PHASE.INIT
      });
      document.addEventListener("click", this.#handleClick.bind(this));
      document.addEventListener("change", this.#handleChange.bind(this));
    }
  }

  // DOM構築完了後に初期化
  window.addEventListener("DOMContentLoaded", () => EventManager.init());
  // --- 外部参照用 ---
  const Evt = EventManager;
</script>
