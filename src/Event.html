<!-- Event.html -->
<script>
  // --- イベント管理・初期化クラス ---
  class EventManager {
    // --- タブ切替 ---
    static switchTab(tabId) {
      document.querySelectorAll(".tab-btn, .tab-content").forEach(el => el.classList.remove("active"));
      document.querySelector(`[data-target="${tabId}"]`)?.classList.add("active");
      DOM.get(tabId)?.classList.add("active");
      State.set("GLB.activeTab", tabId);
    }

    // --- 設定エリアイベント ---
    static processConfigArea() {
      const selectMode = DOM.get(Tab1UI.configArea)?.querySelector('[data-field="configExacMode"]')?.value;
      const modeText = selectMode === "Dual" ? "obsidian + mudrockのセット抽出に対応" : "単純抽出";
      const currentPhase = State.get("Tab1ST.phase");
      const currentMode = State.get("Tab1ST.config.mode");
      // モード変更判定とステータス更新
      if (selectMode !== currentMode && currentPhase >= APP_PHASE.VALID.val) {
        State.set({
          "Tab1ST.file.status": ["error", "モード変更検知: 再検証"],
          "Tab1ST.phase": APP_PHASE.INVALID.val
        });
      }
      State.set({
        "Tab1ST.config.mode": selectMode,
        "Tab1ST.config.status": ["", modeText]
      });
    }

    // --- Fileエリアイベント ---
    static processFileArea() {
      const selectors = [...DOM.get(Tab1UI.fileBox).querySelectorAll(".input-select")];
      // 必須項目３で判定
      const errorFlags = Mtd.Utils.validateSelect(selectors.map(s => s.value), 3);
      const isError = errorFlags.some(Boolean);
      // ステータス更新
      State.set({
        "Tab1ST.file.isMapError": errorFlags,
        "Tab1ST.file.status": [
          isError ? "error" : "success", 
          isError ? "エラー: 選択項目" : State.get("Tab1ST.file.cachedStatus")[1]
        ]
      });
    }

    // --- 抽出エリアイベント ---
    static processExacArea() {
      const inputs = [...DOM.get(Tab1UI.exacBox).querySelectorAll('.input-text')];
      // dataset入力を判定
      const exacMap = Object.fromEntries(inputs.map(i => [i.dataset.field, i.value]));
      const isError = !(exacMap.dataset?.trim());
      // ステータス更新
      State.set({
        "Tab1ST.exac.map": exacMap,
        "Tab1ST.exac.isMapError": [isError, false, false],
        "Tab1ST.exac.status": isError ? ["error", "エラー: Dataset未入力"] : State.get("Tab1ST.exac.cachedStatus")
      });
    }

    // --- 変更イベントハンドラ ---
    static #handleChange(e) {
      const target = e.target;
      const fieldKey = target?.dataset?.field;
      if (!fieldKey) return; 
      const actionMap = {
        [Tab1UI.configArea]: () => this.processConfigArea(),
        [Tab1UI.fileArea]: () => {
          State.set("Tab1ST.file.map", { ...State.get("Tab1ST.file.map"), [fieldKey]: target.value });
          this.processFileArea();
        },
        [Tab1UI.exacArea]: () => this.processExacArea()
      };
      Object.entries(actionMap).some(([id, action]) => target.closest(`#${id}`) && (action(), true));
    }

    // --- 初期化処理 ---
    static async init() {
      this.switchTab(State.get("GLB.activeTab"));
      State.set({
        "GLB.isLocked": true, 
        "Tab1ST.config.status": ["alert", "初期設定中..."],
        "Tab1ST.phase": APP_PHASE.INIT.val
      });
      // グローバル読込
      try {
        State.set("GLB.cachedGlobal", await API.getGlobal());
        this.processConfigArea();
      } catch (err) {
        State.set("Tab1ST.config.status", ["error", "エラー: GAS通信エラー"]);
      } finally {
        State.set("GLB.isLocked", false);
      }
      // イベントリスナー登録
      document.addEventListener("click", e => {
        const tabId = e.target?.dataset?.target;
        if (tabId && e.target.classList.contains("tab-btn")) this.switchTab(tabId);
      });
      document.addEventListener("change", this.#handleChange.bind(this));
    }
  }

  // --- 呼び出し短縮と初期化 ---
  const Evt = {
    switchTab: EventManager.switchTab.bind(EventManager),
    configArea: EventManager.processConfigArea.bind(EventManager),
    fileArea: EventManager.processFileArea.bind(EventManager),
    exacArea: EventManager.processExacArea.bind(EventManager)
  };
  window.addEventListener("DOMContentLoaded", () => EventManager.init());
</script>
