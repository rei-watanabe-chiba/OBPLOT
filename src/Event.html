<script>
  // --- イベント管理・初期化クラス ---
  class Evt {
    // --- 汎用：マルチセレクト切替 ---
    static toggleMultiSelect(target, statePath) {
      const container = target.closest('ob-multi-select');
      if (!container) return;
      const itemCbs = [...container.querySelectorAll('.dataset-cb')];
      const allCb = container.querySelector('.select-all-cb');
      if (allCb) allCb.checked = itemCbs.length > 0 && itemCbs.every(cb => cb.checked);
      State.set(statePath, itemCbs.filter(cb => cb.checked).map(cb => cb.value));
    }
    static toggleAllMultiSelect(target, statePath) {
      const container = target.closest('ob-multi-select');
      if (!container) return;
      const itemCbs = container.querySelectorAll('.dataset-cb');
      itemCbs.forEach(cb => { cb.checked = target.checked; });
      State.set(statePath, target.checked ? [...itemCbs].map(cb => cb.value) : []);
    }

    // --- イベントバインダ ---
    static #bindMulti = (path) => (target) => this.toggleMultiSelect(target, path);
    static #bindAll = (path) => (target) => this.toggleAllMultiSelect(target, path);

    // --- Tab1変更移譲 ---
    static Tab1 = {
      // --- リアクティブ状態監視：モード選択 ---
      validateConfigMode: (mode) => {
        if (!mode) return;
        const modeText = mode === "Dual" ? "obsidian + mudrockのセット抽出に対応" : "1ファイル単位で抽出（モード混在可）";
        const phase = State.get("Tab1ST.phase");
        if (phase === TAB1_PHASE.INIT) {
          State.set({ "Tab1ST.config.status": ["message", modeText], "Tab1ST.phase": TAB1_PHASE.READY });
        } else if (phase >= TAB1_PHASE.INVALID) {
          State.set({ "Tab1ST.file.status": ["error", "モード変更検知: 再検証"], "Tab1ST.config.status": ["message", modeText], "Tab1ST.phase": TAB1_PHASE.INVALID });
        } else {
          State.set("Tab1ST.config.status", ["message", modeText]);
        }
      },
      // --- リアクティブ状態監視：列選択 ---
      updateFileMap: (target) => {
        const field = target.getAttribute('data-field');
        State.set(`Tab1ST.file.map.${field}`, target.value);
        Evt.Tab1.validateFileMap();
      },
      validateFileMap: () => {
        const map = State.get("Tab1ST.file.map");
        const flags = Mtd.Utils.validateSelect(GLOBAL_CONFIG.fileFields.map(f => map[f.key] || ""), 3);
        const isErr = flags.some(Boolean);
        State.set({
          "Tab1ST.file.isMapError": flags,
          "Tab1ST.file.status": isErr ? ["error", "エラー: 列選択"] : State.get("Tab1ST.file.cachedStatus")
        });
      },
      // --- リアクティブ状態監視：計測属性 ---
      validateExacMap: () => {
        const isErr = !(State.get("Tab1ST.exac.map.dataset")?.trim());
        State.set({
          "Tab1ST.exac.isMapError": [isErr, false, false],
          "Tab1ST.exac.status": isErr ? ["error", "エラー: Dataset未入力"] : State.get("Tab1ST.exac.cachedStatus")
        });
      }
    };

    // --- Tab2変更移譲 ---
    static Tab2 = {
      // リアクティブ状態監視：dataset選択
      toggleDataset: this.#bindMulti("Tab2ST.dataset.filter"),
      toggleAllDataset: this.#bindAll("Tab2ST.dataset.filter"),
      // リアクティブ状態監視：シンボル設定
      confirmAndChangeAxis: async (targetSelect) => {
        const newVal = targetSelect.value;
        const oldVal = State.get("Tab2ST.symbol.baseKey");
        if (newVal === oldVal) return;
        const isConfirmed = await NewDOM.confirm("確認", "シンボル設定をリセットしますか？");
        if (!isConfirmed) {
          targetSelect.value = oldVal;
          return;
        }
        State.set("Tab2ST.symbol.baseKey", newVal);
        State.reset("Tab2ST.symbol.rules");
      },
      addSymbolRule: () => {
        const rules = [...(State.get("Tab2ST.symbol.rules") || [])];
        rules.push({ id: `rule_${Date.now()}`, target: "", shape: "circle", color: "var(--grey600)" });
        State.set("Tab2ST.symbol.rules", rules);
      },
      removeSymbolRule: (targetBtn) => {
        const id = targetBtn.getAttribute('data-rule-id');
        if (!id) return;
        const rules = (State.get("Tab2ST.symbol.rules") || []).filter(r => r.id !== id);
        State.set("Tab2ST.symbol.rules", rules);
      },
      updateSymbolRule: (targetBtn) => {
        const idx = targetBtn.getAttribute('data-symbol-idx');
        const type = targetBtn.getAttribute('data-symbol-type');
        if (idx == null || !type) return;
        const rules = [...(State.get("Tab2ST.symbol.rules") || [])];
        if (rules[idx]) {
          rules[idx][type] = targetBtn.value;
          State.set("Tab2ST.symbol.rules", rules);
        }
      },
      // リアクティブ状態監視：Obsidianモード
      togglePreviewMode: this.#bindMulti("Tab2ST.preview.modeMap"),
      toggleAllPreviewMode: this.#bindAll("Tab2ST.preview.modeMap"),
      // リアクティブ状態監視：Item選択
      togglePreviewItem: this.#bindMulti("Tab2ST.preview.itemMap"),
      toggleAllPreviewItem: this.#bindAll("Tab2ST.preview.itemMap")
    };

    // --- ボタン監視ルーター ---
    static #handleClick(e) {
      const target = e.target;
      const tabBtn = target.closest('.tab-btn');
      if (tabBtn) { this.switchTab(tabBtn.getAttribute('data-target')); return; }
      const actionBtn = target.closest('[data-action]');
      if (actionBtn) {
        const [namespace, methodName] = actionBtn.getAttribute('data-action').split('.');
        // Ctrl層になければEvent(this)層を探す
        if (Ctrl[namespace]?.[methodName]) {
          Ctrl[namespace][methodName](actionBtn);
        } else if (this[namespace]?.[methodName]) {
          this[namespace][methodName](actionBtn);
        }
      }
    }
     // --- 変更監視ルーター ---
    static #handleChange(e) {
      const target = e.target;
      const bindPath = target.getAttribute('data-bind');
      if (bindPath) {
        const val = target.type === "checkbox" ? target.checked : target.value;
        State.set(bindPath, val);
      }
      const changePath = target.getAttribute('data-change');
      if (changePath) {
        const [namespace, methodName] = changePath.split('.');
        if (this[namespace] && typeof this[namespace][methodName] === 'function') {
          this[namespace][methodName](target);
        }
      }
    }
    // --- タブ切替 ---
    static switchTab(tabId) {
      document.querySelectorAll(".tab-btn, .tab-content").forEach(el => el.classList.remove("active"));
      document.querySelector(`[data-target="${tabId}"]`)?.classList.add("active");
      document.getElementById(tabId)?.classList.add("active");
      document.body.setAttribute('data-theme', tabId);
      State.set("GLB.activeTab", tabId);
    }

    // --- アプリケーション初期化 ---
    static async init() {
      UIInit.build();
      State.subscribe("Tab1ST.config.mode", Evt.Tab1.validateConfigMode);
      State.subscribe("Tab1ST.exac.map.dataset", Evt.Tab1.validateExacMap);
      this.switchTab(State.get("GLB.activeTab"));
      State.set({
        "GLB.isLocked": false, 
        "Tab1ST.config.status": ["hidden", ""],
        "Tab1ST.phase": TAB1_PHASE.INIT
      });
      UIPhase.updateTab1PhaseUI(State.get("Tab1ST.phase"));
      UIPhase.updateTab2PhaseUI(State.get("Tab2ST.phase"));
      document.addEventListener("click", this.#handleClick.bind(this));
      document.addEventListener("change", this.#handleChange.bind(this));
    }
  }

  window.addEventListener("DOMContentLoaded", () => Evt.init());
</script>
