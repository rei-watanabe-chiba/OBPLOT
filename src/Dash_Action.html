<!-- src/Dash_Action.html -->
<script>
  class DashAction {
    static get ssId() { return State.get("GLB.ssId"); }

    static async loadDB() {
      // 統合パイプラインへの集約（確認スキップ）
      await CoreAction.withAsync("DashST.inst.status", async () => {
        const [pRes, wRes, cRes] = await API.fetchMultiple(DashAction.ssId, [{ sht: GLB.appShts.pxrf }, { sht: GLB.rawShts.wdxrf }, { sht: GLB.appShts.crct }]);
        
        const pData = pRes.success ? pRes.payload.data : null;
        const wData = wRes.success ? wRes.payload.data : null;
        const cData = cRes.success ? cRes.payload.data : [];
        
        if (!pData || pData.length <= 1) throw new Error("PXRF不足");
        if (!wData || wData.length <= 1) throw new Error("WDXRF不足");
        
        const { pxrfDT, wdxrfDT } = CoreMethod.Util.buildDB(pData, wData, { mixWD: false });
        const crctDT = cData;
        
        State.set({ 
          "DashST.inst.data.pxrfDT": pxrfDT, 
          "DashST.inst.data.wdxrfDT": wdxrfDT, 
          "DashST.inst.data.crctDT": crctDT, 
          "DashST.phase": DASH_PHS.LOADED,
          "DashST.repo.status": ["message", "グラフ展開用HTMLを作成"] 
        });
        return `データセット構築完了: PXRF ${pxrfDT.length}件`;
      });
    }

    static async openRepo() {
      await CoreAction.withAsync("DashST.repo.status", async () => {
        let template = await API.getReportTemplate();
        const { inst } = State.proxy.DashST;
        const injectData = { pxrfDT: inst.data.pxrfDT || [], wdxrfDT: inst.data.wdxrfDT || [], crctDT: inst.data.crctDT || [] };
        const safeJson = JSON.stringify(injectData).replace(/</g, '\\u003c').replace(/>/g, '\\u003e');
        template = template.replace("'INJECT_TARGET'", () => safeJson);
        const blob = new Blob([template], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        
        if (typeof Office !== 'undefined') {
          const a = document.createElement('a'); a.href = url; a.download = "OBPLOT_Report.html";
          document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
          return "レポートをダウンロードしました";
        } else {
          window.open(url, '_blank'); 
          return "別タブで展開しました";
        }
      });
    }
  }

  window.DashAction = DashAction;

  class AppDashInit {
    static async start() {
      CoreAction.rootGLB({ CoreAction, DashAction, });

      CoreAction.configResolver = (tabId) => {
        return { schemaKey: 'dash', statPath: 'DashST.inst.status', schema: DASH_SIDEBAR_SCHEMA };
      };

      const automatorDash = new CoreUI(DASH_SIDEBAR_SCHEMA, 'DashST');
      automatorDash.build();

      State.subscribe("DashST.phase", () => automatorDash.update());
      
      State.subscribe("GLB.isLocked", () => {
        automatorDash.update();
      });

      const ssId = window.__INITIAL_SSID__ || "EXCEL_LOCAL_RUN";
      CoreAction.activateTabUI('dash');
      
      const initConfig = CoreAction.configResolver('dash');
      await CoreAction.startSession(ssId, false, {}, initConfig);
    }
  }

  if (typeof Office !== 'undefined') {
    Office.onReady(() => AppDashInit.start());
  } else {
    if (document.readyState === 'loading') { window.addEventListener("DOMContentLoaded", () => AppDashInit.start()); } 
    else { AppDashInit.start(); }
  }
</script>
