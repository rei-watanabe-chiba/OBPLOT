<!-- src/Dash_Action.html -->
<script>
  class DashAct {
    static get ssId() { return State.get("GLB.ssId"); }

    static async requestLoadDB() {
      // 統合パイプラインへの集約（確認スキップ）
      await CoreAct.withAsync("DashST.INST.status", async () => {
        const [pData, wData, cData] = await CoreAct.ensureFetch(DashAct.ssId, [GLB.appShts.pxrf, GLB.rawShts.wdxrf, GLB.appShts.crct]);
        if (!pData || pData.length <= 1) throw new Error("PXRF不足");
        if (!wData || wData.length <= 1) throw new Error("WDXRF不足");
        
        const { pxrfDT, wdxrfDT } = CoreMethod.Util.genDB(pData, wData, { mixWD: false });
        const crctDT = cData || [];
        
        State.set({ 
          "DashST.INST.data.pxrfDT": pxrfDT, 
          "DashST.INST.data.wdxrfDT": wdxrfDT, 
          "DashST.INST.data.crctDT": crctDT, 
          "DashST.phase": DASH_PHS.LOADED,
          "DashST.REPO.status": ["message", "グラフ展開用HTMLを作成"] 
        });
        return `データ構築完了: PXRF ${pxrfDT.length}件`;
      });
    }

    static async requestOpenRepo() {
      await CoreAct.withAsync("DashST.REPO.status", async () => {
        let template = await API.getReportTemplate();
        const { INST } = State.proxy.DashST;
        const injectData = { pxrfDT: INST.data.pxrfDT || [], wdxrfDT: INST.data.wdxrfDT || [], crctDT: INST.data.crctDT || [] };
        const safeJson = JSON.stringify(injectData).replace(/</g, '\\u003c').replace(/>/g, '\\u003e');
        template = template.replace("'INJECT_TARGET'", () => safeJson);
        const blob = new Blob([template], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        
        if (typeof Office !== 'undefined') {
          const a = document.createElement('a'); a.href = url; a.download = "OBPLOT_Report.html";
          document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
          return "レポートをダウンロードしました";
        } else {
          window.open(url, '_blank'); 
          return "別タブで展開しました";
        }
      });
    }
  }

  window.DashAct = DashAct;

  class DashInit {
    static async start() {
      CoreAct.rootGLB({ CoreAct, DashAct, });

      CoreAct.cfgRslv = (tabId) => {
        return { schemaKey: 'dash', statPath: 'DashST.INST.status', schema: DASH_SIDEBAR_SCHEMA };
      };

      const automatorDash = new CoreUI(DASH_SIDEBAR_SCHEMA, 'DashST');
      automatorDash.build();

      State.subscribe("DashST.phase", () => automatorDash.update());
      
      State.subscribe("GLB.isLocked", () => {
        automatorDash.update();
      });

      const ssId = window.__INITIAL_SSID__ || "EXCEL_LOCAL_RUN";
      CoreAct.actvTab('dash');
      
      const initCfg = CoreAct.cfgRslv('dash');
      await CoreAct.startSession(ssId, false, {}, initCfg);
    }
  }

  if (typeof Office !== 'undefined') {
    Office.onReady(() => DashInit.start());
  } else {
    if (document.readyState === 'loading') { window.addEventListener("DOMContentLoaded", () => DashInit.start()); } 
    else { DashInit.start(); }
  }
</script>
