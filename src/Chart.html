<!-- Chart.html -->
<script>
  // --- テーマキャッシュ ---
  class ThemeCache {
    static #cache = new Map();

    // --- カラー変数変換 ---
    static get(varStr) {
      if (!varStr?.startsWith('var(')) return varStr; // 非変数名のため直返す
      const match = varStr.match(/var\((--[^,\s)]+)/);
      if (!match) return varStr; // 解析失敗のため直返す
      const key = match[1];
      if (!this.#cache.has(key)) {
        const val = getComputedStyle(document.body).getPropertyValue(key).trim();
        this.#cache.set(key, val || varStr); // 計算値を保存
      }
      return this.#cache.get(key);
    }
  }

  // --- グラフカスタム要素 ---
  class ObCalPlot extends HTMLElement {
    #container;
    #chartDiv;
    #chart;
    #resizeObserver;
    #mutationObserver;
    #drawData = null;
    static #baseAXIS = {
      titleTextStyle: { fontSize: 11, italic: false }, textStyle: { fontSize: 10, bold: false },
      minorGridlines: { count: 0 }, titlePosition: 'out', maxAlternation: 1
    };

    // --- デフォルト構成 ---
    static #CONFIG = {
      defaultPoint: { 
        shapeType: 'circle', size: 4, fillColor: 'transparent', 
        strokeColor: 'var(--grey600)', strokeWidth: 0.6
      },
      legend: { position: 'top', alignment: 'end', textStyle: { fontSize: 10 } },
      series: { 0: { visibleInLegend: false } },
      trendlines: {
        0: {
          type: 'linear', color: 'var(--grey600)',
          lineWidth: 1, opacity: 0.4, lineDashStyle: [8, 4]
        }
      },
      hAxis: { ...ObCalPlot.#baseAXIS, title: 'WDXRF' },
      vAxis: { ...ObCalPlot.#baseAXIS, title: 'PXRF' },
    };

    // --- コンストラクタ ---
    constructor() {
      super();
      this.#container = document.createElement('div');
      this.#container.style.cssText = 'width: 100%; position: relative;';
      this.#chartDiv = document.createElement('div');
      this.#container.appendChild(this.#chartDiv);
      this.#resizeObserver = new ResizeObserver(() => {
        if (this.#drawData && this.#chartDiv.clientWidth > 0) {
          requestAnimationFrame(() => this.#render()); // 描画予約
        }
      });
      this.#mutationObserver = new MutationObserver(() => this.#applySvgHacks());
    }

    // --- 接続時 ---
    connectedCallback() {
      this.appendChild(this.#container);
      this.#resizeObserver.observe(this.#container); // 監視開始
    }

    // --- 切断時 ---
    disconnectedCallback() {
      this.#resizeObserver.disconnect(); // 監視停止
      this.#mutationObserver.disconnect(); // 監視停止
    }

    // --- データ設定 ---
    set drawData(data) {
      this.#drawData = data;
      this.#render(); // 再描画実行
    }

    // --- 描画消去 ---
    clear() {
      this.#drawData = null;
      this.#chartDiv.replaceChildren(); // 要素初期化
      this.#container.style.height = '0px'; // 高度クリア
    }

    // --- 属性一式設定 ---
    #setAttrs(el, attrs) {
      if (!el || !attrs) return;
      Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v)); // 属性付与
    }

    // --- オプション結合 ---
    #buildOptions(overrides) {
      const merged = Object.assign({}, ObCalPlot.#CONFIG, overrides); // 結合処理
      if (merged.trendlines?.[0]?.color) {
        merged.trendlines[0].color = ThemeCache.get(merged.trendlines[0].color); // 変数解決
      }
      if (merged.legend?.textStyle) {
        merged.legend.textStyle.color = ThemeCache.get('var(--grey600)'); // 変数解決
      }
      return merged;
    }

    // --- スタイル文字列生成 ---
    #buildStyleString(styleObj) {
      if (!styleObj) return '';
      const map = {
        shapeType: 'shape-type', size: 'size', fillColor: 'fill-color',
        strokeColor: 'stroke-color', strokeWidth: 'stroke-width'
      };
      const props = Object.entries(styleObj)
        .filter(([_, v]) => v != null)
        .map(([k, v]) => `${map[k] || k}:${v};`)
        .join(' ');
      return `point { ${props} }`;
    }

    // --- 散布図描画本体 ---
    #render() {
      const { previewData, symbolData } = this.#drawData || {};
      if (!previewData?.length || !window.google?.visualization) {
        this.clear(); // データなしのため消去
        return;
      }
      this.#chart = new google.visualization.ScatterChart(this.#chartDiv);
      const dataTable = new google.visualization.DataTable();

      // --- カラム追加 ---
      [
        ['number', 'WDXRF'], ['number', 'PXRF'],
        { type: 'string', role: 'tooltip' }, { type: 'string', role: 'style' }
      ].forEach(spec => Array.isArray(spec) ? dataTable.addColumn(...spec) : dataTable.addColumn(spec));

      const baseKey = symbolData?.baseKey;
      const mapping = symbolData?.mapping || {};
      const defPoint = ObCalPlot.#CONFIG.defaultPoint;

      dataTable.addRows(previewData.map(d => {
        let currentStyle = { ...defPoint };
        const val = d[baseKey];
        if (val && mapping[val]) {
          const c = ThemeCache.get(mapping[val].color);
          currentStyle = {
            ...currentStyle,
            shapeType: mapping[val].shape,
            fillColor: c,
            strokeColor: c
          };
        }
        
        const styleStr = this.#buildStyleString(currentStyle);
        return [d.x, d.y, `ID: ${d.id ?? '-'}\nGroup: ${d.group ?? '-'}`, styleStr];
      }));

      const sideLength = this.#container.clientWidth || 276;
      this.#container.style.height = `${sideLength}px`; // 高度設定
      
      const { niceMin, niceMax, niceTicks } = Mtd.Utils.calcNiceScale(
        previewData.map(d => d.x), 
        previewData.map(d => d.y)
      );
      const yTicks = [...niceTicks];
      yTicks.shift(); // 先頭除去

      const options = this.#buildOptions({
        width: sideLength,
        height: sideLength,
        chartArea: { left: 40, top: 25, width: sideLength - 65, height: sideLength - 70 },
        hAxis: {
          ...ObCalPlot.#CONFIG.hAxis,
          viewWindow: { min: niceMin, max: niceMax },
          ticks: niceTicks
        },
        vAxis: {
          ...ObCalPlot.#CONFIG.vAxis,
          viewWindow: { min: niceMin, max: niceMax },
          ticks: yTicks
        }
      });

      google.visualization.events.addOneTimeListener(this.#chart, 'ready', () => {
        this.#mutationObserver.observe(this.#chartDiv, { childList: true, subtree: true }); // 監視開始
        this.#applySvgHacks();
      });

      this.#chart.draw(dataTable, options); // 描画実行
    }

    // --- SVGハックパイプライン ---
    #applySvgHacks() {
      if (!this.#chart) return;
      this.#mutationObserver.disconnect(); // 誤検知防止
      try {
        const svg = this.#chartDiv.querySelector('svg');
        if (!svg) return;
        this.#drawPlotBorder(svg);
        this.#rotateYAxisLabels(svg);
        this.#shiftXAxisLabels(svg);
        this.#drawEquationText(svg);
      } finally {
        this.#mutationObserver.observe(this.#chartDiv, { childList: true, subtree: true }); // 監視復帰
      }
    }

    // --- 領域枠描画 ---
    #drawPlotBorder(svg) {
      svg.querySelector('.plot-border')?.remove(); // 重複防止
      const area = this.#chart.getChartLayoutInterface().getChartAreaBoundingBox();
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      
      // --- 属性設定 ---
      this.#setAttrs(rect, {
        'class': 'plot-border', 'x': area.left, 'y': area.top,
        'width': area.width, 'height': area.height,
        'fill': 'none', 'stroke': ThemeCache.get('var(--grey200)'), 'stroke-width': '1'
      });
      svg.appendChild(rect); // 要素追加
    }

    // --- 方程式テキスト描画 ---
    #drawEquationText(svg) {
      svg.querySelector('.equation-text')?.remove(); // 重複防止
      const stats = this.#drawData?.statsData;
      if (!stats) return; // データ未存在のため終了

      const rows = DataUtils.createStatsRows(stats);
      const r2Val = rows.find(([label]) => label === '相関係数')[1].split(',')[1].trim();
      const eqVal = rows.find(([label]) => label === '回帰直線')[1];

      const area = this.#chart.getChartLayoutInterface().getChartAreaBoundingBox();
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      this.#setAttrs(text, {
        'class': 'equation-text', 'x': area.left + 8, 'y': area.top + 16,
        'font-size': '10', 'fill': ThemeCache.get('var(--grey600)'), 'font-family': 'Roboto, sans-serif'
      });

      [r2Val, eqVal].forEach((val, idx) => {
        const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
        tspan.textContent = val;
        this.#setAttrs(tspan, {
          'x': area.left + 8,
          ...(idx > 0 ? { 'dy': '13' } : {})
        });
        text.appendChild(tspan);
      });

      svg.appendChild(text); // 要素追加
    }

    // --- Y軸回転 ---
    #rotateYAxisLabels(svg) {
      const leftThreshold = this.#chart.getChartLayoutInterface().getChartAreaBoundingBox().left;
      Array.from(svg.querySelectorAll('text')).filter(text => {
        const x = parseFloat(text.getAttribute('x'));
        return !isNaN(x) && x < leftThreshold && x > (leftThreshold - 50) && /^-?\d+(\.\d+)?k?$/.test(text.textContent.trim().replace(/,/g, ''));
      }).forEach(text => {
        const y = parseFloat(text.getAttribute('y'));
        // --- 属性設定 ---
        this.#setAttrs(text, {
          'transform': `rotate(-90, ${leftThreshold - 12},${y - 3})`,
          'text-anchor': 'middle', 'dx': '-6', 'font-size': '10'
        });
      });
    }

    // --- X軸シフト ---
    #shiftXAxisLabels(svg) {
      const { top, height } = this.#chart.getChartLayoutInterface().getChartAreaBoundingBox();
      const texts = Array.from(svg.querySelectorAll('text')).filter(text => {
        const y = parseFloat(text.getAttribute('y'));
        return !isNaN(y) && y >= (top + height) && /^-?\d+(\.\d+)?k?$/.test(text.textContent.trim().replace(/,/g, ''));
      });
      if (!texts.length) return; // テキストなしのため終了
      texts.forEach(text => {
        const baseY = parseFloat(text.getAttribute('original-y') || text.getAttribute('y'));
        if (!text.hasAttribute('original-y')) text.setAttribute('original-y', baseY);
        text.setAttribute('y', baseY + 2); // 位置微調整
      });
      const minEl = texts.reduce((m, e) => parseFloat(e.getAttribute('x')) < parseFloat(m.getAttribute('x')) ? e : m);
      minEl.setAttribute('dx', String(parseFloat(minEl.getAttribute('dx') || '0') - 8)); // 位置調整
    }
  }

  customElements.define('ob-cal-plot', ObCalPlot);
</script>
