<!-- Chart.html -->
<script>
  // --- テーマキャッシュ ---
  class ThemeCache {
    static #cache = new Map();
    // --- 変数解決 ---
    static get(varStr) {
      if (!varStr?.startsWith('var(')) return varStr;
      const match = varStr.match(/var\((--[^,\s)]+)/);
      if (!match) return varStr;
      const key = match[1];
      if (!this.#cache.has(key)) {
        const val = getComputedStyle(document.body).getPropertyValue(key).trim();
        this.#cache.set(key, val || varStr);
      }
      return this.#cache.get(key);
    }
  }

  // --- グラフカスタム要素 ---
  class ObScatterChart extends HTMLElement {
    #container;
    #chartDiv;
    #chart;
    #resizeObserver;
    #mutationObserver;
    #drawData = null;

    // --- デフォルト構成 ---
    static #CONFIG = {
      defaultPoint: {
        shapeType: 'circle',
        size: 5,
        fillColor: 'transparent',
        strokeColor: 'var(--grey600)',
        strokeWidth: 0.8
      },
      legend: { position: 'top', alignment: 'end', textStyle: { fontSize: 10 } },
      series: { 0: { visibleInLegend: false } },
      trendlines: {
        0: {
          type: 'linear',
          color: 'var(--grey600)',
          lineWidth: 1,
          opacity: 0.4,
          lineDashStyle: [8, 4],
          visibleInLegend: true,
          showR2: true
        }
      },
      hAxis: {
        title: 'WDXRF',
        titleTextStyle: { fontSize: 11, italic: false },
        textStyle: { fontSize: 10, bold: false },
        minorGridlines: { count: 0 },
        titlePosition: 'out',
        maxAlternation: 1
      },
      vAxis: {
        title: 'PXRF',
        titleTextStyle: { fontSize: 11, italic: false },
        textStyle: { fontSize: 10, bold: false },
        minorGridlines: { count: 0 },
        titlePosition: 'out',
        maxAlternation: 1
      }
    };

    constructor() {
      super();
      this.#container = document.createElement('div');
      this.#container.style.cssText = 'width: 100%; position: relative;';
      this.#chartDiv = document.createElement('div');
      this.#container.appendChild(this.#chartDiv);
      
      this.#resizeObserver = new ResizeObserver(() => {
        if (this.#drawData && this.#chartDiv.clientWidth > 0) {
          requestAnimationFrame(() => this.#render());
        }
      });
      this.#mutationObserver = new MutationObserver(() => this.#applySvgHacks());
    }

    connectedCallback() {
      this.appendChild(this.#container);
      this.#resizeObserver.observe(this.#container);
    }

    disconnectedCallback() {
      this.#resizeObserver.disconnect();
      this.#mutationObserver.disconnect();
    }

    // --- データ注入と描画 ---
    set drawData(data) {
      this.#drawData = data;
      this.#render();
    }

    // --- 描画消去 ---
    clear() {
      this.#drawData = null;
      this.#chartDiv.replaceChildren();
      this.#container.style.height = '0px';
    }

    // --- オプション結合 ---
    #buildOptions(overrides) {
      const merged = Object.assign({}, ObScatterChart.#CONFIG, overrides);
      if (merged.trendlines?.[0]?.color) {
        merged.trendlines[0].color = ThemeCache.get(merged.trendlines[0].color);
      }
      if (merged.legend?.textStyle) {
        merged.legend.textStyle.color = ThemeCache.get('var(--grey600)');
      }
      return merged;
    }

    // --- スタイル文字列生成 ---
    #buildStyleString(styleObj) {
      if (!styleObj) return '';
      const map = {
        shapeType: 'shape-type',
        size: 'size',
        fillColor: 'fill-color',
        strokeColor: 'stroke-color',
        strokeWidth: 'stroke-width'
      };
      const props = Object.entries(styleObj)
        .filter(([_, v]) => v != null)
        .map(([k, v]) => `${map[k] \vert{}\vert{} k}:${v};`)
        .join(' ');
      return `point { ${props} }`;
    }

    // --- 散布図描画本体 ---
    #render() {
      const { previewData, symbolData } = this.#drawData || {};
      if (!previewData?.length || !window.google?.visualization) {
        this.clear();
        return;
      }

      this.#chart = new google.visualization.ScatterChart(this.#chartDiv);
      const dataTable = new google.visualization.DataTable();
      dataTable.addColumn('number', 'WDXRF');
      dataTable.addColumn('number', 'PXRF');
      dataTable.addColumn({ type: 'string', role: 'tooltip' });
      dataTable.addColumn({ type: 'string', role: 'style' });

      const baseKey = symbolData?.baseKey;
      const mapping = symbolData?.mapping || {};
      const defPoint = ObScatterChart.#CONFIG.defaultPoint;

      dataTable.addRows(previewData.map(d => {
        let currentStyle = { ...defPoint };
        const val = d[baseKey];
        // 動的設定のマージ
        if (val && mapping[val]) {
          const c = ThemeCache.get(mapping[val].color);
          currentStyle = {
            ...currentStyle,
            shapeType: mapping[val].shape,
            fillColor: c,
            strokeColor: c
          };
        }
        
        const styleStr = this.#buildStyleString(currentStyle);
        return [d.x, d.y, `ID: ${d.id ?? '-'}\nGroup: ${d.group ?? '-'}`, styleStr];
      }));

      const sideLength = this.#container.clientWidth || 276;
      this.#container.style.height = `${sideLength}px`;
      
      const { niceMin, niceMax, niceTicks } = Mtd.Utils.calcNiceScale(
        previewData.map(d => d.x), 
        previewData.map(d => d.y)
      );
      const yTicks = [...niceTicks];
      yTicks.shift();

      const options = this.#buildOptions({
        width: sideLength,
        height: sideLength,
        chartArea: { left: 40, top: 25, width: sideLength - 65, height: sideLength - 70 },
        hAxis: { viewWindow: { min: niceMin, max: niceMax }, ticks: niceTicks },
        vAxis: { viewWindow: { min: niceMin, max: niceMax }, ticks: yTicks }
      });

      google.visualization.events.addOneTimeListener(this.#chart, 'ready', () => {
        this.#mutationObserver.observe(this.#chartDiv, { childList: true, subtree: true });
        this.#applySvgHacks();
      });

      this.#chart.draw(dataTable, options);
    }

    // --- SVGハックパイプライン ---
    #applySvgHacks() {
      if (!this.#chart) return;
      this.#mutationObserver.disconnect();
      try {
        const svg = this.#chartDiv.querySelector('svg');
        if (!svg) return;
        this.#drawPlotBorder(svg);
        this.#rotateYAxisLabels(svg);
        this.#shiftXAxisLabels(svg);
      } finally {
        this.#mutationObserver.observe(this.#chartDiv, { childList: true, subtree: true });
      }
    }

    // --- 領域枠描画 ---
    #drawPlotBorder(svg) {
      svg.querySelector('.plot-border')?.remove();
      const area = this.#chart.getChartLayoutInterface().getChartAreaBoundingBox();
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('class', 'plot-border');
      rect.setAttribute('x', area.left);
      rect.setAttribute('y', area.top);
      rect.setAttribute('width', area.width);
      rect.setAttribute('height', area.height);
      rect.setAttribute('fill', 'none');
      rect.setAttribute('stroke', ThemeCache.get('var(--grey200)'));
      rect.setAttribute('stroke-width', '1');
      svg.appendChild(rect);
    }

    // --- Y軸回転 ---
    #rotateYAxisLabels(svg) {
      const leftThreshold = this.#chart.getChartLayoutInterface().getChartAreaBoundingBox().left;
      Array.from(svg.querySelectorAll('text')).filter(text => {
        const x = parseFloat(text.getAttribute('x'));
        return !isNaN(x) && x < leftThreshold && x > (leftThreshold - 50) && /^-?\d+(\.\d+)?k?$/.test(text.textContent.trim().replace(/,/g, ''));
      }).forEach(text => {
        const y = parseFloat(text.getAttribute('y'));
        text.setAttribute('transform', `rotate(-90, ${leftThreshold - 12},${y - 3})`);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dx', '-6');
        text.setAttribute('font-size', '10');
      });
    }

    // --- X軸シフト ---
    #shiftXAxisLabels(svg) {
      const { top, height } = this.#chart.getChartLayoutInterface().getChartAreaBoundingBox();
      const texts = Array.from(svg.querySelectorAll('text')).filter(text => {
        const y = parseFloat(text.getAttribute('y'));
        return !isNaN(y) && y >= (top + height) && /^-?\d+(\.\d+)?k?$/.test(text.textContent.trim().replace(/,/g, ''));
      });
      if (!texts.length) return;
      
      texts.forEach(text => {
        const baseY = parseFloat(text.getAttribute('original-y') || text.getAttribute('y'));
        if (!text.hasAttribute('original-y')) text.setAttribute('original-y', baseY);
        text.setAttribute('y', baseY + 2);
      });
      const minEl = texts.reduce((m, e) => parseFloat(e.getAttribute('x')) < parseFloat(m.getAttribute('x')) ? e : m);
      minEl.setAttribute('dx', String(parseFloat(minEl.getAttribute('dx') || '0') - 8));
    }
  }

  customElements.define('ob-cal-plot', ObScatterChart);
</script>
