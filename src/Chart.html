<script>
  class CSSToken {
    static #cache = new Map();
    static get(varStr) {
      if (!varStr?.startsWith('var(')) return varStr;
      const mch = varStr.match(/var\((--[^,\s)]+)/);
      if (!mch) return varStr;
      const key = mch[1];
      if (!this.#cache.has(key)) this.#cache.set(key, getComputedStyle(document.body).getPropertyValue(key).trim() || varStr);
      return this.#cache.get(key);
    }
  }
  class ObCalPlot extends HTMLElement {
    #box; #chart = null; #observer; #src = null; #lastW = 0;
    constructor() {
      super();
      this.#box = document.createElement('div');
      this.#box.style.cssText = 'width: 100%; position: relative;';
      this.#observer = new ResizeObserver(() => {
        const curW = this.clientWidth;
        if (curW > 0 && curW !== this.#lastW && this.#src) {
          this.#lastW = curW;
          if (this.#chart) this.#chart.resize();
          this.#render();
        }
      });
    }
    connectedCallback() {
      this.style.display = 'grid';
      this.style.gridTemplateColumns = 'minmax(0, 1fr)';
      this.style.width = '100%';
      this.appendChild(this.#box);
      this.#observer.observe(this.#box);
    }
    disconnectedCallback() {
      this.#observer.disconnect();
      if (this.#chart) { this.#chart.dispose(); this.#chart = null; }
    }
    set src(data) {
      this.#src = data;
      this.#render();
    }
    clear() {
      this.#src = null;
      if (this.#chart) this.#chart.clear();
      this.#box.style.height = '0px';
    }
    #render() {
      const { prevDT, statsDT, symb, gph, panel } = this.#src || {};
      if (!prevDT?.length || typeof echarts === 'undefined') return this.clear();
      const containerWidth = this.clientWidth;
      if (containerWidth === 0) return;
      this.#lastW = containerWidth;
      const rS = gph?.style || GLB.defaultGraphStyle;
      const STYLE = {
        font: rS.font, fontS: { ...rS.fontS },
        fontC: { base: CSSToken.get(rS.fontC.base), stats: CSSToken.get(rS.fontC.stats), tip: CSSToken.get(rS.fontC.tip) },
        symbol: { ...rS.symbol }, lineW: { ...rS.lineW },
        lineC: { grid: CSSToken.get(rS.lineC.grid), axis: CSSToken.get(rS.lineC.axis), reg: CSSToken.get(rS.lineC.reg)},
        bgPlot: rS.bgPlot, bgOuter: rS.bgOuter, bgTip: rS.bgTip
      };
      const GAP = { ...(gph?.gap || GLB.defaultGraphGap) };
      const charWidth = STYLE.fontS.tick * 0.6, overY = (4 * charWidth) / 2, overX = (2 * charWidth) / 2;
      const titleText = panel?.title || "";
      const titleSizePx = STYLE.fontS.title || (12 * 1.33);
      const requiredPadT = Math.max(STYLE.fontS.tick, titleText ? titleSizePx + GAP.tick : 0);
      const safePadT = GAP.padT < requiredPadT ? GAP.padT + requiredPadT : GAP.padT;
      const safePadR = GAP.padR < STYLE.fontS.tick ? GAP.padR + STYLE.fontS.tick : GAP.padR;
      const gridTop = safePadT + overY;
      const gridBottom = GAP.padB + STYLE.fontS.name + GAP.name + STYLE.fontS.tick + GAP.tick;
      const gridLeft = GAP.padL + overX + STYLE.fontS.name + GAP.name + STYLE.fontS.tick + GAP.tick;
      const gridRight = safePadR + overX;
      const plotSize = containerWidth - gridLeft - gridRight, containerHeight = plotSize + gridTop + gridBottom;
      this.#box.style.width = `${containerWidth}px`; this.#box.style.height = `${containerHeight}px`;
      this.#box.style.backgroundColor = STYLE.bgOuter;
      if (!this.#chart) {
        const renderer = this.getAttribute('data-renderer') || 'canvas';
        this.#chart = echarts.init(this.#box, null, { renderer });
        this.#chart.on('finished', () => {
          this.dispatchEvent(new CustomEvent('render-finished'));
        });
      }
      const validPoints = prevDT.filter(d => d.x != null && d.y != null && !isNaN(d.x) && !isNaN(d.y));
      const { niceMin, niceMax, niceTicks } = CoreMethod.Util.calcScale(validPoints.map(d => d.x), validPoints.map(d => d.y));
      const itv = niceTicks.length >= 2 ? (niceTicks[1].v - niceTicks[0].v) : undefined;
      const fmtTick = v => { const tck = niceTicks.find(t => Math.abs(t.v - v) < 1e-8); return tck ? tck.f : v; };
      const graphText = statsDT ? CoreMethod.Util.buildStats(statsDT, 3, [{ key: 'R² = {r2}', label: '' }, { key: 'y = {slope}x {sign} {abs_intercept}', label: '' }]).map(r => r[1]).join('\n') : "";
      const baseKey = symb?.baseKey, rls = symb?.rls || [], defRl = rls.find(r => r.key === "default");
      const plotDT = validPoints.map(d => {
        const rl = rls.find(r => r.target !== "" && r.target === d[baseKey]) || defRl;
        const rawShp = rl.shp || 'circle';
        const isEmpty = rawShp === 'emptyCircle' && !d._forceClr;
        const shp = rawShp === 'emptyCircle' ? 'circle' : rawShp; 
        const bClr = CSSToken.get(d._forceClr || rl.clr);
        return {
          value: [d.x, d.y], '計測ID': d['計測ID'], [GLB.idx.key1]: d[GLB.idx.key1], [GLB.idx.key2]: d[GLB.idx.key2], [GLB.idx.p1]: d[GLB.idx.p1], [GLB.idx.p2]: d[GLB.idx.p2], [GLB.idx.wd1]: d[GLB.idx.wd1], [GLB.idx.wd2]: d[GLB.idx.wd2],
          symbol: shp, symbolSize: shp.startsWith('path://') ? STYLE.symbol.pathSize : STYLE.symbol.baseSize,
          itemStyle: { color: isEmpty ? 'transparent' : bClr, borderColor: bClr, borderWidth: STYLE.symbol.borderW }
        };
      });
      const series = [{ type: 'scatter', data: plotDT, animation: false }];
      if (statsDT?.slope != null && statsDT?.intercept != null) {
        const { slope, intercept } = statsDT;
        series.push({
          type: 'line', data: [[niceMin, slope * niceMin + intercept], [niceMax, slope * niceMax + intercept]],
          symbol: 'none', lineStyle: { color: STYLE.lineC.reg, width: STYLE.lineW.regW, type: STYLE.lineW.regD, opacity: 0.5 },
          animation: false, silent: true
        });
      }
      const graphics = [
        { type: 'text', left: gridLeft + STYLE.fontS.tick, top: gridTop + STYLE.fontS.tick, style: { text: graphText, fontFamily: STYLE.font, fontSize: STYLE.fontS.stats, fill: STYLE.fontC.stats } }
      ];
      if (titleText) {
        graphics.push({
          type: 'text',
          left: gridLeft + GAP.tick,
          bottom: (containerHeight - gridTop) + GAP.tick,
          style: { text: titleText, fontFamily: STYLE.font, fontSize: titleSizePx, fill: STYLE.fontC.base }
        });
      }
      const opt = {
        animation: false,
        textStyle: { fontFamily: STYLE.font },
        grid: { left: gridLeft, top: gridTop, width: plotSize, height: plotSize, show: true, backgroundColor: STYLE.bgPlot, borderColor: STYLE.lineC.axis, borderWidth: STYLE.lineW.axis },
        tooltip: { formatter: p => p.componentSubType === 'line' ? '' : GLB.tooltipKeys.map(k => `${k}: ${p.data[k] || '-'}`).join('<br/>'), backgroundColor: STYLE.bgTip, textStyle: { fontFamily: STYLE.font, fontSize: STYLE.fontS.tip, color: STYLE.fontC.tip } },
        xAxis: {
          type: 'value', name: panel?.xLabel || 'WDXRF', nameLocation: 'middle',
          nameGap: GAP.tick + STYLE.fontS.tick + GAP.name, nameTextStyle: { fontFamily: STYLE.font, fontSize: STYLE.fontS.name, color: STYLE.fontC.base },
          min: niceMin, max: niceMax, interval: itv,
          axisLabel: { margin: GAP.tick, fontSize: STYLE.fontS.tick, color: STYLE.fontC.base, formatter: v => fmtTick(v) },
          splitLine: { show: true, lineStyle: { color: STYLE.lineC.grid, type: 'solid', width: STYLE.lineW.grid } },
          axisLine: { show: true, onZero: false, lineStyle: { color: STYLE.lineC.axis, width: STYLE.lineW.axis } },
          axisTick: { show: false, inside: true }
        },
        yAxis: {
          type: 'value', name: panel?.yLabel || 'pXRF', nameLocation: 'middle',
          nameGap: GAP.tick + STYLE.fontS.tick + GAP.name, nameTextStyle: { fontFamily: STYLE.font, fontSize: STYLE.fontS.name, color: STYLE.fontC.base },
          min: niceMin, max: niceMax, interval: itv,
          axisLabel: { rotate: 90, margin: GAP.tick, fontSize: STYLE.fontS.tick, color: STYLE.fontC.base, formatter: v => (Math.abs(v - niceMin) < 1e-8) ? '' : fmtTick(v) },
          splitLine: { show: true, lineStyle: { color: STYLE.lineC.grid, type: 'solid', width: STYLE.lineW.grid } },
          axisLine: { show: true, onZero: false, lineStyle: { color: STYLE.lineC.axis, width: STYLE.lineW.axis } },
          axisTick: { show: false, inside: true }
        },
        graphic: graphics,
        series: series
      };
      this.#chart.setOption(opt);
    }
  }
  customElements.define('ob-cal-plot', ObCalPlot);
</script>
