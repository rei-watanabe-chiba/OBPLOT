<script>
  // --- 開発デバッグ用クラス ---
  class OBPDebugger {
    static #box = null;
    static init() {
      if (this.#box) return;
      this.#box = document.createElement('div');
      this.#box.style.cssText = `
        position: fixed; bottom: 0; left: 0; width: 100%; max-height: 120px;
        background: rgba(0,0,0,0.85); color: #00ff00; font-family: monospace;
        font-size: 10px; z-index: 99999; overflow-y: auto; padding: 4px;
        border-top: 2px solid #ff0055; pointer-events: none; pointer-events: auto;
      `;
      this.#box.innerHTML = '<div style="font-weight:bold;color:#ff0055;border-bottom:1px solid #333;">[OBPLOT DEBUG CONSOLE]</div>';
      document.body.appendChild(this.#box);
      // グローバルエラーの捕捉
      window.addEventListener('error', (e) => {
        OBPDebugger.log(`[FATAL_ERR] ${e.message} (${e.filename}:${e.lineno})`, '#ff3333');
      });
      window.addEventListener('unhandledrejection', (e) => {
        OBPDebugger.log(`[PROMISE_REJ] ${e.reason?.message || e.reason}`, '#ffaa00');
      });
    }
    static log(msg, color = '#00ff00') {
      if (!this.#box) this.init();
      const line = document.createElement('div');
      line.style.color = color;
      line.style.borderBottom = '1px solid #222';
      line.style.padding = '2px 0';
      line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      this.#box.appendChild(line);
      this.#box.scrollTop = this.#box.scrollHeight;
    }
  }
  // --- CoreIdlTm ---
  class CoreIdlTm {
    static #MS = 5 * 60000;
    static #tm = null;
    static init() {
      if (isExcelEnv) return;
      const rst = () => { 
        clearTimeout(this.#tm); 
        this.#tm = setTimeout(() => {
          const forceReload = () => {
            if (typeof google !== 'undefined' && google?.script?.run) {
              google.script.run.withFailureHandler(() => google.script.host.close()).showSidebar();
            } else { window.location.reload(); }
          };
          CoreAct.toast("GAS通信エラー", "一定時間操作がなかったため、サイドバーを再起動してください", forceReload);
        }, this.#MS); 
      };
      ['mousemove', 'keydown', 'touchstart', 'click', 'scroll'].forEach(e => document.addEventListener(e, rst, { passive: true })); 
      rst();
    }
  }
  // --- CoreAct ---
  class CoreAct {
    static get #ssId() { return State.get("GLB.ssId"); }
    static #isInit = false;
    static cfgRslv = null;
    static async ensureFetch(ssId, shts) {
      const reqs = shts.map(s => typeof s === 'string' ? { sht: s } : s);
      const resArr = await API.pullMult(ssId, reqs);
      return resArr.map(res => (res?.success && res.pld?.data) ? res.pld.data : null);
    }
    static confirm(title, msg, isToast = false) {
      return new Promise(resolve => {
        window.__dialogResolve = resolve;
        State.set("GLB.dialog", { isOpen: true, type: isToast ? "toast" : "confirm", title, msg });
      });
    }
    static toast(title, msg, onOk = null) {
      this.confirm(title, msg, true).then(res => { if (onOk) onOk(); });
    }
    static closeDlg(tgt) {
      const result = tgt.dataset.result === "true";
      State.set("GLB.dialog.isOpen", false);
      if (window.__dialogResolve) {
        window.__dialogResolve(result);
        window.__dialogResolve = null;
      }
    }
    static async withAsync(statusPath, optOrFn, fn = null, finallyFn = null) {
      const isFn = typeof optOrFn === 'function';
      const actualProcessFn = isFn ? optOrFn : fn;
      const actualFinallyFn = isFn ? fn : finallyFn;
      const opt = isFn ? null : optOrFn;
      const svStat = statusPath ? State.get(statusPath) : null;
      State.set("GLB.isLocked", true);
      if (statusPath) State.set(statusPath, ["loading", "実行中..."]);
      try {
        if (opt) {
          const title = typeof opt === 'object' && opt.title ? opt.title : "確認";
          const msg = typeof opt === 'object' && opt.msg ? opt.msg : (typeof opt === 'string' ? opt : "");
          if (msg && !(await CoreAct.confirm(title, msg))) {
            if (statusPath) State.set(statusPath, svStat ?? ["hidden", ""]);
            State.set("GLB.isLocked", false);
            return false;
          }
        }
        const res = await actualProcessFn();
        if (statusPath) {
          if (typeof res === "string") State.set(statusPath, ["success", res]);
          else if (Array.isArray(res)) State.set(statusPath, res);
        }
        return true;
      } catch (err) {
        if (statusPath) State.set(statusPath, ["error", err.message]);
        return false;
      } finally {
        if (actualFinallyFn) await actualFinallyFn();
        State.set("GLB.isLocked", false);
      }
    }
    static async connectApp(ssId, cfg) {
      State.set("GLB.isLocked", true);
      const statPath = cfg.statPath;
      try {
        State.set(statPath, ["loading", "環境確認中..."]);
        const targetShts = GLB.schema[cfg.schemaKey].map(s => s.name);
        const curShts = await API.getWbState(ssId, targetShts);
        const { errs, buildPlan, missingNames } = CoreMethod.Util.valdEnv(curShts, cfg.schemaKey);
        if (errs.length) throw new Error(`【検証エラー】\n${errs.join('\n')}\n\nGitHub仕様をご確認ください。`);
        if (buildPlan.length) {
          if (missingNames.length) {
            State.set(statPath, ["message", "確認待ち"]);
            if (!(await CoreAct.confirm("確認", `「${missingNames.join('、')}」が不足しています。\n新たに作成しますか？`))) {
              State.set("GLB.isLocked", false);
              State.set(statPath, ["hidden", ""]);
              return false;
            }
          }
          State.set(statPath, ["loading", "シート構成を更新中..."]);
          await API.genShts(ssId, buildPlan);
        }
        State.set("GLB.ssId", ssId);
        State.set(statPath, ["hidden", ""]);
        return true;
      } catch (e) {
        State.set(statPath, ["hidden", ""]);
        await CoreAct.confirm("接続エラー", e.message.includes("【検証エラー】") ? e.message : `予期せぬエラーです。\n\n${e.message}`, true);
        State.set("GLB.isLocked", false);
        return false;
      }
    }
    static async startSession(ssId, isSwitch = false, hooks = {}, cfg = {}) {
      if (!isSwitch) {
        if (this.#isInit) return; 
        const isConnected = await this.connectApp(ssId, cfg);
        if (!isConnected) return; 
        this.#isInit = true;
      }
      if (hooks.onBeforeInit) await hooks.onBeforeInit(isSwitch);
      if (!isSwitch) {
        CoreIdlTm.init();
      }
      State.set("GLB.isLocked", false);
      if (hooks.onAfterInit) hooks.onAfterInit();
    }
    static actvTab(tabPRM) {
      document.querySelectorAll('[data-part="tab-content"], .tab-content').forEach(el => {
        const isCur = (el.dataset.param === tabPRM);
        el.setAttribute('aria-hidden', isCur ? 'false' : 'true');
        if (isCur) el.setAttribute('data-state', 'active');
        else el.removeAttribute('data-state');
      });
      document.querySelectorAll('[data-part="tab-btn"], .tab-btn').forEach(el => {
        const isCur = (el.dataset.param === tabPRM);
        el.setAttribute('aria-selected', isCur ? 'true' : 'false');
      });
      document.body.setAttribute('data-theme', tabPRM);
      State.set("GLB.activeTab", tabPRM);
    }

    static switchTab(btnOrId, hooks = {}) {
      const tabPRM = typeof btnOrId === 'string' ? btnOrId : btnOrId.dataset.param;
      this.actvTab(tabPRM);
      const cfg = this.cfgRslv ? this.cfgRslv(tabPRM) : {};
      this.startSession(this.#ssId || "EXCEL_LOCAL_RUN", true, hooks, cfg);
    }
    // --- [routEvent] 中央イベントルーター ---
    static rootGLB(actionClasses = {}) {
      const routEvent = (e) => {
        const tgt = e.target.closest('[data-action], [data-patch], form[data-bind-ctx] input, form[data-bind-ctx] select, form[data-bind-ctx] textarea') || e.target;
        if (!tgt || tgt.disabled) return;

        const tag = tgt.tagName;
        const type = tgt.type;
        const isClick = e.type === 'click';
        const isInput = e.type === 'input';
        const isChange = e.type === 'change';
        const isLiveInput = isInput && ['INPUT', 'TEXTAREA'].includes(tag) && !['checkbox', 'radio'].includes(type);
        const formCtx = tgt.closest('form[data-bind-ctx]');

        // --- Action発火処理 ---
        const actionStr = tgt.dataset.action;
        if (actionStr) {
          const isBtnClick = isClick && !['INPUT', 'SELECT', 'TEXTAREA'].includes(tag);
          const isValChange = (isChange || isLiveInput) && ['INPUT', 'SELECT', 'TEXTAREA'].includes(tag);
          
          if (isBtnClick || isValChange) {
            const [ns, method] = actionStr.split('.');
            const param = tgt.dataset.param; 
            const subParam = tgt.dataset.subParam;
            
            if (actionClasses[ns]?.[method]) actionClasses[ns][method](tgt, param, subParam);
            else if (window[ns]?.[method]) window[ns][method](tgt, param, subParam);
          }
        }

        // --- State結合処理 (data-patch="bind: ...") ---
        const patchBind = tgt.dataset.patch ? CoreUIPatcher.routOptions(tgt.dataset.patch).bind : null;
        const bindPath = patchBind || (formCtx && tgt.name ? `${CoreUIPatcher.resolveBindCtx(formCtx.dataset.bindCtx)}.${tgt.name}` : null);

        if (bindPath && (isLiveInput || isChange)) {
          let val = type === "checkbox" ? tgt.checked : (['number', 'range'].includes(type) ? (tgt.value === '' ? '' : Number(tgt.value)) : tgt.value);
          if (['number', 'range'].includes(type) && typeof val === 'number') {
            if (tgt.hasAttribute('min') && val < Number(tgt.getAttribute('min'))) val = Number(tgt.getAttribute('min'));
            if (tgt.hasAttribute('max') && val > Number(tgt.getAttribute('max'))) val = Number(tgt.getAttribute('max'));
            tgt.value = val;
          }
          State.set(bindPath, val);
        }
      };

      document.addEventListener("click", routEvent);
      document.addEventListener("change", routEvent);
      document.addEventListener("input", routEvent);
    }
    static tglMulti(tgt) {
      const cntr = tgt.closest('[data-ui="mselect"], ui-mselect');
      if (!cntr) return;
      const statePath = cntr.dataset.bind || (cntr.dataset.patch ? CoreUIPatcher.routOptions(cntr.dataset.patch).bind : null);
      
      const itemCbs = [...cntr.querySelectorAll('.dataset-cb')], allCb = cntr.querySelector('.select-all-cb');
      if (allCb) allCb.checked = itemCbs.length > 0 && itemCbs.every(cb => cb.checked);
      if (statePath) State.set(statePath, itemCbs.filter(cb => cb.checked).map(cb => cb.value));
    }
    static tglAllMulti(tgt) {
      const cntr = tgt.closest('[data-ui="mselect"], ui-mselect');
      if (!cntr) return;
      const statePath = cntr.dataset.bind || (cntr.dataset.patch ? CoreUIPatcher.routOptions(cntr.dataset.patch).bind : null);
      
      const itemCbs = cntr.querySelectorAll('.dataset-cb');
      itemCbs.forEach(cb => cb.checked = tgt.checked);
      if (statePath) State.set(statePath, tgt.checked ? [...itemCbs].map(cb => cb.value) : []);
    }
  }
</script>
