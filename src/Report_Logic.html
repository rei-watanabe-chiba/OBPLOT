  const REPORT_SCHEMA = {

      { part: "lblFilterDB", text: () => GLB.idx.key1 },
      { part: "lblFilterItem", text: () => GLB.idx.p1 },
      { part: "lblFilterGroup", text: () => GLB.idx.wd1 },

        visiblePhase: () => { 
          const l = State.get("RPTST.config.layout"); 
          return l && i < (l.gridRows * l.gridCols);

    ],
    persistPaths: ["RPTST.dataset", "RPTST.config", "RPTST.panels"]
  };



  class ReportMethod {
    // --- buildGraphStyle ---
    static buildGraphStyle(raw, rng) {
      const pt2px = pt => Number(pt) * 1.33;
      const mm2px = mm => Number(mm) * 3.78;
      const px = {};
      Object.entries(raw).forEach(([k, v]) => {
        const unit = rng[k]?.unit;
        if (unit === 'mm') px[k] = mm2px(v);
        else if (unit === 'pt') px[k] = pt2px(v);
        else px[k] = v;
      });

      return {
        style: {
          font: `${raw.fontEng}, ${raw.fontJp}, sans-serif`,
          fontS: { title: px.s_title, tick: px.s_tick, name: px.s_name, stats: px.s_stats, tip: px.s_stats },
          fontC: { base: `hsl(0, 0%, ${100 - raw.c_base}%)`, stats: `hsl(0, 0%, ${100 - raw.c_stats}%)`, tip: 'var(--text-main)' },
          symbol: { baseSize: px.sym_size, pathSize: px.sym_size * 1.2, borderW: px.sym_bw },
          lineW: { axis: px.lw_axis, grid: px.lw_grid, regW: px.lw_reg, regD: Number(raw.lw_reg) <= 0.4 ? [3, 3] : [5, 5] },
          lineC: { axis: `hsl(0, 0%, ${100 - raw.c_axis}%)`, grid: `hsl(0, 0%, ${100 - raw.c_grid}%)`, reg: `hsl(0, 0%, ${100 - raw.c_base}%)` },
          bgPlot: 'transparent', bgOuter: 'transparent', bgTip: 'rgba(255,255,255,0.95)'
        },
        gap: { name: px.g_name, tick: px.g_tick, padT: px.p_t, padB: px.p_b, padL: px.p_l, padR: px.p_r }
      };
    }

    // --- 共通パディング ---
    static getPanelOffsets(gph, hasTitle, titleSizePx) {
      // 幾何計算のDRY化：実際の描画を行う ChartRenderer に余白計算を完全委譲
      const { gridTop, gridBottom, gridLeft, gridRight } = ChartRenderer.getGridMargins(gph, hasTitle);
      return {
        gridTop, gridRight, gridBottom, gridLeft,
        fixedW: gridLeft + gridRight, 
        fixedH: gridTop + gridBottom
      };
    }

    // --- calculatePanelMetrics ---
    static calculatePanelMetrics(gw, gh, gridCols, gridRows, gapPx, gph, hasTitle, titleSizePx) {
      const { fixedW, fixedH } = this.getPanelOffsets(gph, hasTitle, titleSizePx);
      const maxW = (gw - (gridCols - 1) * gapPx) / gridCols;
      const maxH = (gh - (gridRows - 1) * gapPx) / gridRows;
      const plotLen = Math.max(10, Math.min(maxW - fixedW, maxH - fixedH));
      return { panelW: plotLen + fixedW, panelH: plotLen + fixedH };
    }

    // --- calculatePanelMetricsAspect ---
    static calculatePanelMetricsAspect(gw, gh, gridCols, gridRows, gapPx, gph, hasTitle, titleSizePx, rowAspects) {
      const { fixedW, fixedH } = this.getPanelOffsets(gph, hasTitle, titleSizePx);
      const maxW = (gw - (gridCols - 1) * gapPx) / gridCols;
      const maxHTotal = gh - (gridRows - 1) * gapPx;
      const aspects = Array.from({ length: gridRows }, (_, i) => rowAspects[i] ?? 1.0);
      const kSum = aspects.reduce((s, k) => s + k, 0);
      const wConstraint = maxW - fixedW;
      const hConstraint = (maxHTotal - gridRows * fixedH) / kSum;
      const plotW = Math.max(10, Math.min(wConstraint, hConstraint));
      const plotH = aspects.map(k => Math.max(10, k * plotW));
      const panelH = plotH.map(ph => ph + fixedH);
      const panelW = plotW + fixedW;
      return { panelW, panelH, plotW, plotH };
    }

    // --- generateExportHTML ---
    static generateExportHTML(type, outerHTML, dateStr, data) {
      const ttl = `OBPLOT_${type.toUpperCase()}_${dateStr}`;
      let hStr = '';
      if (type === 'app') {
        const scrTag = `<title>${ttl}</title>window.__INJECTED_DATA__=${CoreMethod.Util.escapeJsonForScript(data.raw)}; window.__INJECTED_FAVORITE__=${CoreMethod.Util.escapeJsonForScript(data.fav)};<\/script></head>`;
        hStr = '<!DOCTYPE html>' + outerHTML.replace('</head>', scrTag);
      } else {
        const cfg = JSON.stringify({ autoPrint: type === 'pdf' });
        hStr = '<!DOCTYPE html>' + outerHTML.replace('<head>', `<head><title>${ttl}</title>window.__EXPORT_CFG__=${cfg}; window.__PRINT_STATE__=${CoreMethod.Util.escapeJsonForScript(data.state)}; window.__PRECALC_DATA__=${CoreMethod.Util.escapeJsonForScript(data.pCalcDT)};<\/script>`);
      }
      return { ttl, hStr };
    }

    // --- calculateBaseScales ---
    static calculateBaseScales(d, dataset, targetMetrics) {
      if (!d?.pxrfDT || !d?.wdxrfDT || !targetMetrics?.size) return { auto: {}, fixed: {} };
      const baseScales = { auto: {}, fixed: {} };
      const calcForMetrics = (mode, filters) => {
        const conf = { useCal: dataset.useCal, crctDT: d.crctDT, useLOD: dataset.useLOD };
        const { pDT, wDT } = filters ? CoreMethod.Util.filterDatasets(d.pxrfDT, d.wdxrfDT, filters, GLB.idx) : { pDT: d.pxrfDT, wDT: d.wdxrfDT };
        const filteredCalibBase = CHARTDT.genBaseDT(pDT, wDT, { ...conf, val: GLB.valElms[0] });
        targetMetrics.forEach(metric => {
          const wVals = wDT.map(w => CoreMethod.Calc.evaluate(metric, w)).filter(v => v != null && !isNaN(v));
          const pVals = filteredCalibBase.map(p => CoreMethod.Calc.evaluate(metric, p)).filter(v => v != null && !isNaN(v));
          const combined = [...wVals, ...pVals];
          if (combined.length) {
            const sc = CoreMethod.Util.calcScale(combined, combined);
            baseScales[mode][metric] = { niceMin: sc.niceMin, niceMax: sc.niceMax, ticks: sc.niceTicks.map(t => t.v), units: CoreMethod.Util.calcNiceTickUnits(combined) };
          } else {
            baseScales[mode][metric] = null;
          }
        });
      };
      calcForMetrics('fixed', { db: dataset.filters?.db || [] });
      calcForMetrics('auto', dataset.filters);
      return baseScales;
    }

    // --- _makeCustomScale ---
    // カスタム単位が指定された場合のスケール再計算（純粋関数）
    static _makeCustomScale(rawMin, rawMax, specifiedUnit) {
      const u = Number(specifiedUnit);
      if (isNaN(u) || u <= 0) return null;
      const minVal = rawMin >= 0 ? 0 : Math.floor(rawMin / u) * u;
      const maxVal = rawMin >= 0 ? Math.max(u, Math.ceil(rawMax / u) * u) : Math.ceil(rawMax / u) * u;
      const count = Math.round((maxVal - minVal) / u);
      if (count > 200 || count <= 0) return null;
      const { ticks, fmtTick } = CoreMethod.Util.createTicks(minVal, maxVal, u);
      return { min: minVal, max: maxVal, interval: u, fmtTick };
    }

    // --- buildChartConfig ---
    static buildChartConfig(d, dataset, panel, boardMode, gph, symb, srcScales, layout, rowIndex) {
      if (!d?.pxrfDT?.length) return null;

      const graphType = boardMode || 'calib';
      
      const conf = { 
        useCal: dataset.useCal, 
        calElms: dataset.calElms, 
        crct: dataset.crct, 
        crctDT: d.crctDT, 
        useLOD: dataset.useLOD, 
        filters: dataset.filters, 
        graphType, 
        calbVal: panel.calbVal, 
        clusXVal: panel.clusXVal, 
        clusYVal: panel.clusYVal 
      };

      const { prevDT, statsDT } = CHARTDT.genChartDB(d.pxrfDT, d.wdxrfDT, conf);

      let aspectMode = 'square';
      let aspectRatio = null;
      let finalScaleFixed = null;

      // カスタムスケールの適用ロジック
      if (srcScales) {
        const resolveUnit = (u) => (u != null && u !== '' && !isNaN(Number(u)) && Number(u) > 0) ? Number(u) : null;
        let scaleX = srcScales.x;
        let scaleY = srcScales.y;

        if (graphType === 'clus') {
          aspectMode = 'custom';
          aspectRatio = layout?.rowAspect?.[rowIndex] ?? 1.0;
          const uX = resolveUnit(panel.tickUnitX);
          if (uX && scaleX) scaleX = this._makeCustomScale(scaleX.niceMin, scaleX.niceMax, uX) || scaleX;
          const uY = resolveUnit(panel.tickUnitY);
          if (uY && scaleY) scaleY = this._makeCustomScale(scaleY.niceMin, scaleY.niceMax, uY) || scaleY;
        } else {
          // calibモードの場合は、スケール全体(XY両方)を包括する最小値/最大値で統一
          if (scaleX && scaleY) {
            const minAll = Math.min(scaleX.niceMin, scaleY.niceMin);
            const maxAll = Math.max(scaleX.niceMax, scaleY.niceMax);
            const u = resolveUnit(panel.tickUnit);
            if (u) {
              const c = this._makeCustomScale(minAll, maxAll, u);
              if (c) { scaleX = c; scaleY = c; }
            }
          }
        }
        finalScaleFixed = { x: scaleX, y: scaleY };
      }

      return {
        data: { prevDT, statsDT },
        symb,
        panel,
        gph,
        layout: { aspectMode, aspectRatio },
        scaleFixed: finalScaleFixed
      };
    }
  }

</script>
