<!-- src/T1T2_Schema.html -->
<script>
  const T1T2_SCHEMA = {
    T1: {
      elements: [
        { id: "tab1Fieldset", disablePhase: () => State.get("GLB.isLocked") },
        { id: "prefSec", activePhase: p => p === T1_PHS.INIT, disablePhase: p => false },
        
        { id: "rawSec", activePhase: p => p >= T1_PHS.READY, disablePhase: p => p < T1_PHS.READY, openPhase: p => p >= T1_PHS.READY && p < T1_PHS.VALID },
        { id: "btn-load-raw", disablePhase: p => false, text: p => p <= T1_PHS.READY ? "データを取得" : "再取得" },
        { id: "btn-make-list", activePhase: p => p >= T1_PHS.READY, className: p => p === T1_PHS.LOAD ? "" : "outline" },
        { id: "btn-vald-list", activePhase: p => p >= T1_PHS.INVALID && !State.get("T1ST.raw.flags").some(Boolean), className: p => p === T1_PHS.INVALID ? "" : "outline" },
        { id: "rawSecArea", visiblePhase: p => p >= T1_PHS.LOAD },
        { id: "rawSecBtnBox", visiblePhase: p => p >= T1_PHS.LOAD },
        
        { id: "extrSec", activePhase: p => p >= T1_PHS.VALID, disablePhase: p => p < T1_PHS.VALID, openPhase: p => p >= T1_PHS.VALID && p < T1_PHS.OUTPUT },
        { id: "btn-extr-run", activePhase: p => p >= T1_PHS.VALID && !State.get("T1ST.extr.flags").some(Boolean) },
        { id: "btn-push-extr", activePhase: p => p >= T1_PHS.EXTRACT, visiblePhase: p => p >= T1_PHS.EXTRACT },
        { id: "extrSecArea", visiblePhase: p => p >= T1_PHS.VALID }
      ]
    },
    T2: {
      persistPaths: [
        "T2ST.asgn.refs.available", "T2ST.asgn.refs.filter",
        "T2ST.symb.refs.baseKey", "T2ST.symb.refs.rls",
        "T2ST.calb.refs.modeMap", "T2ST.calb.refs.calElms", "T2ST.calb.refs.correction", "T2ST.calb.refs.useLOD", "T2ST.calb.refs.useCal",
        "T2ST.prev.refs.itemMap", "T2ST.prev.refs.val", "T2ST.prev.refs.saveIndexName",
        "T2ST.stdz.refs.itemMap", "T2ST.stdz.refs.modeMap", "T2ST.stdz.refs.useLOD", "T2ST.stdz.refs.saveIndexName",
        "T2ST.asgn.status", "T2ST.symb.status", "T2ST.calb.status", "T2ST.prev.status", "T2ST.stdz.status"
      ],
      elements: [
        { id: "tab2Fieldset", disablePhase: () => State.get("GLB.isLocked") },
        { id: "asgnSec", activePhase: p => true, disablePhase: p => false, openPhase: p => p < T2_PHS.FILTERED },
        { id: "btn-load-db", disablePhase: p => false },
        { id: "btn-fltr-db", activePhase: p => p >= T2_PHS.LOADED },
        { id: "asgnSecArea", visiblePhase: p => p >= T2_PHS.LOADED },

        { id: "symbSec", activePhase: p => p >= T2_PHS.FILTERED, disablePhase: p => p < T2_PHS.FILTERED, openPhase: p => p >= T2_PHS.FILTERED && p < T2_PHS.MAPPED },
        { id: "btn-symb", activePhase: p => p >= T2_PHS.FILTERED },
        { id: "t2AxisBox", activePhase: p => p >= T2_PHS.FILTERED },
        { id: "symbSecArea", visiblePhase: p => p >= T2_PHS.FILTERED },

        // ダウンフェーズ (p < 4) 時は false (強制閉鎖)、それ以上は undefined (ユーザー操作維持)
        { id: "prevSec", activePhase: p => p >= T2_PHS.MAPPED, disablePhase: p => p < T2_PHS.MAPPED, openPhase: p => p < T2_PHS.MAPPED ? false : undefined },
        { id: "btn-make-prev", activePhase: p => p >= T2_PHS.MAPPED },

        { id: "calbSec", activePhase: p => p >= T2_PHS.MAPPED, openPhase: p => p === T2_PHS.MAPPED ? true : (p >= T2_PHS.PREVIEWED ? false : undefined) },

        { id: "stdzSec", activePhase: p => p >= T2_PHS.MAPPED, disablePhase: p => p < T2_PHS.MAPPED, openPhase: p => p < T2_PHS.MAPPED ? false : undefined }
      ]
    }
  };
</script>
