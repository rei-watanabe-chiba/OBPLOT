<script>
  // --- 共通ユーティリティ ---
  class DataUtils {
    // --- 再配列処理 ---
    static remapArry(data, indexArr, newHeader = null) {
      if (!data?.length) return [];
      const [rawHeader, ...body] = data;
      const remap = row => indexArr.map(idx => idx !== -1 ? (row?.[idx] ?? "") : "");
      return [newHeader ?? remap(rawHeader), ...body.map(remap)];
    }

    // --- セレクタ配列判定 ---
    static validateSelect(values, quota = values.length) {
      const checkVals = values.slice(0, quota);
      return values.map((v, i) => i < quota ? (!v || checkVals.indexOf(v) !== checkVals.lastIndexOf(v)) : false);
    }
  }

  // --- Tab1 ファイルリスト検証ロジック ---
  class FileValidator {
    static #COL = { FILE: 0, MODE: 1, ID: 2, SUB_ID: 3, INFO: 4 };
    static #getScanID = (id, sub_id) => sub_id ? `${id}_${sub_id}` : `${id}`;
    static run(sheetData, outHeader, validModes, exacMode) {
      if (!sheetData?.length) return [];
      const [, ...body] = sheetData;
      const stats = { file: {}, scan: {} };
      // カウント集計
      for (const row of body) {
        const file = row[this.#COL.FILE];
        const scanId = this.#getScanID(row[this.#COL.ID], row[this.#COL.SUB_ID]);
        stats.file[file] = (stats.file[file] || 0) + 1;
        stats.scan[scanId] ??= { modes: new Set(), count: 0 };
        stats.scan[scanId].modes.add(row[this.#COL.MODE]);
        stats.scan[scanId].count++;
      }
      // エラー判定
      const rules = [
        { check: r => !/^\d+$/.test(r[this.#COL.FILE] ?? ""), err: " file形式" },
        { check: r => !validModes.includes(r[this.#COL.MODE]), err: " mode形式" },
        { check: r => !r[this.#COL.ID], err: " id形式" },
        { check: r => stats.file[r[this.#COL.FILE]] > 1, err: " file重複" },
        { check: r => {
            const s = stats.scan[this.#getScanID(r[this.#COL.ID], r[this.#COL.SUB_ID])];
            if (exacMode === "Single") return s.count > 1;
            return !(s?.count === 2 && s.modes.size === 2 && s.modes.has('mudrock') && s.modes.has('obsidian'));
          }, err: exacMode === "Single" ? " id重複" : " 計測id-mode形式"
        }
      ];
      // データ出力
      return [
        [...outHeader, "error"],
        ...body.map(row => {
          const scanId = this.#getScanID(row[this.#COL.ID], row[this.#COL.SUB_ID]);
          const errorMsg = rules.filter(r => r.check(row)).map(r => r.err).join(",");
          return [...row, scanId, errorMsg];
        })
      ];
    }
  }

  // --- Tab1 Results抽出ロジック ---
  class DataExtractor {
    static run(fileDT, resultDT, exacMap) {
      if (!fileDT?.length || !resultDT?.length) return [];
      const resultMap = new Map(resultDT.slice(1).map(r => [String(r[0]), r]));
      const scanIDMap = new Map();
      // マップ作成
      for (const [file, mode, id, , , scanId] of fileDT.slice(1)) {
        if (!scanIDMap.has(scanId)) scanIDMap.set(scanId, { id, files: {} });
        scanIDMap.get(scanId).files[String(mode).toLowerCase()] = file;
      }
      const getKeys = obj => Object.keys(obj).sort((a, b) => obj[a] - obj[b]);
      const [obKeys, mdKeys] = [getKeys(GLOBAL_CONFIG.obsidianIndex), getKeys(GLOBAL_CONFIG.mudrockIndex)];
      // 数値フォーマット
      const format = v => (v === "" || v == null) ? "" : (String(v).trim() === "< LOD" ? v : (!isNaN(Number(v)) ? Number(v) * 10000 : v));
      // データ抽出
      const extract = (file, keys, idxObj) => {
        const row = resultMap.get(String(file ?? ""));
        return keys.reduce((acc, k) => {
          const idx = Object.hasOwn(idxObj, k) ? idxObj[k] : null;
          acc.vals.push(format(idx !== null ? (row?.[idx] ?? "") : ""));
          acc.errs.push(format(idx !== null ? (row?.[idx + 1] ?? "") : ""));
          return acc;
        }, { vals: [], errs: [] });
      };
      // データ出力
      const header = [
        '計測ID', 'ID', 'dataset', 'item', 'date',
        ...obKeys.map(k => `ob_${k}`), ...mdKeys.map(k => `md_${k}`),
        ...obKeys.map(k => `ob_${k}_Err`), ...mdKeys.map(k => `md_${k}_Err`)
      ];
      const body = Array.from(scanIDMap, ([scanId, { id, files }]) => {
        const ob = extract(files.obsidian, obKeys, GLOBAL_CONFIG.obsidianIndex);
        const mu = extract(files.mudrock, mdKeys, GLOBAL_CONFIG.mudrockIndex);
        return [scanId, id, exacMap.dataset, exacMap.item, exacMap.date, ...ob.vals, ...mu.vals, ...ob.errs, ...mu.errs];
      });
      return [header, ...body];
    }
  }
  
  // --- Tab1 PXRF重複検証・統合ロジック ---
  class PxrfValidator {
    static run(existingDT, newDT) {
      if (!existingDT?.length || !newDT?.length) return { isDup: false, data: newDT };
      // dataset_IDをキーとして突合
      const newKeys = new Set(newDT.slice(1).map(r => `${r[2]}_${r[1]}`));
      const filteredEx = existingDT.slice(1).filter(r => !newKeys.has(`${r[2]}_${r[1]}`));
      return filteredEx.length !== existingDT.length - 1 
        ? { isDup: true, data: [existingDT[0], ...filteredEx, ...newDT.slice(1)] } 
        : { isDup: false, data: null };
    }
  }

  // --- Tab2 データ取得ロジック ---
  class DataManager {
    // 行列変換
    static #toObjArray(data) {
      const [header, ...body] = data;
      return body.map(row => header.reduce((obj, h, i) => ({ ...obj, [String(h).trim()]: row[i] }), {}));
    }

    // 読み込みロジック
    static load(pxrfData, wdxrfData) {
      const pxrfObjs = this.#toObjArray(pxrfData);
      const wdxrfObjs = this.#toObjArray(wdxrfData);    
      const clean = str => String(str ?? "").replace(/\s+/g, "").toUpperCase();
      const wdxrfMap = new Map(wdxrfObjs.map(o => [`${clean(o.dataset)}_${clean(o.ID || o.id)}`, o]));
      const datasets = new Set();
      pxrfObjs.forEach(pObj => {
        const wObj = wdxrfMap.get(`${clean(pObj.dataset)}_${clean(pObj.ID || pObj.id)}`);
        pObj.Group = wObj?.Group ?? "Unknown";
        pObj.Source = wObj?.Source ?? "Unknown";
        if (pObj.dataset) datasets.add(pObj.dataset);
      });
      return { mergedPXRF: pxrfObjs, wdxrfObjs, datasets: [...datasets] };
    }

    // フィルターロジック
    static filter(mergedPXRF, wdxrfObjs, selectedDatasets) {
      const targetSet = new Set(selectedDatasets);
      return { basePXRF: mergedPXRF.filter(obj => targetSet.has(obj.dataset)), baseWDXRF: wdxrfObjs.filter(obj => targetSet.has(obj.dataset)) };
    }
  }

  // --- Tab2 プレビューデータ構築ロジック ---
  class PreviewManager {
    // プレビュー用データ構築
    static buildPreviewData(basePXRF, baseWDXRF, modeMap, valueLogic) {
      const allElements = Object.keys(GLOBAL_CONFIG.mudrockIndex);
      // pxrf元素の抽出
      const processed = basePXRF.map(row => {
        const newRow = { dataset: row.dataset, id: row.ID || row.id };
        allElements.forEach(el => {
          const isOptional = GLOBAL_CONFIG.optionalElements.includes(el);
          const mode = isOptional ? (modeMap[el] || 'obsidian') : 'mudrock';
          const colName = mode === 'obsidian' ? `ob_${el}` : `md_${el}`;
          const errColName = mode === 'obsidian' ? `ob_${el}_Err` : `md_${el}_Err`;
          newRow[el] = row[colName] ?? null;
          newRow[`${el}_Err`] = row[errColName] ?? null;
        });
        return newRow;
      });

      // WDXRFマップ作成
      const wdxrfMap = new Map(baseWDXRF.map(w => [`${w.dataset}_${w.ID || w.id}`, w]));
      
      // プレビューデータ構築
      return processed.map(p => {
        const w = wdxrfMap.get(`${p.dataset}_${p.id}`);
        if (!w) return null;
        
        const yVal = CalcProcessor.evaluate(valueLogic, p);
        const xVal = CalcProcessor.evaluate(valueLogic, w);
        if (xVal == null || yVal == null) return null;

        const errVal = allElements.includes(valueLogic) ? (p[`${valueLogic}_Err`] ?? null) : null;

        return { x: xVal, y: yVal, err: errVal };
      }).filter(Boolean);
    }
  }

  // --- Tab2 数式評価・統計ロジック ---
  class CalcProcessor {
    // 安全な式評価コンパイラ
    static evaluate(formula, rowData) {
      if (!formula) return null;
      try {
        const keys = Object.keys(rowData);
        const vals = Object.values(rowData);
        // Mathオブジェクトの関数をローカル変数として展開し、安全に実行
        const mathFns = Object.getOwnPropertyNames(Math)
          .filter(k => typeof Math[k] === 'function')
          .map(k => `const ${k} = Math.${k};`)
          .join('');
        const fn = new Function(...keys, `${mathFns} return ${formula};`);
        const result = fn(...vals);
        return isNaN(result) || !isFinite(result) ? null : result;
      } catch (e) {
        return null;
      }
    }

    // --- ピアソン相関・単回帰計算 ---
    static calcRegression(xArr, yArr, errArr) {
      if (!xArr?.length || xArr.length !== yArr?.length) return null;
      const n = xArr.length;
      
      const [sumX, sumY] = xArr.reduce((acc, x, i) => [acc[0] + x, acc[1] + yArr[i]], [0, 0]);
      const [meanX, meanY] = [sumX / n, sumY / n];

      let num = 0, sxx = 0, syy = 0;
      for (let i = 0; i < n; i++) {
        const [dx, dy] = [xArr[i] - meanX, yArr[i] - meanY];
        num += dx * dy;
        sxx += dx * dx;
        syy += dy * dy;
      }

      const slope = sxx === 0 ? 0 : num / sxx;
      const intercept = meanY - slope * meanX;
      const r = (sxx === 0 || syy === 0) ? 0 : num / Math.sqrt(sxx * syy);
      
      let ssRes = 0, maxRes = 0;
      for (let i = 0; i < n; i++) {
        const res = Math.abs(yArr[i] - (slope * xArr[i] + intercept));
        ssRes += res * res;
        maxRes = Math.max(maxRes, res);
      }
      
      const resStdDev = n > 2 ? Math.sqrt(ssRes / (n - 2)) : 0;
      
      let err3Sigma = 0;
      if (errArr?.length > 2) {
        const meanErr = errArr.reduce((sum, err) => sum + err, 0) / errArr.length;
        const ssErr = errArr.reduce((sum, err) => sum + (err - meanErr) ** 2, 0);
        err3Sigma = Math.sqrt(ssErr / (errArr.length - 1)) * 3;
      }

      return { slope, intercept, r, r2: r * r, resStdDev, err3Sigma, maxRes };
    }
  }

  // --- 外部参照用 (追加反映) ---
  const Mtd = {
    Utils: DataUtils,
    Tab1: { FileValidator, DataExtractor, PxrfValidator },
    Tab2: { DataManager, PreviewManager, CalcProcessor }
  };
</script>
