<script>
  const Mtd = {
    Util: class {
      // --- 再配列処理 ---
      static remapArry(data, idxArr, newHdr = null) {
        if (!data?.length) return [];
        const remap = r => idxArr.map(idx => idx !== -1 ? (r?.[idx] ?? "") : "");
        return [newHdr ?? remap(data[0]), ...data.slice(1).map(remap)];
      }
      // --- セレクタ配列判定 ---
      static validateSelect(vals, quota = vals.length) {
        const chkVals = vals.slice(0, quota);
        return vals.map((v, i) => i < quota ? (!v || chkVals.indexOf(v) !== chkVals.lastIndexOf(v)) : false);
      }
      // --- 汎用キーソート ---
      static sortKeysByVal = obj => Object.keys(obj).sort((a, b) => obj[a] - obj[b]);
      // --- 有効数値の抽出 ---
      static getValidNums = (arr, reqPos = false) => arr.map(Number).filter(v => !isNaN(v) && (!reqPos || v > 0));
      // --- 統計表データ生成 ---
      static buildStats(statsDT, digits = 3, fmlRls = null) {
        if (!statsDT) return [];
        const fmt = v => (v != null && !isNaN(v)) ? Number(v).toFixed(digits) : "-";
        const meta = { ...statsDT, sign: statsDT.intercept >= 0 ? "+" : "-", abs_intercept: Math.abs(statsDT.intercept ?? 0) };
        if (fmlRls?.length) {
          return fmlRls.map(({ key, label }) => {
            if (!key) return [label ?? "", ""];
            const valStr = meta[key] !== undefined ? (meta[key] === meta.sign ? meta[key] : fmt(meta[key])) : key.replace(/\{(\w+)\}/g, (m, k) => meta[k] !== undefined ? (k === "sign" ? meta[k] : fmt(meta[k])) : m);
            return [label ?? "", valStr];
          });
        }
        return [
          statsDT.count != null ? ["データ個数", statsDT.count] : null,
          (statsDT.r != null && statsDT.r2 != null) ? ["相関係数", `R = ${fmt(statsDT.r)} , R² = ${fmt(statsDT.r2)}`] : null,
          (statsDT.slope != null && statsDT.intercept != null) ? ["回帰直線", `y = ${fmt(statsDT.slope)}x ${meta.sign} ${fmt(meta.abs_intercept)}`] : null,
          statsDT.resStdDev != null ? ["残差標準偏差", fmt(statsDT.resStdDev)] : null,
          statsDT.err3Sigma != null ? ["器械Err3σ", fmt(statsDT.err3Sigma)] : null
        ].filter(Boolean);
      }
      // --- Nice Numbers計算 ---
      static calcScale(xVals, yVals, desiredTicks = 4) {
        if (!xVals?.length || !yVals?.length) return { niceMin: 0, niceMax: 0, niceTicks: [] };
        const [xMin, xMax, yMin, yMax] = [Math.min(...xVals), Math.max(...xVals), Math.min(...yVals), Math.max(...yVals)];
        const isAllPos = xMin >= 0 && yMin >= 0;
        const rawMin = isAllPos ? 0 : Math.min(xMin, yMin);
        const rawMax = Math.max(xMax, yMax);
        const rawStep = (rawMax - rawMin || 1) / (desiredTicks - 1);
        const exp = Math.floor(Math.log10(rawStep));
        const frac = rawStep / Math.pow(10, exp);
        const niceFrac = frac <= 1.2 ? 1 : (frac <= 2.5 ? 2 : (frac <= 6.0 ? 5 : 10));
        const niceStep = niceFrac * Math.pow(10, exp);
        const niceMin = isAllPos ? 0 : Math.floor(rawMin / niceStep) * niceStep;
        const niceMax = Math.ceil(rawMax / niceStep) * niceStep;
        const decimals = exp < 0 ? Math.abs(exp) : 0;
        const niceTicks = Array.from({ length: Math.round((niceMax - niceMin) / niceStep) + 1 }, (_, i) => {
          const v = niceMin + (i * niceStep);
          return { v: v, f: Math.abs(v) >= 1000 ? `${(v / 1000).toFixed(0)}k` : (decimals > 0 ? v.toFixed(decimals) : v.toLocaleString()) };
        });
        return { niceMin, niceMax, niceTicks };
      }
      // --- ヘッダー動的生成集約 ---
      static buildHeader(type) {
        const { key1, key2, p1, p2, wd1, wd2 } = GLB.idx;
        const obK = this.sortKeysByVal(GLB.obsidianIndex), mdK = this.sortKeysByVal(GLB.mudrockIndex);
        switch(type) {
          case 'pxrf': return ['計測ID', key2, key1, p1, p2, ...obK.map(k => `ob_${k}`), ...mdK.map(k => `md_${k}`), ...obK.map(k => `ob_${k}_Err`), ...mdK.map(k => `md_${k}_Err`)];
          case 'wdxrf': return [key1, key2, wd1, wd2, ...GLB.valElms];
          case 'corr': return ['IndexName', ...GLB.valElms.flatMap(e => [`${e}_slp`, `${e}_int`])];
          case 'filelist': return ['file', 'mode', key2, 'sub_id', 'info', '計測ID'];
          case 'rawFile': return ['file', 'mode', key2, 'sub_id', 'info'];
          default: return [];
        }
      }
    },
    T1: {
      // --- リスト検証 ---
      FVald: class {
        static valdList(shtDT, outHdr, validMods, exacMode) {
          if (!shtDT?.length) return [];
          const [hdr, ...body] = shtDT;
          const getIdx = k => hdr.findIndex(h => h === k); // 走査型バインド
          const colFile = getIdx('file'), colMode = getIdx('mode'), colId = getIdx(GLB.idx.key2), colSub = getIdx('sub_id');
          const getScanID = r => r[colSub] ? `${r[colId]}_${r[colSub]}` : `${r[colId]}`;
          const statsDT = body.reduce((acc, r) => {
            acc.file.set(r[colFile], (acc.file.get(r[colFile]) || 0) + 1);
            const sId = getScanID(r);
            const s = acc.scan.get(sId) || { modes: new Set(), count: 0 };
            s.modes.add(r[colMode]); s.count++; acc.scan.set(sId, s);
            return acc;
          }, { file: new Map(), scan: new Map() });
          const rls = [
            { check: r => !/^\d+$/.test(r[colFile] ?? ""), err: " file形式" },
            { check: r => !validMods.includes(r[colMode]), err: " mode形式" },
            { check: r => !r[colId], err: " id形式" },
            { check: r => statsDT.file.get(r[colFile]) > 1, err: " file重複" },
            { check: r => {
                const s = statsDT.scan.get(getScanID(r));
                return exacMode === "Single" ? s.count > 1 : !(s?.count === 2 && s.modes.size === 2 && s.modes.has('mudrock') && s.modes.has('obsidian'));
              }, err: exacMode === "Single" ? " id重複" : " 計測id-mode形式" }
          ];
          return [[...outHdr, "error"], ...body.map(r => [...r, getScanID(r), rls.filter(rl => rl.check(r)).map(rl => rl.err).join(",")])];
        }
      },
      // --- データ抽出 ---
      Extr: class {
        static runExtr(fileDT, resDT, extrRefs) {
          if (!fileDT?.length || !resDT?.length) return [];
          const resMap = new Map(resDT.slice(1).map(r => [String(r[0]), r]));
          const scanIDMap = fileDT.slice(1).reduce((map, r) => {
            const entry = map.get(r[5]) || { id: r[2], files: {} };
            entry.files[String(r[1]).toLowerCase()] = r[0]; map.set(r[5], entry); return map;
          }, new Map());
          const obKeys = Mtd.Util.sortKeysByVal(GLB.obsidianIndex), mdKeys = Mtd.Util.sortKeysByVal(GLB.mudrockIndex);
          const fmt = v => (v === "" || v == null) ? "" : (String(v).trim() === "< LOD" ? v : (!isNaN(Number(v)) ? Number(v) * 10000 : v));
          const extract = (file, keys, idxObj) => {
            const r = resMap.get(String(file ?? ""));
            return keys.reduce((acc, k) => {
              const idx = Object.hasOwn(idxObj, k) ? idxObj[k] : null;
              acc.vals.push(fmt(idx !== null ? (r?.[idx] ?? "") : ""));
              acc.errs.push(fmt(idx !== null ? (r?.[idx + 1] ?? "") : ""));
              return acc;
            }, { vals: [], errs: [] });
          };
          return [Mtd.Util.buildHeader('pxrf'), ...Array.from(scanIDMap, ([scanId, { id, files }]) => {
            const ob = extract(files.obsidian, obKeys, GLB.obsidianIndex), md = extract(files.mudrock, mdKeys, GLB.mudrockIndex);
            return [scanId, id, extrRefs[GLB.idx.key1], extrRefs[GLB.idx.p1], extrRefs[GLB.idx.p2], ...ob.vals, ...md.vals, ...ob.errs, ...md.errs];
          })];
        }
      },
      // --- PXRF重複検証 ---
      PVald: class {
        static checkPxrf(pxrfDT, newDT) {
          if (!pxrfDT?.length || !newDT?.length) return { isDup: false, data: newDT };
          const h = pxrfDT[0];
          const iDB = h.indexOf(GLB.idx.key1), iID = h.indexOf(GLB.idx.key2);
          const newKeys = new Set(newDT.slice(1).map(r => `${r[iDB]}_${r[iID]}`));
          const fltrEx = pxrfDT.slice(1).filter(r => !newKeys.has(`${r[iDB]}_${r[iID]}`));
          return fltrEx.length !== pxrfDT.length - 1 ? { isDup: true, data: [pxrfDT[0], ...fltrEx, ...newDT.slice(1)] } : { isDup: false, data: null };
        }
      }
    },
    T2: {
      // --- データ統合 ---
      mgmtDT: class {
        // --- オブジェクト配列化 ---
        static #toObjArray(data) {
          const [hdr, ...body] = data;
          return body.map(r => hdr.reduce((obj, h, i) => ({ ...obj, [String(h).trim()]: r[i] }), {}));
        }
        // --- 読込 ---
        static loadDB(pxrfDT, wdxrfDT) {
          const pObjs = this.#toObjArray(pxrfDT);
          const wObjs = this.#toObjArray(wdxrfDT);
          const { key1: k1, key2: k2, wd1: w1, wd2: w2 } = GLB.idx;
          const wMap = new Map(wObjs.map(o => [`${o[k1]}_${o[k2]}`, o]));
          const dbs = new Set();
          pObjs.forEach(pObj => {
            const wObj = wMap.get(`${pObj[k1]}_${pObj[k2]}`);
            pObj[w1] = wObj?.[w1] ?? "Unknown"; 
            pObj[w2] = wObj?.[w2] ?? "Unknown";
            if (pObj[k1]) dbs.add(pObj[k1]);
          });
          return { wrapPXRF: pObjs, wrapWDXRF: wObjs, dbs: [...dbs] };
        }
        // --- フィルタ ---
        static fltrDB(wrapPXRF, wrapWDXRF, selDBs) {
          const tgtSet = new Set(selDBs);
          const { key1: k1, key2: k2, p1: p1, wd1: w1, wd2: w2 } = GLB.idx;
          const pxrfDT = wrapPXRF.filter(obj => tgtSet.has(obj[k1])).map(r => ({
            [k1]: r[k1], [k2]: r[k2], [p1]: r[p1], [w1]: r[w1], [w2]: r[w2],
            ...Object.fromEntries(GLB.valElms.flatMap(elm => [[`ob_${elm}`, r[`ob_${elm}`]], [`md_${elm}`, r[`md_${elm}`]], [`ob_${elm}_Err`, r[`ob_${elm}_Err`]], [`md_${elm}_Err`, r[`md_${elm}_Err`]]]))
          }));
          const wdxrfDT = wrapWDXRF.filter(obj => tgtSet.has(obj[k1])).map(r => ({
            [k1]: r[k1], [k2]: r[k2], [w1]: r[w1], [w2]: r[w2],
            ...Object.fromEntries(GLB.valElms.map(elm => [elm, r[elm]]))
          }));
          return { pxrfDT, wdxrfDT };
        }
      },
      // --- プレビューデータ生成 ---
      mgmPrev: class {
        // --- データ生成パイプライン統合 ---
        static buildPrev(pxrfDT, wdxrfDT, conf) {
          if (!pxrfDT?.length || !wdxrfDT?.length) return [];
          const { key1: k1, key2: k2, p1: p1, wd1: w1, wd2: w2 } = GLB.idx;
          const wMap = new Map(wdxrfDT.map(w => [`${w[k1]}_${w[k2]}`, w]));
          const minMap = conf.useLOD ? this.#getMinMap(pxrfDT, conf) : {};
          const cfs = this.#resCoeffs(pxrfDT, wMap, conf, minMap);
          return pxrfDT.reduce((acc, r) => {
            const itemVal = r[p1];
            if (conf.itemMap?.length && !conf.itemMap.includes(itemVal)) return acc;
            const w = wMap.get(`${r[k1]}_${r[k2]}`);
            if (!w) return acc;
            const pDT = { [k1]: r[k1], [k2]: r[k2], [p1]: itemVal, [w1]: r[w1], [w2]: r[w2] };
            GLB.valElms.forEach(elm => {
              const pfx = (GLB.optElms.includes(elm) && conf.modeMap?.includes(elm)) ? 'ob' : 'md';
              const rawV = r[`${pfx}_${elm}`];
              const isLod = typeof rawV === 'string' && rawV.includes('LOD');
              let val = (isLod && conf.useLOD) ? (minMap[elm] ?? null) : (rawV != null && rawV !== "" && !isNaN(Number(rawV)) ? Number(rawV) : null);
              if (cfs?.[elm] && val != null) val = (val - cfs[elm].int) / cfs[elm].slp;
              pDT[elm] = val; pDT[`${elm}_Err`] = r[`${pfx}_${elm}_Err`] ?? null;
            });
            const xVal = Mtd.T2.Calc.evaluate(conf.val, w), yVal = Mtd.T2.Calc.evaluate(conf.val, pDT);
            if (xVal != null && yVal != null) acc.push({ ...pDT, x: xVal, y: yVal, err: GLB.valElms.includes(conf.val) ? (pDT[`${conf.val}_Err`] ?? null) : null });
            return acc;
          }, []);
        }
        // --- LOD最小値取得 ---
        static #getMinMap(pxrfDT, conf) {
          return Object.fromEntries(GLB.valElms.map(elm => {
            const pfx = (GLB.optElms.includes(elm) && conf.modeMap?.includes(elm)) ? 'ob' : 'md';
            const nums = Mtd.Util.getValidNums(pxrfDT.map(r => r[`${pfx}_${elm}`]), true);
            return [elm, nums.length ? Math.min(...nums) : null];
          }));
        }
        // --- 検量線算出 ---
        static #resCoeffs(pxrfDT, wMap, conf, minMap) {
          if (!conf.useCal || !conf.calElms?.length) return null;
          const { key1: k1, key2: k2 } = GLB.idx;
          if (conf.correction === "new") {
            return Object.fromEntries(conf.calElms.map(elm => {
              const pfx = (GLB.optElms.includes(elm) && conf.modeMap?.includes(elm)) ? 'ob' : 'md';
              const vList = pxrfDT.reduce((acc, p) => {
                const w = wMap.get(`${p[k1]}_${p[k2]}`);
                if (!w || w[elm] == null) return acc;
                const raw = p[`${pfx}_${elm}`];
                const v = (typeof raw === 'string' && raw.includes('LOD') && conf.useLOD) ? minMap[elm] : (raw != null && !isNaN(Number(raw)) ? Number(raw) : null);
                if (v != null) { acc.w.push(Number(w[elm])); acc.p.push(v); }
                return acc;
              }, { w: [], p: [] });
              return [elm, Mtd.T2.Calc.calcCalib(vList.w, vList.p)];
            }).filter(([, v]) => v));
          }
          const r = conf.corrDT?.find(rw => rw[0] === conf.correction);
          if (!r) return null;
          return Object.fromEntries(conf.calElms.map(elm => {
            const sIdx = conf.corrDT[0].indexOf(`${elm}_slp`), iIdx = conf.corrDT[0].indexOf(`${elm}_int`);
            return sIdx !== -1 && iIdx !== -1 && r[sIdx] !== "" ? [elm, { slp: Number(r[sIdx]), int: Number(r[iIdx]) }] : [elm, null];
          }).filter(([, v]) => v));
        }
        // --- 検量線適用データ整形 ---
        static genCorr(pxrfDT, wdxrfDT, conf, idxName) {
          const newRow = [idxName];
          GLB.valElms.forEach(elm => {
            if (!conf.calElms?.includes(elm)) { newRow.push("", ""); return; }
            const prevDT = this.buildPrev(pxrfDT, wdxrfDT, { ...conf, val: elm, useCal: false });
            const cfs = prevDT.length ? Mtd.T2.Calc.calcCalib(prevDT.map(d => d.x), prevDT.map(d => d.y)) : null;
            newRow.push(cfs?.slp ?? "", cfs?.int ?? "");
          });
          return newRow;
        }
      },
      // --- 検量線データ生成 ---
      Calc: class {
        // --- Math関数群の静的キャッシュ ---
        static #MATH_FNS = Object.getOwnPropertyNames(Math).filter(k => typeof Math[k] === 'function').map(k => `const ${k} = Math.${k};`).join('');
        // --- カスタム数式評価 ---
        static evaluate(fml, rData) {
          if (!fml) return null;
          try {
            const keys = Object.keys(rData), vals = Object.values(rData);
            const fn = new Function(...keys, `${this.#MATH_FNS} return ${fml};`);
            const res = fn(...vals);
            return isNaN(res) || !isFinite(res) ? null : res;
          } catch (e) { return null; }
        }
        // --- 検量線係数計算 ---
        static calcCalib(wdxrfVals, pxrfVals) {
          if (!wdxrfVals?.length || wdxrfVals.length < 2 || wdxrfVals.length !== pxrfVals?.length) return null;
          try {
            const d = wdxrfVals.map((x, i) => [x, pxrfVals[i]]);
            const { m: slope, b: intercept } = ss.linearRegression(d);
            return (isNaN(slope) || isNaN(intercept) || slope === 0) ? null : { slp: slope, int: intercept };
          } catch (e) { return null; }
        }
        // --- 回帰・相関計算 ---
        static calcReg(xArr, yArr, errArr) {
          if (!xArr?.length || xArr.length !== yArr?.length) return null;
          const n = xArr.length, d = xArr.map((x, i) => [x, yArr[i]]);
          const { m: slope, b: intercept } = ss.linearRegression(d);
          const r = ss.sampleCorrelation(xArr, yArr), r2 = r * r;
          let ssRes = 0, maxRes = 0;
          xArr.forEach((x, i) => { const res = Math.abs(yArr[i] - (slope * x + intercept)); ssRes += res * res; maxRes = Math.max(maxRes, res); });
          const resStdDev = n > 2 ? Math.sqrt(ssRes / (n - 2)) : 0;
          let err3Sigma = 0;
          if (errArr?.length > 2) {
            const meanErr = errArr.reduce((a, b) => a + b, 0) / errArr.length;
            err3Sigma = Math.sqrt(errArr.reduce((a, b) => a + (b - meanErr) ** 2, 0) / (errArr.length - 1)) * 3;
          }
          return { count: n, slope, intercept, r, r2, resStdDev, err3Sigma, maxRes };
        }
      }
    }
  };
</script>
