<!-- src/Tracer5i.html -->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">    
    <script src="https://cdn.jsdelivr.net/npm/simple-statistics@7.8.3/dist/simple-statistics.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.1/lib/browser/math.min.js"></script>
    <?!= include("CSS"); ?>
  </head>
  <body data-theme="entry">
    <div data-ui="dlg"></div>
    <nav class="nav-tabs" id="nav">
      <button class="tab-btn active" data-action="CoreAct.switchTab" data-target="entry">データ抽出</button>
      <button class="tab-btn" data-action="CoreAct.switchTab" data-target="adapter">検量線・標準化</button>
    </nav>
    <main class="scroll-y">
      <!-- ENT (旧 Tab1) -->
      <div id="entry" class="tab-content active">
        <fieldset id="entFieldset">
          <details id="secPREF" open>
            <summary>抽出設定</summary>
            <!-- 動的フォームバインディング -->
            <div><div id="boxPREF_mode" data-bind-fields="ENTST.PREF.data.modeFields"></div></div>
            <div id="barPREF" class="status-bar" data-status="hidden" data-bind-status="ENTST.PREF.status"></div>
          </details>
          <hr>
          <details id="secRAW">
            <summary>読込と検証</summary>
            <div class="flex-row">
              <button id="btnRAW_load" data-action="ENTAct.loadRaw" data-type="primary">データを取得</button>
              <span class="txt-btninfo">読込シート:<span class="badge-label">File</span></span>
            </div>
            <div id="secRAW_area">
              <!-- エラーとフォーム動的バインディング -->
              <div id="boxRAW_fields" data-bind-errs="ENTST.RAW.flags" data-bind-fields="ENTST.RAW.data.fields"></div>
            </div>
            <div id="boxRAW_btn" class="field-row">
              <button id="btnRAW_genList" data-action="ENTAct.genList" data-type="primary">リスト生成</button>
              <button id="btnRAW_valdList" data-action="ENTAct.valdList" data-type="primary">検証</button>
            </div>
          </details>
          <div id="barRAW" class="status-bar" data-status="hidden" data-bind-status="ENTST.RAW.status"></div>
          <hr>
          <details id="secEXTR">
            <summary>抽出と格納</summary>
            <div class="flex-row">
              <button id="btnEXTR_run" data-action="ENTAct.runExtr" data-type="primary">データを抽出</button>
              <span class="txt-btninfo">読込シート:<span class="badge-label">Results</span></span>
            </div>
            <div id="secEXTR_area">
              <!-- エラーとフォーム動的バインディング -->
              <div id="boxEXTR_fields" data-bind-errs="ENTST.EXTR.flags" data-bind-fields="ENTST.EXTR.data.extrFields"></div>
            </div>
            <div class="field-row">
              <button id="btnEXTR_push" data-action="ENTAct.pushExtr" data-type="primary" class="outline">tracer5iに格納</button>
            </div>
          </details>
          <div id="barEXTR" class="status-bar" data-status="hidden" data-bind-status="ENTST.EXTR.status"></div>
        </fieldset>
      </div>
      <!-- ADP (旧 Tab2) -->
      <div id="adapter" class="tab-content">
        <fieldset id="adpFieldset">
          <details id="secASGN" open>
            <summary>データ読込・選択</summary>
            <div id="secASGN_area">
              <label>データセット選択</label>
              <div data-ui="mselect" data-change-item="CoreAct.tglMulti" data-change-all="CoreAct.tglAllMulti" data-bind="ADPST.ASGN.refs.filter" data-bind-opts="ADPST.ASGN.refs.available"></div>
            </div>
            <div class="txt-btninfo">読込シート<span class="badge-label">tracer5i</span><span class="badge-label">WDXRF</span><span class="badge-label">Correction</span></div>
            <div class="field-row">
              <button id="btnASGN_load" data-action="ADPAct.loadDB" data-type="primary">データを読込</button>
              <button id="btnASGN_fltr" data-action="ADPAct.fltrDB" data-type="primary" class="outline">データを確定</button>
            </div>
          </details>
          <div id="barASGN" class="status-bar" data-status="hidden" data-bind-status="ADPST.ASGN.status"></div>
          <hr>
          <details id="secSYMB">
            <summary>シンボル設定</summary>
            <div id="secSYMB_area">
              <label>属性選択</label>
              <div class="field-row" style="margin-top: var(--unit)">
                <!-- 動的フォームバインディング -->
                <div id="boxSYMB_axis" data-bind-fields="ADPST.SYMB.data.axisFields" style="flex:1;"></div>
                <button data-action="ADPAct.resetSymb" data-type="primary" class="outline" style="flex:none;">リセット</button>
              </div>
              <label>シンボル設定</label>
              <div class="scroll-y" style="max-height: calc(var(--unit) * 50); border: 1px solid var(--grey200); border-radius: var(--unit); padding: var(--unit) calc(var(--unit) * 2);">
                <!-- srcの動的バインディング -->
                <div data-ui="symbtbl" id="tblSYMB" data-bind-src="ADPST.SYMB.data.src"></div>
              </div>
            </div>
            <div class="field-row">
              <button id="btnSYMB_set" data-action="ADPAct.setSymb" data-type="primary">シンボル確定</button>
            </div>
          </details>
          <div id="barSYMB" class="status-bar" data-status="hidden" data-bind-status="ADPST.SYMB.status"></div>
          <hr>
          <details id="secPREV">
            <summary>プレビュー</summary>
            <div id="boxPREV_chart" style="width: 100%; height: auto;">
              <!-- チャートsrcバインディング -->
              <ui-plot data-bind-src="ADPST.PREV.data.chartSrc"></ui-plot>
            </div>
            <!-- statsバインディング -->
            <div id="tblPREV_stats" data-bind-stats="ADPST.PREV.data.statsDT"></div>
            <div id="secPREV_area">
              <div class="field-row">
                <div class="field-col">
                  <label>プレビュー値</label>
                  <!-- 動的フォームバインディング -->
                  <div id="boxPREV_val" data-bind-fields="ADPST.PREV.data.valFields"></div>
                </div>
              </div>
              <label>対象Item</label>
              <!-- optsとbindバインディング -->
              <div data-ui="mselect" id="boxPREV_item" data-change-item="CoreAct.tglMulti" data-change-all="CoreAct.tglAllMulti" data-bind="ADPST.PREV.refs.itemMap" data-bind-opts="ADPST.ASGN.refs.availableItems"></div>
              <div class="field-row">
                <button id="btnPREV_genPrev" data-action="ADPAct.genPrev" data-type="primary">プレビュー更新</button>
              </div>
              <hr style="margin: calc(var(--unit) * 4) 0 calc(var(--unit) * 2);">
              <details id="secCALB" class="sub-sec">
                <summary>プレビュー補正設定</summary>
                <div class="field-row">
                  <div class="field-col">
                    <label>補正方法</label>
                    <!-- 動的フォームバインディング -->
                    <div id="boxCALB_crct" data-bind-fields="ADPST.CALB.data.crctFields"></div>
                  </div>
                </div>
                <label>Obsidianモード計測値</label>
                <!-- optsとbindバインディング -->
                <div data-ui="mselect" id="boxCALB_mode" data-change-item="CoreAct.tglMulti" data-change-all="CoreAct.tglAllMulti" data-bind="ADPST.CALB.refs.modeMap" data-bind-opts="ADPST.CALB.data.modeOpts"></div>
                <label>検量線適用対象</label>
                <div data-ui="mselect" id="boxCALB_calElm" data-change-item="CoreAct.tglMulti" data-change-all="CoreAct.tglAllMulti" data-bind="ADPST.CALB.refs.calElms" data-bind-opts="ADPST.CALB.data.calElmOpts"></div>
                <div class="field-row">
                  <!-- インラインHTML直接バインディング -->
                  <div class="field-col">
                    <div class="toggle-row"><span class="toggle-label">LOD置換</span><label class="toggle-switch"><input type="checkbox" data-bind="ADPST.CALB.refs.useLOD"><span class="toggle-slider"></span></label></div>
                  </div>
                  <div class="field-col">
                    <div class="toggle-row"><span class="toggle-label">検量線適用</span><label class="toggle-switch"><input type="checkbox" data-bind="ADPST.CALB.refs.useCal"><span class="toggle-slider"></span></label></div>
                  </div>
                </div>
              </details>
            </div>
          </details>
          <div id="barPREV" class="status-bar" data-status="hidden" data-bind-status="ADPST.PREV.status"></div>
          <hr>
          <details id="secSTDZ">
            <summary>出力と標準化</summary>
            <label>対象Item（検量線計算用）</label>
            <div data-ui="mselect" id="boxSTDZ_item" data-change-item="CoreAct.tglMulti" data-change-all="CoreAct.tglAllMulti" data-bind="ADPST.STDZ.refs.itemMap" data-bind-opts="ADPST.ASGN.refs.availableItems"></div>
            <label>Obsidianモード計測値</label>
            <div data-ui="mselect" id="boxSTDZ_mode" data-change-item="CoreAct.tglMulti" data-change-all="CoreAct.tglAllMulti" data-bind="ADPST.STDZ.refs.modeMap" data-bind-opts="ADPST.STDZ.data.modeOpts"></div>
            <div class="field-row">
              <div class="field-col">
                <div class="toggle-row"><span class="toggle-label">LOD置換</span><label class="toggle-switch"><input type="checkbox" data-bind="ADPST.STDZ.refs.useLOD"><span class="toggle-slider"></span></label></div>
              </div>
            </div>
            <div class="field-row" style="margin-top: calc(var(--unit) * 3);">
              <input type="text" class="form-control" placeholder="インデックス名を入力" data-bind="ADPST.STDZ.refs.saveIndexName">
              <button id="btnCALB_pushCrct" data-action="ADPAct.pushCrct" data-type="primary">検量線出力</button>
            </div>
            <div class="field-row">
              <button id="btnSTDZ_push" data-action="ADPAct.pushStdz" data-type="primary" class="outline">PXRFシート出力</button>
            </div>
          </details>
          <div id="barSTDZ" class="status-bar" data-status="hidden" data-bind-status="ADPST.STDZ.status"></div>
        </fieldset>
      </div>
    </main>
    <script>
      window.__INITIAL_SSID__ = "<?= typeof initialSsId !== 'undefined' ? initialSsId : '' ?>";
      window.__APP_MODE__ = "<?= typeof appMode !== 'undefined' ? appMode : 'entry' ?>";
    </script>
    <?!= include('Global'); ?>
    <?!= include('PlatformAdapter'); ?>
    <?!= include('Model'); ?>
    <?!= include('CoreMethod'); ?>
    <?!= include('Tracer5i_Method'); ?>
    <?!= include('Component'); ?>
    <?!= include('Chart'); ?>
    <?!= include('Tracer5i_Schema'); ?>
    <?!= include('CoreUI'); ?>
    <?!= include('CoreAction'); ?>
    <?!= include('Tracer5i_Action'); ?>

  </body>
</html>
