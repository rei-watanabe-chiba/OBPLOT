<script>
  // --- htmlID ---
  const Tab1UI = {
      tabSet: "tab1Fieldset",       // タブ全体UI
      configArea: "configMapArea",  // 設定エリア
      configBar: "configStasBar",   // 設定コンソール
      fileArea: "fileMapArea",      // ファイルエリア
      fileBar: "fileStasBar",       // ファイルコンソール
      fileBox: "fileMapBox",        // ファイル入力BOX
      fileLoadBtn: "fileLoadBtn",   // 読込ボタン
      fileMakeBtn: "fileMakeBtn",   // リスト生成ボタン
      fileValdBtn: "fileValdBtn",   // 検証ボタン
      exacArea: "extractAreaContainer",
      exacBar: "exacStasBar",       // 抽出コンソール
      exacBtn: "exacBtn",           // 抽出ボタン
      exacPushBtn: "exacPushBtn",   // PXRFに格納ボタン
      exacBox: "exacMapBox"         // 抽出設定BOX（新規追加）
  }

  const Tab2UI = {
    tabSet: "tab2Fieldset",     // タブ全体UI
    reportBtn: "reportOpenBtn", // 展開ボタン
    reportBar: "reportStasBar"  // 状態表示
  }

  // --- フェーズ定義 ---
  const APP_PHASE = {
    INIT: { val: 1, name: 'init' },       // 初期状態・リセット時
    LOAD: { val: 2, name: 'load' },       // データ取得成功
    INVALID: { val: 3, name: 'invalid' }, // 要検証
    VALID: { val: 4, name: 'valid' },     // 検証成功（抽出可能）
    EXTRACT: { val: 5, name: 'extract' }  // 抽出成功（PXRF格納可能）
  };

  // --- 状態管理クラス定義 ---
  class AppState {
    #state; // 内部状態
    #listeners; // 登録されたコールバック群
    
    #resolvePath(path) {// ネスト結合
      if (typeof path === 'string') {
        return path.split('.');
      }
      return path;
    }

    constructor() {
      this.#state = {
        GLB: {
          activeTab: "tab1",
          isLocked: false,
          cachedGlobal: null,
        },
        Tab1ST: {
          phase: APP_PHASE.INIT.val,
          config: {
            status: [],
            mode: "Dual"
          },
          file: {
            data: null,
            status: [],
            cachedStatus: [],
            map: {},
            isMapError: [true, true, true, false, false]
          },
          exac: {
            status: [],
            cachedStatus: [],
            map: { dataset: "", item: "", date: "" },
            isMapError: [true, false, false]
          }
        },
        Tab2ST: {
          reportStas: []
        }
      };
      this.#listeners = {};
    }

    // --- 状態取得 ---
    get(paths) {
      // 文字列/配列判定
      const resolve = p => (Array.isArray(p) ? p : p.split('.')).reduce((o, k) => o?.[k], this.#state);
      // 共通処理
      return Array.isArray(paths) ? paths.map(resolve) : resolve(paths);
    }
    
    // --- 状態更新 ---
    set(updates, value) {
      // 文字列/オブジェクト判定
      if (typeof updates === 'object' && !Array.isArray(updates)) {
        return Object.entries(updates).forEach(([k, v]) => this.set(k, v));
      }
      // 共通処理
      const keys = Array.isArray(updates) ? updates : updates.split('.');
      const last = keys.pop();
      const target = keys.reduce((o, k) => o[k] ??= {}, this.#state);
      if (target[last] !== value) {
        target[last] = value;
        this.#listeners[[...keys, last].join('.')]?.forEach(cb => cb(value));
      }
    }
    
    // --- 変更の監視登録 ---
    subscribe(path, callback) {
      const key = Array.isArray(path) ? path.join('.') : path;
      (this.#listeners[key] ??= []).push(callback);
    }
  }

  // --- GAS通信(API)クラス ---
  class GasService {
    static #serverCall(funcName, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(r => r?.success ? resolve(r.payload) : reject(new Error(`[${r?.errorType || 'ERR'}] ${r?.message}`)))
          .withFailureHandler(e => reject(new Error(`[NET_ERR] ${e.message}`)))
          [funcName](...args);
      });
    }
    // 通信関数定義
    static getGlobal() { return this.#serverCall("getGlobal"); }
    static fetchData(sheet, quotaCol = null, loadCol = null) { return this.#serverCall("fetchData", sheet, quotaCol, loadCol); }
    static writeData(sheet, data, options = "clear") { return this.#serverCall("writeData", sheet, data, options); }
    static checkUserProperty(id) { return this.#serverCall("checkUserProperty", id); }
    static clearUserProperty(id) { return this.#serverCall("clearUserProperty", id); }
    static getReportTemplate() { return this.#serverCall("getReportTemplate"); }
  }

  // --- 初期化と短縮 ---
  const API = GasService;
  const State = new AppState();
</script>
