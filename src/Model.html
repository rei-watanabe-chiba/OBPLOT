  // --- global ---

      ],

        { key: "date", label: "date", placeholder: "計測日", bind: "T1ST.extr.refs.date" }
      ],
      symbAxes: [{ val: "DB", label: "database" }, { val: "item", label: "item" }, { val: "Group", label: "Group" }, { val: "Source", label: "Source" }],

      obsidianIndex: { "Mn":16, "Fe":18, "Rb":24, "Sr":26,"Y":28, "Zr":30, "Nb":32 },
      mudrockIndex: { "Al":18, "Si":20, "P":22, "K":28, "Ca":30, "Ti":32, "Mn":38, "Fe":40, "Rb":56, "Sr":58, "Y":60, "Zr":62, "Nb":64, "Ba":68 }
    }
  };
  // --- htmlID ---
  const T1UI = {
    tabSet: "tab1Fieldset", prefSec: "prefSec", prefBar: "prefStatusBar", prefArea: "prefArea", prefModeBox: "prefModeBox",
    rawSec: "rawSec", rawLoadBtn: "rawLoadBtn", rawBar: "rawStatusBar", rawArea: "rawArea", rawBox: "rawBox", rawBtnBox:"rawBtnBox", rawMakeBtn: "rawMakeBtn", rawValdBtn: "rawValdBtn",
    extrSec: "extrSec", extrBar: "extrStatusBar", extrBtn: "extrBtn", extrArea: "extrArea", extrPushBtn: "extrPushBtn", extrBox: "extrBox"
  };
  const T2UI = {
    tabSet: "tab2Fieldset",
    asgnSec: "asgnSec", asgnLoadBtn: "asgnLoadBtn", asgnFltrBtn: "asgnFilterBtn", asgnLoadBar: "asgnLoadBar", asgnArea: "asgnArea", asgnBox: "asgnBox",
    symbSec: "symbSec", symbArea: "symbArea", symbAxisBox: "symbAxisBox", symbBox: "symbBox", symbBtn: "symbBtn", symbBar: "symbStatusBar", 
    prevSec: "prevSec", prevModeBox: "prevModeBox", prevItemBox: "prevItemBox", prevCorrBox: "prevCorrBox", prevValBox: "prevValBox", prevLodBox: "prevLodBox", prevCalTglBox: "prevCalTglBox", prevMakeBtn: "prevMakeBtn", prevChartBox: "prevChartBox", prevStatsTbl: "prevStatsTbl", prevBar: "prevBar", prevSaveBox: "prevSaveBox", prevSaveInp: "prevSaveInp", prevSaveBtn: "prevSaveBtn",
    repoSec: "repoSec", reppBtn: "reportOpenBtn", repoBar: "reportStatusBar"
  };
  // --- フェーズ定義 ---
  const T1_PHS = { INIT: 1, READY: 2, LOAD: 3, INVALID: 4, VALID: 5, EXTRACT: 6, OUTPUT: 7 };
  const T2_PHS = { INIT: 1, LOADED: 2, FILTERED: 3, MAPPED: 4, PREVIEWED: 5 };
  // --- 状態管理クラス定義 ---
  class AppState {
    #state; #initialState; #listeners; 
    // state宣言：GLB/Tab → section → stateの名前空間
    constructor() {
      const initDef = {
        GLB: { activeTab: "tab1", isLocked: false },
        T1ST: {
          phase: T1_PHS.INIT,
          pref: { status: [], mode: "" },
          raw: { data: null, status: [], cachedStatus: [], refs: {}, hasRefErr: [true, true, true, false, false] },
          extr: { status: [], cachedStatus: [], refs: { DB: "", item: "", date: "" }, hasRefErr: [true, false, false] }
        },
        T2ST: {
          phase: T2_PHS.INIT,
          asgn: { rawDT: { corrDT: [], wrapPXRF: null, wrapWDXRF: null }, available: [], filter: [], pxrfDT: null, wdxrfDT: null, status: [] },
          symb: { baseKey: "DB", rls: [{ key: "default", target: "", shp: "emptyCircle", clr: "var(--grey600)" }], status: [] },
          prev: { modeMap: [...GLB.Conf.optElms], itemMap: [], calElms: [...GLB.Conf.valElms], val: GLB.Conf.valElms[0], correction: "new", useLOD: false, useCal: false, saveIndexName: "", correctionLogic: {}, prevDT: null, statsDT: null, status: [] },
          repo: { values: [], corrections: [], status: [] }
        }
      };
      this.#initialState = JSON.parse(JSON.stringify(initDef));
      this.#state = JSON.parse(JSON.stringify(initDef));
      this.#listeners = {};
    }
    // proxy化
    get proxy() { return this.#state; }
    // state取得
    get(paths) {
      const res = p => (Array.isArray(p) ? p : p.split('.')).reduce((o, k) => o?.[k], this.#state);
      return Array.isArray(paths) ? paths.map(res) : res(paths);
    }
    // state注入
    set(updates, v) {
      if (typeof updates === 'object' && !Array.isArray(updates)) return Object.entries(updates).forEach(([k, val]) => this.set(k, val));
      const keys = Array.isArray(updates) ? updates : updates.split('.');
      const last = keys.pop();
      const tgt = keys.reduce((o, k) => o[k] ??= {}, this.#state);
      if (tgt[last] !== v) {
        tgt[last] = v;
        this.#listeners[[...keys, last].join('.')]?.forEach(cb => cb(v));
      }
    }
    // state登録
    subscribe(path, cb) {
      const key = Array.isArray(path) ? path.join('.') : path;
      (this.#listeners[key] ??= []).push(cb);
    }
    // stateリセット
    reset(paths) {
      const updates = {};
      (Array.isArray(paths) ? paths : [paths]).forEach(p => {
        const initVal = p.split('.').reduce((o, k) => o?.[k], this.#initialState);
        updates[p] = initVal !== undefined ? JSON.parse(JSON.stringify(initVal)) : null;
      });
      this.set(updates);
    }
  }
  // --- GAS通信(API)クラス ---
  class GasService {
    static #serverCall(funcName, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(r => r?.success ? resolve(r.payload) : reject(new Error(`[${r?.errorType || 'ERR'}] ${r?.message}`)))
          .withFailureHandler(e => reject(new Error(`[NET_ERR] ${e.message}`)))
          [funcName](...args);
      });
    }
    static fetchDT(sht, qCol = null, lCol = null) { return this.#serverCall("fetchDT", sht, qCol, lCol); }
    static writeData(sht, data, opts = "clear") { return this.#serverCall("writeData", sht, data, opts); }
    static checkUserProperty(id) { return this.#serverCall("checkUserProperty", id); }
    static clearUserProperty(id) { return this.#serverCall("clearUserProperty", id); }
    static getReportTemplate() { return this.#serverCall("getReportTemplate"); }
  }
  const API = GasService;
  const State = new AppState();
</script>
