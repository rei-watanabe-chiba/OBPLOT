  // --- フェーズ定義 ---
  const TAB1_PHASE = { INIT: 1, READY: 2, LOAD: 3, INVALID: 4, VALID: 5, EXTRACT: 6, OUTPUT: 7 };
  const TAB2_PHASE = { INIT: 1, LOADED: 2, FILTERED: 3, MAPPED: 4, PREVIEWED: 5 };

  // --- 状態管理クラス定義 ---
  class AppState {
    #state; 
    #initialState;
    #listeners; 
    
    constructor() {
      // 初期状態の定義（キャッシュ用とステート用のベース）
      const initialStateDef = {
        GLB: { activeTab: "tab1", isLocked: false },
        Tab1ST: {
          phase: TAB1_PHASE.INIT,
          config: { status: [], mode: "" },
          file: { data: null, status: [], cachedStatus: [], map: {}, isMapError: [true, true, true, false, false] },
          exac: { status: [], cachedStatus: [], map: { dataset: "", item: "", date: "" }, isMapError: [true, false, false] }
        },
        Tab2ST: {
          phase: TAB2_PHASE.INIT,
          dataset: {
            rawData: { correction: [], mergedPXRF: null, wdxrfObjs: null },
            availableDatasets: [],
            filter: [],
            basePXRF: null, 
            baseWDXRF: null,
            status: []
          },
          symbol: { 
            baseKey: "dataset", 
            mapping: {}, 
            status: [] 
          },
          preview: {
            modeMap: [], 
            itemMap: [], 
            value: GLOBAL_CONFIG.valueLogic[0], 
            correction: "rawdata",
            correctionLogic: {}, 
            previewData: null,
            statsData: null,
            status: []
          },
          report: { 
            values: [], 
            corrections: [],
            status: []
          }
        }
      };
      
      this.#initialState = JSON.parse(JSON.stringify(initialStateDef));
      this.#state = JSON.parse(JSON.stringify(initialStateDef));
      this.#listeners = {};
    }
    
    // state取得
    get(paths) {
      const resolve = p => (Array.isArray(p) ? p : p.split('.')).reduce((o, k) => o?.[k], this.#state);
      return Array.isArray(paths) ? paths.map(resolve) : resolve(paths);
    }
    
    // state更新
    set(updates, value) {
      if (typeof updates === 'object' && !Array.isArray(updates)) {
        return Object.entries(updates).forEach(([k, v]) => this.set(k, v));
      }
      const keys = Array.isArray(updates) ? updates : updates.split('.');
      const last = keys.pop();
      const target = keys.reduce((o, k) => o[k] ??= {}, this.#state);
      if (target[last] !== value) {
        target[last] = value;
        this.#listeners[[...keys, last].join('.')]?.forEach(cb => cb(value));
      }
    }
    
    // state監視登録
    subscribe(path, callback) {
      const key = Array.isArray(path) ? path.join('.') : path;
      (this.#listeners[key] ??= []).push(callback);
    }

    // セクションの初期化
    reset(paths) {
      const pathArray = Array.isArray(paths) ? paths : [paths];
      const updates = {};
      pathArray.forEach(path => {
        const keys = path.split('.');
        const initialVal = keys.reduce((o, k) => o?.[k], this.#initialState);
        // JSON.parseで確実に発火
        updates[path] = initialVal !== undefined ? JSON.parse(JSON.stringify(initialVal)) : null;
      });
      this.set(updates);
    }
  }

  // --- GAS通信(API)クラス ---
  class GasService {
    static #serverCall(funcName, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(r => r?.success ? resolve(r.payload) : reject(new Error(`[${r?.errorType || 'ERR'}] ${r?.message}`)))
          .withFailureHandler(e => reject(new Error(`[NET_ERR] ${e.message}`)))
          [funcName](...args);
      });
    }
    static fetchData(sheet, quotaCol = null, loadCol = null) { return this.#serverCall("fetchData", sheet, quotaCol, loadCol); }
    static writeData(sheet, data, options = "clear") { return this.#serverCall("writeData", sheet, data, options); }
    static checkUserProperty(id) { return this.#serverCall("checkUserProperty", id); }
    static clearUserProperty(id) { return this.#serverCall("clearUserProperty", id); }
    static getReportTemplate() { return this.#serverCall("getReportTemplate"); }
  }

  // --- 外部参照用 ---
  const API = GasService;
  const State = new AppState();
</script>
