<script>
  // --- フェーズ定義 ---
  const ENT_PHS = { INIT: 1, READY: 2, LOAD: 3, INVALID: 4, VALID: 5, EXTRACT: 6, OUTPUT: 7 };
  const ADP_PHS = { INIT: 1, LOADED: 2, FILTERED: 3, MAPPED: 4, PREVIEWED: 5 };
  const DASH_PHS = { INIT: 1, LOADED: 2 };
  // 互換用エイリアス
  // --- AppSt ---
  class AppSt {
    #state; #initialState; #listeners; #updating;
    // --- セクション単位のstate生成 ---
    constructor() {
      const createSec = (overrides = {}) => ({ status: [], data: null, refs: {}, flags: [], ...overrides });
      const initDef = {
        GLB: { 
          activeTab: "ent", isLocked: false, ssId: "",
          dialog: { isOpen: false, type: "confirm", title: "", msg: "" }
        },
        ENTST: {
          phase: ENT_PHS.INIT,
          PREF: createSec({ refs: { mode: "" }, data: { modeFields: [{ type: "select", opts: GLB.confMods, bind: "ENTST.PREF.refs.mode", change: "ENTAct.valdPref", hasEmpty: false }] } }),
          RAW:  createSec({ flags: GLB.initFlags.raw }),
          EXTR: createSec({ refs: { [GLB.idx.key1]: "", [GLB.idx.p1]: "", [GLB.idx.p2]: "" }, flags: GLB.initFlags.extr, data: { extrFields: GLB.extrFields.map(f => ({ type: "text", label: f.label, bind: f.bind, placeholder: f.placeholder })) } })
        },
        ADPST: {
          phase: ADP_PHS.INIT,
          ASGN: createSec({ data: { crctDT: [], wrapPXRF: null, wrapWDXRF: null, pxrfDT: null, wdxrfDT: null }, refs: { available: [], filter: [] } }),
          SYMB: createSec({ refs: { baseKey: GLB.symbBaseKey, rls: [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }] }, data: { axisFields: [{ type: "select", opts: GLB.symbAxes, change: "ADPAct.valdAxis", hasEmpty: false }] } }),
          CALB: createSec({ refs: { modeMap: [...GLB.optElms], calElms: [...GLB.valElms], crct: "new", useLOD: false, useCal: false }, data: { modeOpts: GLB.optElms, calElmOpts: GLB.valElms } }),
          PREV: createSec({ refs: { itemMap: [], val: GLB.valLgc.length ? GLB.valLgc[0] : GLB.valElms[0], saveIndexName: "" }, data: { crctLogic: {}, prevDT: null, statsDT: null, chartSrc: null, valFields: [{ type: "select", bind: "ADPST.PREV.refs.val", hasEmpty: false, opts: [...GLB.valElms, ...GLB.valLgc].map(v => ({ label: v, val: v })) }] } }),
          STDZ: createSec({ refs: { itemMap: [], modeMap: [...GLB.optElms], useLOD: false, saveIndexName: "" }, data: { modeOpts: GLB.optElms } })
        },
        DashST: {
          phase: DASH_PHS.INIT,
          INST: createSec({ data: { pxrfDT: null, wdxrfDT: null, crctDT: null } }),
          REPO: createSec({ 
            refs: { useFav: false, selectedFav: "", favInputName: "" },
            data: { 
              favList: [], 
              favInputInvalid: false, 
              favOverwriteTarget: "", 
              favSuccessTarget: "",
              favBtnText: "クリップボードから新規登録",
              favTableSrc: null
            } 
          }),
          gph: { style: GLB.defGraphStyle, gap: GLB.defGraphGap }
        },
        // 【追加】レポート専用のステートマシン
        RPTST: {
          phase: 1,
          refs: {
            crct: "new", useCal: false, useLOD: false, calElms: [...GLB.valElms], 
            filters: { db: [], item: [], group: [] }, gridRows: 1, gridCols: 1, panelGap: 4,
            margins: { top: 15, bottom: 15, left: 15, right: 15 },
            activePanelId: "p_0",
            symb: { baseKey: GLB.symbBaseKey, rls: [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }] },
            rawGph: {},
            panels: []
          },
          data: {
            raw: { pxrfDT: [], wdxrfDT: [], crctDT: [] },
            crctFields: [], filterDBOpts: [], filterItemOpts: [], filterGroupOpts: [],
            fontEngFields: [], fontJpFields: [], graphTypeFields: [], calbValFields: [], clusXFields: [], clusYFields: [],
            symbSrc: null,
            apTitle: "", apXLabel: "", apYLabel: "", apGraphType: "", apCalbVal: "", apClusXVal: "", apClusYVal: ""
          }
        }
      };
      this.#initialState = JSON.parse(JSON.stringify(initDef));
      this.#state = JSON.parse(JSON.stringify(initDef));
      this.#listeners = {};
    }
    // --- Proxy取得 ---
    get proxy() { return this.#state; }
    // --- State取得 ---
    get(paths) {
      const res = p => (Array.isArray(p) ? p : p.split('.')).reduce((o, k) => o?.[k], this.#state);
      return Array.isArray(paths) ? paths.map(res) : res(paths);
    }
    // --- State設定 ---
    set(updates, v) {
      if (typeof updates === 'object' && !Array.isArray(updates)) return Object.entries(updates).forEach(([k, val]) => this.set(k, val));
      const pathStr = Array.isArray(updates) ? updates.join('.') : updates;
      const keys = pathStr.split('.');
      const last = keys.pop();
      const tgt = keys.reduce((o, k) => o[k] ??= {}, this.#state);
      
      if (tgt[last] !== v) {
        tgt[last] = v;
        
        // 循環更新（無限ループ）ガード
        this.#updating ??= new Set();
        if (this.#updating.has(pathStr)) return;
        this.#updating.add(pathStr);
        
        try {
          this.#listeners[pathStr]?.forEach(cb => cb(v));
          Object.keys(this.#listeners).forEach(listenerPath => {
            if (listenerPath.startsWith(`${pathStr}.`)) {
              const childVal = listenerPath.split('.').reduce((o, k) => o?.[k], this.#state);
              this.#listeners[listenerPath].forEach(cb => cb(childVal));
            }
            if (pathStr.startsWith(`${listenerPath}.`)) {
              const parentVal = listenerPath.split('.').reduce((o, k) => o?.[k], this.#state);
              this.#listeners[listenerPath].forEach(cb => cb(parentVal));
            }
          });
          this.#listeners['*']?.forEach(cb => cb());
        } finally {
          this.#updating.delete(pathStr);
        }
      }
    }
    // --- 変更購読 ---
    subscribe(path, cb) {
      if (Array.isArray(path)) return path.forEach(p => this.subscribe(p, cb));
      this.#listeners[path] ??= [];
      if (!this.#listeners[path].includes(cb)) this.#listeners[path].push(cb);
    }
    // --- State初期化 ---
    reset(paths) {
      const updates = {};
      (Array.isArray(paths) ? paths : [paths]).forEach(p => {
        const initVal = p.split('.').reduce((o, k) => o?.[k], this.#initialState);
        updates[p] = initVal !== undefined ? JSON.parse(JSON.stringify(initVal)) : null;
      });
      this.set(updates);
    }
  }
  const State = new AppSt();
  window.State = State;
</script>
