  };
  // --- htmlID ---
  const Tab1UI = {
    tabSet: "tab1Fieldset", configSection: "configSection", configBar: "configStatusBar", configArea: "configArea", configModeBox: "configModeBox",
    rawSection: "rawSection", rawLoadBtn: "rawLoadBtn", rawBar: "rawStatusBar", rawArea: "rawArea", rawBox: "rawBox", rawBtnBox:"rawBtnArea", rawMakeBtn: "rawMakeBtn", rawValdBtn: "rawValdBtn",
    extrSection: "extrSection", extrBar: "extrStatusBar", extrBtn: "extrBtn", extrArea: "extrArea", extrPushBtn: "extrPushBtn", extrBox: "extrBox"
  };
  const Tab2UI = {
    tabSet: "tab2Fieldset",
    dsetSection: "dsetSection", dsetLoadBtn: "dsetLoadBtn", dsetfilterBtn: "dsetFilterBtn", dsetloadBar: "dsetLoadBar", dsetArea: "dsetArea", dsetBox: "dsetBox",
    symbSection: "symbSection", symbArea: "symbArea", symbAxisBox: "symbAxisBox", symbBox: "symbBox", symbBtn: "symbBtn", symbBar: "symbStatusBar", 
    prevSection: "prevSection", prevModeBox: "prevModeBox", prevItemBox: "prevItemBox", prevCorrectionBox: "prevCorrectionBox", prevValueBox: "prevValueBox", prevLODBox: "prevLODBox", prevCalToggleBox: "prevCalToggleBox", prevMakeBtn: "prevMakeBtn", prevChartBox: "prevChartBox", prevStatsTable: "prevStatsTable", prevBar: "prevBar", prevSaveBox: "prevSaveBox", prevSaveInput: "prevSaveInput", prevSaveBtn: "prevSaveBtn",
    repoSection: "repoSection", reppBtn: "reportOpenBtn", repoBar: "reportStatusBar"
  };
  // --- フェーズ定義 ---
  const TAB1_PHASE = { INIT: 1, READY: 2, LOAD: 3, INVALID: 4, VALID: 5, EXTRACT: 6, OUTPUT: 7 };
  const TAB2_PHASE = { INIT: 1, LOADED: 2, FILTERED: 3, MAPPED: 4, PREVIEWED: 5 };
  // --- 状態管理クラス定義 ---
  class AppState {
    #state; #initialState; #listeners; 
    constructor() {
      const initDef = {
        GLB: { activeTab: "tab1", isLocked: false },
        Tab1ST: {
          phase: TAB1_PHASE.INIT, config: { status: [], mode: "" },
          raw: { data: null, status: [], cachedStatus: [], refs: {}, isRefsErr: [true, true, true, false, false] },
          extr: { status: [], cachedStatus: [], refs: { dset: "", item: "", date: "" }, isRefsErr: [true, false, false] }
        },
        Tab2ST: {
          phase: TAB2_PHASE.INIT,
          dset: { rawData: { correction: [], mergedPXRF: null, wdxrfObjs: null }, available: [], filter: [], basePXRF: null, baseWDXRF: null, status: [] },
          symb: { baseKey: "dset", rules: [{ key: "default", target: "", shape: "emptyCircle", color: "var(--grey600)" }], status: [] },
          prev: { modeMap: [...GLOBAL_CONFIG.optionalElements], itemMap: [], calElementMap: [...GLOBAL_CONFIG.valueElement], val: GLOBAL_CONFIG.valueElement[0], correction: "new", lodEnabled: false, calEnabled: false, saveIndexName: "", correctionLogic: {}, prevData: null, statsData: null, status: [] },
          repo: { values: [], corrections: [], status: [] }
        }
      };
      this.#initialState = JSON.parse(JSON.stringify(initDef));
      this.#state = JSON.parse(JSON.stringify(initDef));
      this.#listeners = {};
    }
    get proxy() { return this.#state; }
    get(paths) {
      const resolve = p => (Array.isArray(p) ? p : p.split('.')).reduce((o, k) => o?.[k], this.#state);
      return Array.isArray(paths) ? paths.map(resolve) : resolve(paths);
    }
    set(updates, value) {
      if (typeof updates === 'object' && !Array.isArray(updates)) return Object.entries(updates).forEach(([k, v]) => this.set(k, v));
      const keys = Array.isArray(updates) ? updates : updates.split('.');
      const last = keys.pop();
      const target = keys.reduce((o, k) => o[k] ??= {}, this.#state);
      if (target[last] !== value) {
        target[last] = value;
        this.#listeners[[...keys, last].join('.')]?.forEach(cb => cb(value));
      }
    }
    subscribe(path, callback) {
      const key = Array.isArray(path) ? path.join('.') : path;
      (this.#listeners[key] ??= []).push(callback);
    }
    reset(paths) {
      const updates = {};
      (Array.isArray(paths) ? paths : [paths]).forEach(p => {
        const initialVal = p.split('.').reduce((o, k) => o?.[k], this.#initialState);
        updates[p] = initialVal !== undefined ? JSON.parse(JSON.stringify(initialVal)) : null;
      });
      this.set(updates);
    }
  }
  // --- GAS通信(API)クラス ---
  class GasService {
    static #serverCall(funcName, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(r => r?.success ? resolve(r.payload) : reject(new Error(`[${r?.errorType || 'ERR'}] ${r?.message}`)))
          .withFailureHandler(e => reject(new Error(`[NET_ERR] ${e.message}`)))
          [funcName](...args);
      });
    }
    static fetchData(sheet, quotaCol = null, loadCol = null) { return this.#serverCall("fetchData", sheet, quotaCol, loadCol); }
    static writeData(sheet, data, options = "clear") { return this.#serverCall("writeData", sheet, data, options); }
    static checkUserProperty(id) { return this.#serverCall("checkUserProperty", id); }
    static clearUserProperty(id) { return this.#serverCall("clearUserProperty", id); }
    static getReportTemplate() { return this.#serverCall("getReportTemplate"); }
  }
  const API = GasService;
  const State = new AppState();
</script>
