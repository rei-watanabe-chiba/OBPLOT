<script>
  class CoreUIPatcher {
    static ctxResolver = null;
    static activeCtxSubscriber = null;

    static initDlg(cntr) {
      if (cntr.__dlgInit) return;
      cntr.__dlgInit = true;
      cntr.innerHTML = Tpl.Dialog.universal();
      cntr.querySelectorAll('[data-opts]:not([data-ui])').forEach(el => CoreUIPatcher.applyOpts(el, el.dataset.opts));
      const dialogEl = cntr.querySelector('dialog');
      const applyDlg = (dlg) => {
        if (!dlg || !dialogEl) return;
        if (dlg.isOpen) {
          const titleEl = cntr.querySelector('[data-part="title"]');
          if (titleEl) titleEl.innerText = dlg.title || (dlg.type === 'toast' ? '通知' : '確認');
          const msgEl = cntr.querySelector('[data-part="msg"]');
          if (msgEl) msgEl.innerText = dlg.msg || '';
          const cancelBtn = cntr.querySelector('[data-part="cancel"]');
          if (cancelBtn) cancelBtn.style.display = dlg.type === 'toast' ? 'none' : '';
          if (!dialogEl.open) dialogEl.showModal();
        } else {
          if (dialogEl.open) dialogEl.close();
        }
      };
      State.subscribe("GLB.dialog", applyDlg);
      applyDlg(State.get("GLB.dialog"));
    }

    static promptDialog(dlgOrPart) {
      return new Promise(resolve => {
        const dlg = typeof dlgOrPart === 'string'
          ? (document.querySelector(`dialog[data-part="${dlgOrPart}"], dialog#${dlgOrPart}`))
          : dlgOrPart;
        if (!dlg) return resolve(null);
        const onClose = () => {
          dlg.removeEventListener('close', onClose);
          if (!dlg.returnValue || dlg.returnValue === 'cancel') {
            resolve(null);
          } else {
            const form = dlg.querySelector('form');
            if (form) {
              const fd = new FormData(form);
              const data = Object.fromEntries(fd.entries());
              const keys = Object.keys(data);
              resolve(keys.length === 1 ? data[keys[0]] : data);
            } else {
              resolve(dlg.returnValue);
            }
          }
        };
        dlg.addEventListener('close', onClose, { once: true });
        dlg.showModal();
        const firstInput = dlg.querySelector('input, textarea, select');
        if (firstInput) {
          firstInput.value = '';
          firstInput.focus();
        }
      });
    }

    static resolveBindCtx(ctx) {
      if (!ctx) return ctx;
      if (ctx.includes('$active') && typeof CoreUIPatcher.ctxResolver === 'function') {
        return CoreUIPatcher.ctxResolver(ctx);
      }
      return ctx;
    }

    static syncFormCtx(form, directCtx) {
      const rawCtx = directCtx || form.__formOpts?.ctx || (form.dataset.opts ? CoreUIPatcher.routOptions(form.dataset.opts).ctx : null);
      if (!rawCtx) return;
      const ctx = CoreUIPatcher.resolveBindCtx(rawCtx);
      form.querySelectorAll('input[name], select[name], textarea[name]').forEach(ctrl => {
        const name = ctrl.name;
        const val = State.get(`${ctx}.${name}`);
        if (ctrl.type === 'checkbox') {
          ctrl.checked = !!val;
        } else if (ctrl.type === 'radio') {
          ctrl.checked = String(ctrl.value) === String(val);
        } else {
          ctrl.value = val ?? '';
        }
      });
    }

    static bindFormCtx(form, directCtx) {
      if (form.__boundCtx) {
        CoreUIPatcher.syncFormCtx(form, directCtx);
        return;
      }
      form.__boundCtx = true;
      const rawCtx = directCtx || form.__formOpts?.ctx || (form.dataset.opts ? CoreUIPatcher.routOptions(form.dataset.opts).ctx : null);
      if (!rawCtx) return;

      CoreUIPatcher.syncFormCtx(form, rawCtx);

      // $active が含まれる場合、アクティブ変更時にフォームを自動再同期
      if (rawCtx.includes('$active') && typeof CoreUIPatcher.activeCtxSubscriber === 'function') {
        const onActiveChange = () => CoreUIPatcher.syncFormCtx(form, rawCtx);
        CoreUIPatcher.activeCtxSubscriber(onActiveChange);
      }

      form.querySelectorAll('input[name], select[name], textarea[name]').forEach(ctrl => {
        const name = ctrl.name;
        // 個別State値の変更も購読
        State.subscribe(() => {
          const currentCtx = CoreUIPatcher.resolveBindCtx(rawCtx);
          return `${currentCtx}.${name}`;
        }, (newVal) => {
          if (ctrl.type === 'checkbox') {
            if (ctrl.checked !== !!newVal) ctrl.checked = !!newVal;
          } else if (ctrl.type === 'radio') {
            ctrl.checked = String(ctrl.value) === String(newVal);
          } else {
            if (ctrl.value !== String(newVal ?? '')) ctrl.value = newVal ?? '';
          }
        });
      });
    }

    static ensureMSelectInit(el) {
      if (!el.querySelector('[data-part="popover-content"]')) {
        el.innerHTML = Tpl.Common.popover("未選択", "", "form-control", "cb-container", el.id ? `pop_${el.id}` : null);
      }
    }

    // --- [復活] マルチセレクトの選択状態(チェックボックス)を反映 ---
    static patchMSelectRefs(el, vals) {
      CoreUIPatcher.ensureMSelectInit(el);
      const sum = el.querySelector('[data-part="popover-summary"]');
      if (sum) {
        sum.innerHTML = vals?.length
          ? `<span class="badge-wrapper">${vals.map(v => Tpl.Common.badge(v)).join('')}</span>`
          : '<span style="color:var(--grey400)">未選択</span>';
      }
      const cbs = el.querySelectorAll('[data-part="dataset-cb"]');
      cbs.forEach(cb => { cb.checked = Array.isArray(vals) && vals.includes(cb.value); });
      const allCb = el.querySelector('[data-part="select-all-cb"]');
      if (allCb) allCb.checked = cbs.length > 0 && [...cbs].every(cb => cb.checked);
    }

    // --- [修正版] マルチセレクトの選択肢(Option)を生成 ---
    static patchMSelectOpts(el, arr) {
      CoreUIPatcher.ensureMSelectInit(el);
      const cntr = el.querySelector('[data-part="popover-content"]');
      if (!cntr) return;
      if (!arr?.length) {
        cntr.innerHTML = '<div class="txt-btninfo">データなし</div>';
        return;
      }
      const actAll = el.__mselectOpts?.actionAll; 
      const actItem = el.__mselectOpts?.actionItem; 
      cntr.innerHTML = (actAll ? Tpl.MultiSelect.selectAll(actAll) : '') +
        arr.map(item => Tpl.MultiSelect.item(item, actItem)).join('');
      
      const bindPath = el.dataset.out ? CoreUIPatcher.routOptions(el.dataset.out).bind : null;
      if (bindPath) {
        const vals = State.get(bindPath);
        if (vals !== undefined) CoreUIPatcher.patchMSelectRefs(el, vals);
      }
    }


    static patchElementVal(el, val) {
      if (el.type === 'checkbox') {
        if (el.checked !== !!val) el.checked = !!val;
      } else if (el.dataset.ui === 'mselect' || el.tagName === 'UI-MSELECT') {
        CoreUIPatcher.patchMSelectRefs(el, val);
      } else if (el.dataset.ui === 'segment') {
        el.querySelectorAll('button').forEach(btn => {
          const targetVal = btn.dataset.param;
          if (targetVal === String(val)) {
            btn.setAttribute('aria-selected', 'true');
          } else {
            btn.setAttribute('aria-selected', 'false');
          }
        });
      } else if (el.tagName === 'SELECT' || el.tagName === 'INPUT') {
        if (el.value !== String(val ?? '')) el.value = val ?? '';
      } else if (el.tagName === 'BUTTON') {
        if (el.innerText !== String(val ?? '')) el.innerText = val ?? '';
      }
    }

    static patchStatus(el, val) {
      if (Array.isArray(val) && val.length >= 2) {
        if (el.dataset.view !== val[0]) el.dataset.view = val[0];
        if (el.innerText !== val[1]) el.innerText = val[1];
      } else {
        el.dataset.view = "hidden";
        el.innerText = "";
      }
    }

    static patchOpts(el, val, hasEmptyOverride) {
      if (el.dataset.ui === 'mselect' || el.tagName === 'UI-MSELECT') {
        CoreUIPatcher.patchMSelectOpts(el, val);
      } else if (el.tagName === 'SELECT') {
        // selectタグの場合はoptionのみを動的生成する
        const hasEmpty = hasEmptyOverride !== undefined ? hasEmptyOverride : (el.__hasEmpty ?? false);
        el.innerHTML = Tpl.Form.options(val, hasEmpty);
      } else {
        el.opts = val;
      }
    }

    static patchSrc(el, val) {
      if (el.dataset.ui === 'symbtbl' || el.tagName === 'UI-SYMBTBL') el.innerHTML = Tpl.Symbol.tbl(val);
      else if (el.dataset.ui === 'table' || el.tagName === 'UI-TABLE') el.innerHTML = Tpl.Table.build(val);
      else if (typeof el.src !== 'undefined' || el.tagName === 'UI-PLOT') el.src = val;
    }

    static patchErrs(el, val) {
      el.querySelectorAll('select, input').forEach((s, idx) => {
        if (val?.[idx]) s.setAttribute('aria-invalid', 'true');
        else s.removeAttribute('aria-invalid');
      });
    }

    static evalPhase(prop, phase, defaultVal = false) {
      if (prop === undefined) return defaultVal;
      return typeof prop === 'function' ? prop(phase) : phase >= prop;
    }

    static updateVisible(el, def, curPhase) {
      if (def.visiblePhase === undefined) return;
      const isVisible = CoreUIPatcher.evalPhase(def.visiblePhase, curPhase);
      el.style.display = isVisible ? '' : 'none';
    }

    static updateOpen(el, def, curPhase) {
      if (def.openPhase === undefined || el.tagName !== 'DETAILS') return;
      const isOpen = CoreUIPatcher.evalPhase(def.openPhase, curPhase);
      if (isOpen !== undefined && el.open !== isOpen) {
        if (isOpen) {
          setTimeout(() => { el.open = true; }, 200);
        } else {
          el.open = false;
        }
      }
    }

    static updateActiveDis(el, def, curPhase) {
      if (def.activePhase === undefined && def.disablePhase === undefined) return;
      const isActive = def.activePhase !== undefined 
        ? CoreUIPatcher.evalPhase(def.activePhase, curPhase, true) 
        : true;
      const isDis = def.disablePhase !== undefined 
        ? CoreUIPatcher.evalPhase(def.disablePhase, curPhase, false) 
        : !isActive;

      if (el.tagName === 'DETAILS') {
        if (isActive && isDis) el.dataset.view = 'active disabled';
        else if (isActive) el.dataset.view = 'active';
        else if (isDis) el.dataset.view = 'disabled';
        else el.dataset.view = '';

        el.querySelectorAll('input, select, button, textarea, ui-mselect, [data-ui="mselect"]').forEach(child => {
          if (child.tagName === 'UI-MSELECT' || child.dataset.ui === 'mselect') {
            const sum = child.querySelector('[data-part="popover-summary"]');
            if (sum) sum.disabled = isDis;
          }
          child.disabled = isDis;
        });
      } else {
        el.disabled = isDis;
      }
    }

    static updateClass(el, def, curPhase) {
      if (def.className === undefined) return;
      const cls = typeof def.className === 'function' ? def.className(curPhase) : def.className;
      if (el.className !== cls) el.className = cls;
    }

    static updateText(el, def, curPhase) {
      if (def.text === undefined) return;
      const txt = typeof def.text === 'function' ? def.text(curPhase) : def.text;
      if (el.innerText !== txt) el.innerText = txt;
    }

    static updateDataset(el, def, curPhase) {
      if (def.dataset === undefined) return;
      const ds = typeof def.dataset === 'function' ? def.dataset(curPhase) : def.dataset;
      if (ds && typeof ds === 'object') {
        for (const key in ds) {
          if (el.dataset[key] !== String(ds[key])) el.dataset[key] = ds[key];
        }
      }
    }
    // --- [routOptions] オプション文字列パース ---
    static routOptions(optStr) {
      if (!optStr) return {};
      return optStr.split(';').reduce((a, pair) => {
        const idx = pair.indexOf(':');
        if (idx > -1) a[pair.substring(0, idx).trim()] = pair.substring(idx + 1).trim();
        return a;
      }, {});
    }

    // --- [applyOpts] 巨大パーサー本体 ---
    static applyOpts(el, rawOpts, uiType = null) {
      if (!rawOpts) return;
      let opts;
      try {
        opts = JSON.parse(rawOpts);
      } catch {
        opts = this.routOptions(rawOpts);
      }
      if (!opts || typeof opts !== 'object') return;

      // [view-state] CSS内部属性へ書き込み（開発者は直接書かない）
      if (opts.view !== undefined) {
        el.dataset.view = opts.view;
      }

      // [ui-opts] data-ui の種別に応じて振り分け
      if (uiType === 'addon' || (!uiType && (opts.icon || opts.prefix || opts.suffix))) {
        this.buildAddon(el, opts);
      }
      if (uiType === 'form') {
        el.__formOpts = opts;
        if (opts.ctx) this.bindFormCtx(el, opts.ctx);
      }
      if (uiType === 'mselect' || opts.actionItem || opts.actionAll) {
        el.__mselectOpts = opts; // キャッシュ
      }
      if (opts.hasEmpty !== undefined) {
        el.__hasEmpty = opts.hasEmpty !== 'false' && opts.hasEmpty !== false;
      }

      // [free] 未知のキーは dataset に直接マップ（拡張スロット）
      const knownKeys = new Set(['view', 'icon', 'prefix', 'suffix', 'color', 'size', 'ctx', 'actionItem', 'actionAll', 'hasEmpty']);
      for (const [k, v] of Object.entries(opts)) {
        if (!knownKeys.has(k)) el.dataset[k] = v;
      }
    }

    // --- [routBuilder] UI初期構築ルーター ---
    static routBuilder(el) {
      if (el.__uiBound) return;
      const type = el.dataset.ui;
      this.applyOpts(el, el.dataset.opts, type);

      if (type === 'dlg') this.initDlg(el);
      else if (type === 'mselect') this.ensureMSelectInit(el);
      else if (type === 'addon') {} // buildAddon は applyOpts 内で実行済
      else if (type === 'form') {}  // bindFormCtx は applyOpts 内で実行済

      el.__uiBound = true;
    }

    // --- [routOut] 動的パッチ処理ルーター (旧 routPatch) ---
    static routOut(el, outStr, getValFn) {
      if (!outStr || el.__outBound) return;
      el.__outBound = true;
      const config = this.routOptions(outStr);

      if (config.hasEmpty !== undefined) {
        el.__hasEmpty = config.hasEmpty !== 'false' && config.hasEmpty !== false;
      }

      Object.entries(config).forEach(([type, path]) => {
        if (type === 'hasEmpty') return;
        const applyFn = (val) => {
          if (val === undefined) return;
          if (type === 'status') this.patchStatus(el, val);
          else if (type === 'opts') this.patchOpts(el, val, el.__hasEmpty);
          else if (type === 'src') this.patchSrc(el, val);
          else if (type === 'stats') el.innerHTML = Tpl.Stats.gen(val);
          else if (type === 'errs') this.patchErrs(el, val);
          else if (type === 'invalid') {
            if (val) el.setAttribute('aria-invalid', 'true');
            else el.removeAttribute('aria-invalid');
          }
          else if (type === 'bind') this.patchElementVal(el, val);
        };
        State.subscribe(path, applyFn);
        applyFn(getValFn(path));
      });
    }

    // --- [buildAddon] 装飾DOM直接付与 (旧 decorateAddon) ---
    static buildAddon(wrap, opts) {
      if (wrap.__addonBuilt) return;
      const { icon, prefix, suffix, color, size } = opts;
      if (!icon && !prefix && !suffix) return;
      wrap.__addonBuilt = true;
      
      const styles = [];
      if (color) styles.push(`color:${color}`);
      if (size) {
        const sz = typeof size === 'number' ? `${size}px` : size;
        styles.push(`font-size:${sz};--addon-icon-size:${sz}`);
      }
      const styleAttr = styles.length ? ` style="${styles.join(';')}"` : '';

      if (icon || prefix) {
        wrap.classList.add('has-prefix');
        let preInner = '';
        if (icon) preInner += `<span class="material-symbols-outlined"${styleAttr}>${icon}</span>`;
        if (prefix) preInner += `<span${styleAttr}>${prefix}</span>`;
        wrap.insertAdjacentHTML('afterbegin', `<span class="prefix-container">${preInner}</span>`);
      }
      if (suffix) {
        wrap.classList.add('has-suffix');
        wrap.insertAdjacentHTML('beforeend', `<span class="suffix-container"${styleAttr}>${suffix}</span>`);
      }
    }
  }

  class CoreUI {
    constructor(schema, stateTarget) {
      this.schema = schema;
      this.stateTarget = stateTarget;
    }

    getVal(path) {
      return State.get(path.includes('.') ? path : `${this.stateTarget}.${path}`);
    }

    build() {
      this.update();

      // [新処理] data-ui ビルダー
      document.querySelectorAll('[data-ui]').forEach(el => CoreUIPatcher.routBuilder(el));

      // [新処理] data-opts 単体要素（data-uiを持たない要素）のパース
      document.querySelectorAll('[data-opts]:not([data-ui])').forEach(el => CoreUIPatcher.applyOpts(el, el.dataset.opts));

      // [新処理] data-out ルーター
      const getVal = (path) => this.getVal(path);
      document.querySelectorAll('[data-out]').forEach(el => CoreUIPatcher.routOut(el, el.dataset.out, getVal));
    }

    update() {
      const curPhase = State.get(`${this.stateTarget}.phase`) ?? 1;
      (this.schema.elements || []).forEach(def => {
        const targetKey = def.part || def.id;
        const el = document.querySelector(`[data-part="${targetKey}"], #${targetKey}`);
        if (!el) return;
        CoreUIPatcher.updateVisible(el, def, curPhase);
        CoreUIPatcher.updateOpen(el, def, curPhase);
        CoreUIPatcher.updateActiveDis(el, def, curPhase);
        CoreUIPatcher.updateClass(el, def, curPhase);
        CoreUIPatcher.updateText(el, def, curPhase);
        CoreUIPatcher.updateDataset(el, def, curPhase);
      });
    }
  }
</script>
