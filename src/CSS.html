<!-- CSS.html -->
<!-- Oat UI CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@knadh/oat@latest/oat.min.css">
<script src="https://cdn.jsdelivr.net/npm/@knadh/oat@latest/oat.min.js"></script>

<style>
  /* --- トークン定義 --- */
  :root {
    --primary-blue: #1a73e8;
    --primary-green: #34a853;
    --primary-red: #ea4335;
    --primary-yellow: #fbbc05;
    --sub-color: #5f6368;
    --bg-white: #ffffff;
    --bg-hover: #f8f8f8;
  }

  /* --- 基本レイアウト --- */
  body { 
    padding: 8px 12px;
    display: grid; 
    grid-template-rows: auto 1fr; 
    height: 100vh; 
    overflow: hidden;
  }
  main {
    overflow-y: auto;
    padding-right: 4px;
    padding-bottom: 20px;
  }
  .flex-row { 
    display: flex; 
    gap: 4px;
    align-items: center; 
    margin-top: 6px;
  }
  .mt-2 { margin-top: 8px; }
  .txt-btninfo { font-size: 11px; color: var(--sub-color); }
  hr { margin: 12px 0; border: none; border-top: 1px solid #eaeaea; }

  /* --- タブナビゲーション --- */
  .nav-tabs { 
    display: flex; 
    border-bottom: 1px solid #ccc; 
    margin-bottom: 8px; 
  }
  .tab-btn { 
    background: none; 
    border: none; 
    cursor: pointer; 
    flex: 1; 
    padding: 6px 12px;
    font-weight: 600; 
    color: var(--sub-color); 
    border-radius: 0;
    font-size: 14px;
  }
  .tab-btn.active { 
    color: var(--primary-blue); 
    border-bottom: 2px solid var(--primary-blue); 
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* --- コンテンツ要素 --- */
  .map-content {
    display: flex; 
    flex-direction: column; 
    gap: 2px !important;
    margin-top: 2px !important;
  }
  .map-content label {
    margin-bottom: 2px !important;
  }
  .map-content input, select {
    margin-bottom: 2px !important;
    padding: 0px 4px !important;
  }

  /* --- フォーム要素 --- */
  label {
    font-size: 13px;
    display: block;
    margin-bottom: 2px;
  }
  input, select {
    width: 100%;
    padding: 4px 6px;
    font-size: 13px;
    height: auto; 
    box-sizing: border-box;
  }
  details { margin-top: 8px; }
  summary {
    font-size: 13px;
    padding: 6px;
    color: var(--sub-color);
  }

  /* --- ボタンレイアウト --- */
  .btn-container {
    display: flex;
    gap: 4px;
    margin-top: 8px;
    width: 100%;
  }
  .btn-container > button {
    flex: 1; 
    padding: 6px;
    font-size: 13px;
  }
  .btn-container > button:only-child {
    flex: 0 0 50%; 
  }

  /* --- ボタンカラー定義 --- */
  button.btn-blue { background-color: var(--primary-blue); color: white; border: 1px solid var(--primary-blue); }
  button.btn-green { background-color: var(--primary-green); color: white; border: 1px solid var(--primary-green); }
  
  /* サブ(アウトライン)スタイル */
  button.sub { background-color: transparent; border-width: 1.5px; }
  button.btn-blue.sub { color: var(--primary-blue); }
  button.btn-green.sub { color: var(--primary-green); }

  /* 無効状態 */
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* --- ダイアログスタイル --- */
  dialog {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    max-width: 260px;
    width: 100%;
  }
  /* 背面の暗転 */
  dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
  dialog h3 {
    margin-top: 0;
    margin-bottom: 12px;
    font-size: 15px;
    color: #333;
  }
</style>
