<!-- CSS.html -->
<style>
  /* --- 変数・テーマ定義 --- */
  :root {
    --unit: 4px;
    --main-blue: #1A73E8;
    --main-blue-hover: #1F41B6;
    --main-green: #34A853;
    --main-green-hover: #1F843C;
    --main-red: #ea4335;
    --grey50: #ECEFF1;
    --grey200: #B0BEC5;
    --grey400: #78909C;
    --grey600: #546E7A;
    --bg-color: #FFF;
    --bg-color-hover: #F5F5F5;
    --text-main: #202124;
    --transition-speed: 0.2s;
    --theme-color: var(--main-blue);
    --theme-hover: var(--main-blue-hover);
    interpolate-size: allow-keywords;
  }
  body[data-theme="tab2"] {
    --theme-color: var(--main-green);
    --theme-hover: var(--main-green-hover);
  }

  /* --- レイアウト --- */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
    font-family: 'Roboto', 'Noto Sans JP', sans-serif;
    font-size: 13px;
    color: var(--text-main);
    background-color: var(--bg-color);
    overflow-x: hidden;
    user-select: none;
  }
  main {
    padding: calc(var(--unit) * 3);
    padding-top: calc(var(--unit) * 2);
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: transparent transparent;
  }
  main:hover {
    scrollbar-color: color-mix(in srgb, var(--grey200) 50%, transparent) transparent;
  }

  fieldset { 
    border: none; 
  }
  .flex-row { 
    display: flex; 
    align-items: center; 
    gap: 0; 
  }
  .txt-btninfo { 
    margin-left: calc(var(--unit) * 2); 
    font-size: 11px; 
    color: var(--grey600); 
  }
  hr { 
    margin: calc(var(--unit) * 3) 0; 
    border: none; 
    border-top: 1.5px solid var(--grey200); 
  }
  .field-row {
    display: flex;
    gap: 0 calc(var(--unit) * 2);
    width: 100%;
    margin: calc(var(--unit) * 2) 0;
  }
  .field-col {
    flex: 1;
    min-width: 0;
  }

  /* --- タブ --- */
  .nav-tabs {
    display: flex;
    border-bottom: 1px solid var(--grey200);
  }
  .tab-btn {
    flex: 1;
    padding: calc(var(--unit) * 2.5) 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--grey400);
    background: none;
    border: none;
    border-radius: 0;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: all var(--transition-speed);
    &:hover { 
      background-color: var(--bg-color-hover); 
    }
    &.active {
      color: var(--theme-color);
      border-bottom-color: currentColor;
    }
  }
  .tab-content {
    display: none;
    &.active { 
      display: block; 
    }
  }

  /* --- フォーム --- */
  label {
    display: block;
    margin: calc(var(--unit) * 1) calc(var(--unit) * 0.5);
    color: var(--grey600);
  }

  input, select {
    flex: 1;
    width: 100%;
    margin-top: calc(var(--unit) * 1);
    padding: calc(var(--unit) * 1.5) calc(var(--unit) * 2);
    font-size: 13px;
    color: var(--text-main);
    background-color: var(--bg-color);
    border: 1px solid var(--grey400);
    border-radius: calc(var(--unit) * 1);
    transition: all var(--transition-speed);
    
    &:disabled { 
      opacity: 0.7; 
      cursor: not-allowed; 
    }
    &:not(:disabled) {
      cursor: pointer;
      &:hover { 
        filter: brightness(0.95); 
      }
    }
    &:focus { 
      outline: none; 
      border-color: var(--theme-color); 
    }
    &.has-error {
      background-color: color-mix(in srgb, var(--main-red) 10%, #fff);
      border-color: var(--main-red);
    }
  }
  input[type="text"]:not(:disabled) { 
    cursor: text; 
  }

  .checkbox-container { 
    max-height: calc(var(--unit) * 30); 
    overflow-y: auto; 
  }
  .checkbox-item {
    display: flex;
    align-items: center;
    margin: 0 !important;
    padding: calc(var(--unit) * 1) 0;
    border-bottom: 1px solid var(--grey200);
    cursor: pointer;
    &:last-child { 
      border-bottom: none; 
    }
    input[type="checkbox"] { 
      flex: 1; 
      transform: scale(1.2); 
      cursor: pointer; 
    }
    & span { 
      flex: 5; 
      font-weight: normal; 
    }
    &.select-all {
      border-bottom: 1px solid var(--grey400);
      & span { 
        font-weight: 500; 
      }
    }
  }

  /* --- アコーディオン --- */
  details {
    margin: calc(var(--unit) * 1) 0;
    transition: opacity var(--transition-speed);
    &[data-type="disabled"] { 
      opacity: 0.5; 
      pointer-events: none; 
    }
    &[data-state="active"] summary { 
      margin-bottom: calc(var(--unit) * 2); 
      color: var(--theme-color); 
    }
    &[data-state="disabled"] summary { 
      cursor: not-allowed; 
    }
    &::details-content {
      height: 0;
      opacity: 0;
      overflow: clip;
      transition: height 0.4s ease, opacity 0.4s ease, content-visibility 0.4s ease allow-discrete;
    }
    &[open]::details-content {
      height: auto;
      height: calc-size(auto, size);
      opacity: 1;
    }
  }
  summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: calc(var(--unit) * 1.5);
    font-size: 14px;
    font-weight: 600;
    list-style: none;
    color: var(--grey600);
    cursor: pointer;
    transition: color var(--transition-speed);
    &::marker { 
      display: none; 
    }
    &::after {
      display: block;
      width: calc(var(--unit) * 1.5);
      height: calc(var(--unit) * 1.5);
      content: "";
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
      transition: transform 0.2s ease;
    }
  }
  details[open] summary::after { 
    transform: rotate(-135deg); 
  }

  /* --- ボタン --- */
  button {
    flex: 1;
    padding: calc(var(--unit) * 2) 0;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
    border-radius: calc(var(--unit) * 1);
    cursor: pointer;
    transition: all var(--transition-speed);
    &[data-type="primary"] {
      color: #fff;
      background-color: var(--theme-color);
      &:not(:disabled):hover {
        background-color: var(--theme-hover);
      }
    }
    &.outline {
      background-color: transparent;
      border-color: currentColor;
      &[data-type="primary"] { 
        color: var(--theme-color); 
      }
      &:not(:disabled):hover { 
        background-color: color-mix(in srgb, currentColor 10%, transparent); 
      }
    }
    &:disabled {
      color: #fff;
      background-color: var(--grey200);
      border-color: transparent;
      cursor: not-allowed;
    }
    &.outline:disabled {
      color: var(--grey400);
      background-color: transparent;
      border-color: var(--grey400);
    }
  }

  /* --- ダイアログ --- */
  dialog {
    width: calc(var(--unit) * 70);
    margin: auto;
    padding: calc(var(--unit) * 5);
    border: none;
    border-radius: calc(var(--unit) * 2);
    h3 { 
      margin-bottom: calc(var(--unit) * 3); 
      font-size: 16px; 
      color: var(--text-main); 
    }
    p { 
      margin-bottom: calc(var(--unit) * 5); 
      line-height: 1.5; 
      color: var(--grey600); 
    }
    .field-row { 
      gap: calc(var(--unit) * 3); 
      margin-bottom: 0; 
    }
    &::backdrop {
      background-color: color-mix(in srgb, var(--text-main) 30%, transparent);
      backdrop-filter: blur(2px);
    }
  }

  /* --- ステータスバー --- */
  .status-bar {
    display: flex;
    align-items: center;
    gap: calc(var(--unit) * 2);
    max-height: calc(var(--unit) * 12.5);
    margin: calc(var(--unit) * 1.5) 0;
    padding: calc(var(--unit) * 2) calc(var(--unit) * 3);
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
    border-radius: calc(var(--unit) * 1);
    opacity: 1;
    transition: all 0.3s ease;
    &[data-status="hidden"] {
      max-height: 0;
      margin-bottom: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      opacity: 0;
      pointer-events: none;
    }
    &[data-status="loading"], &[data-status="message"] {
      color: var(--grey600);
    }
    &[data-status="loading"]::before {
      display: block;
      width: calc(var(--unit) * 3.5);
      height: calc(var(--unit) * 3.5);
      content: "";
      border: 2px solid var(--grey200);
      border-top-color: var(--theme-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    &[data-status="success"] {
      color: var(--main-green);
      background-color: color-mix(in srgb, var(--main-green) 10%, transparent);
    }
    &[data-status="error"], &[data-status="alert"] {
      color: var(--main-red);
      background-color: color-mix(in srgb, var(--main-red) 10%, transparent);
    }
  }

  /* --- 拡張コンポーネント --- */
  .symbol-row {
    display: flex;
    align-items: center;
    gap: calc(var(--unit) * 1);
    margin-bottom: calc(var(--unit) * 1.5);
    select { 
      padding: calc(var(--unit) * 1); 
    }
  }
  .symbol-target { 
    flex: 2; 
  }
  .symbol-shape, .symbol-color { 
    flex: 1; 
  }

  .radio-row { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    padding: calc(var(--unit) * 1) 0; 
    border-bottom: 1px solid var(--grey50); 
  }
  .radio-label { 
    flex: 1; 
    font-weight: 500; 
  }
  .radio-group { 
    display: flex; 
    gap: calc(var(--unit) * 4); 
    flex: 2; 
  }
  .radio-item { 
    display: flex; 
    align-items: center; 
    gap: calc(var(--unit) * 1); 
    cursor: pointer; 
  }

  /* --- 統計テーブルスタイル --- */
  .stats-container {
    margin-top: calc(var(--unit) * 1.5);
    padding: calc(var(--unit) * 2);
    font-size: 11px;
    background-color: var(--grey50);
    border: 1px solid var(--grey200);
    border-radius: calc(var(--unit) * 1);
    user-select: text;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    align-items: center;
    row-gap: calc(var(--unit) * 1);
    column-gap: calc(var(--unit) * 2);
  }
  .stats-label {
    font-weight: 500;
    color: var(--grey600);
  }
  .stats-val {
    font-weight: 700;
  }

  /* --- マルチセレクト・ドロップダウン --- */
  .multi-select-wrapper {
    box-sizing: border-box;
    width: 100%;
    margin: calc(var(--unit) * 1) 0;
  }
  .multi-select-summary {
    display: block;
    box-sizing: border-box;
    width: 100%;
    height: calc(var(--unit) * 8);
    padding: calc(var(--unit) * 0.75) calc(var(--unit) * 6) calc(var(--unit) * 0.75) calc(var(--unit) * 2);
    font-weight: normal;
    text-align: left;
    white-space: nowrap;
    background-color: var(--bg-color);
    border: 1px solid var(--grey400);
    border-radius: calc(var(--unit) * 1);
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    &:hover {
      background-color: var(--bg-color-hover);
    }
  }

  .multi-select-options {
    top: calc(anchor(bottom) + calc(var(--unit) * 1));
    left: anchor(left);
    box-sizing: border-box;
    width: anchor-size(width);
    max-height: calc(var(--unit) * 50);
    margin: 0;
    padding: 0;
    background-color: var(--bg-color);
    border: 1px solid var(--grey200);
    border-radius: calc(var(--unit) * 1);
    box-shadow: 0 calc(var(--unit) * 1) calc(var(--unit) * 2) color-mix(in srgb, var(--text-main) 20%, transparent);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--grey200) transparent;
  }

  .badge {
    display: inline-block;
    vertical-align: middle;
    margin-right: calc(var(--unit) * 1);
    padding: calc(var(--unit) * 0.5) calc(var(--unit) * 1.5);
    font-size: 12px;
    line-height: 1.2;
    color: var(--text-main);
    background-color: var(--grey50);
    border: 1px solid var(--grey200);
    border-radius: calc(var(--unit) * 1);
  }

  /* --- シンボル設定動的テーブル --- */
  #symbolBox {
    max-height: calc(var(--unit) * 50);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--grey200) transparent;
    border: 1px solid var(--grey200);
    border-radius: calc(var(--unit) * 1);
    padding: calc(var(--unit) * 1) calc(var(--unit) * 2);
  }
  .symbol-table-row {
    display: flex;
    align-items: center;
    gap: calc(var(--unit) * 1);
    margin-bottom: calc(var(--unit) * 1);
    padding-bottom: calc(var(--unit) * 0.5);
    border-bottom: 1px solid var(--grey50);
  }
  .symbol-col-btn { flex: 0 0 calc(var(--unit) * 6); text-align: center; }
  .symbol-col-target { flex: 2; min-width: 0; }
  .symbol-col-shape { flex: 1.5; min-width: 0; }
  .symbol-col-color { flex: 1.5; min-width: 0; }

  /* ＋/－ ボタン風スタイル */
  .icon-btn {
    width: calc(var(--unit) * 6);
    height: calc(var(--unit) * 6);
    padding: 0;
    border-radius: 50%;
    font-size: 16px;
    font-weight: bold;
    line-height: 1;
    color: var(--grey600);
    background: transparent;
    border: 1px solid var(--grey200);
    cursor: pointer;
    flex: none;
  }
  .icon-btn:not(:disabled):hover {
    background: var(--bg-color-hover);
    color: var(--theme-color);
    border-color: var(--theme-color);
  }
  .icon-btn:disabled {
    opacity: 0.2;
    cursor: not-allowed;
    border-color: transparent;
  }

  /* --- シングルセレクト (Popover応用) --- */
  .single-select-wrapper {
    box-sizing: border-box;
    width: 100%;
  }
  .single-select-summary {
    display: flex;
    align-items: center;
    box-sizing: border-box;
    width: 100%;
    height: calc(var(--unit) * 7);
    padding: calc(var(--unit) * 1) calc(var(--unit) * 1.5);
    font-size: 12px;
    text-align: left;
    background-color: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    border-radius: 0;
    cursor: pointer;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .single-select-summary:hover {
    background-color: var(--bg-color-hover);
    border-bottom: 1px solid var(--grey200);
  }
  .single-select-options {
    top: calc(anchor(bottom) + 2px);
    left: anchor(left);
    box-sizing: border-box;
    min-width: anchor-size(width);
    max-width: fit-content;
    max-height: calc(var(--unit) * 40);
    margin: 0;
    padding: 0;
    background-color: var(--bg-color);
    border: 1px solid var(--grey200);
    border-radius: calc(var(--unit) * 1);
    box-shadow: 0 calc(var(--unit) * 1) calc(var(--unit) * 2) color-mix(in srgb, var(--text-main) 20%, transparent);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--grey200) transparent;
  }
  .single-select-item {
    display: flex;
    align-items: center;
    width: 100%;
    padding: calc(var(--unit) * 1.5) calc(var(--unit) * 2);
    font-size: 12px;
    text-align: left;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--grey50);
    cursor: pointer;
  }
  .single-select-item:hover {
    background-color: var(--bg-color-hover);
  }
  .color-box {
    display: inline-block;
    flex: 0 0 12px;
    height: 12px;
    margin-right: 6px;
    border: 1px solid var(--grey400);
    border-radius: 2px;
  }

  @keyframes spin {
    to { 
      transform: rotate(360deg); 
    }
  }
</style>
