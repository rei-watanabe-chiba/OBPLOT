<!-- CSS.html -->
<style>
  /* --- 1. カラーパレットとベース設定 --- */
  :root {
    --main-blue: #1A73E8;
    --main-blue-hover: #1F41B6;
    --main-green: #34A853;
    --main-green-hover: #1F843C;
    --main-red: #ea4335;
    --grey50: #ECEFF1;
    --grey200: #B0BEC5;
    --grey400: #78909C;
    --grey600: #546E7A;
    --bg-color: #FFF;
    --bg-color-hover: #F5F5F5;
    --text-main: #202124;
    --transition-speed: 0.2s;
  }

  /* --- 基本レイアウト --- */
  * { 
    box-sizing: border-box; 
    margin: 0;
    padding: 0;
  }
  body { 
    display: grid; 
    grid-template-rows: auto 1fr; 
    height: 100vh; 
    overflow: hidden;
    font-family: 'Roboto', 'Noto Sans JP', sans-serif;
    font-size: 13px;
    color: var(--text-main);
    background-color: var(--bg-color);
  }
  main { 
    overflow-y: auto; 
    padding: 12px; 
  }
  fieldset { border: none; }
  .flex-row { display: flex; align-items: center; gap: 0; }
  .txt-btninfo { font-size: 11px; color: var(--grey600); margin-left: 8px; }
  hr { border: none; border-top: 1px solid var(--grey200); margin: 12px 0; }

  /* --- タブ --- */
  .nav-tabs { 
    display: flex; 
    border-bottom: 1px solid var(--grey200); 
  }
  .tab-btn { 
    background: none; 
    border: none; 
    border-radius: 0;
    color: var(--grey400); 
    flex: 1; 
    padding: 10px 0;
    font-weight: 600; 
    font-size: 13px;
    cursor: pointer; 
    transition: color var(--transition-speed), border-color var(--transition-speed);
    border-bottom: 2px solid transparent;
  }
  .tab-btn:hover {
    background-color: var(--bg-color-hover);
  }
  .tab-btn.active { 
    color: var(--grey600);
    border-bottom: 2px solid currentColor; 
  }
  .tab-btn.active.blue { color: var(--main-blue); }
  .tab-btn.active.green { color: var(--main-green); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* --- フォーム --- */
  label { 
    display: block; 
    margin-bottom: 4px;
    font-weight: 500;
  }
  input, select { 
    width: 100%; 
    font-size: 13px; 
    padding: 6px 8px;
    margin-top: 4px;
    border: 1px solid var(--grey400);
    border-radius: 4px;
    background-color: var(--bg-color);
    color: var(--text-main);
    transition: border-color var(--transition-speed), box-shadow var(--transition-speed);
    &:disabled { cursor: not-allowed; }
    &:not(:disabled) { cursor: pointer; }
    &:hover { filter: brightness(0.9); }
    &:focus { box-shadow: none; outline: none; }
  }

  /* --- アコーディオン --- */
  details {
    border: 1px solid var(--grey400);
    border-radius: 4px;
    padding: 6px 12px;
    margin: 8px 0; 
  }
  summary { 
    color: var(--text-main);
    font-weight: 500;
    cursor: pointer; 
    border-radius: 4px;
    transition: color var(--transition-speed);
    padding: 3px 0px;  
    user-select: none;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    &::-webkit-details-marker,
    &::marker { display: none; }
    &::after {
      content: "";
      width: 6px;
      height: 6px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
      transition: transform 0.2s ease;
    }
    input, select { margin: 2px; }
  }
  details[open] summary {
    margin-bottom: 12px;
    &::after { transform: rotate(-135deg); }
  }

  /* --- ボタン --- */
  .btn-container {
    display: flex;
    width: 100%;
    gap: 8px;
    margin: 12px 0;
  }
  button {
    flex: 0 0 50%;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 0px;
    border-radius: 4px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color var(--transition-speed), border-color var(--transition-speed), color var(--transition-speed);
    &:only-child { flex: 1 1 100%; }
    &[data-type="blue"] { background-color: var(--main-blue); color: #fff; }
    &[data-type="blue"]:hover:not(:disabled) { background-color: var(--main-blue-hover); }
    &[data-type="green"] { background-color: var(--main-green); color: #fff; }
    &[data-type="green"]:hover:not(:disabled) { background-color: var(--main-green-hover); }
    &[data-type]:disabled {
      background-color: var(--grey200);
      color: #fff;
      cursor: not-allowed;
      border-color: transparent;
    }
  }
  button.outline {
    background-color: transparent;
    border: 1px solid currentColor;
    &[data-type="blue"] { color: var(--main-blue); }
    &[data-type="green"] { color: var(--main-green); }
    &:disabled {
      background-color: transparent;
      color: var(--grey400);
      border-color: var(--grey400);
    }
    &[data-type]:hover {
      background-color: color-mix(in srgb, currentColor 15%, #FFF)
    }
  }

  /* --- ダイアログ --- */
  dialog { 
    width: 280px;
    padding: 20px;
    border: none;
    border-radius: 8px;
    margin: auto;
    h3 { margin-bottom: 12px; font-size: 16px; color: var(--text-main); }
    p { margin-bottom: 20px; line-height: 1.5; color: var(--grey600); }
    .btn-container { margin-bottom: 0; gap: 12px; }
    &::backdrop { filter: brightness(0.9);  backdrop-filter: blur(2px); }
  }

  /* --- ステータスバー（アラートボックス型） --- */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    margin: 6px 0;
    border-radius: 4px;
    border: 1px solid transparent;
    font-size: 13px;
    font-weight: 500;
    opacity: 1;
    max-height: 50px;
    overflow: hidden;
    transition: opacity 0.3s ease, max-height 0.3s ease, padding 0.3s ease, margin 0.3s ease;
  }
  .status-bar[data-status="hidden"] {
    opacity: 0;
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    margin-bottom: 0;
    border-width: 0;
    pointer-events: none;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .status-bar[data-status="loading"]::before {
    content: "";
    display: block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--grey200);
    border-top-color: var(--main-blue);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  .status-bar[data-status="loading"],
  .status-bar[data-status="message"] {
    background-color: transparent;
    border-color: var(--grey200);
    color: var(--grey600);
  }
  .status-bar[data-status="success"] {
    background-color: color-mix(in srgb, var(--main-green) 10%, transparent);
    color: var(--main-green);
  }
  .status-bar[data-status="error"],
  .status-bar[data-status="alert"] {
    background-color: color-mix(in srgb, var(--main-red) 10%, transparent);
    color: var(--main-red);
  }
</style>
