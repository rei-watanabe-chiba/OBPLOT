<!-- CSS.html -->
<style>
  /* --- 変数・テーマ定義 --- */
  :root {
    --main-blue: #1A73E8;
    --main-blue-hover: #1F41B6;
    --main-green: #34A853;
    --main-green-hover: #1F843C;
    --main-red: #ea4335;
    --grey50: #ECEFF1;
    --grey200: #B0BEC5;
    --grey400: #78909C;
    --grey600: #546E7A;
    --bg-color: #FFF;
    --bg-color-hover: #F5F5F5;
    --text-main: #202124;
    --transition-speed: 0.2s;
    /* デフォルトテーマ (Tab1) */
    --theme-color: var(--main-blue);
    --theme-hover: var(--main-blue-hover);
    interpolate-size: allow-keywords;
  }
  body[data-theme="tab2"] {
    --theme-color: var(--main-green);
    --theme-hover: var(--main-green-hover);
  }

  /* --- レイアウト --- */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
    overflow-x: hidden;
    font-family: 'Roboto', 'Noto Sans JP', sans-serif;
    font-size: 13px;
    color: var(--text-main);
    background-color: var(--bg-color);
  }
  main {
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px;
    padding-top: 8px;
    scrollbar-color: transparent;
  }
  main:hover {
    scrollbar-color: var(--grey200) transparent;
  }
  
  fieldset { border: none; }
  .flex-row { display: flex; align-items: center; gap: 0; }
  .txt-btninfo { font-size: 11px; color: var(--grey600); margin-left: 8px; }
  hr { border: none; border-top: 1.5px solid var(--grey200); margin: 12px 0; }
  .field-row {
    display: flex;
    gap: 8px;
    width: 100%;
    margin: 8px 0;
  }
  .field-col {
    flex: 1;
    min-width: 0;
  }

  /* --- タブ --- */
  .nav-tabs {
    display: flex;
    border-bottom: 1px solid var(--grey200);
  }
  .tab-btn {
    flex: 1;
    padding: 10px 0;
    background: none;
    border: none;
    border-radius: 0;
    border-bottom: 2px solid transparent;
    color: var(--grey400);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition-speed);
    &:hover { background-color: var(--bg-color-hover); }
    &.active {
      color: var(--theme-color);
      border-bottom-color: currentColor;
    }
  }
  .tab-content {
    display: none;
    &.active { display: block; }
  }

  /* --- フォーム --- */
  label {
    display: block;
    margin: 4px 2px;
    color: var(--grey600);
    user-select: none;
  }

  input, select {
    width: 100%;
    padding: 6px 8px;
    margin-top: 4px;
    font-size: 13px;
    color: var(--text-main);
    background-color: var(--bg-color);
    border: 1px solid var(--grey400);
    border-radius: 4px;
    transition: all var(--transition-speed);
    
    &:disabled { cursor: not-allowed; opacity: 0.7; }
    &:not(:disabled) { cursor: pointer; }
    &:not(:disabled):hover { filter: brightness(0.95); }
    &:focus { outline: none; border-color: var(--theme-color); }
    &.has-error {
      border-color: var(--main-red);
      background-color: color-mix(in srgb, var(--main-red) 10%, #fff);
    }
  }
  input[type="text"]:not(:disabled) { cursor: text; }

  .checkbox-container { max-height: 120px; overflow-y: auto; }
  .checkbox-item {
    display: flex;
    align-items: center;
    margin: 0 !important;
    padding: 4px 0;
    border-bottom: 1px solid var(--grey200);
    cursor: pointer;
    &:last-child { border-bottom: none; }
  }

  /* --- アコーディオン --- */
  details {
    margin: 4px 0;
    transition: opacity var(--transition-speed);
    &[data-type="disabled"] { pointer-events: none; opacity: 0.5; }
    &[data-state="active"] summary { color: var(--theme-color); margin-bottom: 8px; }
    &[data-state="disabled"] summary { cursor: not-allowed; }
    &::details-content {
      height: 0;
      opacity: 0;
      overflow: clip;
      transition: height 0.4s ease, opacity 0.4s ease, content-visibility 0.4s ease allow-discrete;
    }
    &[open]::details-content {
      height: auto;
      height: calc-size(auto, size);
      opacity: 1;
    }
  }
  summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    color: var(--text-main);
    font-size: 14px;
    font-weight: 600;
    list-style: none;
    cursor: pointer;
    user-select: none;
    transition: color var(--transition-speed);
    &::-webkit-details-marker, &::marker { display: none; }
    &::after {
      content: "";
      width: 6px;
      height: 6px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
      transition: transform 0.2s ease;
    }
  }
  details[open] summary::after { transform: rotate(-135deg); }

  /* --- ボタン --- */
  button {
    flex: 1 1 calc(50% - 4px);
    padding: 8px 0;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
    border-radius: 4px;
    cursor: pointer;
    transition: all var(--transition-speed);
    &:only-child { flex: 1 1 100%; }
    &[data-type="primary"] {
      background-color: var(--theme-color);
      color: #fff;
    }
    &[data-type="primary"]:not(:disabled):hover {
      background-color: var(--theme-hover);
    }
    &.outline {
      background-color: transparent;
      border-color: currentColor;
      &[data-type="primary"] { color: var(--theme-color); }
      &:not(:disabled):hover { background-color: color-mix(in srgb, currentColor 10%, transparent); }
    }
    &:disabled {
      background-color: var(--grey200);
      color: #fff;
      border-color: transparent;
      cursor: not-allowed;
    }
    &.outline:disabled {
      background-color: transparent;
      color: var(--grey400);
      border-color: var(--grey400);
    }
  }

  /* --- ダイアログ --- */
  dialog {
    width: 280px;
    margin: auto;
    padding: 20px;
    border: none;
    border-radius: 8px;
    h3 { margin-bottom: 12px; font-size: 16px; color: var(--text-main); }
    p { margin-bottom: 20px; line-height: 1.5; color: var(--grey600); }
    .field-row { margin-bottom: 0; gap: 12px; }
    &::backdrop {
      background-color: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(2px);
    }
  }

  /* --- ステータスバー --- */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    max-height: 50px;
    margin: 6px 0;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
    border-radius: 4px;
    opacity: 1;
    transition: all 0.3s ease;
    &[data-status="hidden"] {
      max-height: 0;
      margin-bottom: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      opacity: 0;
      pointer-events: none;
    }
    &[data-status="loading"], &[data-status="message"] {
      color: var(--grey600);
    }
    &[data-status="loading"]::before {
      content: "";
      display: block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--grey200);
      border-top-color: var(--theme-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    &[data-status="success"] {
      color: var(--main-green);
      background-color: color-mix(in srgb, var(--main-green) 10%, transparent);
    }
    &[data-status="error"], &[data-status="alert"] {
      color: var(--main-red);
      background-color: color-mix(in srgb, var(--main-red) 10%, transparent);
    }
  }
  
  /* --- テンプレート用 拡張クラス --- */
  .checkbox-item { 
    input[type="checkbox"] { flex: 1; cursor: pointer; transform: scale(1.2);}
    span { flex: 5; }
    &.select-all { 
      border-bottom: 1px solid var(--grey400); 
      &span { font-weight: 500; }
    }
  }
  .symbol-row {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
    align-items: center;
    select { padding: 4px; }
  }
  .symbol-target { flex: 2; }
  .symbol-shape, .symbol-color { flex: 1; }

  .radio-row { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    padding: 4px 0; 
    border-bottom: 1px solid var(--grey50); 
  }
  .radio-label { font-weight: 500; flex: 1; }
  .radio-group { display: flex; gap: 16px; flex: 2;}
  .radio-item { display: flex; align-items: center; gap: 4px; cursor: pointer; }

  /* --- 統計テーブルスタイル --- */
  .stats-container {
    font-size: 11px;
    background-color: var(--grey50);
    padding: 8px;
    border: 1px solid var(--grey200);
    border-radius: 4px;
    margin-top: 6px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    row-gap: 4px;
    column-gap: 8px;
    align-items: center;
  }
  .stats-label {
    color: var(--grey600);
    font-weight: 500;
  }
  .stats-val {
    font-weight: 700;
  }

  /* --- マルチセレクト・ドロップダウン (Popover API) --- */
  .multi-select-wrapper {
    box-sizing: border-box;
    width: 100%;
    margin-top: 4px;
  }
  .multi-select-summary {
    display: block;
    box-sizing: border-box;
    width: 276px;
    height: 32px;
    line-height: 24px;
    padding: 3px 24px 3px 8px;
    background-color: var(--bg-color);
    border: 1px solid var(--grey400);
    border-radius: 4px;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    font-weight: normal;
  }
  .multi-select-summary:hover {
    background-color: var(--bg-color-hover);
  }
  
  /* Popover本体の設定 (CSS Anchor Positioning) */
  .multi-select-options {
    margin: 0;
    padding: 0;
    max-height: 200px;
    overflow-y: auto;
    background-color: var(--bg-color);
    border: 1px solid var(--grey200);
    border-radius: 4px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    box-sizing: border-box;
    /* アンカーを基準にした相対配置 */
    top: calc(anchor(bottom) + 4px);
    left: anchor(left);
    width: anchor-size(width);
  }
  
  .badge {
    display: inline-block;      /* インライン要素として1行に並べる */
    vertical-align: middle;     /* 行の高さに対する垂直中央揃え */
    margin-right: 4px;          /* 要素間の隙間（gapの代替） */
    background-color: var(--grey50);
    color: var(--text-main);
    border: 1px solid var(--grey200);
    border-radius: 4px;
    padding: 2px 6px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 12px;
    line-height: 1.2;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
