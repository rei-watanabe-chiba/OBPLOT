<!-- CSS.html -->
<!-- Oat.UI CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@knadh/oat@latest/oat.min.css">
<script src="https://cdn.jsdelivr.net/npm/@knadh/oat@latest/oat.min.js"></script>

<style>
  /* --- カラー設定 --- */
  :root {
    --main-blue: #1a73e8;
    --main-green: #34a853;
    --main-red: #ea4335;
    --grey600: #546e7a;
  }

  /* --- 基本レイアウト --- */
  * { box-sizing: border-box; }
  body { 
    display: grid; 
    grid-template-rows: auto 1fr; 
    height: 100vh; 
    overflow: hidden;
    font-family: 'Roboto', 'Noto Sans JP', sans-serif;
    font-size: 13px;
  }
  main { 
    overflow-y: auto; 
    padding: 12px; 
  }
  fieldset { border: none; padding: 0; }
  .flex-row { display: flex; align-items: center; gap: 0; }
  .txt-btninfo { font-size: 11px; color: var(--grey600); margin-left: 8px; }
  hr { border: none; border-top: 1px solid #ddd; margin: 12px 0; }

  /* --- ナビゲーション --- */
  .nav-tabs { display: flex; border-bottom: 1px solid #ccc; }
  .tab-btn { 
    background: none; 
    border: none; 
    border-radius: 0;
    color: var(--grey600); 
    flex: 1; 
    font-weight: 600; 
    cursor: pointer; 
  }
  .tab-btn.active { 
    border-bottom: 2px solid currentColor; 
    &.blue { color: var(--main-blue); }
    &.green { color: var(--main-green); }
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* --- フォームコントロール --- */
  label { display: block; }
  input, select { width: 100%; font-size: 13px; 
    &:hover:not(:disabled) { border-color: var(--main-blue); }
    &:focus, &:focus-visible {
      border-color: var(--main-blue);
      outline: none;
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--main-blue) 20%, transparent);
    }
  }
  details { padding: 0; margin: 0;
    & select, & input, & label { margin: 0; }
  }
  summary { color: var(--grey600); cursor: pointer; padding: 8px;  margin-bottom: 2px; }

  /* --- ボタンレイアウト --- */
  .btn-container {
    display: flex;
    width: 100%;
    gap: 6px;
    margin: 8px auto;
    & > button {
      flex: 1;
      font-size: 13px;
      cursor: pointer;
    }
  }
  /* --- ボタン (Oat.UI仕様拡張) --- */
  button {
    &.outline:disabled,
    &[data-variant].outline:disabled {
      color: var(--grey600);
      border-color: var(--grey600);
    }
    &[data-variant="blue"] {
      background-color: var(--main-blue);
      border-color: var(--main-blue);
      color: #fff;
      &:hover:not(:disabled) {
        background-color: color-mix(in srgb, var(--main-blue) 85%, #000);
      }
      &.outline {
        background-color: transparent;
        color: var(--main-blue);
        &:hover:not(:disabled) {
          background-color: color-mix(in srgb, var(--main-blue) 10%, transparent);
        }
      }
    }
    &[data-variant="green"] {
      background-color: var(--main-green);
      border-color: var(--main-green);
      color: #fff;
      &:hover:not(:disabled) {
        background-color: color-mix(in srgb, var(--main-green) 85%, #000);
      }
      &.outline {
        background-color: transparent;
        color: var(--main-green);
        &:hover:not(:disabled) {
          background-color: color-mix(in srgb, var(--main-green) 10%, transparent);
        }
      }
    }
  }

  /* --- モーダルダイアログのレイアウト統一 --- */
  dialog { 
    width: 280px;
    padding: 20px;
  }
  dialog h3,
  dialog p,
  dialog .btn-container {
    margin-left: 0;
    margin-right: 0;
    padding-left: 0;
    padding-right: 0;
  }
  dialog .btn-container {
    margin-top: 16px;
    margin-bottom: 0;
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
</style>
