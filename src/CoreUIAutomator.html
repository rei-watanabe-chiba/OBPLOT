<script>
  class CoreUIAutomator {
    constructor(schema, stateTarget) {
      this.schema = schema;
      this.stateTarget = stateTarget;
    }

    getVal(path) {
      return State.get(path.includes('.') ? path : `${this.stateTarget}.${path}`);
    }

    build() {
      this.update();

      const bindElement = (el, path) => {
        if (!path) return;
        const applyBind = (val) => {
          if (val === undefined) return;
          if (el.type === 'checkbox') {
            if (el.checked !== !!val) el.checked = !!val;
          } else if (el.tagName === 'OB-MULTI-SELECT') {
            el.refs = val; 
          } else if (el.tagName === 'SELECT' || el.tagName === 'INPUT') {
            if (el.value !== String(val ?? '')) el.value = val ?? '';
          }
        };
        State.subscribe(path, applyBind);
        applyBind(this.getVal(path));
      };

      document.querySelectorAll(`[data-bind-status^="${this.stateTarget}"]`).forEach(el => {
        const path = el.dataset.bindStatus;
        const applyStatus = (val) => {
          if (Array.isArray(val) && val.length >= 2) {
            if (el.dataset.status !== val[0]) el.dataset.status = val[0];
            if (el.innerText !== val[1]) el.innerText = val[1];
          } else {
            el.dataset.status = "hidden";
            el.innerText = "";
          }
        };
        State.subscribe(path, applyStatus);
        applyStatus(this.getVal(path));
      });

      document.querySelectorAll(`[data-bind^="${this.stateTarget}"]`).forEach(el => bindElement(el, el.dataset.bind));

      document.querySelectorAll(`[data-bind-opts^="${this.stateTarget}"]`).forEach(el => {
        const path = el.dataset.bindOpts;
        const applyOpts = (val) => { if (val !== undefined) el.opts = val; };
        State.subscribe(path, applyOpts);
        applyOpts(this.getVal(path));
      });

      document.querySelectorAll(`[data-bind-src^="${this.stateTarget}"]`).forEach(el => {
        const path = el.dataset.bindSrc;
        const applySrc = (val) => { if (val !== undefined) el.src = val; };
        State.subscribe(path, applySrc);
        applySrc(this.getVal(path));
      });

      document.querySelectorAll(`[data-bind-stats^="${this.stateTarget}"]`).forEach(el => {
        const path = el.dataset.bindStats;
        const applyStats = (val) => { if (val !== undefined) NewDOM.buildStats(val, el); };
        State.subscribe(path, applyStats);
        applyStats(this.getVal(path));
      });

      document.querySelectorAll(`[data-bind-errs^="${this.stateTarget}"]`).forEach(el => {
        const path = el.dataset.bindErrs;
        const applyErrs = (val) => { if (val !== undefined) NewDOM.inputs(el, val); };
        State.subscribe(path, applyErrs);
        applyErrs(this.getVal(path));
      });

      document.querySelectorAll(`[data-bind-fields^="${this.stateTarget}"]`).forEach(el => {
        const path = el.dataset.bindFields;
        const applyFields = (val) => { 
          if (val !== undefined) {
            NewDOM.buildFormFields(val, el, true);
            el.querySelectorAll('[data-bind]').forEach(child => bindElement(child, child.dataset.bind));
          }
        };
        State.subscribe(path, applyFields);
        applyFields(this.getVal(path));
      });
    }

    update() {
      const curPhase = State.get(`${this.stateTarget}.phase`) ?? 1;

      (this.schema.elements || []).forEach(def => {
        const targetEl = document.getElementById(def.id);
        if (!targetEl) return;

        if (def.visiblePhase !== undefined) {
          const isVisible = typeof def.visiblePhase === 'function' ? def.visiblePhase(curPhase) : curPhase >= def.visiblePhase;
          targetEl.style.display = isVisible ? '' : 'none';
        }

        // 修正: openPhase を先に評価し、閉じる場合は即時反映させてアニメーション競合を避ける
        if (def.openPhase !== undefined && targetEl.tagName === 'DETAILS') {
          const isOpen = typeof def.openPhase === 'function' ? def.openPhase(curPhase) : curPhase >= def.openPhase;
          if (isOpen !== undefined && targetEl.open !== isOpen) {
            if (isOpen) {
              setTimeout(() => { targetEl.open = true; }, 200);
            } else {
              targetEl.open = false; // 閉じる時は遅延させない
            }
          }
        }

        if (def.activePhase !== undefined || def.disablePhase !== undefined) {
          const isActive = def.activePhase !== undefined 
            ? (typeof def.activePhase === 'function' ? def.activePhase(curPhase) : curPhase >= def.activePhase) 
            : true;
          const isDis = def.disablePhase !== undefined 
            ? (typeof def.disablePhase === 'function' ? def.disablePhase(curPhase) : curPhase >= def.disablePhase) 
            : !isActive; 

          if (targetEl.tagName === 'DETAILS') {
            targetEl.setAttribute('data-state', isActive ? 'active' : '');
            if (isDis) targetEl.setAttribute('data-type', 'disabled');
            else targetEl.removeAttribute('data-type');
            
            // --- [追加] 下層フォーム要素への物理的な disabled 強制同期ガード ---
            targetEl.querySelectorAll('input, select, button, textarea, ob-multi-select').forEach(child => {
              if (child.tagName === 'OB-MULTI-SELECT') {
                const sum = child.querySelector('.popover-summary');
                if (sum) sum.disabled = isDis;
              }
              child.disabled = isDis;
            });
            // -----------------------------------------------------------------
          } else {
            targetEl.disabled = isDis;
          }
        }

        if (def.className !== undefined) {
          const cls = typeof def.className === 'function' ? def.className(curPhase) : def.className;
          if (targetEl.className !== cls) targetEl.className = cls;
        }

        if (def.text !== undefined) {
          const txt = typeof def.text === 'function' ? def.text(curPhase) : def.text;
          if (targetEl.innerText !== txt) targetEl.innerText = txt;
        }

        if (def.dataset !== undefined) {
          const ds = typeof def.dataset === 'function' ? def.dataset(curPhase) : def.dataset;
          if (ds && typeof ds === 'object') {
            for (const key in ds) {
              if (targetEl.dataset[key] !== String(ds[key])) targetEl.dataset[key] = ds[key];
            }
          }
        }
      });
    }
  }
</script>
