<script>
  class T1Action {
    static get ssId() { return State.get("GLB.ssId"); }
    
    static checkT1Pref(tgt) {
      const mode = tgt.value;
      if (!mode) return;
      const phs = State.get("T1ST.phase"), isInit = phs === T1_PHS.INIT, isInvalid = phs >= T1_PHS.INVALID;
      if (isInvalid) { 
        const errStat = ["error", "設定変更検知: リストの再生成・検証が必要です"];
        State.set({ "T1ST.raw.status": errStat, "T1ST.raw.cachedStatus": errStat, "T1ST.extr.status": ["hidden", ""] });
      }
      State.set({ "T1ST.pref.status": ["message", mode === "Dual" ? "Obsidian/mudrockセット抽出対応" : "1ファイル単位抽出（モード混在可）"], ...(isInit || isInvalid ? { "T1ST.phase": isInit ? T1_PHS.READY : T1_PHS.INVALID } : {}) });
    }
    
    static renewRawRefs(tgt) {
      State.set(`T1ST.raw.refs.${tgt.dataset.field}`, tgt.value);
      T1Action.checkRawRefs();
    }
    
    static checkRawRefs() {
      const flags = CoreMethod.Util.validateSelect(GLB.fileFields.map(f => State.get(`T1ST.raw.refs.${f.key}`) || ""), 3);
      State.set({ "T1ST.raw.flags": flags, "T1ST.raw.status": flags.some(Boolean) ? ["error", "エラー: 列選択"] : State.get("T1ST.raw.cachedStatus") });
    }
    
    static checkExtrRefs() {
      const isErr = !(State.get(`T1ST.extr.refs.${GLB.idx.key1}`)?.trim());
      State.set("T1ST.extr.flags", [isErr, false, false]);
      if (State.get("T1ST.phase") >= T1_PHS.VALID) {
        State.set("T1ST.extr.status", isErr ? ["error", `エラー: ${GLB.idx.key1}未入力`] : ["hidden", ""]); 
      }
    }

    static async loadRaw() {
      const msg = State.get("T1ST.raw.data") ? "データをリセットしますか？" : "Fileシートを読込ますか？";
      await CoreAction.confirmAndExecute("T1ST.raw.status", "確認", msg, async () => {
        const { data, message } = await API.fetchDT(T1Action.ssId, GLB.rawShts.file, 5);
        State.set({ 
          "T1ST.raw.data": data, 
          "T1ST.raw.refs": Object.fromEntries(GLB.fileFields.map(f => [f.key, ""])), 
          "T1ST.raw.flags": [true, true, true, false, false], 
          "T1ST.raw.cachedStatus": ["success", message], 
          "T1ST.phase": T1_PHS.LOAD,
          "T1ST.extr.status": ["hidden", ""],
          "T1ST.extr.flags": [true, false, false]
        });
        T1Action.checkRawRefs(); 
        return State.get("T1ST.raw.status"); 
      });
    }
    
    static async stateDI(rawDT, act = "make") {
      const outData = Mtd.T1.FVald.valdList(rawDT, CoreMethod.Util.buildHeader('filelist'), GLB.validModes, State.get("T1ST.pref.refs.mode"));
      const isErr = outData.slice(1).some(r => r.at(-1) !== ""); 
      await API.writeData(T1Action.ssId, GLB.appShts.filelist, outData, "rule");
      
      const statArr = act === "extract"
        ? (isErr ? ["alert", "抽出中断: リストの再検証が必要です"] : State.get("T1ST.raw.cachedStatus"))
        : [isErr ? "alert" : "success", `${act === "validate" ? "検証" : "リスト生成"}完了: err${isErr ? "あり" : "なし"}`];
      
      const newPhase = isErr ? T1_PHS.INVALID : T1_PHS.VALID;
      State.set({ 
        "T1ST.raw.cachedStatus": statArr, 
        "T1ST.raw.status": statArr, 
        "T1ST.phase": newPhase, 
        ...((isErr || act !== "extract") && { "T1ST.extr.status": ["hidden", ""] }) 
      });
      
      if (!isErr && act !== "extract") T1Action.checkExtrRefs();
      
      return { isErr, outData, statArr };
    }
    
    static async makeList() {
      T1Action.checkRawRefs();
      const { raw } = State.proxy.T1ST;
      if (raw.flags.some(Boolean)) return;
      await CoreAction.confirmAndExecute("T1ST.raw.status", "確認", "「ファイルリスト」を上書きしますか？", async () => {
        return (await T1Action.stateDI(CoreMethod.Util.remapArry(raw.data, GLB.fileFields.map(f => raw.refs[f.key] ? raw.data[0].indexOf(raw.refs[f.key]) : -1), CoreMethod.Util.buildHeader('rawFile')), "make")).statArr;
      });
    }
    
    static async valdList() {
      await CoreAction.confirmAndExecute("T1ST.raw.status", "確認", "「ファイルリスト」を上書きしますか？", async () => {
        return (await T1Action.stateDI((await API.fetchDT(T1Action.ssId, GLB.appShts.filelist, 5, 5)).data, "validate")).statArr;
      });
    }
    
    static async runExtr() {
      await CoreAction.confirmAndExecute("T1ST.extr.status", "確認", "「抽出データ」を上書きしますか？", async () => {
        const { isErr, outData: validFileDT } = await T1Action.stateDI((await API.fetchDT(T1Action.ssId, GLB.appShts.filelist, 5, 5)).data, "extract");
        if (isErr) return State.get("T1ST.extr.status");
        const resDT = await API.fetchDT(T1Action.ssId, GLB.rawShts.results);
        const outData = Mtd.T1.Extr.runExtr(validFileDT, resDT.data, State.get("T1ST.extr.refs"));
        if (!outData || outData.length <= 1) throw new Error("対象データなし");
        await API.writeData(T1Action.ssId, GLB.appShts.extract, outData);
        State.set("T1ST.phase", T1_PHS.EXTRACT); 
        return `抽出: ${outData.length - 1} 件`;
      });
    }
    
    static async pushExtr() {
      State.set("GLB.isLocked", true);
      State.set("T1ST.extr.status", ["loading", "データ確認中..."]);
      let extrRes, trcRes, checkRes;
      try {
        extrRes = await API.fetchDT(T1Action.ssId, GLB.appShts.extract);
        trcRes = await API.fetchDT(T1Action.ssId, GLB.rawShts.tracer5i).catch(() => ({ data: [CoreMethod.Util.buildHeader('tracer5i')] }));
        checkRes = Mtd.T1.PVald.checkPxrf(trcRes.data, extrRes.data);
      } catch (e) {
        State.set("T1ST.extr.status", ["error", e.message]);
        State.set("GLB.isLocked", false);
        return;
      }
      State.set("GLB.isLocked", false);

      const msg = checkRes.isDup ? "重複IDがあります。上書き格納しますか？" : "tracer5iシートに格納しますか？";
      
      await CoreAction.confirmAndExecute("T1ST.extr.status", "確認", msg, async () => {
        await API.writeData(T1Action.ssId, GLB.rawShts.tracer5i, checkRes.isDup ? checkRes.data : extrRes.data.slice(1), checkRes.isDup ? "clear" : ["append"]);
        State.set("T1ST.phase", T1_PHS.OUTPUT); 
        return `格納完了: ${extrRes.data.length - 1} 件`;
      });
    }
  }

  class T2Action {
    static get ssId() { return State.get("GLB.ssId"); }

    static tglMulti(tgt, statePath) {
      const cntr = tgt.closest('ob-multi-select');
      if (!cntr) return;
      const itemCbs = [...cntr.querySelectorAll('.dataset-cb')], allCb = cntr.querySelector('.select-all-cb');
      if (allCb) allCb.checked = itemCbs.length > 0 && itemCbs.every(cb => cb.checked);
      State.set(statePath, itemCbs.filter(cb => cb.checked).map(cb => cb.value));
    }
    static tglAllMulti(tgt, statePath) {
      const cntr = tgt.closest('ob-multi-select');
      if (!cntr) return;
      const itemCbs = cntr.querySelectorAll('.dataset-cb');
      itemCbs.forEach(cb => cb.checked = tgt.checked);
      State.set(statePath, tgt.checked ? [...itemCbs].map(cb => cb.value) : []);
    }
    static tglDB(tgt) { this.tglMulti(tgt, "T2ST.asgn.refs.filter"); }
    static tglAllDB(tgt) { this.tglAllMulti(tgt, "T2ST.asgn.refs.filter"); }
    static tglPrevMode(tgt) { this.tglMulti(tgt, "T2ST.calb.refs.modeMap"); }
    static tglAllPrevMode(tgt) { this.tglAllMulti(tgt, "T2ST.calb.refs.modeMap"); }
    static tglCalElm(tgt) { this.tglMulti(tgt, "T2ST.calb.refs.calElms"); }
    static tglAllCalElm(tgt) { this.tglAllMulti(tgt, "T2ST.calb.refs.calElms"); }
    static tglPrevItem(tgt) { this.tglMulti(tgt, "T2ST.prev.refs.itemMap"); }
    static tglAllPrevItem(tgt) { this.tglAllMulti(tgt, "T2ST.prev.refs.itemMap"); }
    static tglStdzMode(tgt) { this.tglMulti(tgt, "T2ST.stdz.refs.modeMap"); }
    static tglAllStdzMode(tgt) { this.tglAllMulti(tgt, "T2ST.stdz.refs.modeMap"); }
    static tglStdzItem(tgt) { this.tglMulti(tgt, "T2ST.stdz.refs.itemMap"); }
    static tglAllStdzItem(tgt) { this.tglAllMulti(tgt, "T2ST.stdz.refs.itemMap"); }

    static async loadDB() {
      await CoreAction.confirmAndExecute("T2ST.asgn.status", null, null, async () => {
        const [pRes, wRes, cRes] = await Promise.all([API.fetchDT(T2Action.ssId, GLB.rawShts.tracer5i), API.fetchDT(T2Action.ssId, GLB.rawShts.wdxrf), API.fetchDT(T2Action.ssId, GLB.appShts.correction).catch(() => ({ data: [] }))]);
        if (!pRes.data || pRes.data.length <= 1) throw new Error("tracer5i不足");
        if (!wRes.data || wRes.data.length <= 1) throw new Error("WDXRF不足");
        State.reset(['T2ST.asgn', 'T2ST.symb', 'T2ST.calb', 'T2ST.prev', 'T2ST.stdz']);
        const { wrapPXRF, wrapWDXRF, dbs } = Mtd.T2.mgmtDT.loadDB(pRes.data, wRes.data);
        State.set({ "T2ST.asgn.data.wrapPXRF": wrapPXRF, "T2ST.asgn.data.wrapWDXRF": wrapWDXRF, "T2ST.asgn.data.corrDT": cRes.data, "T2ST.asgn.refs.available": dbs, "T2ST.asgn.refs.filter": dbs, "T2ST.phase": T2_PHS.LOADED, "T2ST.calb.refs.modeMap": [...GLB.optElms], "T2ST.calb.refs.calElms": [...GLB.valElms], "T2ST.stdz.refs.modeMap": [...GLB.optElms] });
        return `読込完了: database ${dbs.length}件`;
      });
    }
    static async fltrDB() {
      await CoreAction.confirmAndExecute("T2ST.asgn.status", null, null, async () => {
        const { asgn } = State.proxy.T2ST;
        if (!asgn.refs.filter?.length) throw new Error("DB未選択");
        State.reset(['T2ST.symb', 'T2ST.calb', 'T2ST.prev', 'T2ST.stdz']);
        const { pxrfDT, wdxrfDT } = Mtd.T2.mgmtDT.fltrDB(asgn.data.wrapPXRF, asgn.data.wrapWDXRF, asgn.refs.filter);
        State.set({ "T2ST.asgn.data.pxrfDT": pxrfDT, "T2ST.asgn.data.wdxrfDT": wdxrfDT, "T2ST.phase": T2_PHS.FILTERED }); return "データ更新";
      });
    }
    static async setSymb() { 
      await CoreAction.confirmAndExecute("T2ST.symb.status", null, null, async () => { 
        State.set("T2ST.phase", T2_PHS.MAPPED); 
        return "シンボル確定"; 
      }); 
    }
    
    static async resetSymb() { State.reset("T2ST.symb.refs.rls"); }
    
    static async checkAxis(tgtSelect) {
      const newVal = tgtSelect.value, oldVal = State.get("T2ST.symb.refs.baseKey");
      if (newVal === oldVal) return;
      
      const isConfirmed = await CoreAction.confirmAndExecute("T2ST.symb.status", "確認", "属性を変更するとシンボル設定がリセットされます。よろしいですか？", async () => {
        State.set({ "T2ST.symb.refs.baseKey": newVal }); 
        State.reset("T2ST.symb.refs.rls");
        return ["hidden", ""];
      });
      
      if (!isConfirmed) {
        tgtSelect.value = oldVal;
      }
    }
    
    static addSymb() { State.set("T2ST.symb.refs.rls", [...(State.get("T2ST.symb.refs.rls") || []), { key: `rule_${Date.now()}`, target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }]); }
    static removeSymb(tgtBtn) {
      const key = tgtBtn.dataset.ruleKey;
      if (key) State.set("T2ST.symb.refs.rls", (State.get("T2ST.symb.refs.rls") || []).filter(r => r.key !== key));
    }
    static renewSymb(tgtBtn) {
      const idx = tgtBtn.dataset.symbolIdx, type = tgtBtn.dataset.symbolType;
      if (idx == null || !type) return;
      const rls = [...(State.get("T2ST.symb.refs.rls") || [])];
      if (rls[idx]) { rls[idx][type] = tgtBtn.value; State.set("T2ST.symb.refs.rls", rls); }
    }

    static async buildPrev() {
      await CoreAction.confirmAndExecute("T2ST.prev.status", "確認", "プレビューを更新しますか？", async () => {
        const { prev, calb, asgn, symb } = State.proxy.T2ST;
        const conf = { ...prev.refs, ...calb.refs, corrDT: asgn.data.corrDT, graphType: 'calibration', calibVal: prev.refs.val }; 
        const { prevDT, statsDT } = Mtd.T2.mgmPrev.generateChartData(asgn.data.pxrfDT, asgn.data.wdxrfDT, conf);
        if (!prevDT.length) throw new Error("対象データなし");
        
        State.set({ 
          "T2ST.prev.data.correctionLogic": statsDT, 
          "T2ST.prev.data.statsDT": statsDT, 
          "T2ST.prev.data.prevDT": prevDT,
          "T2ST.prev.data.chartSrc": { prevDT, statsDT, symb: symb.refs },
          "T2ST.phase": T2_PHS.PREVIEWED 
        }); 
        return ["message", "検量線とデータ補正のプレビュー"];
      });
    }
    static async saveCorr() {
      const idxName = State.get("T2ST.stdz.refs.saveIndexName")?.trim();
      if (!idxName) { State.set("T2ST.stdz.status", ["error", "名前が未入力です"]); return; }
      
      const { asgn, stdz } = State.proxy.T2ST;
      const isDup = asgn.data.corrDT?.slice(1).some(r => r[0] === idxName);
      const msg = isDup ? `全対象元素の検量線を上書きしますか？\n名前：${idxName}` : `全対象元素の検量線を出力しますか？\n名前：${idxName}`;
      
      await CoreAction.confirmAndExecute("T2ST.stdz.status", "確認", msg, async () => {
        const newRow = Mtd.T2.mgmStdz.calcAllCalib(asgn.data.pxrfDT, asgn.data.wdxrfDT, stdz.refs, idxName);
        let updData = asgn.data.corrDT?.length ? [...asgn.data.corrDT] : [CoreMethod.Util.buildHeader('corr')];
        if (isDup) updData[updData.findIndex(r => r[0] === idxName)] = newRow; else updData.push(newRow);
        await API.writeData(T2Action.ssId, GLB.appShts.correction, isDup ? updData : (asgn.data.corrDT?.length ? [newRow] : updData), (isDup || !asgn.data.corrDT?.length) ? "clear" : ["append"]);
        State.set({ "T2ST.asgn.data.corrDT": updData, "T2ST.stdz.refs.saveIndexName": "" }); 
        return `補正値を${isDup ? '上書き' : '保存'}しました`;
      });
    }
    static async pushStdz() {
      await CoreAction.confirmAndExecute("T2ST.stdz.status", "確認", "PXRFシートに出力しますか？", async () => {
        const { asgn, stdz } = State.proxy.T2ST;
        const outData = Mtd.T2.mgmStdz.genNewPxrf(asgn.data.pxrfDT, stdz.refs.modeMap);
        await API.writeData(T2Action.ssId, GLB.appShts.pxrf, outData, "clear");
        return "PXRFシートの出力を完了しました";
      });
    }

    static updateDerivedState() {
      const baseDT = State.get("T2ST.asgn.data.pxrfDT");
      const baseKey = State.get("T2ST.symb.refs.baseKey");
      const rls = State.get("T2ST.symb.refs.rls");

      if (baseDT?.length) {
        const items = [...new Set(baseDT.map(d => d[GLB.idx.p1]).filter(Boolean))];
        State.set({
          "T2ST.asgn.refs.availableItems": items,
          "T2ST.prev.refs.itemMap": State.get("T2ST.prev.refs.itemMap")?.length ? State.get("T2ST.prev.refs.itemMap") : items,
          "T2ST.stdz.refs.itemMap": State.get("T2ST.stdz.refs.itemMap")?.length ? State.get("T2ST.stdz.refs.itemMap") : items
        });

        const vals = [...new Set(baseDT.map(d => d[baseKey]).filter(Boolean))];
        State.set("T2ST.symb.data.src", {
          rls: rls,
          optsConf: { target: [{ val: "", label: "未選択" }, ...vals.map(v => ({ val: v, label: v }))], shp: GLB.symbShapes, clr: GLB.symbColors },
          actsConf: { add: "T2Action.addSymb", remove: "T2Action.removeSymb", update: "T2Action.renewSymb"}
        });
      } else {
        State.set({ "T2ST.asgn.refs.availableItems": [], "T2ST.symb.data.src": null });
      }
    }
  }

  window.T1Action = T1Action;
  window.T2Action = T2Action;

  class AppTracerInit {
    static async start() {
      const urlParams = new URLSearchParams(window.location.search);
      const activeMode = window.__APP_MODE__ || urlParams.get('mode') || 'tab1';
      
      CoreAction.initGlobalRouter({ CoreAction, T1Action, T2Action });

      CoreAction.configResolver = (tabId) => {
        return tabId === 'tab1' 
          ? { schemaKey: 'tab1', statPath: 'T1ST.pref.status' }
          : { schemaKey: 'tab2', statPath: 'T2ST.asgn.status' };
      };

      const automatorT1 = new CoreUIAutomator(T1T2_SCHEMA.T1, 'T1ST');
      const automatorT2 = new CoreUIAutomator(T1T2_SCHEMA.T2, 'T2ST');

      automatorT1.build();
      automatorT2.build();

      State.subscribe("T1ST.phase", () => automatorT1.update());
      State.subscribe("T2ST.phase", () => automatorT2.update());
      
      // 【追加】フラグ（入力エラー状態）の変更時にもUI（ボタンの有効/無効などスキーマ定義の再評価）をトリガーする
      State.subscribe("T1ST.raw.flags", () => automatorT1.update());
      State.subscribe("T1ST.extr.flags", () => automatorT1.update());

      State.subscribe("GLB.isLocked", v => {
        const fs1 = document.getElementById("tab1Fieldset");
        const fs2 = document.getElementById("tab2Fieldset");
        if (fs1) fs1.disabled = v;
        if (fs2) fs2.disabled = v;
      });

      // --- 派生状態（UI用データ）の自動更新監視 ---
      State.subscribe(`T1ST.extr.refs.${GLB.idx.key1}`, () => T1Action.checkExtrRefs());
      
      State.subscribe("T1ST.raw.data", data => {
        if (data?.[0]) State.set("T1ST.raw.data.fields", GLB.fileFields.map(f => ({ type: "select", label: f.label, field: f.key, change: "T1Action.renewRawRefs", opts: data[0].map(h => ({ label: h, val: h })), hasEmpty: true })));
        else State.set("T1ST.raw.data.fields", []);
      });
      State.subscribe("T2ST.asgn.data.corrDT", data => {
        if (!data) return;
        const opts = [{ label: "新規検量線", val: "new" }, ...data.slice(1).filter(r => r[0]).map(r => ({ label: r[0], val: r[0] }))];
        State.set("T2ST.calb.data.corrFields", [{ type: "select", bind: "T2ST.calb.refs.correction", hasEmpty: false, opts: opts }]);
      });

      State.subscribe("T2ST.asgn.data.pxrfDT", () => T2Action.updateDerivedState());
      State.subscribe("T2ST.symb.refs.baseKey", () => T2Action.updateDerivedState());
      State.subscribe("T2ST.symb.refs.rls", () => T2Action.updateDerivedState());

      const hooks = {
        onBeforeInit: async (isSwitch, bu) => {
          if (State.get("GLB.activeTab") === "tab2" && !isSwitch && bu) {
             if (await NewDOM.confirm("復元", "前回の作業状態を復元しますか？")) {
                await T2Action.loadDB();
                if (State.get("T2ST.phase") >= T2_PHS.LOADED) {
                  State.set({ "T2ST.asgn.refs.available": bu.asgn.r.available, "T2ST.asgn.refs.filter": bu.asgn.r.filter });
                  if (bu.phase >= T2_PHS.FILTERED) {
                     await T2Action.fltrDB();
                     State.set({
                       "T2ST.symb.refs.baseKey": bu.symb.r.baseKey, "T2ST.symb.refs.rls": bu.symb.r.rls,
                       "T2ST.calb.refs.modeMap": bu.calb.r.modeMap, "T2ST.calb.refs.calElms": bu.calb.r.calElms, "T2ST.calb.refs.correction": bu.calb.r.correction, "T2ST.calb.refs.useLOD": bu.calb.r.useLOD, "T2ST.calb.refs.useCal": bu.calb.r.useCal,
                       "T2ST.prev.refs.itemMap": bu.prev.r.itemMap, "T2ST.prev.refs.val": bu.prev.r.val, "T2ST.prev.refs.saveIndexName": bu.prev.r.saveIndexName,
                       "T2ST.stdz.refs.itemMap": bu.stdz?.r.itemMap || [], "T2ST.stdz.refs.modeMap": bu.stdz?.r.modeMap || [...GLB.optElms], "T2ST.stdz.refs.useLOD": bu.stdz?.r.useLOD || false, "T2ST.stdz.refs.saveIndexName": bu.stdz?.r.saveIndexName || ""
                     });
                     if (bu.phase >= T2_PHS.PREVIEWED) await T2Action.buildPrev();
                  }
                  State.set({ "T2ST.asgn.status": bu.asgn.s, "T2ST.symb.status": bu.symb.s, "T2ST.calb.status": bu.calb.s, "T2ST.prev.status": bu.prev.s, "T2ST.stdz.status": bu.stdz?.s || ["hidden", ""] });
                }
             } else { CoreMakeBU.clear(); }
          }
        }
      };

      const ssId = window.__INITIAL_SSID__ || "EXCEL_LOCAL_RUN";
      CoreAction.activateTabUI(activeMode);
      const initConfig = CoreAction.configResolver(activeMode);
      await CoreAction.startSession(ssId, false, hooks, initConfig);
    }
  }

  if (typeof Office !== 'undefined') { Office.onReady(() => AppTracerInit.start()); } 
  else { if (document.readyState === 'loading') { window.addEventListener("DOMContentLoaded", () => AppTracerInit.start()); } else { AppTracerInit.start(); } }
</script>
