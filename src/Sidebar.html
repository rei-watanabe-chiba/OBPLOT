<!-- Sidebar.html -->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include("CSS"); ?>
  </head>
  <body data-theme="tab1">
    <!-- ナビゲーション -->
    <nav class="nav-tabs" id="nav">
      <button class="tab-btn active" data-target="tab1">データ抽出</button>
      <button class="tab-btn" data-target="tab2">グラフ作成</button>
    </nav>

    <main>
      <!-- 第1タブ -->
      <div id="tab1" class="tab-content active">
        <fieldset id="tab1Fieldset">
          <!-- 設定層 -->
          <details id="configSection" data-state="active" open>
            <summary>設定</summary>
            <div id="configArea">
              <select id="configExacMode" data-bind="Tab1ST.config.mode">
                <option value="" selected disabled hidden>モードを選択してください</option>
                <option value="Dual">Dualモード</option>
                <option value="Single">Singleモード</option>
              </select>
            </div>
          </details>
          <div id="configStatusBar" class="status-bar" data-status="hidden"></div>
          <hr>
          <!-- ファイル層 -->
          <details id="fileSection" data-type="disabled">
            <summary>読込と検証</summary>
            <div class="flex-row">
              <button id="fileLoadBtn" data-type="primary" data-action="Tab1.loadFile">データを取得</button>
              <span class="txt-btninfo">読込シート「File」</span>
            </div>
            <div id="fileArea" style="display: none;">
              <div id="fileBox"></div>
            </div>
            <div id="fileBtnArea" class="btn-container" style="display: none;">
              <button id="fileMakeBtn" data-type="primary" class="outline" data-action="Tab1.makeFileList" disabled>リスト生成</button>
              <button id="fileValdBtn" data-type="primary" class="outline" data-action="Tab1.validateFileList" disabled>検証</button>
            </div>
          </details>
          <div id="fileStatusBar" class="status-bar" data-status="hidden"></div>
          <hr>
          <!-- 抽出層 -->
          <details id="exacSection" data-type="disabled">
            <summary>抽出と格納</summary>
            <div class="flex-row">
              <button id="exacBtn" data-type="primary" data-action="Tab1.extractFile" disabled>データを抽出</button>
              <span class="txt-btninfo" id="exacInfoTxt">読込シート「Results」</span>
            </div>
            <div id="exacArea" style="display: none;">
              <div id="exacBox">
                <label>dataset *必須
                  <input type="text" data-bind="Tab1ST.exac.map.dataset" placeholder="データセット・遺跡名">
                </label>
                <label>item
                  <input type="text" data-bind="Tab1ST.exac.map.item" placeholder="計測情報（任意）">
                </label>
                <label>date
                  <input type="text" data-bind="Tab1ST.exac.map.date" placeholder="計測日（任意）">
                </label>
              </div>
            </div>
            <div id="exacBtnArea" class="btn-container">
              <button id="exacPushBtn" data-type="primary" class="outline" style="display: none;" data-action="Tab1.pushExacData" disabled>PXRFに格納</button>
            </div>
          </details>
          <div id="exacStatusBar" class="status-bar" data-status="hidden"></div>
        </fieldset>
      </div>

      <!-- 第2タブ -->
      <div id="tab2" class="tab-content">
        <fieldset id="tab2Fieldset">
          <!-- dataset層 -->
          <details id="datasetSection" open>
            <summary>データ読込・選択</summary>
            <div class="btn-container">
              <button id="datasetLoadBtn" data-type="primary" data-action="Tab2.loadData">データを読込</button>
              <button id="datasetFilterBtn" data-type="primary" class="outline" data-action="Tab2.filterData" disabled>データを確定</button>
            </div>
            <div id="datasetLoadBar" class="status-bar" data-status="hidden"></div>
            <div id="datasetArea" style="display: none;">
              <label>dataset選択</label>
              <div id="datasetBox" class="checkbox-container"></div>
            </div>
          </details>
          <hr>
          <!-- シンボル層 -->
          <details id="symbolSection" data-type="disabled">
            <summary>シンボル設定</summary>
            <div class="btn-container">
              <button id="symbolBtn" data-type="primary" data-action="Tab2.setSymbolMap" disabled>シンボル確定</button>
            </div>
            <select id="symbolAxis" data-bind="Tab2ST.symbol.baseKey" disabled>
              <option value="dataset" selected>dataset</option>
              <option value="item">item</option>
              <option value="Group">Group</option>
              <option value="Source">Source</option>
            </select>
            <div id="symbolArea" style="display: none;">
              <label style="margin-top: 12px;">シンボル設定</label>
              <div id="symbolBox"></div>
            </div>
          </details>
          <hr>
          <!-- レポート層 -->
          <details id="reportSection" data-type="disabled">
            <summary>レポート作成</summary>
            <div class="btn-container">
              <button id="reportOpenBtn" data-type="primary" data-action="Tab2.openReport">PDF用レポートを作成</button>
            </div>
            <div id="reportStatusBar" class="status-bar" data-status="hidden"></div>
          </details>
        </fieldset>
      </div>
    </main>

    <!-- HTML5 Native Dialog -->
    <dialog id="universalConfirm">
      <h3 id="uDialogTitle">確認</h3>
      <p id="uDialogMessage"></p>
      <div class="btn-container">
        <button id="uDialogCancelBtn" data-type="primary" class="outline">キャンセル</button>
        <button id="uDialogConfirmBtn" data-type="primary">OK</button>
      </div>
    </dialog>

    <!-- 動的生成要素 (テンプレート) -->
    <template id="selectorTemplate">
      <label class="field-label">
        <select class="field-select">
          <option value="" class="empty-opt" selected>---未選択---</option>
        </select>
      </label>
    </template>

    <template id="checkboxTemplate">
      <label class="checkbox-item">
        <input type="checkbox" class="dataset-cb" checked>
        <span class="cb-text"></span>
      </label>
    </template>

    <template id="selectAllTemplate">
      <label class="checkbox-item select-all">
        <input type="checkbox" id="selectAll" checked>
        <span>すべて選択</span>
      </label>
    </template>

    <template id="symbolRowTemplate">
      <div class="symbol-row">
        <select data-symbol-type="target" class="symbol-target">
          <option value="" selected>未選択</option>
        </select>
        <select data-symbol-type="shape" class="symbol-shape"></select>
        <select data-symbol-type="color" class="symbol-color"></select>
      </div>
    </template>

    <?!= include('Model'); ?>
    <?!= include('Method'); ?>
    <?!= include('View'); ?>
    <?!= include('Controller'); ?>
    <?!= include('Event'); ?>
  </body>
</html>
