<!DOCTYPE html>
<!-- Sidebar.html -->
<html>
  <head>
    <base target="_top">
    <?!= include("CSS"); ?>
  </head>
  <body>
    <!-- ナビゲーション -->
    <nav class="nav-tabs" id="nav">
      <button class="tab-btn active" data-target="tab1">Data</button>
      <button class="tab-btn" data-target="tab2" style="color: var(--primary-green);">Chart</button>
    </nav>

    <main>
      <!-- 第1タブ -->
      <div id="tab1" class="tab-content active">
        <fieldset id="tab1Fieldset" style="border: none; padding: 0;">
          
          <div id="configAreaContainer">
            <label>モード選択
              <select id="configExacMode" data-field="configExacMode">
                <option value="Dual">Dualモード</option>
                <option value="Single">Singleモード</option>
              </select>
            </label>
            <div id="configStatusBar" class="mt-2"></div>
          </div>
          <hr>
          
          <div id="fileAreaContainer">
            <div class="flex-row">
              <button id="fileLoadBtn" class="btn-blue" onclick="Ctrl.loadFile()">データを取得</button>
              <span class="txt-btninfo">読込シート「File」</span>
            </div>
            <div id="fileStatusBar" class="mt-2"></div>
            
            <details id="fileMapArea" style="display: none;" class="map-content">
              <summary>列を選択する</summary>
              <div id="fileMapBox"></div>
            </details>
            
            <div id="fileBtnArea" class="btn-container">
              <button id="fileMakeBtn" class="btn-blue sub" style="display: none;" onclick="Ctrl.makeFileList()" disabled>リスト生成</button>
              <button id="fileValdBtn" class="btn-blue sub" style="display: none;" onclick="Ctrl.validateFileList()" disabled>検証</button>
            </div>
          </div>
          <hr>
          
          <div id="extractAreaContainer">
            <div class="flex-row">
              <button id="exacBtn" class="btn-blue" onclick="Ctrl.extractFile()" disabled>データを抽出</button>
              <span class="txt-btninfo" id="exacInfoTxt">読込シート「Results」</span>
            </div>
            <div id="exacStatusBar" class="mt-2"></div>
            
            <details id="exacMapBox" style="display: none;" class="map-content">
              <summary>データ属性</summary>
              <div>
                <label>dataset *必須
                  <input type="text" data-field="dataset" placeholder="データセット・遺跡名">
                </label>
                <label>item
                  <input type="text" data-field="item" placeholder="計測情報（任意）">
                </label>
                <label>date
                  <input type="text" data-field="date" placeholder="計測日（任意）">
                </label>
              </div>
            </details>
            
            <div id="exacBtnArea" class="btn-container">
              <button id="exacPushBtn" class="btn-blue sub" style="display: none;" onclick="Ctrl.pushExacData()" disabled>PXRFに格納</button>
            </div>
          </div>
        </fieldset>
      </div>

      <!-- 第2タブ -->
      <div id="tab2" class="tab-content">
        <fieldset id="tab2Fieldset" style="border: none; padding: 0;">
          <div id="datasetAreaContainer">
            <label>可視化データ設定</label>
            <div class="btn-container">
              <button id="datasetLoadBtn" class="btn-green" onclick="Ctrl.getTab2Data('load')">読込</button>
              <button id="datasetFilterBtn" class="btn-green sub" onclick="Ctrl.getTab2Data('filter')" disabled>確定/更新</button>
            </div>
            <div id="datasetLoadBar" class="mt-2"></div>
            
            <details id="dataSetArea">
              <summary>dataset選択</summary>
              <div id="dataSetBOX" style="max-height: 120px; overflow-y: auto; padding: 6px; border: 1px solid #ccc; border-radius: 4px; margin-top: 4px;"></div>
            </details>
          </div>
          <hr>

          <div id="symbolAreaContainer">
            <div class="btn-container">
              <button id="symbolBtn" class="btn-green" onclick="Ctrl.confirmSymbolMapping()" disabled>シンボル確定</button>
            </div>
            <details id="symbolMapArea" style="display: none;">
              <summary>マーカー設定 (シンボルマッピング)</summary>
              <div id="symbolAxisBox" style="margin-bottom: 8px;"></div>
              <div id="symbolMapBox"></div>
            </details>
          </div> 
          <hr>
          
          <div class="btn-container">
            <button id="reportOpenBtn" class="btn-green" onclick="Ctrl.openReport()">PDF用レポートを作成</button>
          </div>
          <div id="reportStatusBar" class="mt-2"></div>
        </fieldset>
      </div>
    </main>

    <!-- HTML5 Native Dialog -->
    <dialog id="universalConfirm">
      <h3 id="uDialogTitle">確認</h3>
      <p id="uDialogMessage" style="margin: 12px 0; font-size: 13px;"></p>
      <div class="btn-container">
        <button id="uDialogCancelBtn" class="btn-blue sub">キャンセル</button>
        <button id="uDialogConfirmBtn" class="btn-blue">OK</button>
      </div>
    </dialog>

    <?!= include('Model'); ?>
    <?!= include('Method'); ?>
    <?!= include('View'); ?>
    <?!= include('Controller'); ?>
    <?!= include('Event'); ?>
  </body>
</html>
