<!-- Sidebar.html -->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <!-- 統計計算ライブラリ (simple-statistics) -->
    <script src="https://cdn.jsdelivr.net/npm/simple-statistics@7.8.3/dist/simple-statistics.min.js"></script>
    <!-- グラフ描画ライブラリ (Apache ECharts) -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script>google.charts.load('current', {'packages':['corechart']});</script>
    <?!= include("CSS"); ?>
  </head>
  <body data-theme="tab1">
    <!-- ナビゲーション -->
    <nav class="nav-tabs" id="nav">
      <button class="tab-btn active" data-target="tab1">データ抽出</button>
      <button class="tab-btn" data-target="tab2">グラフ作成</button>
    </nav>

    <main>
      <!-- 第1タブ -->
      <div id="tab1" class="tab-content active">
        <fieldset id="tab1Fieldset">
          <!-- 設定層 -->
          <details id="configSection" data-state="active" open>
            <summary>設定</summary>
            <div id="configArea">
              <div id="configModeBox"></div>
            </div>
          </details>
          <div id="configStatusBar" class="status-bar" data-status="hidden"></div>
          <hr>
          <!-- ファイル層 -->
          <details id="fileSection" data-type="disabled">
            <summary>読込と検証</summary>
            <div class="flex-row">
              <button id="fileLoadBtn" data-type="primary" data-action="Tab1.loadFile">データを取得</button>
              <span class="txt-btninfo">読込シート「File」</span>
            </div>
            <div id="fileArea" style="display: none;">
              <div id="fileBox"></div>
            </div>
            <div id="fileBtnArea" class="field-row" style="display: none;">
              <button id="fileMakeBtn" data-type="primary" class="outline" data-action="Tab1.makeFileList" disabled>リスト生成</button>
              <button id="fileValdBtn" data-type="primary" class="outline" data-action="Tab1.validateFileList" disabled>検証</button>
            </div>
          </details>
          <div id="fileStatusBar" class="status-bar" data-status="hidden"></div>
          <hr>
          <!-- 抽出層 -->
          <details id="exacSection" data-type="disabled">
            <summary>抽出と格納</summary>
            <div class="flex-row">
              <button id="exacBtn" data-type="primary" data-action="Tab1.extractFile" disabled>データを抽出</button>
              <span class="txt-btninfo" id="exacInfoTxt">読込シート「Results」</span>
            </div>
            <div id="exacArea" style="display: none;">
              <div id="exacBox"></div>
            </div>
            <div id="exacBtnArea" class="field-row">
              <button id="exacPushBtn" data-type="primary" class="outline" style="display: none;" data-action="Tab1.pushExacData" disabled>PXRFに格納</button>
            </div>
          </details>
          <div id="exacStatusBar" class="status-bar" data-status="hidden"></div>
        </fieldset>
      </div>

      <!-- 第2タブ -->
      <div id="tab2" class="tab-content">
        <fieldset id="tab2Fieldset">
          <!-- dataset層 -->
          <details id="datasetSection" open>
            <summary>データ読込・選択</summary>
            <div id="datasetArea" style="display: none;">
              <label>dataset選択</label>
              <div id="datasetBox"></div>
            </div>
            <div class="field-row">
              <button id="datasetLoadBtn" data-type="primary" data-action="Tab2.loadData">データを読込</button>
              <button id="datasetFilterBtn" data-type="primary" class="outline" data-action="Tab2.filterData" disabled>データを確定</button>
            </div>
          </details>
          <div id="datasetLoadBar" class="status-bar" data-status="hidden"></div>
          <hr>
          <!-- シンボル層 -->
          <details id="symbolSection" data-type="disabled">
            <summary>シンボル設定</summary>
            <div id="symbolArea" style="display: none;">
              <label>属性選択</label>
            <div id="symbolAxisBox"></div>
              <label>シンボル設定</label>
              <div id="symbolBox"></div>
            </div>
            <div class="field-row">
              <button id="symbolBtn" data-type="primary" data-action="Tab2.setSymbolMap" disabled>シンボル確定</button>
            </div>
          </details>
          <div id="symbolStatusBar" class="status-bar" data-status="hidden"></div>
          <hr>
          <!-- 補正＆プレビュー層 -->
          <details id="previewSection" data-type="disabled">
            <summary>補正＆プレビュー</summary>
            <div id="previewArea">
              <div id="previewChartBox"></div>
              <div id="previewStatsTable"></div>
              <div class="field-row">
                <div class="field-col">
                  <label>プレビュー値</label>
                  <div id="previewValueBox"></div>
                </div>
                <div class="field-col">
                  <label>補正方法</label>
                  <div id="previewCorrectionBox"></div>
                </div>
              </div>
              <div class="field-row">
                <button id="previewMakeBtn" data-type="primary" data-action="Tab2.makePreview" disabled>プレビュー更新</button>
              </div>
              <label>Obsidianモード計測値</label>
              <div id="previewModeBox"></div>
              <label>対象Item</label>
              <div id="previewItemBox"></div>
            </div>
          </details>
          <div id="previewBar" class="status-bar" data-status="hidden"></div>
          <hr>
          <!-- レポート層 -->
          <details id="reportSection" data-type="disabled">
            <summary>レポート作成</summary>
            <div class="field-row">
              <button id="reportOpenBtn" data-type="primary" data-action="Tab2.openReport">PDF用レポートを作成</button>
            </div>
            <div id="reportStatusBar" class="status-bar" data-status="hidden"></div>
          </details>
        </fieldset>
      </div>
    </main>

    <!-- HTML5 Native Dialog -->
    <dialog id="universalConfirm">
      <h3 id="uDialogTitle">確認</h3>
      <p id="uDialogMessage"></p>
      <div class="field-row">
        <button id="uDialogCancelBtn" data-type="primary" class="outline">キャンセル</button>
        <button id="uDialogConfirmBtn" data-type="primary">OK</button>
      </div>
    </dialog>

    <!-- 動的生成要素 (テンプレート) -->
    <template id="selectorTemplate">
      <label class="field-label">
        <select class="field-select">
          <option value="" class="empty-opt" selected>---未選択---</option>
        </select>
      </label>
    </template>
    <template id="inputTemplate">
      <label class="field-label">
        <input type="text" class="field-input">
      </label>
    </template>
    <template id="checkboxTemplate">
      <label class="checkbox-item">
        <input type="checkbox" class="dataset-cb" data-change="Tab2.toggleDataset" checked>
        <span class="cb-text"></span>
      </label>
    </template>
    <template id="checkAllTemplate">
      <label class="checkbox-item select-all">
        <input type="checkbox" id="selectAll" data-change="Tab2.toggleAllDataset" checked>
        <span>すべて選択</span>
      </label>
    </template>
    <template id="symbolRowTemplate">
      <div class="symbol-row">
        <select data-symbol-type="target" class="symbol-target">
          <option value="" selected>未選択</option>
        </select>
        <select data-symbol-type="shape" class="symbol-shape"></select>
        <select data-symbol-type="color" class="symbol-color"></select>
      </div>
    </template>
    <template id="previewModeTemplate">
      <div class="radio-row">
        <span class="radio-label"></span>
        <div class="radio-group">
          <label class="radio-item">
            <input type="radio" value="obsidian"> obsidian
          </label>
          <label class="radio-item">
            <input type="radio" value="mudrock"> mudrock
          </label>
        </div>
      </div>
    </template>
    <template id="statsContainerTemplate">
      <div class="stats-container">
        <div class="stats-grid"></div>
      </div>
    </template>
    <template id="statsRowTemplate">
      <div class="stats-label"></div>
      <div class="stats-val"></div>
    </template>
    <template id="multiSelectTemplate">
      <div class="multi-select-wrapper">
        <button class="multi-select-summary"></button>
        <div class="multi-select-options checkbox-container" popover="auto"></div>
      </div>
    </template>

    <?!= include('Model'); ?>
    <?!= include('Method'); ?>
    <?!= include('Component'); ?>
    <?!= include('Chart'); ?>
    <?!= include('View'); ?>
    <?!= include('Controller'); ?>
    <?!= include('Event'); ?>
  </body>
</html>
