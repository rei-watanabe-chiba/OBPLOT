<!DOCTYPE html>
<!-- Sidebar.html -->
<html>
  <head>
    <base target="_top">
    <?!= include("CSS"); ?>
  </head>
  <body>
    <!-- ナビゲーション -->
    <nav class="nav-tabs" id="nav">
      <button class="tab-btn active blue" data-target="tab1">Data</button>
      <button class="tab-btn green" data-target="tab2">Chart</button>
    </nav>

    <main>
      <!-- 第1タブ -->
      <div id="tab1" class="tab-content active">
        <fieldset id="tab1Fieldset">
          <div id="configAreaContainer">
            <label>モード選択
              <select id="configExacMode" data-field="configExacMode">
                <option value="Dual">Dualモード</option>
                <option value="Single">Singleモード</option>
              </select>
            </label>
            <div id="configStatusBar"></div>
          </div>
          <hr>
          
          <div id="fileAreaContainer">
            <div class="flex-row">
              <button id="fileLoadBtn" data-variant="blue" onclick="Ctrl.loadFile()">データを取得</button>
              <span class="txt-btninfo">読込シート「File」</span>
            </div>
            <div id="fileStatusBar"></div>
            <details id="fileMapArea" style="display: none;">
              <summary>列を選択する</summary>
              <div id="fileMapBox"></div>
            </details>
            <div id="fileBtnArea" class="btn-container" style="display: none;">
              <button id="fileMakeBtn" data-variant="blue" class="outline" onclick="Ctrl.makeFileList()" disabled>リスト生成</button>
              <button id="fileValdBtn" data-variant="blue" class="outline" onclick="Ctrl.validateFileList()" disabled>検証</button>
            </div>
          </div>
          <hr>
          
          <div id="extractAreaContainer">
            <div class="flex-row">
              <button id="exacBtn" data-variant="blue" onclick="Ctrl.extractFile()" disabled>データを抽出</button>
              <span class="txt-btninfo" id="exacInfoTxt">読込シート「Results」</span>
            </div>
            <div id="exacStatusBar"></div>
            <details id="exacMapBox" style="display: none;">
              <summary>データ属性</summary>
              <div>
                <label>dataset *必須
                  <input type="text" data-field="dataset" placeholder="データセット・遺跡名">
                </label>
                <label>item
                  <input type="text" data-field="item" placeholder="計測情報（任意）">
                </label>
                <label>date
                  <input type="text" data-field="date" placeholder="計測日（任意）">
                </label>
              </div>
            </details>
            <div id="exacBtnArea" class="btn-container">
              <button id="exacPushBtn" data-variant="blue" class="outline" style="display: none;" onclick="Ctrl.pushExacData()" disabled>PXRFに格納</button>
            </div>
          </div>
        </fieldset>
      </div>

      <!-- 第2タブ -->
      <div id="tab2" class="tab-content">
        <fieldset id="tab2Fieldset">
          <div id="datasetAreaContainer">
            <label>可視化データ設定</label>
            <div class="btn-container">
              <button id="datasetLoadBtn" data-variant="green" onclick="Ctrl.getTab2Data('load')">読込</button>
              <button id="datasetFilterBtn" data-variant="green" class="outline" onclick="Ctrl.getTab2Data('filter')" disabled>確定/更新</button>
            </div>
            <div id="datasetLoadBar"></div>
            
            <details id="dataSetArea">
              <summary>dataset選択</summary>
              <div id="dataSetBOX"></div>
            </details>
          </div>
          <hr>

          <div id="symbolAreaContainer">
            <div class="btn-container">
              <button id="symbolBtn" data-variant="green" onclick="Ctrl.confirmSymbolMapping()" disabled>シンボル確定</button>
            </div>
            <details id="symbolMapArea" style="display: none;">
              <summary>マーカー設定 (シンボルマッピング)</summary>
              <div id="symbolAxisBox"></div>
              <div id="symbolMapBox"></div>
            </details>
          </div> 
          <hr>
          
          <div class="btn-container">
            <button id="reportOpenBtn" onclick="Ctrl.openReport()">PDF用レポートを作成</button>
          </div>
          <div id="reportStatusBar"></div>
        </fieldset>
      </div>
    </main>

    <!-- HTML5 Native Dialog -->
    <dialog id="universalConfirm">
      <h3 id="uDialogTitle">確認</h3>
      <p id="uDialogMessage"></p>
      <div class="btn-container">
        <button id="uDialogCancelBtn" data-variant="blue" class="outline">キャンセル</button>
        <button id="uDialogConfirmBtn" data-variant="blue">OK</button>
      </div>
    </dialog>

    <?!= include('Model'); ?>
    <?!= include('Method'); ?>
    <?!= include('View'); ?>
    <?!= include('Controller'); ?>
    <?!= include('Event'); ?>
  </body>
</html>
