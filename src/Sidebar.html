<!DOCTYPE html>
<!-- サイドバーbody -->
<html>
  <head>
    <base target="_top">
    <?!= include("CSS"); ?> <!-- CSS読込 -->
  </head>
  <body>
    <!-- ナビゲーション -->
    <nav class="nav" id="nav">
      <button class="tab-btn" data-target="tab1">Data</button>
      <button class="tab-btn --green" data-target="tab2">Chart</button>
    </nav>

    <main class="content-area">
      <!-- データ処理 -->
      <div id="tab1" class="tab-content">
        <fieldset id="tab1Fieldset" style="border: none; padding: 0; margin: 0;">
          
          <!-- 第1層: 設定エリア -->
          <div id="configAreaContainer">
            <div id="configMapArea">
              <div class="field-row">
                <label class="input-label">モード選択</label>
                <div class="select-wrapper">
                  <select class="input-select" data-field="configExacMode">
                    <option value="Dual">Dualモード</option>
                    <option value="Single">Singleモード</option>
                  </select>
                </div>
              </div>
              <div id="configStatusBar" class="status-bar loading"></div>
            </div>
          </div>
          <hr class="section-hr">
          
          <!-- 第2層: ファイル処理エリア -->
          <div id="fileAreaContainer">
            <!-- メインボタン -->
            <button id="fileLoadBtn" class="action-btn" title="Fileシートを内部データに格納" onclick="Ctrl.loadFile()">データを取得</button>
            <span class="txt-btninfo">読込シート「File」</span>
            <div id="fileStatusBar" class="status-bar"></div>
            <!-- 列選択（初期非表示） -->
            <details id="fileMapArea" style="display: none;">
              <summary class="mapping-title">列を選択する</summary>
              <div id="fileMapBox"></div>
            </details>
            <!-- ボタン群（初期非表示） -->
            <div id="fileBtnArea" class="action-btn-container">
              <button id="fileMakeBtn" class="action-btn --sub" style="display: none;" onclick="Ctrl.makeFileList()" disabled>リスト生成</button>
              <button id="fileValdBtn" class="action-btn --sub" style="display: none;" onclick="Ctrl.validateFileList()" disabled>検証</button>
            </div>
          </div>
          <hr class="section-hr">
          
          <!-- 第3層: 抽出エリア -->
          <div id="extractAreaContainer">
            <button id="exacBtn" class="action-btn" title="Resultsからファイルを抽出" onclick="Ctrl.extractFile()" disabled>データを抽出</button>
            <span class="txt-btninfo" id="exacInfoTxt">読込シート「Results」</span>
            <div id="exacStatusBar" class="status-bar"></div>
            <!-- データ属性（初期非表示） -->
            <details id="exacMapBox" style="display: none;">
              <summary class="mapping-title">データ属性</summary>
              <div class="field-row">
                <div class="input-wrapper">
                  <label class="input-label">dataset *必須</label>
                  <input type="text" class="input-text" data-field="dataset" placeholder="データセット・遺跡名（必須）">
                  <label class="input-label">item</label>
                  <input type="text" class="input-text" data-field="item" placeholder="計測情報（任意）">
                  <label class="input-label">date</label>
                  <input type="text" class="input-text" data-field="date" placeholder="date - 計測日（任意）">
                </div>
              </div>
            </details>
            <!-- ボタン群（初期非表示） -->
            <div id="exacBtnArea" class="action-btn-container">
              <button id="exacPushBtn" class="action-btn --sub" title="抽出データをPXRFに格納" style="display: none;" onclick="Ctrl.pushExacData()" disabled>PXRFに格納</button>
            </div>
          </div>

        </fieldset>
      </div>

      <!-- チャート表示 -->
      <div id="tab2" class="tab-content">
        <fieldset id="tab2Fieldset" style="border: none; padding: 0; margin: 0;">
          <!-- 第1層: データセット設定 -->
          <div id="datasetAreaContainer">
            <label class="input-label">可視化データ設定</label>
            <div id="datasetBtnArea" class="action-btn-container">
              <button id="datasetLoadBtn" class="action-btn --green" onclick="Ctrl.getTab2Data('load')">読込</button>
              <button id="datasetFilterBtn" class="action-btn --green --sub" onclick="Ctrl.getTab2Data('filter')" disabled>確定/更新</button>
            </div>
            <div id="datasetLoadBar" class="status-bar"></div>
            <details id="dataSetArea">
              <summary class="mapping-title">dataset選択</summary>
                <div id="dataSetBOX" class="checkbox-container"></div>
            </details>
          </div>
          <hr class="section-hr">

          <!-- 第2層: シンボルマッピング -->
          <div id="symbolAreaContainer">
            <div class="action-btn-container">
              <button id="symbolBtn" class="action-btn --green" onclick="Ctrl.confirmSymbolMapping()" disabled>シンボル確定</button>
            </div>
            <details id="symbolMapArea" style="display: none;">
              <summary class="mapping-title">マーカー設定 (シンボルマッピング)</summary>
              <div id="symbolAxisBox" style="margin-bottom: 10px;"></div>
              <div id="symbolMapBox"></div>
            </details>
          </div> 
          <hr class="section-hr">
          <!-- 別タブ出力テスト用 -->
          <div class="action-btn-container">
            <button id="reportOpenBtn" class="action-btn --green" onclick="Ctrl.openReport()">PDF用レポートを作成</button>
          </div>
          <div id="reportStatusBar" class="status-bar"></div>        
        </fieldset>
      </div>
    </main>

    <!-- 各層の読込 -->
    <?!= include('Model'); ?>
    <?!= include('Method'); ?>
    <?!= include('View'); ?>
    <?!= include('Controller'); ?>
    <?!= include('Event'); ?>
  </body>
</html>
