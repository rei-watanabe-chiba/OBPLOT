<script>


  // --- 設定定数定義 ---
  // --- **GLB内は認知度向上のためにプロパティ名・コメントアウトの文字数制限撤廃** ---
  // --- **リファクタリング時も既存コメントアウトを絶対保持すること** ---
  // ▼ 出力値：key: PXRF-WDXRF紐づけのキー, p: 計測情報, wd: 産地情報（ヘッダに連動）
  const GLBidx = { key1: "database", key2: "ID", p1: "item", p2: "date", wd1: "Group", wd2: "Source" };
  const GLB = {
    idx: GLBidx,
    // ▼ valElms に元素を追加可能, valLgc に指数追加可能
    // 可視化元素指定 ---------------
    valElms: ["Al", "Si", "P", "K", "Ca", "Ti", "Mn", "Fe", "Rb", "Sr", "Y", "Zr", "Nb", "Ba"],
    // 可視化指数指定（math.jsで計算可能な文字列で指定） ---------------
    valLgc: ["Mn * 100 / Fe", "Rb/(Rb+Sr+Y+Zr)*100", "log10(Fe/K)", "Sr/(Rb+Sr+Y+Zr)*100"],
    // オプション元素（def: mudrock, opt: obsidian） ---------------
    optElms: ["Mn", "Fe", "Rb", "Sr", "Y", "Zr", "Nb"],
    // ▼ グラフの見た目は以下で変更可能
    // シンボル定義（valはecharts準拠を調べること) ---------------
    symbShapes: [{ val: 'emptyCircle', label: '○' }, { val: 'circle', label: '●' }, { val: 'triangle', label: '▲' }, { val: 'square', label: '■' }, { val: 'cross', label: '✖' }],
    // シンボルカラー定義（valはCSS準拠) ---------------
    symbColors: [{ val: 'var(--grey600)', label: 'Gray' }, { val: 'var(--text-main)', label: 'Black' }, { val: 'var(--main-blue)', label: 'Blue' }, { val: 'var(--main-green)', label: 'Green' }, { val: 'var(--main-red)', label: 'Red' }, { val: '#fbbc04', label: 'Yellow' }],
    // シンボルデフォルト値
    symbBaseKey: GLBidx.key1, symbDefShp: "emptyCircle", symbDefClr: "var(--grey600)",
    wdxrfDefClr: "var(--grey400)",
    // フォント選択用リスト
    fontEngList: ["Roboto", "Arial", "Helvetica", "Times New Roman"],
    fontJpList: ["Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", "MS PGothic"],
    // グラフデフォルト設定 ---------------
    defGraphStyle: {
      font: "'Roboto', 'Noto Sans JP', sans-serif",
      fontS: { tick: 10, name: 11, stats: 10, tip: 11 },
      fontC: { base: 'var(--grey600)', stats: 'var(--grey600)', tip: 'var(--text-main)' },
      symbol: { baseSize: 6, pathSize: 7, borderW: 1 },
      lineW: { grid: 0.3, axis: 0.8, regW: 0.6, regD: [5, 5] },
      lineC: { grid: 'var(--grey200)', axis: 'var(--grey400)', reg: 'var(--grey600)' },
      bgPlot: 'transparent', bgOuter: 'transparent', bgTip: 'rgba(255,255,255,0.95)'
    },
    // グラフ余白
    defGraphGap: { tick: 5, name: 5, padT: 0, padB: 0, padL: 0, padR: 0 },
    // ツールチップ表示項目（GLBidxベースで'計測ID','item','date'も対応） ---------------
    tooltipKeys: [GLBidx.key1, GLBidx.key2, GLBidx.wd1],

    // 以降は処理フロー・UI用定数のため編集不可（出力値はUIに連動）
    validModes: ["mudrock", "obsidian"],
    obsidianIndex: { "Mn":16, "Fe":18, "Rb":24, "Sr":26,"Y":28, "Zr":30, "Nb":32 },
    mudrockIndex: { "Al":18, "Si":20, "P":22, "K":28, "Ca":30, "Ti":32, "Mn":38, "Fe":40, "Rb":56, "Sr":58, "Y":60, "Zr":62, "Nb":64, "Ba":68 },
    rawShts: { file: "File", results: "Results", tracer5i: "tracer5i", wdxrf: "WDXRF" },
    appShts: { filelist: "ファイルリスト", extract: "抽出データ", crct: "Correction", pxrf: "PXRF" },
    initFlags: { raw: [true, true, true, false, false], extr: [true, false, false] },
    extrFields: [
      { key: GLBidx.key1, label: `${GLBidx.key1} *必須`, placeholder: "データセット名", bind: `ENTST.EXTR.refs.${GLBidx.key1}` },
      { key: GLBidx.p1, label: GLBidx.p1, placeholder: "計測情報", bind: `ENTST.EXTR.refs.${GLBidx.p1}` },
      { key: GLBidx.p2, label: GLBidx.p2, placeholder: "計測日", bind: `ENTST.EXTR.refs.${GLBidx.p2}` }
    ],
    symbAxes: [{ val: GLBidx.key1, label: GLBidx.key1 }, { val: GLBidx.p1, label: GLBidx.p1 }, { val: GLBidx.wd1, label: GLBidx.wd1 }, { val: GLBidx.wd2, label: GLBidx.wd2 }],
    fileFields: [
      { key: "file", label: "file *必須", required: true }, { key: "mode", label: "mode *必須", required: true },
      { key: GLBidx.key2, label: `${GLBidx.key2} *必須`, required: true }, { key: "sub_id", label: "sub_id", required: false }, { key: "info", label: "info", required: false }
    ],
    confMods: [{ val: "", label: "モードを選択", disabled: true, hidden: true }, { val: "Dual", label: "Dualモード" }, { val: "Single", label: "Singleモード" }],
    schema: {
      ent: [
        { name: 'ファイルリスト', hdrType: 'filelist', clr: true },
        { name: 'File' }, { name: 'Results' },
        { name: '抽出データ', hdrType: 'tracer5i', clr: true },
        { name: 'tracer5i', hdrType: 'tracer5i', lock: true, validRule: 'tracer5i' }
      ],
      adp: [
        { name: 'tracer5i', hdrType: 'tracer5i', lock: true, validRule: 'tracer5i' },
        { name: 'WDXRF', hdrType: 'wdxrf', lock: true, validRule: 'wdxrf' },
        { name: 'Correction', hdrType: 'crct', lock: true, validRule: 'crct' },
        { name: 'PXRF', hdrType: 'pxrf', lock: true, validRule: 'pxrf' }
      ],
      dash: [
        { name: 'PXRF', hdrType: 'pxrf', lock: true, validRule: 'pxrf' },
        { name: 'WDXRF', hdrType: 'wdxrf', lock: true, validRule: 'wdxrf' },
        { name: 'Correction', hdrType: 'crct', lock: true, validRule: 'crct' }
      ]
    }
  };
  GLB.schema.entry = GLB.schema.ent;
  GLB.schema.adapter = GLB.schema.adp;



  // --- フェーズ定義 ---
  const ENT_PHS = { INIT: 1, READY: 2, LOAD: 3, INVALID: 4, VALID: 5, EXTRACT: 6, OUTPUT: 7 };
  const ADP_PHS = { INIT: 1, LOADED: 2, FILTERED: 3, MAPPED: 4, PREVIEWED: 5 };
  const DASH_PHS = { INIT: 1, LOADED: 2 };
  // --- AppSt ---
  class AppSt {
    #state; #initialState; #listeners; #updating;
    // --- セクション単位のstate生成 ---
    constructor() {
      const createSec = (overrides = {}) => ({ status: [], data: null, refs: {}, flags: [], ...overrides });
      const initDef = {
        GLB: { 
          activeTab: "ent", isLocked: false, ssId: "",
          dialog: { isOpen: false, type: "confirm", title: "", msg: "" }
        },
        ENTST: {
          phase: ENT_PHS.INIT,
          PREF: createSec({ refs: { mode: "" }, data: { modeOpts: GLB.confMods } }),
          RAW:  createSec({ flags: GLB.initFlags.raw, data: { hdrOpts: [] } }),
          EXTR: createSec({ refs: { [GLB.idx.key1]: "", [GLB.idx.p1]: "", [GLB.idx.p2]: "" }, flags: GLB.initFlags.extr })
        },
        ADPST: {
          phase: ADP_PHS.INIT,
          ASGN: createSec({ data: { crctDT: [], wrapPXRF: null, wrapWDXRF: null, pxrfDT: null, wdxrfDT: null }, refs: { available: [], filter: [] } }),
          SYMB: createSec({ refs: { baseKey: GLB.symbBaseKey, rls: [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }] }, data: { axisOpts: GLB.symbAxes } }),
          CALB: createSec({ refs: { modeMap: [...GLB.optElms], calElms: [...GLB.valElms], crct: "new", useLOD: false, useCal: false }, data: { modeOpts: GLB.optElms, calElmOpts: GLB.valElms, crctOpts: [] } }),
          PREV: createSec({ refs: { itemMap: [], val: GLB.valLgc.length ? GLB.valLgc[0] : GLB.valElms[0], saveIndexName: "" }, data: { crctLogic: {}, prevDT: null, statsDT: null, chartSrc: null, valOpts: [...GLB.valElms, ...GLB.valLgc].map(v => ({ label: v, val: v })) } }),
          STDZ: createSec({ refs: { itemMap: [], modeMap: [...GLB.optElms], useLOD: false, saveIndexName: "" }, data: { modeOpts: GLB.optElms } })
        },
        DashST: {
          phase: DASH_PHS.INIT,
          INST: createSec({ data: { pxrfDT: null, wdxrfDT: null, crctDT: null } }),
          REPO: createSec({ 
            refs: { useFav: false, selectedFav: "", favInputName: "" },
            data: { 
              favList: [], 
              favInputInvalid: false, 
              favOverwriteTarget: "", 
              favSuccessTarget: "",
              favBtnText: "新規登録",
              favTableSrc: null
            } 
          }),
          gph: { style: GLB.defGraphStyle, gap: GLB.defGraphGap }
        },
        // 【追加】レポート専用のステートマシン
        RPTST: {
          phase: 1,
          dataset: {
            raw: { pxrfDT: [], wdxrfDT: [], crctDT: [] },
            filters: { db: [], item: [], group: [] },
            crct: "new",
            calElms: [...GLB.valElms],
            useCal: false,
            useLOD: false,
            baseScales: { auto: {}, fixed: {} },
            rowPlotH: null
          },
          config: {
            boardMode: "calib",
            layout: { gridRows: 1, gridCols: 1, panelGap: 4, rowAspect: [1.0, 1.0, 1.0] },
            theme: {},
            symbology: { baseKey: GLB.symbBaseKey, rls: [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }] }
          },
          panels: [],
          ui: {
            activeTab: "tabLayout",
            activeSub: "subFont",
            activePanelId: "p_0",
            activePanelScaleMode: "auto",
            linkCanvasMargin: false,
            linkPanelMargin: false,
            exportStatus: "message",
            exportDesc: "",
            copyStatus: "message",
            copyDesc: "",
            optFields: {}
          }
        }
      };
      this.#initialState = JSON.parse(JSON.stringify(initDef));
      this.#state = JSON.parse(JSON.stringify(initDef));
      this.#listeners = {};
    }
    // --- Proxy取得 ---
    get proxy() { return this.#state; }
    // --- State取得 ---
    get(paths) {
      const res = p => (Array.isArray(p) ? p : p.split('.')).reduce((o, k) => o?.[k], this.#state);
      return Array.isArray(paths) ? paths.map(res) : res(paths);
    }
    // --- State設定 ---
    set(updates, v) {
      if (typeof updates === 'object' && !Array.isArray(updates)) return Object.entries(updates).forEach(([k, val]) => this.set(k, val));
      const pathStr = Array.isArray(updates) ? updates.join('.') : updates;
      const keys = pathStr.split('.');
      const last = keys.pop();
      const tgt = keys.reduce((o, k) => o[k] ??= {}, this.#state);
      
      if (tgt[last] !== v) {
        tgt[last] = v;
        
        // 循環更新（無限ループ）ガード
        this.#updating ??= new Set();
        if (this.#updating.has(pathStr)) return;
        this.#updating.add(pathStr);
        
        try {
          this.#listeners[pathStr]?.forEach(cb => cb(v));
          Object.keys(this.#listeners).forEach(listenerPath => {
            if (listenerPath.startsWith(`${pathStr}.`)) {
              const childVal = listenerPath.split('.').reduce((o, k) => o?.[k], this.#state);
              this.#listeners[listenerPath].forEach(cb => cb(childVal));
            }
            if (pathStr.startsWith(`${listenerPath}.`)) {
              const parentVal = listenerPath.split('.').reduce((o, k) => o?.[k], this.#state);
              this.#listeners[listenerPath].forEach(cb => cb(parentVal));
            }
          });
          this.#listeners['*']?.forEach(cb => cb());
        } finally {
          this.#updating.delete(pathStr);
        }
      }
    }
    // --- 変更購読 ---
    subscribe(path, cb) {
      if (Array.isArray(path)) return path.forEach(p => this.subscribe(p, cb));
      this.#listeners[path] ??= [];
      if (!this.#listeners[path].includes(cb)) this.#listeners[path].push(cb);
    }
    // --- State初期化 ---
    reset(paths) {
      const updates = {};
      (Array.isArray(paths) ? paths : [paths]).forEach(p => {
        const initVal = p.split('.').reduce((o, k) => o?.[k], this.#initialState);
        updates[p] = initVal !== undefined ? JSON.parse(JSON.stringify(initVal)) : null;
      });
      this.set(updates);
    }
  }
  const State = new AppSt();
  window.State = State;

</script>
