<!-- src/Dash.html -->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">    
    <script src="https://cdn.jsdelivr.net/npm/simple-statistics@7.8.3/dist/simple-statistics.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.1/lib/browser/math.min.js"></script>
    <?!= include("CSS"); ?>
  </head>
  <body data-theme="dash">
    <div data-ui="dlg"></div>
    <dialog data-part="dlgFavPaste" class="universal-dialog">
      <form method="dialog">
        <h3 data-part="title" class="d-title">設定の貼り付け</h3>
        <p data-part="msg" class="d-msg">ブラウザの自動読取が制限されています。<br>ここに設定JSONを貼り付けてください：</p>
        <textarea name="favPaste" data-part="txtFavPaste" class="form-control" style="width: 100%; height: 140px; margin: 8px 0; font-family: monospace; font-size: 11px;" placeholder="{ &quot;RPTST.refs&quot;: ... }"></textarea>
        <div class="field-row">
          <button type="submit" value="cancel" class="outline" data-type="primary">キャンセル</button>
          <button type="submit" value="ok" data-type="primary">OK</button>
        </div>
      </form>
    </dialog>
    <nav class="nav-tabs" data-part="nav">
      <!-- data-arg を data-param へ変更 -->
      <button class="tab-btn" data-part="tab-btn" aria-selected="true" data-action="CoreAct.switchTab" data-param="dash">ダッシュボード</button>
    </nav>
    <main class="scroll-y">
      <div data-part="tab-content" data-tab="dash" class="tab-content" aria-hidden="false" data-state="active">
        <fieldset data-part="dashFieldset">
          <details data-part="secINST" open>
            <summary>データ読込</summary>
            <div class="txt-btninfo">読込シート<span class="badge-label">PXRF</span><span class="badge-label">WDXRF</span></div>
            <div class="field-row">
              <button data-part="btnINST_load" data-action="DashAct.requestLoadDB" data-type="primary">データを読込</button>
            </div>
          </details>
          <!-- data-bind-status を data-patch へ変更 -->
          <div data-part="barINST" class="status-bar" data-status="hidden" data-patch="status: DashST.INST.status"></div>
          <hr>
          <details data-part="secREPO">
            <summary>ダッシュボード作成</summary>
            <label>ユーザー設定選択</label>
            <div class="field-row" style="margin-top: var(--unit)">
              <div class="fav-table-cntr scroll-y">
                <!-- data-bind-src を data-patch へ変更 -->
                <div data-part="tblFAV" data-ui="table" data-patch="src: DashST.REPO.data.favTableSrc"></div>
              </div>
            </div>
            <label>設定JSON登録</label>
            <div class="field-row" style="margin-top: var(--unit)">
              <!-- data-bind, data-bind-invalid, data-change を data-patch と data-action へ統合 -->
              <input type="text" data-part="iptFAV_name" placeholder="設定名を入力" data-patch="bind: DashST.REPO.refs.favInputName; invalid: DashST.REPO.data.favInputInvalid" data-action="DashAct.onFavNameChange">
              <button data-part="btnFAV_save" data-action="DashAct.addFavFromClipboard" data-type="primary" class="outline" style="flex: 0.5;" data-patch="bind: DashST.REPO.data.favBtnText">新規登録</button>
            </div>
            <div class="field-row">
              <button data-part="btnREPO_open" data-action="DashAct.requestOpenRepo" data-type="primary">ダッシュボードを展開</button>
            </div>
          </details>
          <div data-part="barREPO" class="status-bar" data-status="hidden" data-patch="status: DashST.REPO.status"></div>
          <div style="flex-grow: 1; min-height: calc(var(--unit) * 2);"></div>
        </fieldset>
      </div>
    </main>
    <script>
      window.__INITIAL_SSID__ = "<?= typeof initialSsId !== 'undefined' ? initialSsId : '' ?>";
      window.__APP_MODE__ = "<?= typeof appMode !== 'undefined' ? appMode : 'dash' ?>";
    </script>
    <?!= include('Global'); ?>
    <?!= include('Adapter'); ?>
    <?!= include('Model'); ?>
    <?!= include('CoreMethod'); ?>

    <?!= include('Component'); ?>
    <?!= include('Dash_Schema'); ?>
    <?!= include('CoreUI'); ?>
    <?!= include('CoreAction'); ?>
    <?!= include('Dash_Action'); ?>
  </body>
</html>
