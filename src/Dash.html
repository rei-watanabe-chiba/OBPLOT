<!-- src/Dash.html -->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">    
    <script src="https://cdn.jsdelivr.net/npm/simple-statistics@7.8.3/dist/simple-statistics.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.1/lib/browser/math.min.js"></script>
    <?!= include("CSS"); ?>
  </head>
  <body data-theme="dash">
    <div data-ui="dlg"></div>
    <dialog id="dlgFavPaste" class="universal-dialog">
      <h3 class="d-title">設定の貼り付け</h3>
      <p class="d-msg">ブラウザの自動読取が制限されています。<br>ここに Ctrl+V で設定JSONを貼り付けてください：</p>
      <textarea id="txtFavPaste" class="form-control" style="width: 100%; height: 140px; margin: 8px 0; font-family: monospace; font-size: 11px;" placeholder="{ &quot;RPTST.refs&quot;: ... }"></textarea>
      <div class="field-row">
        <button class="outline" data-type="primary" id="btnFavPasteCancel">キャンセル</button>
        <button data-type="primary" id="btnFavPasteOk">OK</button>
      </div>
    </dialog>
    <nav class="nav-tabs" id="nav">
      <button class="tab-btn active" data-action="CoreAct.switchTab" data-target="dash">ダッシュボード</button>
    </nav>
    <main class="scroll-y">
      <div id="dash" class="tab-content active">
        <fieldset id="dashFieldset">
          <details id="secINST" open>
            <summary>データ読込</summary>
            <div class="txt-btninfo">読込シート<span class="badge-label">PXRF</span><span class="badge-label">WDXRF</span></div>
            <div class="field-row">
              <button id="btnINST_load" data-action="DashAct.requestLoadDB" data-type="primary">データを読込</button>
            </div>
          </details>
          <div id="barINST" class="status-bar" data-status="hidden" data-bind-status="DashST.INST.status"></div>
          <hr>
          <details id="secREPO">
            <summary>ダッシュボード作成</summary>
            <label>ユーザーグラフ設定</label>
            <div class="fav-table-cntr scroll-y">
              <div id="tblFAV" data-ui="table" data-bind-src="DashST.REPO.data.favTableSrc"></div>
            </div>
            <div class="field-row">
              <input type="text" id="iptFAV_name" placeholder="設定名を入力" data-bind="DashST.REPO.refs.favInputName" data-bind-invalid="DashST.REPO.data.favInputInvalid" data-change="DashAct.onFavNameChange">
              <button id="btnFAV_save" data-action="DashAct.addFavFromClipboard" data-type="primary" class="outline" style="width: 100%;" data-bind="DashST.REPO.data.favBtnText">新規登録</button>
            </div>
            <hr>
            <div class="field-row">
              <button id="btnREPO_open" data-action="DashAct.requestOpenRepo" data-type="primary">ダッシュボードを展開</button>
            </div>
          </details>
          <div id="barREPO" class="status-bar" data-status="hidden" data-bind-status="DashST.REPO.status"></div>
          <div style="flex-grow: 1; min-height: calc(var(--unit) * 2);"></div>
        </fieldset>
      </div>
    </main>
    <script>
      window.__INITIAL_SSID__ = "<?= typeof initialSsId !== 'undefined' ? initialSsId : '' ?>";
      window.__APP_MODE__ = "<?= typeof appMode !== 'undefined' ? appMode : 'dash' ?>";
    </script>
    <?!= include('Global'); ?>
    <?!= include('PlatformAdapter'); ?>
    <?!= include('Model'); ?>
    <?!= include('CoreMethod'); ?>

    <?!= include('Component'); ?>
    <?!= include('Dash_Schema'); ?>
    <?!= include('CoreUI'); ?>
    <?!= include('CoreAction'); ?>
    <?!= include('Dash_Action'); ?>
  </body>
</html>
