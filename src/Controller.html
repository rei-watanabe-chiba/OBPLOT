<script>
  class CoreCtrl {
    // --- 共通：非同期ラッパー ---
    static async withAsyncLock(statusPath, processFn, finallyFn = null) {
      State.set("GLB.isLocked", true);
      try {
        const res = await processFn();
        if (typeof res === "string") State.set(statusPath, ["success", res]);
        else if (Array.isArray(res)) State.set(statusPath, res);
      } catch (err) {
        State.set(statusPath, ["error", err.message]);
      } finally {
        if (finallyFn) await finallyFn();
        State.set("GLB.isLocked", false);
      }
    }
  }

  // --- Tab1 ---
  class Tab1Ctrl {
    // --- Tab1 Fileシート取得 ---
    static async loadFile() {
      if (!(await NewDOM.confirm("確認", State.get("Tab1ST.file.data") ? "内部データをリセットしますか？" : "Fileシートを読み込みますか？", Tab1UI.fileBar))) return;
      await CoreCtrl.withAsyncLock("Tab1ST.file.status", async () => {
        const { data, message } = await API.fetchData(GLOBAL_CONFIG.fileSheetName, 5);
        // リセット処理
        State.reset(['Tab1ST.exac']); 
        State.set({
          "Tab1ST.file.data": data, 
          "Tab1ST.file.map": Object.fromEntries(GLOBAL_CONFIG.fileFields.map(f => [f.key, ""])),
          "Tab1ST.file.isMapError": [true, true, true, false, false], 
          "Tab1ST.file.cachedStatus": ["success", message],
          "Tab1ST.phase": TAB1_PHASE.LOAD
        });
        Evt.Tab1.validateFileMap();
        return message; 
      });
    }

    // --- Tab1 ファイルリスト共通処理 ---
    static async processFileList(actionType, fileDT) {
      if (actionType === "validate") ({ data: fileDT } = await API.fetchData(GLOBAL_CONFIG.filelistSheetName, 5, 5));
      const outData = Mtd.Tab1.FileValidator.run(fileDT, GLOBAL_CONFIG.filelistHeader, GLOBAL_CONFIG.validModes, State.get("Tab1ST.config.mode"));
      const isAlert = outData.slice(1).some(row => row.at(-1) !== ""); 
      await Promise.all([
        API.writeData(GLOBAL_CONFIG.filelistSheetName, outData, "rule"),
        API.clearUserProperty(GLOBAL_CONFIG.propFileEdited)
      ]);
      const statusRes = isAlert ? ["alert", "出力完了, errorあり"] : "出力完了, errorなし";
      // リセット処理
      if (isAlert) State.reset(['Tab1ST.exac']);
      State.set({
        "Tab1ST.file.cachedStatus": Array.isArray(statusRes) ? statusRes : ["success", statusRes],
        "Tab1ST.phase": isAlert ? TAB1_PHASE.INVALID : TAB1_PHASE.VALID
      });
      if (!isAlert) Evt.Tab1.validateExacMap();
      return statusRes;
    }

    // --- Tab1 ファイルリスト生成処理 ---
    static async makeFileList() {
      Evt.Tab1.validateFileMap();
      if (State.get("Tab1ST.file.isMapError").some(Boolean)) return;
      if (!await NewDOM.confirm("確認", "既存の「ファイルリスト」シートを上書きしますか？", Tab1UI.fileBar)) return;
      await CoreCtrl.withAsyncLock("Tab1ST.file.status", async () => {
        const [fileDT, fileMap] = State.get(["Tab1ST.file.data", "Tab1ST.file.map"]);
        const remapped = Mtd.Utils.remapArry(fileDT, GLOBAL_CONFIG.fileFields.map(f => fileMap[f.key] ? fileDT[0].indexOf(fileMap[f.key]) : -1), GLOBAL_CONFIG.fileHeader);
        return await this.processFileList("make", remapped);
      });
    }

    // --- Tab1 リスト検証処理 ---
    static async validateFileList() {
      if (!await NewDOM.confirm("確認", "既存の「ファイルリスト」シートを上書きしますか？", Tab1UI.fileBar)) return;
      await CoreCtrl.withAsyncLock("Tab1ST.file.status", async () => this.processFileList("validate", null));
    }

    // --- Tab1 突合抽出処理 ---
    static async extractFile() {
      if (!await NewDOM.confirm("確認", "既存の「抽出データ」シートを上書きしますか？", Tab1UI.exacBar)) return;
      await CoreCtrl.withAsyncLock("Tab1ST.exac.status", async () => {
        if (await API.checkUserProperty(GLOBAL_CONFIG.propFileEdited)) {
          State.set({ "Tab1ST.file.status": ["error", "シート編集検知: 再検証"], "Tab1ST.phase": TAB1_PHASE.INVALID });
          return;
        }
        const [fileRes, resultRes] = await Promise.all([
          API.fetchData(GLOBAL_CONFIG.filelistSheetName, 6, 6), 
          API.fetchData(GLOBAL_CONFIG.resultsSheetName)
        ]);
        const outData = Mtd.Tab1.DataExtractor.run(fileRes.data, resultRes.data, State.get("Tab1ST.exac.map"));
        if (!outData || outData.length <= 1) throw new Error("対象データなし");
        await API.writeData(GLOBAL_CONFIG.extractSheetName, outData);
        State.set("Tab1ST.phase", TAB1_PHASE.EXTRACT);
        return `抽出: ${outData.length - 1} 件`;
      });
    }

    // --- Tab1 PXRF格納処理 ---
    static async pushExacData() {
      if (!await NewDOM.confirm("確認", "「抽出データ」をPXRFシートに格納しますか？", Tab1UI.exacBar)) return;
      await CoreCtrl.withAsyncLock("Tab1ST.exac.status", async () => {
        const [exacRes, pxrfRes] = await Promise.all([
          API.fetchData(GLOBAL_CONFIG.extractSheetName), 
          API.fetchData(GLOBAL_CONFIG.pxrfSheetName)
        ]);
        const { isDup, data: mergedData } = Mtd.Tab1.PxrfValidator.run(pxrfRes.data, exacRes.data);
        if (isDup && !await NewDOM.confirm("確認", "重複dataset・IDが存在します。上書きしますか？", Tab1UI.exacBar)) return;
        await API.writeData(GLOBAL_CONFIG.pxrfSheetName, isDup ? mergedData : exacRes.data.slice(1), isDup ? "clear" : ["append"]);
        State.set("Tab1ST.phase", TAB1_PHASE.OUTPUT);
        return `PXRF格納完了: ${exacRes.data.length - 1} 件`;
      });
    }
  }

  class Tab2Ctrl {
    // --- Tab2 データ読込 ---
    static async loadData() {
      await CoreCtrl.withAsyncLock("Tab2ST.dataset.status", async () => {
        State.set("Tab2ST.dataset.status", ["loading", "処理中..."]);
        const [pxrfRes, wdxrfRes, corrRes] = await Promise.all([
          API.fetchData(GLOBAL_CONFIG.pxrfSheetName), 
          API.fetchData(GLOBAL_CONFIG.wdxrfSheetName), 
          API.fetchData(GLOBAL_CONFIG.correctionSheetName).catch(() => ({ data: [] }))
        ]);
        if (!pxrfRes.data || pxrfRes.data.length <= 1) throw new Error("PXRFデータ不足");
        if (!wdxrfRes.data || wdxrfRes.data.length <= 1) throw new Error("WDXRFデータ不足");
        // リセット処理
        State.reset(['Tab2ST.dataset', 'Tab2ST.symbol', 'Tab2ST.preview', 'Tab2ST.report']);
        const { mergedPXRF, wdxrfObjs, datasets } = Mtd.Tab2.DataManager.load(pxrfRes.data, wdxrfRes.data);
        State.set({ 
          "Tab2ST.dataset.rawData": { correction: corrRes.data, mergedPXRF, wdxrfObjs }, 
          "Tab2ST.dataset.availableDatasets": datasets,
          "Tab2ST.dataset.filter": datasets, 
          "Tab2ST.phase": TAB2_PHASE.LOADED 
        });
        // プレビューオプションを初期化（UIInitから移動）
        NewDOM.multiSelectDropdown(GLOBAL_CONFIG.optionalElements, Tab2UI.previewModeBox, "Tab2.togglePreviewMode", "Tab2.toggleAllPreviewMode");
        State.set("Tab2ST.preview.modeMap", [...GLOBAL_CONFIG.optionalElements]);
        return `読込完了: dataset ${datasets.length}件`;
      });
    }

    // --- Tab2 データ確定 ---
    static async filterData() {
      await CoreCtrl.withAsyncLock("Tab2ST.dataset.status", async () => {
        const checkedVals = State.get("Tab2ST.dataset.filter") || [];
        if (!checkedVals.length) throw new Error("Dataset未選択");
        // リセット処理
        State.reset(['Tab2ST.symbol', 'Tab2ST.preview', 'Tab2ST.report']);
        const [mergedPXRF, wdxrfObjs] = State.get(["Tab2ST.dataset.rawData.mergedPXRF", "Tab2ST.dataset.rawData.wdxrfObjs"]);
        const { basePXRF, baseWDXRF } = Mtd.Tab2.DataManager.filter(mergedPXRF, wdxrfObjs, checkedVals);
        State.set({
          "Tab2ST.dataset.basePXRF": basePXRF, 
          "Tab2ST.dataset.baseWDXRF": baseWDXRF,
          "Tab2ST.phase": TAB2_PHASE.FILTERED
        });
        return "データ更新";
      });
    }

    // --- Tab2 シンボル確定 ---
    static async setSymbolMap() {
      await CoreCtrl.withAsyncLock("Tab2ST.symbol.status", async () => {
        State.set("Tab2ST.phase", TAB2_PHASE.MAPPED);
        return "シンボル確定";
      });
    }
    
    // --- Tab2 シンボルリセット ---
    static async resetSymbolRules() {
      State.reset("Tab2ST.symbol.rules");
    }

    // --- Tab2 プレビュー作成 ---
    static async makePreview() {
      await CoreCtrl.withAsyncLock("Tab2ST.preview.status", async () => {
        const [modeMap, valueLogic, itemMap, basePXRF, baseWDXRF] = State.get([
        "Tab2ST.preview.modeMap", "Tab2ST.preview.value", "Tab2ST.preview.itemMap", "Tab2ST.dataset.basePXRF", "Tab2ST.dataset.baseWDXRF"
      ]);
        const previewData = Mtd.Tab2.PreviewManager.buildPreviewData(basePXRF, baseWDXRF, modeMap, valueLogic, itemMap);
        if (!previewData.length) throw new Error("対象データなし");
        const xArr = previewData.map(d => d.x);
        const yArr = previewData.map(d => d.y);
        const errArr = previewData.map(d => d.err).filter(v => v != null && !isNaN(v));
        const stats = Mtd.Tab2.CalcProcessor.calcRegression(xArr, yArr, errArr);
        // リセット処理
        State.reset(['Tab2ST.report']);
        State.set({
          "Tab2ST.preview.correctionLogic": stats,
          "Tab2ST.preview.statsData": stats,
          "Tab2ST.preview.previewData": previewData,
          "Tab2ST.phase": TAB2_PHASE.PREVIEWED
        });
        return "プレビュー更新";
      });
    }
    
    // --- Tab2 レポート画面展開 ---
    static async openReport() {
      await CoreCtrl.withAsyncLock("Tab2ST.repoStatus", async () => {
        State.set("Tab2ST.repoStatus", ["loading", "テンプレート取得中..."]);
        const htmlContent = await API.getReportTemplate();
        window.open(URL.createObjectURL(new Blob([htmlContent], { type: 'text/html' })), '_blank');
        return "別タブで展開しました";
      });
    }
  }

  // --- 外部参照用 ---
  const Ctrl = { Core: CoreCtrl, Tab1: Tab1Ctrl, Tab2: Tab2Ctrl };
</script>
