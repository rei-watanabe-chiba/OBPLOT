<script>
  // --- コントローラー層クラス ---
  class AppController {
    // --- 共通：非同期ラッパー ---
    static async withAsyncLock(prefix, processFn, finallyFn = null) {
      State.set("GLB.isLocked", true);
      try {
        await processFn();
      } catch (err) {
        // エラー捕捉と状態更新
        State.set(`Tab1ST.${prefix}Stas`, ["error", err.message]);
      } finally {
        // 終了処理
        if (finallyFn) await finallyFn();
        State.set("GLB.isLocked", false);
      }
    }

    // --- ファイルリスト共通処理 ---
    static async processFileList(actionType, fileDT, global) {
      // validateモードデータ取得
      if (actionType === "validate"){
        const { data } = await API.fetchData(global.filelistSheetName, 5, 5);
        fileDT = data;
      }
      // モード取得と検証
      const exacMode = State.get("Tab1ST.configExacMode");
      const outData = Mtd.FileValidator.run(fileDT, global.filelistHeader, global.validModes, exacMode);
      const isAlert = outData.slice(1).some(row => row[row.length - 1] !== "");
      await API.writeData(global.filelistSheetName, outData, "rule");
      await API.clearUserProperty(global.propFileEdited);
      // ステータス更新
      const stas = isAlert ? ["alert", "出力完了, errorあり"] : ["success", "出力完了, errorなし"];
      const isError = stas[0] !== "success";
      State.set({
        "Tab1ST.isFileEdited": false,
        "Tab1ST.fileStas": stas,
        "Tab1ST.isFileValidateError": isError,
      });
    }
    
    // --- Fileシート取得処理 ---
    static async loadFile() {
      // リセット確認
      const cachedFileData = State.get("Tab1ST.cachedFileData");
      if (cachedFileData !== null) {
        if (!await UI.confirm("確認", "内部データをリセットしますか？", Tab1UI.fileBar)) return;
      }
      
      let stas = [];
      // 非同期ラッパー実行
      await this.withAsyncLock("file", 
        // try処理
        async () => {
          // データ取得
          const global = State.get("GLB.cachedGlobal");
          const { data, message } = await API.fetchData(global.fileSheetName, 5);
          // dataヘッダーで列マップ初期化
          const newMap = {};
          global.fileFields.forEach(f => newMap[f.key] = "");
          UI.renderSelectors(data[0], Tab1UI.fileBox, global.fileFields);
          // ステータス更新
          stas = ["success", message];
          State.set({
            "Tab1ST.cachedFileData": data,
            "Tab1ST.fileMap": newMap,
            "Tab1ST.isFileMapError": [true, true, true, false, false],
            "Tab1ST.fileStas": stas
          });
        },
        // finally処理
        async () => {
          // ステータス記録とUI更新
          State.set("Tab1ST.isFileLoadError", stas[0] === "error");
        }
      );
    }

    // --- ファイルリスト生成処理 ---
    static async makeFileList() {
      // 選択状態確認
      Evt.fileArea();
      if (State.get("Tab1ST.isFileMapError")?.some(Boolean)) return;
    
      // 実行確認
      if (!await UI.confirm("確認", "既存の「ファイルリスト」シートを上書きしますか？",Tab1UI.fileBar)) return;
      // 非同期ラッパー実行
      await this.withAsyncLock("file", async () => {
        // インデックス抽出
        const [global, fileDT, fileMap] = State.get([
          "GLB.cachedGlobal", "Tab1ST.cachedFileData", "Tab1ST.fileMap"
        ]);
        const indexArr = global.fileFields.map(f => {
          const selectedValue = fileMap[f.key];
          return selectedValue ? fileDT[0].indexOf(selectedValue) : -1;
        });
        // 再配列実行
        const remapData = Mtd.Utils.remapArry(fileDT, indexArr, global.fileHeader);
        await this.processFileList("make", remapData, global);
      });
    }

    // --- ファイルリスト検証処理 ---
    static async validateFileList() {
      // 上書き確認
      if (!await UI.confirm("確認", "既存の「ファイルリスト」シートを上書きしますか？",Tab1UI.fileBar)) return;
      
      // 非同期ラッパー実行
      await this.withAsyncLock("file", async () => {
        const global = State.get("GLB.cachedGlobal");
        await this.processFileList("validate", null, global);
      });
    }

    // --- File - Results突合抽出処理 ---
    static async extractFile() {
      // 実行確認（編集フラグ事前読込）
      const global = State.get("GLB.cachedGlobal");
      const flagEdited = await API.checkUserProperty(global.propFileEdited);
      if (!await UI.confirm("確認", "既存の「抽出データ」シートを上書きしますか？",Tab1UI.exacBar)) return;
      
      // 非同期ラッパー実行
      await this.withAsyncLock("exac", async () => {
        // 編集検知
        if (await flagEdited) {
          State.set("Tab1ST.isFileEdited", true);
          return;
        }
        // データ取得
        const { data: fileData } = await API.fetchData(global.filelistSheetName, 6, 6);
        const { data: resultData } = await API.fetchData(global.resultsSheetName);
        // データ抽出
        const [exacMode, configMap] = State.get([
          "Tab1ST.configExacMode", "Tab1ST.configMap"
        ]);
        const outData = Mtd.DataExtractor.run(fileData, resultData, configMap, global);
        // 生成結果確認
        if (!outData || outData.length <= 1) throw new Error("対象データなし");
        // データ出力
        await API.writeData(global.extractSheetName, outData);
        // ステータス更新
        State.set({"Tab1ST.isFileEdited": false, "Tab1ST.exacStas": ["success", `抽出: ${outData.length - 1} 件`]});
      });
    }
  }
  // 他層からの呼び出し
  const Ctrl = AppController;
</script>
