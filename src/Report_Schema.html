<!-- src/Report_Schema.html -->
<script>
  // --- ダッシュボード用ハードコード定数 ---
  const RPT_CFG = {
    lbl: { newCorr: "新規検量線", calib: "検量線", clus: "判別図", useCal: "検量線適用", useLOD: "LOD置換", unsel: "未選択" },
    rng: {
      gridRows: { min: 1, max: 3, step: 1, unit: "" },
      gridCols: { min: 1, max: 3, step: 1, unit: "" },
      panelGap: { min: 0, max: 50, step: 0.5, unit: "mm" },
      "margins.top": { min: 0, max: 100, step: 1, unit: "mm" },
      "margins.bottom": { min: 0, max: 100, step: 1, unit: "mm" },
      "margins.left": { min: 0, max: 100, step: 1, unit: "mm" },
      "margins.right": { min: 0, max: 100, step: 1, unit: "mm" },
      p_t: { min: 0, max: 50, step: 0.5, unit: "mm" },
      p_b: { min: 0, max: 50, step: 0.5, unit: "mm" },
      p_l: { min: 0, max: 50, step: 0.5, unit: "mm" },
      p_r: { min: 0, max: 50, step: 0.5, unit: "mm" },
      s_title: { min: 5, max: 50, step: 0.5, unit: "pt" },
      s_name: { min: 3, max: 30, step: 0.5, unit: "pt" },
      s_tick: { min: 3, max: 30, step: 0.5, unit: "pt" },
      s_stats: { min: 3, max: 30, step: 0.5, unit: "pt" },
      sym_size: { min: 1, max: 20, step: 0.5, unit: "pt" },
      sym_bw: { min: 0, max: 5, step: 0.1, unit: "pt" },
      lw_axis: { min: 0.1, max: 3.0, step: 0.1, unit: "pt" },
      lw_grid: { min: 0.1, max: 3.0, step: 0.1, unit: "pt" },
      lw_reg: { min: 0.1, max: 3.0, step: 0.1, unit: "pt" },
      c_base: { min: 0, max: 100, step: 1, unit: "%" },
      c_axis: { min: 0, max: 100, step: 1, unit: "%" },
      c_grid: { min: 0, max: 100, step: 1, unit: "%" }
    }
  };

  const REPORT_SCHEMA = {
    elements: [
      { id: "lblFilterDB", text: () => GLB.idx.key1 },
      { id: "lblFilterItem", text: () => GLB.idx.p1 },
      { id: "lblFilterGroup", text: () => GLB.idx.wd1 },
      { 
        id: "panelConfigSec", 
        visiblePhase: () => !window.__IS_PRINT_TAB__ && !!State.get("RPTST.refs.panels")?.find(p => p.id === State.get("RPTST.refs.activePanelId")),
        dataset: () => ({ graphtype: State.get("RPTST.data.apGraphType") })
      },
      { id: "tabBtnLayout", className: () => State.get("RPTST.ui.activeTab") === "tabLayout" ? "tab-icon active" : "tab-icon" },
      { id: "tabBtnData", className: () => State.get("RPTST.ui.activeTab") === "tabData" ? "tab-icon active" : "tab-icon" },
      { id: "tabBtnStyle", className: () => State.get("RPTST.ui.activeTab") === "tabStyle" ? "tab-icon active" : "tab-icon" },
      { id: "tabBtnSymb", className: () => State.get("RPTST.ui.activeTab") === "tabSymb" ? "tab-icon active" : "tab-icon" },
      { id: "tabLayout", className: () => State.get("RPTST.ui.activeTab") === "tabLayout" ? "sidebar-tab-pane active" : "sidebar-tab-pane" },
      { id: "tabData", className: () => State.get("RPTST.ui.activeTab") === "tabData" ? "sidebar-tab-pane active" : "sidebar-tab-pane" },
      { id: "tabStyle", className: () => State.get("RPTST.ui.activeTab") === "tabStyle" ? "sidebar-tab-pane active" : "sidebar-tab-pane" },
      { id: "tabSymb", className: () => State.get("RPTST.ui.activeTab") === "tabSymb" ? "sidebar-tab-pane active" : "sidebar-tab-pane" },
      
      { id: "segBtnFont", className: () => State.get("RPTST.ui.activeSub") === "subFont" ? "segment-btn active" : "segment-btn" },
      { id: "segBtnArea", className: () => State.get("RPTST.ui.activeSub") === "subArea" ? "segment-btn active" : "segment-btn" },
      { id: "subFont", className: () => State.get("RPTST.ui.activeSub") === "subFont" ? "sub-pane active" : "sub-pane" },
      { id: "subArea", className: () => State.get("RPTST.ui.activeSub") === "subArea" ? "sub-pane active" : "sub-pane" },
      { id: "p_0", visiblePhase: () => { const r = State.get("RPTST.refs"); return r && 0 < (r.gridRows * r.gridCols); }, className: () => (!window.__IS_PRINT_TAB__ && State.get("RPTST.refs.activePanelId") === "p_0") ? "grid-panel active" : "grid-panel" },
      { id: "p_1", visiblePhase: () => { const r = State.get("RPTST.refs"); return r && 1 < (r.gridRows * r.gridCols); }, className: () => (!window.__IS_PRINT_TAB__ && State.get("RPTST.refs.activePanelId") === "p_1") ? "grid-panel active" : "grid-panel" },
      { id: "p_2", visiblePhase: () => { const r = State.get("RPTST.refs"); return r && 2 < (r.gridRows * r.gridCols); }, className: () => (!window.__IS_PRINT_TAB__ && State.get("RPTST.refs.activePanelId") === "p_2") ? "grid-panel active" : "grid-panel" },
      { id: "p_3", visiblePhase: () => { const r = State.get("RPTST.refs"); return r && 3 < (r.gridRows * r.gridCols); }, className: () => (!window.__IS_PRINT_TAB__ && State.get("RPTST.refs.activePanelId") === "p_3") ? "grid-panel active" : "grid-panel" },
      { id: "p_4", visiblePhase: () => { const r = State.get("RPTST.refs"); return r && 4 < (r.gridRows * r.gridCols); }, className: () => (!window.__IS_PRINT_TAB__ && State.get("RPTST.refs.activePanelId") === "p_4") ? "grid-panel active" : "grid-panel" },
      { id: "p_5", visiblePhase: () => { const r = State.get("RPTST.refs"); return r && 5 < (r.gridRows * r.gridCols); }, className: () => (!window.__IS_PRINT_TAB__ && State.get("RPTST.refs.activePanelId") === "p_5") ? "grid-panel active" : "grid-panel" },
      { id: "p_6", visiblePhase: () => { const r = State.get("RPTST.refs"); return r && 6 < (r.gridRows * r.gridCols); }, className: () => (!window.__IS_PRINT_TAB__ && State.get("RPTST.refs.activePanelId") === "p_6") ? "grid-panel active" : "grid-panel" },
      { id: "p_7", visiblePhase: () => { const r = State.get("RPTST.refs"); return r && 7 < (r.gridRows * r.gridCols); }, className: () => (!window.__IS_PRINT_TAB__ && State.get("RPTST.refs.activePanelId") === "p_7") ? "grid-panel active" : "grid-panel" },
      { id: "p_8", visiblePhase: () => { const r = State.get("RPTST.refs"); return r && 8 < (r.gridRows * r.gridCols); }, className: () => (!window.__IS_PRINT_TAB__ && State.get("RPTST.refs.activePanelId") === "p_8") ? "grid-panel active" : "grid-panel" }
    ],
    persistPaths: ["RPTST.refs"]
  };

  const SIDEBAR_PARTS = {
    'panel-config': [
      { type: "fields", label: "タイプ", labelClass: "panel", id: "boxGraphType", bindFields: "RPTST.data.graphTypeFields" },
      { type: "section", id: "secCALB", rows: [
        { type: "fields", label: "対象指標", labelClass: "panel", id: "boxCalbVal", bindFields: "RPTST.data.calbValFields" }
      ]},
      { type: "section", id: "secCluster", rows: [
        { type: "fields", labelHTML: 'X<span class="badge-label">項目</span>', labelClass: "panel", id: "boxClusX", bindFields: "RPTST.data.clusXFields" },
        { type: "fields", labelHTML: 'Y<span class="badge-label">項目</span>', labelClass: "panel", id: "boxClusY", bindFields: "RPTST.data.clusYFields" }
      ]},
      { type: "inputs", label: "タイトル", labelClass: "panel", inputs: [
        { inputType: "text", apKey: "title", change: "RepoSt.renewPanelRef", bind: "RPTST.data.apTitle", placeholder: "パネルタイトルを入力", className: "form-control" }
      ]},
      { type: "inputs", labelHTML: 'X/Y<span class="badge-label">ラベル</span>', labelClass: "panel", inputs: [
        { inputType: "text", apKey: "xLabel", change: "RepoSt.renewPanelRef", bind: "RPTST.data.apXLabel", className: "form-control", placeholder: "X軸" },
        { inputType: "text", apKey: "yLabel", change: "RepoSt.renewPanelRef", bind: "RPTST.data.apYLabel", className: "form-control", placeholder: "Y軸" }
      ]}
    ],
    'layout-panel': [
      { type: "inputs", label: "行数 / 列数", marginBottom: "16px", inputs: [
        { inputType: "number", bind: "RPTST.refs.gridRows", className: "form-control", title: "行数" },
        { inputType: "number", bind: "RPTST.refs.gridCols", className: "form-control", title: "列数" }
      ]}
    ],
    'layout-margins': [
      { type: "inputs", label: "パネル間隔", inputs: [
        { inputType: "number", bind: "RPTST.refs.panelGap", className: "form-control", unit: "mm" }
      ]},
      { type: "inputs", label: "キャンバス 上/下", inputs: [
        { inputType: "number", bind: "RPTST.refs.margins.top", className: "form-control", unit: "mm" },
        { inputType: "number", bind: "RPTST.refs.margins.bottom", className: "form-control", unit: "mm" }
      ]},
      { type: "inputs", label: "キャンバス 左/右", inputs: [
        { inputType: "number", bind: "RPTST.refs.margins.left", className: "form-control", unit: "mm" },
        { inputType: "number", bind: "RPTST.refs.margins.right", className: "form-control", unit: "mm" }
      ]},
      { type: "inputs", label: "パネル内 上/下", inputs: [
        { inputType: "number", bind: "RPTST.refs.rawGph.p_t", className: "form-control", unit: "mm" },
        { inputType: "number", bind: "RPTST.refs.rawGph.p_b", className: "form-control", unit: "mm" }
      ]},
      { type: "inputs", label: "パネル内 左/右", inputs: [
        { inputType: "number", bind: "RPTST.refs.rawGph.p_l", className: "form-control", unit: "mm" },
        { inputType: "number", bind: "RPTST.refs.rawGph.p_r", className: "form-control", unit: "mm" }
      ]}
    ],
    'data-filters': [
      { type: "multiSelect", label: "dataset", labelId: "lblFilterDB", labelClass: "panel", id: "boxFilterDB", changeItem: "CoreAct.tglMulti", changeAll: "CoreAct.tglAllMulti", bind: "RPTST.refs.filters.db", bindOpts: "RPTST.data.filterDBOpts" },
      { type: "multiSelect", label: "item", labelId: "lblFilterItem", labelClass: "panel", id: "boxFilterItem", changeItem: "CoreAct.tglMulti", changeAll: "CoreAct.tglAllMulti", bind: "RPTST.refs.filters.item", bindOpts: "RPTST.data.filterItemOpts" },
      { type: "multiSelect", label: "Group", labelId: "lblFilterGroup", labelClass: "panel", id: "boxFilterGroup", changeItem: "CoreAct.tglMulti", changeAll: "CoreAct.tglAllMulti", bind: "RPTST.refs.filters.group", bindOpts: "RPTST.data.filterGroupOpts" }
    ],
    'data-crct': [
      { type: "fields", label: "検量線", labelClass: "panel", id: "boxGlobalCrct", bindFields: "RPTST.data.crctFields" },
      { type: "multiSelect", label: "対象元素", labelClass: "panel", id: "boxGlobalCalElms", changeItem: "CoreAct.tglMulti", changeAll: "CoreAct.tglAllMulti", bind: "RPTST.refs.calElms", bindOpts: "RPTST.data.calElmsOpts" },
      { type: "toggles", topMargin: "16px", toggles: [
        { label: "検量線適用", bind: "RPTST.refs.useCal" },
        { label: "LOD置換", bind: "RPTST.refs.useLOD" }
      ]}
    ],
    'style-font': [
      { type: "fields", label: "欧文スタイル", id: "boxFontEng", bindFields: "RPTST.data.fontEngFields" },
      { type: "fields", label: "和文スタイル", id: "boxFontJp", bindFields: "RPTST.data.fontJpFields" },
      { type: "rangeText", labelHTML: 'カラー<span class="badge-label">K</span>', bind: "RPTST.refs.rawGph.c_base" },
      { type: "inputs", label: "タイトル", inputs: [{ inputType: "number", bind: "RPTST.refs.rawGph.s_title", className: "form-control", unit: "pt" }] },
      { type: "inputs", label: "軸名", inputs: [{ inputType: "number", bind: "RPTST.refs.rawGph.s_name", className: "form-control", unit: "pt" }] },
      { type: "inputs", label: "目盛", inputs: [{ inputType: "number", bind: "RPTST.refs.rawGph.s_tick", className: "form-control", unit: "pt" }] },
      { type: "inputs", label: "回帰式", inputs: [{ inputType: "number", bind: "RPTST.refs.rawGph.s_stats", className: "form-control", unit: "pt" }] }
    ],
    'style-area': [
      { type: "inputs", labelHTML: 'シンボル<span class="badge-label">サイズ</span>', inputs: [{ inputType: "number", bind: "RPTST.refs.rawGph.sym_size", className: "form-control", unit: "pt" }] },
      { type: "inputs", labelHTML: 'シンボル<span class="badge-label">線幅</span>', inputs: [{ inputType: "number", bind: "RPTST.refs.rawGph.sym_bw", className: "form-control", unit: "pt" }] },
      { type: "inputs", labelHTML: '軸線<span class="badge-label">線幅</span>', inputs: [{ inputType: "number", bind: "RPTST.refs.rawGph.lw_axis", className: "form-control", unit: "pt" }] },
      { type: "rangeText", labelHTML: '軸線<span class="badge-label">K</span>', bind: "RPTST.refs.rawGph.c_axis" },
      { type: "inputs", labelHTML: 'グリッド<span class="badge-label">線幅</span>', inputs: [{ inputType: "number", bind: "RPTST.refs.rawGph.lw_grid", className: "form-control", unit: "pt" }] },
      { type: "rangeText", labelHTML: 'グリッド<span class="badge-label">K</span>', bind: "RPTST.refs.rawGph.c_grid" },
      { type: "inputs", labelHTML: '回帰線<span class="badge-label">線幅</span>', inputs: [{ inputType: "number", bind: "RPTST.refs.rawGph.lw_reg", className: "form-control", unit: "pt" }] }
    ],
    'symb': [
      { type: "symbAxis", label: "属性選択", labelClass: "panel", marginBottom: "12px", id: "boxSymbAxis", bindFields: "RPTST.data.axisFields", resetAction: "RepoSt.resetSymb" },
      { type: "symbolTable", id: "tblSymb", bindSrc: "RPTST.data.symbSrc" }
    ]
  };
</script>
