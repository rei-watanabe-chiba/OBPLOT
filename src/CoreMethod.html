<script>
  const CoreMethod = {
    Util: class {
      static toObjArray(data) {
        if (!data?.length) return [];
        const [hdr, ...body] = data;
        return body.map(r => hdr.reduce((a, h, i) => ({ ...a, [String(h).trim()]: r[i] }), {}));
      }
      static remapArry(data, idxArr, newHdr = null) {
        if (!data?.length) return [];
        const remap = r => idxArr.map(idx => idx !== -1 ? (r?.[idx] ?? "") : "");
        return [newHdr ?? remap(data[0]), ...data.slice(1).map(remap)];
      }
      static validateSelect(vals, quota = vals.length) {
        const chkVals = vals.slice(0, quota);
        return vals.map((v, i) => i < quota ? (!v || chkVals.indexOf(v) !== chkVals.lastIndexOf(v)) : false);
      }
      static sortKeysByVal = obj => Object.keys(obj).sort((a, b) => obj[a] - obj[b]);
      static getValidNums = (arr, reqPos = false) => arr.map(Number).filter(v => !isNaN(v) && (!reqPos || v > 0));
      static buildStats(statsDT, digits = 3, fmlRls = null) {
        if (!statsDT) return [];
        const fmt = v => (v != null && !isNaN(v)) ? Number(v).toFixed(digits) : "-";
        const meta = { ...statsDT, sign: statsDT.intercept >= 0 ? "+" : "-", abs_intercept: Math.abs(statsDT.intercept ?? 0) };
        if (fmlRls?.length) {
          return fmlRls.map(({ key, label }) => {
            if (!key) return [label ?? "", ""];
            const valStr = meta[key] !== undefined ? (meta[key] === meta.sign ? meta[key] : fmt(meta[key])) : key.replace(/\{(\w+)\}/g, (m, k) => meta[k] !== undefined ? (k === "sign" ? meta[k] : fmt(meta[k])) : m);
            return [label ?? "", valStr];
          });
        }
        return [
          statsDT.count != null ? ["データ個数", statsDT.count] : null,
          (statsDT.r != null && statsDT.r2 != null) ? ["相関係数", `R = ${fmt(statsDT.r)} , R² = ${fmt(statsDT.r2)}`] : null,
          (statsDT.slope != null && statsDT.intercept != null) ? ["回帰直線", `y = ${fmt(statsDT.slope)}x ${meta.sign} ${fmt(meta.abs_intercept)}`] : null,
          statsDT.resStdDev != null ? ["残差標準偏差", fmt(statsDT.resStdDev)] : null,
          statsDT.err3Sigma != null ? ["器械Err3σ", fmt(statsDT.err3Sigma)] : null
        ].filter(Boolean);
      }
      static calcScale(xVals, yVals, desiredTicks = 4) {
        if (!xVals?.length || !yVals?.length) return { niceMin: 0, niceMax: 0, niceTicks: [] };
        const [xMin, xMax, yMin, yMax] = [Math.min(...xVals), Math.max(...xVals), Math.min(...yVals), Math.max(...yVals)];
        const isAllPos = xMin >= 0 && yMin >= 0;
        const rawMin = isAllPos ? 0 : Math.min(xMin, yMin);
        const rawMax = Math.max(xMax, yMax);
        const rawStep = (rawMax - rawMin || 1) / (desiredTicks - 1);
        const exp = Math.floor(Math.log10(rawStep));
        const frac = rawStep / Math.pow(10, exp);
        const niceFrac = frac <= 1.2 ? 1 : (frac <= 2.5 ? 2 : (frac <= 6.0 ? 5 : 10));
        const niceStep = niceFrac * Math.pow(10, exp);
        const niceMin = isAllPos ? 0 : Math.floor(rawMin / niceStep) * niceStep;
        const niceMax = Math.ceil(rawMax / niceStep) * niceStep;
        const decimals = exp < 0 ? Math.abs(exp) : 0;
        const niceTicks = Array.from({ length: Math.round((niceMax - niceMin) / niceStep) + 1 }, (_, i) => {
          const v = niceMin + (i * niceStep);
          return { v: v, f: Math.abs(v) >= 1000 ? `${(v / 1000).toFixed(0)}k` : (decimals > 0 ? v.toFixed(decimals) : v.toLocaleString()) };
        });
        return { niceMin, niceMax, niceTicks };
      }
      static genHeader(type) {
        const { key1, key2, p1, p2, wd1, wd2 } = GLB.idx;
        const obK = this.sortKeysByVal(GLB.obsidianIndex), mdK = this.sortKeysByVal(GLB.mudrockIndex);
        switch(type) {
          case 'tracer5i': return ['計測ID', key1, key2, p1, p2, ...obK.map(k => `ob_${k}`), ...mdK.map(k => `md_${k}`), ...obK.map(k => `ob_${k}_Err`), ...mdK.map(k => `md_${k}_Err`)];
          case 'pxrf': return ['計測ID', key1, key2, p1, p2, wd1, wd2, ...GLB.valElms, ...GLB.valElms.map(e => `${e}_Err`)];
          case 'wdxrf': return [key1, key2, wd1, wd2, ...GLB.valElms];
          case 'crct': return ['IndexName', ...GLB.valElms.flatMap(e => [`${e}_slp`, `${e}_int`])];
          case 'filelist': return ['file', 'mode', key2, 'sub_id', 'info', '計測ID'];
          case 'rawFile': return ['file', 'mode', key2, 'sub_id', 'info'];
          default: return [];
        }
      }
      static valdEnv(curShts, schemaType) {
        const schema = GLB.schema[schemaType].map(s => ({ ...s, hdr: s.hdrType ? this.genHeader(s.hdrType) : [] }));
        const exMap = new Map(curShts.map(s => [s.name, s.hdr]));
        const createHeaderValidator = (label) => (h, req) =>
          JSON.stringify(h) !== JSON.stringify(req) ? `・${label}ヘッダー不正` : null;
        const vls = {
          tracer5i: createHeaderValidator("tracer5i"),
          pxrf: createHeaderValidator("PXRF"),
          crct: createHeaderValidator("Correction"),
          wdxrf: (h, req) => { const ms = req.filter(e => !h.includes(e)); return ms.length ? `・WDXRF必須項目不足: ${ms.join(', ')}` : null; }
        }; 
        const errs = schema.map(s => exMap.has(s.name) && s.validRule ? vls[s.validRule]?.(exMap.get(s.name), s.hdr) : null).filter(Boolean);
        const isMissing = schema.some(s => !exMap.has(s.name));
        const needsSort = isMissing || schema.some((s, i) => curShts[i]?.name !== s.name);
        const buildPlan = (isMissing || needsSort) ? schema.map((s, idx) => ({ name: s.name, hdr: s.hdr, lock: s.lock, clr: s.clr || !exMap.has(s.name), idx })) : [];
        const missingNames = schema.filter(s => !exMap.has(s.name)).map(s => s.name);
        return { errs, buildPlan, missingNames };
      }
      static genDB(pxrfDT, wdxrfDT, conf = {}) {
        const pObjs = CoreMethod.Util.toObjArray(pxrfDT);
        const wObjs = CoreMethod.Util.toObjArray(wdxrfDT);
        const { key1: k1, key2: k2, wd1: w1, wd2: w2 } = GLB.idx;
        const wMap = new Map(wObjs.map(o => [`${String(o[k1])}_${String(o[k2])}`, o]));
        const dbs = new Set();
        pObjs.forEach(pObj => {
          const wObj = wMap.get(`${String(pObj[k1])}_${String(pObj[k2])}`);
          if (conf.mixWD === true) {
            pObj[w1] = wObj?.[w1] ?? "Unknown"; 
            pObj[w2] = wObj?.[w2] ?? "Unknown";
          }
          if (pObj[k1]) dbs.add(pObj[k1]);
        });
        return { pxrfDT: pObjs, wdxrfDT: wObjs, dbs: [...dbs] };
      }
      static fltrDB(wrapPXRF, wrapWDXRF, selDBs, isTracer5i = false) {
        const tgtSet = new Set(selDBs);
        const { key1: k1, key2: k2, p1: p1, p2: p2, wd1: w1, wd2: w2 } = GLB.idx;
        const pxrfDT = wrapPXRF.filter(obj => tgtSet.has(obj[k1])).map(r => {
          const base = { '計測ID': r['計測ID'], [k1]: r[k1], [k2]: r[k2], [p1]: r[p1], [p2]: r[p2], [w1]: r[w1], [w2]: r[w2] };
          const vals = isTracer5i 
            ? Object.fromEntries(GLB.valElms.flatMap(e => [[`ob_${e}`, r[`ob_${e}`]], [`md_${e}`, r[`md_${e}`]], [`ob_${e}_Err`, r[`ob_${e}_Err`]], [`md_${e}_Err`, r[`md_${e}_Err`]]]))
            : Object.fromEntries(GLB.valElms.flatMap(e => [[e, r[e]], [`${e}_Err`, r[`${e}_Err`]]]));
          return { ...base, ...vals };
        });
        const wdxrfDT = wrapWDXRF.filter(obj => tgtSet.has(obj[k1])).map(r => ({
          [k1]: r[k1], [k2]: r[k2], [w1]: r[w1], [w2]: r[w2],
          ...Object.fromEntries(GLB.valElms.map(e => [e, r[e]]))
        }));
        return { pxrfDT, wdxrfDT };
      }
    },
    Calc: class {
      static evaluate(fml, rData) {
        if (!fml) return null;
        try {
          const res = math.evaluate(fml, rData);
          return isNaN(res) || !isFinite(res) ? null : res;
        } catch (e) { return null; }
      }
      static calcCALB(wdxrfVals, pxrfVals) {
        if (!wdxrfVals?.length || wdxrfVals.length < 2 || wdxrfVals.length !== pxrfVals?.length) return null;
        try {
          const d = [];
          for (let i = 0; i < wdxrfVals.length; i++) {
            if (wdxrfVals[i] != null && pxrfVals[i] != null && !isNaN(wdxrfVals[i]) && !isNaN(pxrfVals[i])) d.push([wdxrfVals[i], pxrfVals[i]]);
          }
          if (d.length < 2) return null;
          const { m: slope, b: intercept } = ss.linearRegression(d);
          return (isNaN(slope) || isNaN(intercept) || slope === 0) ? null : { slp: slope, int: intercept };
        } catch (e) { return null; }
      }
      static calcReg(xArr, yArr, errArr) {
        if (!xArr?.length || xArr.length !== yArr?.length) return null;
        const d = [], valX = [], valY = [], valErr = [];
        for (let i = 0; i < xArr.length; i++) {
          if (xArr[i] != null && yArr[i] != null && !isNaN(xArr[i]) && !isNaN(yArr[i])) {
            d.push([xArr[i], yArr[i]]);
            valX.push(xArr[i]); valY.push(yArr[i]);
            if (errArr && errArr[i] != null) valErr.push(errArr[i]);
          }
        }
        const n = valX.length;
        if (n < 2) return null; 
        const { m: slope, b: intercept } = ss.linearRegression(d);
        const r = ss.sampleCorrelation(valX, valY), r2 = r * r;
        let ssRes = 0, maxRes = 0;
        valX.forEach((x, i) => { const res = Math.abs(valY[i] - (slope * x + intercept)); ssRes += res * res; maxRes = Math.max(maxRes, res); });
        const resStdDev = n > 2 ? Math.sqrt(ssRes / (n - 2)) : 0;
        let err3Sigma = 0;
        if (valErr.length > 2) {
          const meanErr = valErr.reduce((a, b) => a + b, 0) / valErr.length;
          err3Sigma = Math.sqrt(valErr.reduce((a, b) => a + (b - meanErr) ** 2, 0) / (valErr.length - 1)) * 3;
        }
        return { count: n, slope, intercept, r, r2, resStdDev, err3Sigma, maxRes };
      }
    }
  };
</script>
