<script>
  // ==========================================
  // インフラ・通信・永続化層 (Platform Adapter)
  // ==========================================
  const isExcelEnv = typeof Office !== 'undefined';

  // --- GAS用 通信API ---
  class GasService {
    static #serverCall(funcName, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(r => r?.success ? resolve(r.payload) : reject(new Error(`[${r?.errorType || 'ERR'}] ${r?.message}`)))
          .withFailureHandler(e => reject(new Error(`[NET_ERR] ${e.message}`)))
          [funcName](...args);
      });
    }
    static fetchDT(ssId, sht, qCol = null, lCol = null) { return this.#serverCall("fetchDT", ssId, sht, qCol, lCol); }
    static writeData(ssId, sht, data, opts = "clear") { return this.#serverCall("writeData", ssId, sht, data, opts); }
    static getReportTemplate() { return this.#serverCall("getReportTemplate"); }
    static getWbState(ssId) { return this.#serverCall("getWbState", ssId); }
    static buildShts(ssId, buildPlan) { return this.#serverCall("buildShts", ssId, buildPlan); }
  }

  // --- GAS用 ローカルストレージ ---
  class LocalStorageAdapter {
    static save(key, val) { localStorage.setItem(key, val); }
    static load(key) { return localStorage.getItem(key); }
    static clear(key) { localStorage.removeItem(key); }
  }

  // --- Excel用 通信API ---
  class ExcelAdapter {
    static async #run(fn) {
      try { return await Excel.run(fn); }
      catch (e) { throw new Error(`[EXCEL_ERR] ${e.message}`); }
    }
    
    // データ取得
    static async fetchDT(ssId, shtName, qCol = null, lCol = null) {
      return this.#run(async (ctx) => {
        const sht = ctx.workbook.worksheets.getItemOrNullObject(shtName);
        await ctx.sync();
        if (sht.isNullObject) throw new Error(`シート「${shtName}」不在`);
        const rng = sht.getUsedRangeOrNullObject();
        rng.load("values");
        await ctx.sync();
        if (rng.isNullObject || !rng.values || rng.values.length <= 1) throw new Error("データが1行以下");
        const raw = rng.values;
        if (qCol && raw[0].length < qCol) throw new Error("データ列不足");
        const data = lCol ? raw.map(r => r.slice(0, lCol)) : raw;
        return { data, message: `取得: ${data.length} 行` };
      });
    }

    // データ出力
    static async writeData(ssId, shtName, data, opts = "clear") {
      return this.#run(async (ctx) => {
        const sht = ctx.workbook.worksheets.getItemOrNullObject(shtName);
        await ctx.sync();
        if (sht.isNullObject) throw new Error(`シート「${shtName}」不在`);
        const oArr = [].concat(opts);
        if (oArr.includes("clear")) {
          sht.getUsedRangeOrNullObject().clear();
          await ctx.sync();
        }
        let sRow = 0;
        if (oArr.includes("append")) {
          const uRng = sht.getUsedRangeOrNullObject();
          uRng.load("rowCount");
          await ctx.sync();
          sRow = uRng.isNullObject ? 0 : uRng.rowCount;
        }
        const tRng = sht.getRangeByIndexes(sRow, 0, data.length, data[0].length);
        tRng.values = data;
        await ctx.sync();
        return "書き出し完了";
      });
    }

    // レポートテンプレート取得
    static async getReportTemplate() {
      if (window.__REPORT_TEMPLATE__) return window.__REPORT_TEMPLATE__;
      const res = await fetch('Report.html');
      if (!res.ok) throw new Error("テンプレート取得失敗");
      return await res.text();
    }

    // ブック状態取得
    static async getWbState(ssId) {
      return this.#run(async (ctx) => {
        const shts = ctx.workbook.worksheets;
        shts.load("items/name");
        await ctx.sync();
        const rngInfo = shts.items.map(s => {
          const rng = s.getUsedRangeOrNullObject();
          rng.load("columnCount");
          return rng;
        });
        await ctx.sync();
        const hdrs = shts.items.map((s, i) => {
          const c = rngInfo[i].columnCount;
          if (rngInfo[i].isNullObject || c === 0) return null;
          const hRng = s.getRangeByIndexes(0, 0, 1, c);
          hRng.load("values");
          return hRng;
        });
        await ctx.sync();
        return shts.items.map((s, i) => ({
          name: s.name,
          hdr: hdrs[i] ? hdrs[i].values[0] : []
        }));
      });
    }

    // シート動的構築とソート
    static async buildShts(ssId, buildPlan) {
      return this.#run(async (ctx) => {
        const shts = ctx.workbook.worksheets;
        shts.load("items/name");
        await ctx.sync();
        const exMap = new Map(shts.items.map(s => [s.name, s]));
        buildPlan.forEach(({ name, hdr, lock, clr, idx }) => {
          let s = exMap.get(name) || shts.add(name);
          if (clr) {
            s.getUsedRangeOrNullObject().clear();
            if (hdr?.length) {
              const hRng = s.getRangeByIndexes(0, 0, 1, hdr.length);
              hRng.values = [hdr];
              if (lock) {
                hdr.forEach((v, i) => {
                  const r = s.getRangeByIndexes(0, i, 1, 1);
                  r.dataValidation.rule = { list: { inCellDropDown: false, source: String(v) } };
                  r.dataValidation.errorAlert = { message: "システム保護: 編集禁止", showAlert: true, style: "Stop", title: "保護" };
                });
              }
            }
          }
          if (idx !== undefined) s.position = idx;
        });
        await ctx.sync();
        return "構成更新完了";
      });
    }
  }

  // --- Excel用 ストレージ ---
  class OfficeStorageAdapter {
    static save(key, data) {
      try {
        if (Office?.context?.document?.settings) {
          Office.context.document.settings.set(key, data);
          Office.context.document.settings.saveAsync();
        }
      } catch (e) {}
    }
    static load(key) {
      try { return Office?.context?.document?.settings?.get(key) || null; } catch (e) { return null; }
    }
    static clear(key) {
      try {
        if (Office?.context?.document?.settings) {
          Office.context.document.settings.remove(key);
          Office.context.document.settings.saveAsync();
        }
      } catch (e) {}
    }
  }

  // --- 環境に応じたDI (依存性注入) ---
  const API = isExcelEnv ? ExcelAdapter : GasService;
  const StorageAPI = isExcelEnv ? OfficeStorageAdapter : LocalStorageAdapter;
</script>
