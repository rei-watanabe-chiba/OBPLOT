<script>
  // ==========================================
  // インフラ・通信・永続化層 (Platform Adapter)
  // ==========================================
  const isExcelEnv = typeof Office !== 'undefined';

  // --- GAS用 通信API ---
  class GasSvc {
    static #srvCall(funcName, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(r => r?.success ? resolve(r.pld) : reject(new Error(`[${r?.errorType || 'ERR'}] ${r?.msg}`)))
          .withFailureHandler(e => reject(new Error(`[NET_ERR] ${e.message}`)))
          [funcName](...args);
      });
    }
    static pullDT(ssId, sht, qCol = null, lCol = null) { return this.#srvCall("pullDT", ssId, sht, qCol, lCol); }
    static pushDT(ssId, sht, data, opts = "clear") { return this.#srvCall("pushDT", ssId, sht, data, opts); }
    static pullMult(ssId, reqs) { return this.#srvCall("pullMult", ssId, reqs); }
    static pushMult(ssId, reqs) { return this.#srvCall("pushMult", ssId, reqs); }
    static getReportTemplate() { return this.#srvCall("getReportTemplate"); }
    static getWbState(ssId, targetShts = []) { return this.#srvCall("getWbState", ssId, targetShts); }
    static genShts(ssId, buildPlan) { return this.#srvCall("genShts", ssId, buildPlan); }
    static saveUserProp(key, val) { return this.#srvCall("saveUserProp", key, val); }
    static loadUserProp(key) { return this.#srvCall("loadUserProp", key); }
    static deleteUserProp(key) { return this.#srvCall("deleteUserProp", key); }
  }

  // --- GAS用 プロパティストレージ ---
  class GasPropsStrg {
    static async save(key, val) { return GasSvc.saveUserProp(key, val); }
    static async load(key) { return GasSvc.loadUserProp(key); }
    static async clear(key) { return GasSvc.deleteUserProp(key); }
  }

  // --- Excel用 通信API ---
  class ExcelAdpt {
    static async #run(fn) {
      try { return await Excel.run(fn); }
      catch (e) { throw new Error(`[EXCEL_ERR] ${e.message}`); }
    }
    
    // データ取得
    static async pullDT(ssId, shtName, qCol = null, lCol = null) {
      return this.#run(async (ctx) => {
        const sht = ctx.workbook.worksheets.getItemOrNullObject(shtName);
        await ctx.sync();
        if (sht.isNullObject) throw new Error(`シート「${shtName}」不在`);
        const rng = sht.getUsedRangeOrNullObject();
        rng.load("values");
        await ctx.sync();
        if (rng.isNullObject || !rng.values || rng.values.length <= 1) throw new Error("データが1行以下");
        const raw = rng.values;
        if (qCol && raw[0].length < qCol) throw new Error("データ列不足");
        const data = lCol ? raw.map(r => r.slice(0, lCol)) : raw;
        return { data, msg: `取得: ${data.length} 行` };
      });
    }

    // データ出力
    static async pushDT(ssId, shtName, data, opts = "clear") {
      return this.#run(async (ctx) => {
        const sht = ctx.workbook.worksheets.getItemOrNullObject(shtName);
        await ctx.sync();
        if (sht.isNullObject) throw new Error(`シート「${shtName}」不在`);
        const oArr = [].concat(opts);
        if (oArr.includes("clear")) {
          sht.getUsedRangeOrNullObject().clear();
          await ctx.sync();
        }
        let sRow = 0;
        if (oArr.includes("append")) {
          const uRng = sht.getUsedRangeOrNullObject();
          uRng.load("rowCount");
          await ctx.sync();
          sRow = uRng.isNullObject ? 0 : uRng.rowCount;
        }
        const tRng = sht.getRangeByIndexes(sRow, 0, data.length, data[0].length);
        tRng.values = data;
        await ctx.sync();
        return "書き出し完了";
      });
    }

    static async pullMult(ssId, reqs) {
      const results = [];
      for (const req of reqs) {
        try {
          const res = await this.pullDT(ssId, req.sht, req.qCol, req.lCol);
          results.push({ success: true, pld: res });
        } catch (e) {
          results.push({ success: false, msg: e.message });
        }
      }
      return results;
    }

    static async pushMult(ssId, reqs) {
      const results = [];
      for (const req of reqs) {
        try {
          const res = await this.pushDT(ssId, req.sht, req.data, req.opts || "clear");
          results.push({ success: true, pld: res });
        } catch (e) {
          results.push({ success: false, msg: e.message });
        }
      }
      return results;
    }

    // レポートテンプレート取得
    static async getReportTemplate() {
      if (window.__REPORT_TEMPLATE__) return window.__REPORT_TEMPLATE__;
      const res = await fetch('Report.html');
      if (!res.ok) throw new Error("テンプレート取得失敗");
      return await res.text();
    }

    // ブック状態取得
    static async getWbState(ssId, targetShts = []) {
      return this.#run(async (ctx) => {
        const shts = ctx.workbook.worksheets;
        shts.load("items/name");
        await ctx.sync();
        const rngInfo = shts.items.map(s => {
          if (targetShts.length > 0 && !targetShts.includes(s.name)) return null;
          const rng = s.getUsedRangeOrNullObject();
          rng.load("columnCount");
          return rng;
        });
        await ctx.sync();
        const hdrs = shts.items.map((s, i) => {
          if (!rngInfo[i]) return null;
          const c = rngInfo[i].columnCount;
          if (rngInfo[i].isNullObject || c === 0) return null;
          const hRng = s.getRangeByIndexes(0, 0, 1, c);
          hRng.load("values");
          return hRng;
        });
        await ctx.sync();
        return shts.items.map((s, i) => ({
          name: s.name,
          hdr: hdrs[i] ? hdrs[i].values[0] : []
        }));
      });
    }

    // シート動的構築とソート
    static async genShts(ssId, buildPlan) {
      return this.#run(async (ctx) => {
        const shts = ctx.workbook.worksheets;
        shts.load("items/name");
        await ctx.sync();
        const exMap = new Map(shts.items.map(s => [s.name, s]));
        buildPlan.forEach(({ name, hdr, lock, clr, idx }) => {
          let s = exMap.get(name) || shts.add(name);
          if (clr) {
            s.getUsedRangeOrNullObject().clear();
            if (hdr?.length) {
              const hRng = s.getRangeByIndexes(0, 0, 1, hdr.length);
              hRng.values = [hdr];
              if (lock) {
                hdr.forEach((v, i) => {
                  const r = s.getRangeByIndexes(0, i, 1, 1);
                  r.dataValidation.rule = { list: { inCellDropDown: false, source: String(v) } };
                  r.dataValidation.errorAlert = { message: "システム保護: 編集禁止", showAlert: true, style: "Stop", title: "保護" };
                });
              }
            }
          }
          if (idx !== undefined) s.position = idx;
        });
        await ctx.sync();
        return "構成更新完了";
      });
    }
  }

  // --- Excel用 ストレージ ---
  class OfcStrg {
    static async save(key, data) {
      return new Promise((resolve) => {
        try {
          if (Office?.context?.document?.settings) {
            Office.context.document.settings.set(key, data);
            Office.context.document.settings.saveAsync(r => resolve(r?.status === Office.AsyncResultStatus.Succeeded));
            return;
          }
        } catch (e) {}
        resolve(false);
      });
    }
    static async load(key) {
      try { return Office?.context?.document?.settings?.get(key) || null; } catch (e) { return null; }
    }
    static async clear(key) {
      return new Promise((resolve) => {
        try {
          if (Office?.context?.document?.settings) {
            Office.context.document.settings.remove(key);
            Office.context.document.settings.saveAsync(r => resolve(r?.status === Office.AsyncResultStatus.Succeeded));
            return;
          }
        } catch (e) {}
        resolve(false);
      });
    }
  }

  // --- 環境に応じたDI (依存性注入) ---
  const API = isExcelEnv ? ExcelAdpt : GasSvc;
  const StorageAPI = isExcelEnv ? OfcStrg : GasPropsStrg;
</script>
