<script>
  // --- Excel用ストレージ ---
  class OfficeStorageAdapter {
    static save(key, data) {
      try {
        if (Office?.context?.document?.settings) {
          Office.context.document.settings.set(key, data);
          Office.context.document.settings.saveAsync();
        }
      } catch (e) {}
    }
    static load(key) {
      try {
        if (Office?.context?.document?.settings) {
          return Office.context.document.settings.get(key) || null;
        }
        return null;
      } catch (e) { return null; }
    }
    static clear(key) {
      try {
        if (Office?.context?.document?.settings) {
          Office.context.document.settings.remove(key);
          Office.context.document.settings.saveAsync();
        }
      } catch (e) {}
    }
  }
  // --- Excel用通信API ---
  class ExcelAdapter {
    static async #run(fn) {
      try { return await Excel.run(fn); }
      catch (e) { throw new Error(`[EXCEL_ERR] ${e.message}`); }
    }
    // --- データ取得 ---
    // GAS版に合わせ引数無視
    static async fetchDT(ssId, shtName, qCol = null, lCol = null) {
      return this.#run(async (ctx) => {
        const sht = ctx.workbook.worksheets.getItemOrNullObject(shtName);
        await ctx.sync();
        if (sht.isNullObject) throw new Error(`シート「${shtName}」不在`);
        const rng = sht.getUsedRangeOrNullObject();
        rng.load("values");
        await ctx.sync();
        if (rng.isNullObject || !rng.values || rng.values.length <= 1) throw new Error("データが1行以下");
        const raw = rng.values;
        if (qCol && raw[0].length < qCol) throw new Error("データ列不足");
        const data = lCol ? raw.map(r => r.slice(0, lCol)) : raw;
        return { data, message: `取得: ${data.length} 行` };
      });
    }
    // --- データ出力 ---
    // GAS版に合わせ引数無視
    static async writeData(ssId, shtName, data, opts = "clear") {
      return this.#run(async (ctx) => {
        const sht = ctx.workbook.worksheets.getItemOrNullObject(shtName);
        await ctx.sync();
        if (sht.isNullObject) throw new Error(`シート「${shtName}」不在`);
        const oArr = [].concat(opts);
        if (oArr.includes("clear")) {
          sht.getUsedRangeOrNullObject().clear();
          await ctx.sync();
        }
        let sRow = 0;
        if (oArr.includes("append")) {
          const uRng = sht.getUsedRangeOrNullObject();
          uRng.load("rowCount");
          await ctx.sync();
          sRow = uRng.isNullObject ? 0 : uRng.rowCount;
        }
        const tRng = sht.getRangeByIndexes(sRow, 0, data.length, data[0].length);
        tRng.values = data;
        await ctx.sync();
        return "書き出し完了";
      });
    }
    // --- レポートテンプレート取得 ---
    static async getReportTemplate() {
      if (window.__REPORT_TEMPLATE__) return window.__REPORT_TEMPLATE__;
      const res = await fetch('Report.html');
      if (!res.ok) throw new Error("テンプレート取得失敗");
      return await res.text();
    }
    // --- 環境セットアップ汎用エンジン ---
    static async setupEnvironment(ssId, schema, valElms, isForce) {
      return this.#run(async (ctx) => {
        const shts = ctx.workbook.worksheets;
        shts.load("items/name");
        await ctx.sync();
        const exMap = new Map(shts.items.map(s => [s.name, s]));
        // 不足検知
        const missing = schema.map(s => s.name).filter(n => !exMap.has(n));
        if (missing.length && !isForce) return { reqConfirm: true, missing };
        // シートルール
        const setH = (s, h) => h && (s.getRangeByIndexes(0, 0, 1, h.length).values = [h]);
        const getH = async s => {
          const rng = s.getUsedRangeOrNullObject();
          rng.load("columnCount");
          await ctx.sync();
          if (rng.isNullObject || !rng.columnCount) return [];
          const hRng = s.getRangeByIndexes(0, 0, 1, rng.columnCount);
          hRng.load("values");
          await ctx.sync();
          return hRng.values[0];
        };
        // WDXRF順序不同許容・包含確認
        const vls = {
          pxrf: (h, req) => JSON.stringify(h) !== JSON.stringify(req) ? "・PXRFヘッダー不正" : null,
          corr: (h, req) => JSON.stringify(h) !== JSON.stringify(req) ? "・Correctionヘッダー不正" : null,
          wdxrf: (h, req) => { const ms = req.filter(e => !h.includes(e)); return ms.length ? `・WDXRF必須項目不足: ${ms.join(', ')}` : null; }
        };
        // 生成/クリア・検証・ソート
        const errs = [];
        for (const [i, { name, hdr, clr, validRule, lock }] of schema.entries()) {
          let sht = exMap.get(name), curH = hdr;
          if (!sht) {
            sht = shts.add(name);
            setH(sht, hdr);
          } else {
            clr && (sht.getUsedRangeOrNullObject().clear(), setH(sht, hdr));
            if (validRule) {
              curH = await getH(sht);
              const err = vls[validRule]?.(curH, hdr);
              err && errs.push(err);
            }
          }
          sht.position = i;
          if (lock && curH?.length) {
            curH.forEach((v, idx) => {
              const r = sht.getRangeByIndexes(0, idx, 1, 1);
              r.dataValidation.rule = { list: { inCellDropDown: false, source: String(v) } };
              r.dataValidation.errorAlert = { message: "システム保護: 編集禁止", showAlert: true, style: "Stop", title: "保護" };
            });
          }
        }
        if (errs.length) throw new Error(`【検証エラー】\n${errs.join('\n')}\n\nGitHub仕様をご確認ください。`);
        await ctx.sync();
        return { reqConfirm: false };
      });
    }
  }
</script>
