<script>
  // --- Excel用ストレージ ---
  class OfficeStorageAdapter {
    static save(key, data) {
      Office.context.document.settings.set(key, data);
      Office.context.document.settings.saveAsync();
    }
    static load(key) {
      return Office.context.document.settings.get(key);
    }
    static clear(key) {
      Office.context.document.settings.remove(key);
      Office.context.document.settings.saveAsync();
    }
  }

  // --- Excel用通信API ---
  class ExcelAdapter {
    static async #run(fn) {
      try { return await Excel.run(fn); }
      catch (e) { throw new Error(`[EXCEL_ERR] ${e.message}`); }
    }

    // --- データ取得 ---
    static async fetchDT(shtName, qCol = null, lCol = null) {
      return this.#run(async (ctx) => {
        const sht = ctx.workbook.worksheets.getItemOrNullObject(shtName);
        await ctx.sync();
        if (sht.isNullObject) throw new Error(`シート「${shtName}」不在`);
        const rng = sht.getUsedRangeOrNullObject();
        rng.load("values");
        await ctx.sync();
        if (rng.isNullObject || !rng.values || rng.values.length <= 1) throw new Error("データが1行以下");
        const raw = rng.values;
        if (qCol && raw[0].length < qCol) throw new Error("データ列不足");
        const data = lCol ? raw.map(r => r.slice(0, lCol)) : raw;
        return { data, message: `取得: ${data.length} 行` };
      });
    }

    // --- データ出力 ---
    static async writeData(shtName, data, opts = "clear") {
      return this.#run(async (ctx) => {
        const sht = ctx.workbook.worksheets.getItemOrNullObject(shtName);
        await ctx.sync();
        if (sht.isNullObject) throw new Error(`シート「${shtName}」不在`);
        const oArr = [].concat(opts);
        if (oArr.includes("clear")) {
          sht.getUsedRangeOrNullObject().clear();
          await ctx.sync();
        }
        let sRow = 0;
        if (oArr.includes("append")) {
          const uRng = sht.getUsedRangeOrNullObject();
          uRng.load("rowCount");
          await ctx.sync();
          sRow = uRng.isNullObject ? 0 : uRng.rowCount;
        }
        const tRng = sht.getRangeByIndexes(sRow, 0, data.length, data[0].length);
        tRng.values = data;
        // ※Excel版での書式ルール拡張(rule)は安全のためスキップ
        await ctx.sync();
        return "書き出し完了";
      });
    }

    // --- レポートテンプレート取得 ---
    static async getReportTemplate() {
      if (window.__REPORT_TEMPLATE__) return window.__REPORT_TEMPLATE__;
      const res = await fetch('Report.html');
      if (!res.ok) throw new Error("テンプレート取得失敗");
      return await res.text();
    }

    // --- 環境セットアップ ---
    static async setupEnvironment(orderedShts, valElms, pxrfHdr, filelistHdr) {
    return this.#run(async (ctx) => {
      const shts = ctx.workbook.worksheets;
      shts.load("items/name");
      await ctx.sync();
      const existingMap = new Map(shts.items.map(s => [s.name, s]));
      // 1. 生成・リセットと検証
      for (const name of orderedShts) {
        let sht = existingMap.get(name);
        if (!sht) {
          sht = shts.add(name);
          if (name === 'PXRF' || name === '抽出データ') sht.getRangeByIndexes(0, 0, 1, pxrfHdr.length).values = [pxrfHdr];
          if (name === 'ファイルリスト') sht.getRangeByIndexes(0, 0, 1, filelistHdr.length).values = [filelistHdr];
          existingMap.set(name, sht);
        } else {
          if (name === '抽出データ' || name === 'ファイルリスト') {
            sht.getUsedRangeOrNullObject().clear();
            if (name === 'ファイルリスト') sht.getRangeByIndexes(0, 0, 1, filelistHdr.length).values = [filelistHdr];
          }
          if (name === 'PXRF' || name === 'WDXRF') {
            const uRng = sht.getUsedRangeOrNullObject();
            uRng.load("columnCount");
            await ctx.sync();
            if (!uRng.isNullObject && uRng.columnCount > 0) {
              const hdrRng = sht.getRangeByIndexes(0, 0, 1, uRng.columnCount);
              hdrRng.load("values");
              await ctx.sync();
              const hdr = hdrRng.values[0];
              if (name === 'PXRF' && JSON.stringify(hdr) !== JSON.stringify(pxrfHdr)) {
                throw new Error(`【検証エラー】\nPXRFシートのヘッダーが規定と異なります。\nGitHub仕様をご確認ください。`);
              }
              if (name === 'WDXRF') {
                const missing = valElms.filter(e => !hdr.includes(e));
                if (missing.length > 0) throw new Error(`【検証エラー】\nWDXRFシートのヘッダーに必須元素 (${missing.join(',')}) が不足しています。`);
              }
            }
          }
        }
      }
      // 2. 並び順の強制
      for (let i = 0; i < orderedShts.length; i++) existingMap.get(orderedShts[i]).position = i;
      // 3. ヘッダーロック (入力規則)
      for (const name of ['PXRF', 'WDXRF']) {
        const sht = existingMap.get(name);
        const row1 = sht.getRange("1:1");
        row1.dataValidation.rule = { custom: { formula: "=FALSE" } };
        row1.dataValidation.errorAlert = { message: "システム保護: ヘッダー行の編集は禁止されています。", showAlert: true, style: "Stop", title: "編集禁止" };
      }
      await ctx.sync();
      return true;
    });
  }
}
</script>
