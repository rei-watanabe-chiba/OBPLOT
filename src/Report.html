<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <base target="_top">
    <script src="https://cdn.jsdelivr.net/npm/simple-statistics@7.8.3/dist/simple-statistics.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.1/lib/browser/math.min.js"></script>
    <?!= include("CSS"); ?>
    <?!= include("ReportCSS"); ?>
  </head>
  <body data-theme="tab2">
    <script>window.__INJECTED_DATA__ = 'INJECT_TARGET';</script>

    <?!= include('Global'); ?>
    <?!= include('Model'); ?>
    <?!= include('Method'); ?>
    <?!= include('Component'); ?>
    <?!= include('Chart'); ?>
    
    <div class="dash-layout">
      <!-- 左サイドバー -->
      <aside class="dash-sidebar" id="dashSidebar">
        <!-- レイアウト構成 -->
        <details class="sub-sec" open>
          <summary>レイアウト構成</summary>
          <div class="field-row">
            <button data-action="addRow" data-type="primary" class="outline">＋ 行を追加</button>
            <button data-action="addCol" data-type="primary" class="outline">＋ 列を追加</button>
          </div>
          <div class="field-row">
            <button data-action="resetGrid" data-type="primary" class="outline">1×1にリセット</button>
          </div>
          <label>パネル間余白 [pt]</label>
          <div class="field-row">
            <input type="number" data-bind="panelGap" min="0" max="50" step="0.5" class="form-control">
          </div>
          <div class="field-row" style="margin-top: 16px;">
            <button data-action="printPDF" data-type="primary">PDF出力（裏で印刷）</button>
          </div>
        </details>

        <!-- 全体補正設定 -->
        <details class="sub-sec" open style="margin-top: 16px;">
          <summary>全体補正設定</summary>
          <div class="field-row">
            <!-- 修正: ラベルを削除 -->
            <div class="field-col" id="boxGlobalCorr"></div>
            <div class="field-col" style="display:flex; align-items:flex-end; padding-bottom:4px;">
              <div id="boxGlobalCalTgl"></div>
            </div>
          </div>
          <label>補正対象元素</label>
          <ob-multi-select id="boxGlobalCalElms" data-change-item="dummyItem" data-change-all="dummyAll"></ob-multi-select>
        </details>

        <!-- シンボル設定 -->
        <details class="sub-sec" id="symbConfigSec" style="margin-top: 16px;">
          <summary>シンボル設定</summary>
          <div class="field-row">
            <div id="boxSymbAxis" style="flex:1;"></div>
            <button data-action="resetSymb" data-type="primary" class="outline" style="flex:none; width:80px;">リセット</button>
          </div>
          <div class="scroll-y" style="max-height: 250px; border: 1px solid var(--grey200); border-radius: 4px; padding: 4px 8px; margin-top: 8px;">
            <ob-symbol-table id="tblSymb"></ob-symbol-table>
          </div>
        </details>

        <!-- グラフスタイル設定 -->
        <details class="sub-sec" id="gphConfigSec" style="margin-top: 16px;">
          <summary>グラフスタイル設定</summary>
          <label>フォント (英字 / 日本語)</label>
          <div class="field-row">
            <div id="boxFontEng"></div>
            <div id="boxFontJp"></div>
          </div>
          <label>ラベルサイズ (軸名 / 目盛) [pt]</label>
          <div class="field-row">
            <input type="number" data-gph="s_name" min="3" max="30" step="0.5" class="form-control">
            <input type="number" data-gph="s_tick" min="3" max="30" step="0.5" class="form-control">
          </div>
          <label>基本文字色 (明度%)</label>
          <div class="field-row">
            <input type="range" data-gph="c_base" min="0" max="100">
            <span id="lbl_c_base" style="width:40px; text-align:right;"></span>
          </div>
          <label>注釈テキストサイズ [pt]</label>
          <div class="field-row">
            <input type="number" data-gph="s_tip" min="3" max="30" step="0.5" class="form-control">
          </div>
          <label>統計テキスト文字色 (明度%)</label>
          <div class="field-row">
            <input type="range" data-gph="c_stats" min="0" max="100">
            <span id="lbl_c_stats" style="width:40px; text-align:right;"></span>
          </div>
          <label>シンボル (サイズ / 枠線幅) [pt]</label>
          <div class="field-row">
            <input type="number" data-gph="sym_size" min="1" max="20" step="0.5" class="form-control">
            <input type="number" data-gph="sym_bw" min="0" max="5" step="0.1" class="form-control">
          </div>
          <label>軸線 (太さ[pt] / 明度%)</label>
          <div class="field-row">
            <input type="number" data-gph="lw_axis" min="0.1" max="3.0" step="0.1" class="form-control">
            <input type="range" data-gph="c_axis" min="0" max="100">
            <span id="lbl_c_axis" style="width:40px; text-align:right;"></span>
          </div>
          <label>グリッド線 (太さ[pt] / 明度%)</label>
          <div class="field-row">
            <input type="number" data-gph="lw_grid" min="0.1" max="3.0" step="0.1" class="form-control">
            <input type="range" data-gph="c_grid" min="0" max="100">
            <span id="lbl_c_grid" style="width:40px; text-align:right;"></span>
          </div>
          <label>回帰線 (太さ[pt] / 色)</label>
          <div class="field-row">
            <input type="number" data-gph="lw_reg" min="0.1" max="3.0" step="0.1" class="form-control">
            <input type="color" data-gph="lc_reg" class="color-picker">
          </div>
          <label>ラベル余白 (軸名 / 目盛) [pt]</label>
          <div class="field-row">
            <input type="number" data-gph="g_name" min="0" max="30" step="0.5" class="form-control">
            <input type="number" data-gph="g_tick" min="0" max="30" step="0.5" class="form-control">
          </div>
          <label>外枠余白 (上/下/左/右) [pt]</label>
          <div class="field-row" style="flex-wrap: wrap;">
            <input type="number" data-gph="p_t" min="0" max="50" step="0.5" class="form-control" title="上">
            <input type="number" data-gph="p_b" min="0" max="50" step="0.5" class="form-control" title="下">
            <input type="number" data-gph="p_l" min="0" max="50" step="0.5" class="form-control" title="左">
            <input type="number" data-gph="p_r" min="0" max="50" step="0.5" class="form-control" title="右">
          </div>
        </details>
        
        <hr>
        
        <!-- パネル個別設定 -->
        <div id="panelConfigSec" style="display: none;">
          <h4 style="margin-bottom: 12px; font-size: 14px; color: var(--theme-color);">選択中のパネル設定</h4>
          <label>グラフタイプ</label>
          <div id="boxGraphType"></div>
          <div id="secCalibration" style="display: none; margin-top: 16px;">
            <label>対象指標 (X軸:WDXRF / Y軸:PXRF)</label>
            <div id="boxCalibVal"></div>
          </div>
          <div id="secDiscrimination" style="display: none; margin-top: 16px;">
            <label>X軸 指標</label>
            <div id="boxDiscrX"></div>
            <label>Y軸 指標</label>
            <div id="boxDiscrY"></div>
          </div>
          <div class="field-row" style="margin-top: 16px;">
            <button data-action="applyPanel" data-type="primary">グラフを確定 (描画)</button>
          </div>
        </div>
      </aside>

      <!-- 右メイン描画領域 -->
      <main class="dash-main">
        <div class="a4-container" id="a4Container">
          <div class="dash-grid" id="dashGrid"></div>
        </div>
      </main>
    </div>

    <!-- 状態復元用ダイアログ -->
    <dialog id="universalConfirm">
      <h3 id="uDialogTitle">確認</h3>
      <p id="uDialogMessage"></p>
      <div class="field-row">
        <button id="uDialogCancelBtn" data-type="primary" class="outline">キャンセル</button>
        <button id="uDialogConfirmBtn" data-type="primary">OK</button>
      </div>
    </dialog>

    <?!= include("ReportLogic"); ?>
  </body>
</html>
