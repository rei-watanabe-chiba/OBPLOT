<!-- src/Report.html -->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <base target="_top">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.jsdelivr.net/npm/simple-statistics@7.8.3/dist/simple-statistics.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.1/lib/browser/math.min.js"></script>
    <?!= include("CSS"); ?>
    <?!= include("ReportCSS"); ?>
  </head>
  <body data-theme="tab2">
    <script>window.__INJECTED_DATA__ = 'INJECT_TARGET';</script>
    <?!= include('Global'); ?>
    <?!= include('PlatformAdapter'); ?>
    <?!= include('Model'); ?>
    <?!= include('CoreMethod'); ?>
    <?!= include('T3_Method'); ?>
    <?!= include('Component'); ?>
    <?!= include('Chart'); ?>
    <?!= include('Report_Schema'); ?>
    
    <div class="dash-layout">
      <!-- 左サイドバー -->
      <aside class="dash-sidebar" id="dashSidebar">
        <!-- 固定: 選択中パネル -->
        <div class="panel-context" id="panelConfigSec" style="display: none;">
          <h4 class="pane-title">選択中のパネル設定</h4>
          <div class="prop-row">
            <label class="prop-label panel">タイプ</label>
            <div class="prop-controls" id="boxGraphType"></div>
          </div>
          <div id="secCalibration">
            <div class="prop-row">
              <label class="prop-label panel">対象指標</label>
              <div class="prop-controls" id="boxCalibVal"></div>
            </div>
          </div>
          <div id="secDiscrimination">
            <div class="prop-row">
              <label class="prop-label panel">X<span class="badge-label">項目</span></label>
              <div class="prop-controls" id="boxDiscrX"></div>
            </div>
            <div class="prop-row">
              <label class="prop-label panel">Y<span class="badge-label">項目</span></label>
              <div class="prop-controls" id="boxDiscrY"></div>
            </div>
          </div>
          <div class="prop-row">
            <label class="prop-label panel">タイトル</label>
            <div class="prop-controls">
              <input type="text" data-bind="activePanel.title" placeholder="パネルタイトルを入力" class="form-control">
            </div>
          </div>
          <div class="prop-row">
            <label class="prop-label panel">X/Y<span class="badge-label">ラベル</span></label>
            <div class="prop-controls">
              <input type="text" data-bind="activePanel.xLabel" class="form-control" placeholder="X軸">
              <input type="text" data-bind="activePanel.yLabel" class="form-control" placeholder="Y軸">
            </div>
          </div>
        </div>
        <div class="prop-row" style="margin-top:4px;">
          <button data-action="printPDF" data-type="primary">PDF出力（印刷用ページ生成）</button>
        </div>
        <!-- タブナビゲーション -->
        <nav class="sidebar-tabs">
          <button class="tab-icon active" data-action="switchTab" data-tab="tabLayout" title="レイアウト"><span class="material-symbols-outlined">grid_view</span></button>
          <button class="tab-icon" data-action="switchTab" data-tab="tabData" title="データ設定"><span class="material-symbols-outlined">database</span></button>
          <button class="tab-icon" data-action="switchTab" data-tab="tabStyle" title="グラフスタイル"><span class="material-symbols-outlined">palette</span></button>
          <button class="tab-icon" data-action="switchTab" data-tab="tabSymb" title="シンボル設定"><span class="material-symbols-outlined">category</span></button>
        </nav>
        <div class="tab-content-area">
          <!-- タブ1: レイアウト -->
          <div id="tabLayout" class="sidebar-tab-pane active">
            <h5 class="pane-title" style="margin-bottom:8px;">パネル操作</h5>
            <div class="prop-row" style="margin-bottom:16px;">
              <label class="prop-label">行数 / 列数</label>
              <div class="prop-controls">
                <input type="number" data-bind="gridRows" class="form-control" title="行数">
                <input type="number" data-bind="gridCols" class="form-control" title="列数">
              </div>
            </div>
            <h5 class="pane-title" style="margin-bottom:8px;">余白設定</h5>
            <div class="prop-row">
              <label class="prop-label">パネル間隔</label>
              <div class="prop-controls"><input type="number" data-bind="panelGap" class="form-control"></div>
            </div>
            <div class="prop-row">
              <label class="prop-label">キャンバス 上/下</label>
              <div class="prop-controls">
                <input type="number" data-bind="margins.top" class="form-control">
                <input type="number" data-bind="margins.bottom" class="form-control">
              </div>
            </div>
            <div class="prop-row">
              <label class="prop-label">キャンバス 左/右</label>
              <div class="prop-controls">
                <input type="number" data-bind="margins.left" class="form-control">
                <input type="number" data-bind="margins.right" class="form-control">
              </div>
            </div>
            <div class="prop-row">
              <label class="prop-label">パネル内 上/下</label>
              <div class="prop-controls">
                <input type="number" data-gph="p_t" class="form-control">
                <input type="number" data-gph="p_b" class="form-control">
              </div>
            </div>
            <div class="prop-row">
              <label class="prop-label">パネル内 左/右</label>
              <div class="prop-controls">
                <input type="number" data-gph="p_l" class="form-control">
                <input type="number" data-gph="p_r" class="form-control">
              </div>
            </div>
          </div>
          <!-- タブ2: データ設定 -->
          <div id="tabData" class="sidebar-tab-pane">
            <h5 class="pane-title" style="margin-bottom:8px;">データフィルター</h5>
            <div class="prop-row">
              <label class="prop-label panel" id="lblFilterDB">dataset</label>
              <div class="prop-controls"><ob-multi-select id="boxFilterDB" data-change-item="fltrDB" data-change-all="fltrAllDB"></ob-multi-select></div>
            </div>
            <div class="prop-row">
              <label class="prop-label panel" id="lblFilterItem">item</label>
              <div class="prop-controls"><ob-multi-select id="boxFilterItem" data-change-item="fltrItem" data-change-all="fltrAllItem"></ob-multi-select></div>
            </div>
            <div class="prop-row">
              <label class="prop-label panel" id="lblFilterGroup">Group</label>
              <div class="prop-controls"><ob-multi-select id="boxFilterGroup" data-change-item="fltrGroup" data-change-all="fltrAllGroup"></ob-multi-select></div>
            </div>
            <h5 class="pane-title" style="margin-top:16px; margin-bottom:8px;">データ補正</h5>
            <div class="prop-row">
              <label class="prop-label panel">検量線</label>
              <div class="prop-controls" id="boxGlobalCorr"></div>
            </div>
            <div class="prop-row">
              <label class="prop-label panel">対象元素</label>
              <div class="prop-controls"><ob-multi-select id="boxGlobalCalElms" data-change-item="calElm" data-change-all="calAllElm"></ob-multi-select></div>
            </div>
            <div class="prop-row" style="margin-top:16px;">
              <div class="prop-controls" id="boxGlobalCalTgl"></div>
              <div class="prop-controls" id="boxGlobalLodTgl"></div>
            </div>
          </div>
          <!-- タブ3: グラフスタイル -->
          <div id="tabStyle" class="sidebar-tab-pane">
            <!-- セグメントトグル -->
            <div class="segment-ctrl">
              <button class="segment-btn active" data-action="switchSub" data-target="subFont">フォント</button>
              <button class="segment-btn" data-action="switchSub" data-target="subArea">グラフエリア</button>
            </div>
            <div id="subFont" class="sub-pane active">
              <div class="prop-row">
                <label class="prop-label">欧文スタイル</label>
                <div class="prop-controls" id="boxFontEng"></div>
              </div>
              <div class="prop-row">
                <label class="prop-label">和文スタイル</label>
                <div class="prop-controls" id="boxFontJp"></div>
              </div>
              <div class="prop-row">
                <label class="prop-label">カラー<span class="badge-label">K</span></label>
                <div class="prop-controls">
                  <input type="range" data-gph="c_base" style="flex:1.8;">
                  <input type="text" data-gph="c_base" class="form-control" style="flex:1.2;text-align:center;">
                </div>
              </div>
              <div class="prop-row">
                <label class="prop-label">タイトル</label>
                <div class="prop-controls"><input type="number" data-gph="s_title" class="form-control"></div>
              </div>
              <div class="prop-row">
                <label class="prop-label">軸名</label>
                <div class="prop-controls"><input type="number" data-gph="s_name" class="form-control"></div>
              </div>
              <div class="prop-row">
                <label class="prop-label">目盛</label>
                <div class="prop-controls"><input type="number" data-gph="s_tick" class="form-control"></div>
              </div>
              <div class="prop-row">
                <label class="prop-label">回帰式</label>
                <div class="prop-controls"><input type="number" data-gph="s_stats" class="form-control"></div>
              </div>
            </div>
            <div id="subArea" class="sub-pane">
              <div class="prop-row">
                <label class="prop-label">シンボル<span class="badge-label">サイズ</span></label>
                <div class="prop-controls"><input type="number" data-gph="sym_size" class="form-control"></div>
              </div>
              <div class="prop-row">
                <label class="prop-label">シンボル<span class="badge-label">線幅</span></label>
                <div class="prop-controls"><input type="number" data-gph="sym_bw" class="form-control"></div>
              </div>
              <div class="prop-row">
                <label class="prop-label">軸線<span class="badge-label">線幅</span></label>
                <div class="prop-controls"><input type="number" data-gph="lw_axis" class="form-control"></div>
              </div>
              <div class="prop-row">
                <label class="prop-label">軸線<span class="badge-label">K</span></label>
                <div class="prop-controls">
                  <input type="range" data-gph="c_axis" style="flex:1.8;">
                  <input type="text" data-gph="c_axis" class="form-control" style="flex:1.2;text-align:center;">
                </div>
              </div>
               <div class="prop-row">
                <label class="prop-label">グリッド<span class="badge-label">線幅</span></label>
                <div class="prop-controls"><input type="number" data-gph="lw_grid" class="form-control"></div>
              </div>
              <div class="prop-row">
                <label class="prop-label">グリッド<span class="badge-label">K</span></label>
                <div class="prop-controls">
                  <input type="range" data-gph="c_grid" style="flex:1.8;">
                  <input type="text" data-gph="c_grid" class="form-control" style="flex:1.2;text-align:center;">
                </div>
              </div>
               <div class="prop-row">
                <label class="prop-label">回帰線<span class="badge-label">線幅</span></label>
                <div class="prop-controls"><input type="number" data-gph="lw_reg" class="form-control"></div>
              </div>
            </div>
          </div>
          <!-- タブ4: シンボル -->
          <div id="tabSymb" class="sidebar-tab-pane">
            <div class="prop-row" style="margin-bottom:12px;">
              <label class="prop-label panel">属性選択</label>
              <div class="prop-controls">
                <div id="boxSymbAxis" style="flex:1;"></div>
                <button data-action="resetSymb" data-type="primary" class="outline" style="flex:none;width:60px;">リセット</button>
              </div>
            </div>
            <div class="scroll-box">
              <ob-symbol-table id="tblSymb"></ob-symbol-table>
            </div>
          </div>
        </div>
      </aside>
      <!-- 右メイン描画領域 -->
      <main class="dash-main">
        <div class="a4-container" id="a4Container">
          <div class="dash-grid" id="dashGrid"></div>
        </div>
      </main>
    </div>
    <?!= include("ReportApp"); ?>
  </body>
</html>
