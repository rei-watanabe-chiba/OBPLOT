<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8"> <!-- 追加: 文字化け防止 -->
    <base target="_top">
    <!-- 各種ライブラリ (Sidebarと共通) -->
    <script src="https://cdn.jsdelivr.net/npm/simple-statistics@7.8.3/dist/simple-statistics.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.1/lib/browser/math.min.js"></script>
    <?!= include("CSS"); ?>
  </head>
  <body>
    <div id="report-app" style="padding: 20px;">
      <p>ダッシュボード初期化中...</p>
    </div>
    
    <!-- データ注入用スクリプト -->
    <script>
      window.__INJECTED_DATA__ = /*{{INJECT_REPORT_DATA}}*/null;
    </script>

    <!-- コアロジックの静的結合 -->
    <?!= include('Global'); ?>
    <?!= include('Model'); ?>
    <?!= include('Method'); ?>
    
    <!-- 動作確認用スクリプト -->
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const app = document.getElementById("report-app");
        if (window.__INJECTED_DATA__) {
          try {
            const testMath = math.evaluate("Mn * 100 / Fe", { Mn: 10, Fe: 20 });
            app.innerHTML = `
              <h3>[フェーズ1 検証完了]</h3>
              <p>注入データ (pxrfDT): ${window.__INJECTED_DATA__.pxrfDT?.length || 0} 件</p>
              <p>注入データ (corrDT): ${window.__INJECTED_DATA__.corrDT?.length || 0} 件</p>
              <p>math.js 評価テスト (10 * 100 / 20): ${testMath}</p>
            `;
          } catch(e) {
            app.innerHTML = `<h3 style="color:red">[エラー] math.jsの実行に失敗: ${e.message}</h3>`;
          }
        } else {
          app.innerHTML = `<h3 style="color:red">[エラー] データの注入に失敗しました</h3>`;
        }
      });
    </script>
  </body>
</html>
