<script>
  class T3Action {
    static get ssId() { return State.get("GLB.ssId"); }

    static async loadDB() {
      // 統合パイプラインへの集約（確認スキップ）
      await CoreAction.withAsync("T3ST.inst.status", async () => {
        const [pRes, wRes, cRes] = await API.fetchMultiple(T3Action.ssId, [{ sht: GLB.appShts.pxrf }, { sht: GLB.rawShts.wdxrf }, { sht: GLB.appShts.correction }]);
        
        const pData = pRes.success ? pRes.payload.data : null;
        const wData = wRes.success ? wRes.payload.data : null;
        const cData = cRes.success ? cRes.payload.data : [];
        
        if (!pData || pData.length <= 1) throw new Error("PXRF不足");
        if (!wData || wData.length <= 1) throw new Error("WDXRF不足");
        
        State.set({ 
          "T3ST.inst.data.pxrfDT": pData, 
          "T3ST.inst.data.wdxrfDT": wData, 
          "T3ST.inst.data.corrDT": cData, 
          "T3ST.phase": T3_PHS.LOADED,
          "T3ST.repo.status": ["message", "グラフ展開用HTMLを作成"] 
        });
        return "データセット構築完了";
      });
    }

    static async openRepo() {
      await CoreAction.withAsync("T3ST.repo.status", async () => {
        let template = await API.getReportTemplate();
        const { inst } = State.proxy.T3ST;
        const injectData = { pxrfDT: inst.data.pxrfDT || [], wdxrfDT: inst.data.wdxrfDT || [], corrDT: inst.data.corrDT || [] };
        const safeJson = JSON.stringify(injectData).replace(/</g, '\\u003c').replace(/>/g, '\\u003e');
        template = template.replace("'INJECT_TARGET'", () => safeJson);
        const blob = new Blob([template], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        
        if (typeof Office !== 'undefined') {
          const a = document.createElement('a'); a.href = url; a.download = "OBPLOT_Report.html";
          document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
          return "レポートをダウンロードしました";
        } else {
          window.open(url, '_blank'); 
          return "別タブで展開しました";
        }
      });
    }
  }

  window.T3Action = T3Action;

  class AppDashInit {
    static async start() {
      CoreAction.initGlobalRouter({ CoreAction, T3Action });

      CoreAction.configResolver = (tabId) => {
        return { schemaKey: 'tab3', statPath: 'T3ST.inst.status' };
      };

      const automatorT3 = new CoreUIAutomator(T3_SIDEBAR_SCHEMA, 'T3ST');
      automatorT3.build();

      State.subscribe("T3ST.phase", () => automatorT3.update());
      
      State.subscribe("GLB.isLocked", () => {
        automatorT3.update();
      });

      const ssId = window.__INITIAL_SSID__ || "EXCEL_LOCAL_RUN";
      CoreAction.activateTabUI('tab3');
      
      const initConfig = CoreAction.configResolver('tab3');
      await CoreAction.startSession(ssId, false, {}, initConfig);
    }
  }

  if (typeof Office !== 'undefined') {
    Office.onReady(() => AppDashInit.start());
  } else {
    if (document.readyState === 'loading') { window.addEventListener("DOMContentLoaded", () => AppDashInit.start()); } 
    else { AppDashInit.start(); }
  }
</script>
