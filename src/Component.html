<!-- Component.html -->
<script>
  // --- UI utilities ---
  class DOM {
    static get = id => document.getElementById(id);
    static setDOM = (id, text) => { if (text !== undefined && this.get(id)) this.get(id).innerText = text; };
    static toggle = (id, isShow) => { if (this.get(id)) this.get(id).style.display = isShow ? "" : "none"; };
    static open = (id, isOpen) => { if (this.get(id)?.tagName === "DETAILS") setTimeout(() => { this.get(id).open = isOpen; }, 200); };
    static setDisabled = (id, isDisabled) => { if (this.get(id)) this.get(id).disabled = isDisabled; };
    static setAttr = (id, attr, val) => val ? this.get(id)?.setAttribute(attr, val) : this.get(id)?.removeAttribute(attr);
  }

  // --- UIパーツ生成・描画クラス ---
  class NewDOM {
    // --- フォーム一括ビルダ ---
    static buildFormFields(configArr, containerId, isClear = false) {
      const container = DOM.get(containerId);
      if (!container || (!isClear && container.hasChildNodes())) return;
      if (isClear) container.replaceChildren();
      const nodes = configArr.map(conf => {
        const el = document.createElement(conf.type === "select" ? "select" : "input");
        el.className = `field-${conf.type} form-control`;
        if (conf.bind) el.setAttribute("data-bind", conf.bind);
        if (conf.change) el.setAttribute("data-change", conf.change);
        if (conf.field) el.setAttribute("data-field", conf.field);
        if (conf.type === "select") {
          if (conf.hasEmpty !== false) el.add(new Option("---未選択---", ""));
          conf.options?.forEach(opt => {
            const o = new Option(opt.label ?? opt, opt.value ?? opt);
            if (opt.disabled) o.disabled = true;
            if (opt.hidden) o.hidden = true;
            if (opt.selected || opt.value === "") o.selected = true;
            el.add(o);
          });
        } else {
          el.type = conf.inputType || "text";
          if (conf.placeholder) el.placeholder = conf.placeholder;
        }
        // label指定の有無で分岐
        if (conf.label) {
          const label = document.createElement("label");
          label.className = "field-label";
          label.textContent = `${conf.label} `;
          label.appendChild(el);
          return label;
        }
        return el;
      });
      container.append(...nodes);
    }

    // --- ステータスバー更新 ---
    static status(id, status = null) {
      const el = DOM.get(id);
      if (!el) return;
      [el.dataset.status, el.innerText] = status?.length ? status : ["hidden", ""];
    }

    // --- 汎用ダイアログ ---
    static confirm(title, msg, barObj = null) {
      const saveStatus = barObj ? DOM.get(barObj)?.innerText : "";
      if (barObj) this.status(barObj, ["loading", "実行中..."]);
      return new Promise((resolve) => {
        const dialog = DOM.get("universalConfirm");
        DOM.setDOM("uDialogTitle", title);
        DOM.setDOM("uDialogMessage", msg);
        dialog.showModal(); 
        DOM.get("uDialogConfirmBtn").onclick = () => { dialog.close(); resolve(true); };
        DOM.get("uDialogCancelBtn").onclick = () => {
          dialog.close();
          if (barObj) this.status(barObj, saveStatus ? ["message", saveStatus] : ["hidden", ""]);
          resolve(false);
        };
      });
    }

    // --- トグルスイッチビルダ ---
    static buildToggle(config, containerId, isClear = false) {
      const container = DOM.get(containerId);
      if (!container || (!isClear && container.hasChildNodes())) return;
      if (isClear) container.replaceChildren();
      
      const html = Tpl.Toggle.row(config.label, config.bind, config.change, config.checked);
      container.insertAdjacentHTML('beforeend', html);
    }

    // --- 統計表レンダリング ---
    static statsTable(stats, containerId = Tab2UI.previewStatsTable) {
      const container = DOM.get(containerId);
      if (!container) return;
      if (!stats) { container.replaceChildren(); return; }
      
      const rows = DataUtils.createStatsRows(stats);
      const rowsHtml = rows.map(([label, val]) => Tpl.Stats.row(label, val)).join('');
      container.innerHTML = Tpl.Stats.container(rowsHtml);
    }

    // --- 入力欄エラー状態更新 ---
    static inputs(mapBoxId, errorFlags) {
      DOM.get(mapBoxId)?.querySelectorAll('select, input').forEach((s, idx) => {
        s.classList.toggle('has-error', !!errorFlags?.[idx]);
      });
    }
  }

  // ==========================================================================
  // Web Components (UI Primitives)
  // ==========================================================================
  
  // --- UI: 汎用ポップオーバー (Behavior Provider) ---
  class ObPopover extends HTMLElement {
    connectedCallback() {
      setTimeout(() => {
        const summary = this.querySelector('.popover-summary');
        const content = this.querySelector('.popover-content');
        if (!summary || !content) return;
        const uid = this.id || `pop_${Math.random().toString(36).substr(2, 9)}`;
        const anchorName = `--anchor-${uid}`;
        summary.setAttribute('popovertarget', uid);
        summary.style.anchorName = anchorName;
        content.id = uid;
        content.setAttribute('popover', 'auto');
        content.style.positionAnchor = anchorName;
      }, 0);
    }
  }

  // --- UI: マルチ選択ドロップダウン ---
  class ObMultiSelect extends HTMLElement {
    #dataChangeItem;
    #dataChangeAll;
    connectedCallback() {
      this.#dataChangeItem = this.getAttribute('data-change-item');
      this.#dataChangeAll = this.getAttribute('data-change-all');
      this.innerHTML = Tpl.Common.popover("未選択", "", "form-control", "checkbox-container");
    }
    set options(arr) {
      const container = this.querySelector('.popover-content');
      if (!container) return;
      if (!arr?.length) { container.innerHTML = '<div class="txt-btninfo">データなし</div>'; return; }
      const itemsHtml = arr.map(item => Tpl.MultiSelect.item(item, this.#dataChangeItem)).join('');
      const allHtml = this.#dataChangeAll ? Tpl.MultiSelect.selectAll(this.#dataChangeAll) : '';
      container.innerHTML = allHtml + itemsHtml;
    }
    set selected(vals) {
      const summary = this.querySelector('.popover-summary');
      if (summary) {
        // ▼ 修正: 生成した個別のバッジ群をラッパーで包む
        summary.innerHTML = vals?.length
          ? `<span class="badge-wrapper">${vals.map(v => Tpl.Common.badge(v)).join('')}</span>`
          : '<span style="color:var(--grey400)">未選択</span>';
      }
      const cbs = this.querySelectorAll('.dataset-cb');
      cbs.forEach(cb => {
        cb.checked = Array.isArray(vals) && vals.includes(cb.value);
      });
      const allCb = this.querySelector('.select-all-cb');
      if (allCb) {
        allCb.checked = cbs.length > 0 && [...cbs].every(cb => cb.checked);
      }
    }
  }

  // --- UI: シンボル設定テーブル ---
  class ObSymbolTable extends HTMLElement {
    #data = null;
    static #COLS = [
      { key: 'target', className: 'symbol-col-target', hasColor: false },
      { key: 'shape', className: 'symbol-col-shape', hasColor: false },
      { key: 'color', className: 'symbol-col-color', hasColor: true }
    ];
    set tableData(val) { this.#data = val; this.#render(); }
    clear() { this.#data = null; this.replaceChildren(); }
    #buildSelectHtml(opts, currentVal, type, idx, hasColor, actionsConfig) {
      let currentLabel = "未選択";
      let currentColor = "";
      const itemsHtml = opts.map(opt => {
        if (opt.val === currentVal) { currentLabel = opt.label; currentColor = opt.val; }
        return Tpl.Symbol.item(opt, type, idx, hasColor, actionsConfig.update);
      }).join('');
      const summaryHtml = Tpl.Symbol.summary(currentLabel, currentColor, hasColor, currentVal);
      return Tpl.Common.popover(summaryHtml, itemsHtml, "single-summary", "");
    }
    #render() {
      const { rules, optionsConfig, actionsConfig } = this.#data || {};
      if (!rules?.length || !optionsConfig) {
        this.clear();
        return;
      }
      const rowsStream = [...rules, { isAddRow: true }];
      const rowsHtml = rowsStream.map((rule, idx) => {
        if (rule.isAddRow) return Tpl.Symbol.addRow(actionsConfig.add, ObSymbolTable.#COLS);
        const isDefault = rule.id === "default";
        const btnHtml = Tpl.Symbol.btn(actionsConfig.remove, rule.id, "-", isDefault);
        const colsHtml = ObSymbolTable.#COLS.map(col => {
          if (col.key === 'target' && isDefault) {
            return Tpl.Symbol.col(col.className, '<div style="padding: 4px; font-size: 12px; color: var(--grey400);">Default</div>');
          }
          const selectHtml = this.#buildSelectHtml(optionsConfig[col.key], rule[col.key], col.key, idx, col.hasColor, actionsConfig);
          return Tpl.Symbol.col(col.className, selectHtml);
        }).join('');
        return Tpl.Symbol.row(btnHtml, colsHtml);
      }).join('');

      this.innerHTML = rowsHtml;
    }
  }

  // ==========================================================================
  // 疑似テンプレート統合管理クラス (Presenter)
  // ==========================================================================
  // --- タグ付きテンプレート関数 (null/undefinedを安全に空文字変換) ---
  const html = (strings, ...vals) => strings.reduce((a, s, i) => a + s + (vals[i] ?? ''), '');
  class Tpl {
    // --- 共通テンプレート ---
    static Common = class {
      static popover(summaryHtml, contentHtml, summaryClasses = "", contentClasses = "") {
        return html`
          <ob-popover>
            <button type="button" class="popover-summary ${summaryClasses}">${summaryHtml}</button>
            <div class="popover-content scroll-y ${contentClasses}">${contentHtml}</div>
          </ob-popover>
        `;
      }
      static colorBox(color) {
        return color ? html`<span class="color-box" style="background: ${color}"></span>` : "";
      }
      static badge(val) {
        return html`<span class="badge">${val}</span>`;
      }
    };
    // --- トグル用 ---
    static Toggle = class {
      static row(label, bindPath, changePath, isChecked) {
        // トグルスイッチUIの生成
        const bindAttr = bindPath ? html`data-bind="${bindPath}"` : "";
        const changeAttr = changePath ? html`data-change="${changePath}"` : "";
        const checkedAttr = isChecked ? "checked" : "";
        return html`
          <div class="toggle-row">
            <span class="toggle-label">${label}</span>
            <label class="toggle-switch">
              <input type="checkbox" ${bindAttr} ${changeAttr} ${checkedAttr}>
              <span class="toggle-slider"></span>
            </label>
          </div>
        `;
      }
    };
    // --- 統計テーブル用 ---
    static Stats = class {
      static row(label, val) {
        return html`<div class="stats-label">${label}</div><div class="stats-val">${val}</div>`;
      }
      static container(rowsHtml) {
        return html`<div class="stats-container"><div class="stats-grid">${rowsHtml}</div></div>`;
      }
    };
    // --- マルチセレクト用 ---
    static MultiSelect = class {
      static item(val, dataChange) {
        return html`
          <label class="checkbox-item">
            <input type="checkbox" class="dataset-cb" value="${val}" data-change="${dataChange}" checked>
            <span class="cb-text">${val}</span>
          </label>
        `;
      }
      static selectAll(dataChange) {
        return html`
          <label class="checkbox-item select-all">
            <input type="checkbox" class="select-all-cb" data-change="${dataChange}" checked>
            <span>すべて選択</span>
          </label>
        `;
      }
    };
    // --- シンボルテーブル用 ---
    static Symbol = class {
      static summary(label, color, hasColor, hasVal) {
        const colorBox = (hasColor && hasVal) ? Tpl.Common.colorBox(color) : "";
        return html`${colorBox}${label}`;
      }
      static item(opt, type, idx, hasColor, action) {
        // シングルセレクトのアイテム生成
        const colorBox = hasColor ? Tpl.Common.colorBox(opt.val) : "";
        return html`
          <button type="button" class="single-select-item" 
            data-action="${action}" data-symbol-idx="${idx}" data-symbol-type="${type}" 
            value="${opt.val}" popovertargetaction="hide">
            ${colorBox}${opt.label}
          </button>
        `;
      }
      static btn(action, id, text, disabled) {
        const attrId = id ? html`data-rule-id="${id}"` : "";
        const attrDis = disabled ? "disabled" : "";
        return html`<button type="button" class="icon-btn" data-action="${action}" ${attrId} ${attrDis}>${text}</button>`;
      }
      static col(className, contentHtml) {
        return html`<div class="${className}">${contentHtml}</div>`;
      }
      static row(btnHtml, colsHtml) {
        return html`<div class="symbol-table-row"><div class="symbol-col-btn">${btnHtml}</div>${colsHtml}</div>`;
      }
      static addRow(actionAdd, colsArr) {
        const btnHtml = this.btn(actionAdd, "", "+", false);
        const colsHtml = colsArr.map(c => this.col(c.className, "")).join('');
        return this.row(btnHtml, colsHtml);
      }
    };
  }

  // --- Web Components 登録 ---
  customElements.define('ob-popover', ObPopover);
  customElements.define('ob-multi-select', ObMultiSelect);
  customElements.define('ob-symbol-table', ObSymbolTable);
</script>
