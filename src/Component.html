<script>


  // --- Tpl ---
  const html = (strings, ...vals) => strings.reduce((a, s, i) => a + s + (vals[i] ?? ''), '');
  class Tpl {
    static Form = class {
      static option(opt) {
        const label = opt?.label ?? opt?.val ?? opt ?? '';
        const val = opt?.val ?? opt?.label ?? opt ?? '';
        const dis = opt?.disabled ? ' disabled' : '';
        const hid = opt?.hidden ? ' hidden' : '';
        const sel = (opt?.selected || (opt && opt.val === '')) ? ' selected' : '';
        return html`<option value="${val}"${dis}${hid}${sel}>${label}</option>`;
      }
      static options(opts = [], hasEmpty = true) {
        const emptyOpt = (hasEmpty !== false) ? '<option value="">---未選択---</option>' : '';
        const items = (opts || []).map(opt => this.option(opt)).join('');
        return emptyOpt + items;
      }
      static select(conf) {
        const { type = 'select', bind, change, field, opts, hasEmpty } = conf;
        const ds = `${bind ? ` data-bind="${bind}"` : ''}${change ? ` data-change="${change}"` : ''}${field ? ` data-field="${field}"` : ''}`;
        return html`<select class="field-${type} form-control"${ds}>${this.options(opts, hasEmpty)}</select>`;
      }
      static input(conf) {
        const { type = 'text', bind, change, field, inputType, placeholder } = conf;
        const ds = `${bind ? ` data-bind="${bind}"` : ''}${change ? ` data-change="${change}"` : ''}${field ? ` data-field="${field}"` : ''}`;
        const ph = placeholder ? ` placeholder="${placeholder}"` : '';
        return html`<input type="${inputType || 'text'}" class="field-${type} form-control"${ph}${ds}>`;
      }
      static field(conf) {
        const { type = 'text', label } = conf;
        const ctrl = type === 'select' ? this.select(conf) : this.input(conf);
        return label ? html`<label class="field-label">${label} ${ctrl}</label>` : ctrl;
      }
      static fields(confArr) {
        if (!Array.isArray(confArr)) return '';
        return confArr.map(conf => this.field(conf)).join('');
      }
    };
    static Common = class {
      static popover(sumHtml, cntHtml, sumCls = "", cntCls = "", customId = null) {
        const uid = customId || `pop_${Math.random().toString(36).substring(2, 9)}`;
        const anchorName = `--anchor-${uid}`;
        return html`<div class="ui-pop"><button type="button" class="popover-summary ${sumCls}" popovertarget="${uid}" style="anchor-name: ${anchorName};">${sumHtml}</button><div id="${uid}" popover="auto" class="popover-content scroll-y ${cntCls}" style="position-anchor: ${anchorName};">${cntHtml}</div></div>`;
      }
      static colorBox(clr) { return clr ? html`<span class="color-box" style="background: ${clr}"></span>` : ""; }
      static badge(val) { return html`<span class="badge">${val}</span>`; }
    };
    static Dialog = class {
      static universal() { 
        return html`<dialog class="universal-dialog"><h3 class="d-title"></h3><p class="d-msg" style="white-space: pre-wrap;"></p><div class="field-row"><button class="d-cancel outline" data-type="primary" data-action="CoreAct.closeDlg" data-result="false">キャンセル</button><button class="d-ok" data-type="primary" data-action="CoreAct.closeDlg" data-result="true">OK</button></div></dialog>`; 
      }
      static genHtml() { return this.universal(); }
    };
    static Toggle = class {
      static row(label, bindPath, changePath, isCheck) { return html`<div class="toggle-row"><span class="toggle-label">${label}</span><label class="toggle-switch"><input type="checkbox" ${bindPath ? html`data-bind="${bindPath}"` : ""} ${changePath ? html`data-change="${changePath}"` : ""} ${isCheck ? "checked" : ""}><span class="toggle-slider"></span></label></div>`; }
    };
    static Stats = class {
      static row(label, val) { return html`<div class="stats-label">${label}</div><div class="stats-val">${val}</div>`; }
      static cntr(rowsHtml) { return html`<div class="stats-container"><div class="stats-grid">${rowsHtml}</div></div>`; }
      static gen(statsDT) {
        if (!statsDT) return '<div class="txt-btninfo" style="padding:16px;">有効なデータが不足しています（計算不能）</div>';
        const rows = CoreMethod.Util.buildStats(statsDT);
        if (!rows.length) return '<div class="txt-btninfo" style="padding:16px;">有効なデータが不足しています（計算不能）</div>';
        return this.cntr(rows.map(([label, val]) => this.row(label, val)).join(''));
      }
    };
    static MultiSelect = class {
      static item(val, dataChange) { return html`<label class="cb-item"><input type="checkbox" class="dataset-cb" value="${val}" data-change="${dataChange}" checked><span class="cb-text">${val}</span></label>`; }
      static selectAll(dataChange) { return html`<label class="cb-item select-all"><input type="checkbox" class="select-all-cb" data-change="${dataChange}" checked><span>すべて選択</span></label>`; }
    };
    static Elements = class {
      static btn(text, action, cls = '', attrs = '') {
        return html`<button type="button" class="${cls}" data-action="${action}" ${attrs}>${text}</button>`;
      }
      static iconBtn(text, action, key = '', dis = false, cls = 'icon-btn', attrs = '') {
        return html`<button type="button" class="${cls}" data-action="${action}" ${key ? html`data-rule-key="${key}" data-key="${key}"` : ''} ${dis ? 'disabled' : ''} ${attrs}>${text}</button>`;
      }
      static cell(cntHtml, cls = '', attrs = '') {
        return html`<div class="${cls}" ${attrs}>${cntHtml}</div>`;
      }
      static row(cellsHtml, cls = 'table-row', attrs = '') {
        return html`<div class="${cls}" ${attrs}>${cellsHtml}</div>`;
      }
    };
    static Table = class {
      static build(cfg) {
        if (!cfg) return '';
        const { rows = [], cols = [], rowClass = 'table-row', rowClassFn = null, rowAttrsFn = null, emptyText = '' } = cfg;
        if (!rows.length) return emptyText ? `<div class="txt-btninfo" style="padding: 8px 0;">${emptyText}</div>` : '';
        return rows.map((r, rIdx) => {
          const dynCls = rowClassFn ? rowClassFn(r, rIdx) : (r.rowClass || '');
          const fullRowCls = [rowClass, dynCls].filter(Boolean).join(' ');
          const rowAttrs = rowAttrsFn ? rowAttrsFn(r, rIdx) : (r.rowAttrs || '');
          const cellsHtml = cols.map((col, cIdx) => {
            let cnt = '';
            if (typeof col.render === 'function') {
              cnt = col.render(r[col.key], r, rIdx);
            } else {
              cnt = r[col.key] ?? '';
            }
            const cellCls = col.className || `col-${col.key || cIdx}`;
            return Tpl.Elements.cell(cnt, cellCls);
          }).join('');
          return Tpl.Elements.row(cellsHtml, fullRowCls, rowAttrs);
        }).join('');
      }
    };
    static Symbol = class {
      static COLS = [
        { key: 'target', className: 'symb-col-target', hasClr: false },
        { key: 'shp', className: 'symb-col-shape', hasClr: false },
        { key: 'clr', className: 'symb-col-color', hasClr: true }
      ];
      static sum(label, clr, hasClr, hasVal) { return html`${(hasClr && hasVal) ? Tpl.Common.colorBox(clr) : ""}${label}`; }
      static item(opt, type, idx, hasClr, action) { return html`<button type="button" class="single-select-item" data-action="${action}" data-symbol-idx="${idx}" data-symbol-type="${type}" value="${opt.val}" popovertargetaction="hide">${hasClr ? Tpl.Common.colorBox(opt.val) : ""}${opt.label}</button>`; }
      static btn(action, key, text, dis) { return Tpl.Elements.iconBtn(text, action, key, dis); }
      static col(clsName, cntHtml) { return Tpl.Elements.cell(cntHtml, clsName); }
      static row(btnHtml, colsHtml) { return Tpl.Elements.row(`${Tpl.Elements.cell(btnHtml, 'symb-col-btn')}${colsHtml}`, 'symb-table-row'); }
      static addRow(actionAdd, colsArr) { return this.row(this.btn(actionAdd, "", "+", false), colsArr.map(c => this.col(c.className, "")).join('')); }
      static genSel(opts, curVal, type, idx, hasClr, actsConf) {
        let curLbl = "未選択", curClr = "";
        const itemsHtml = (opts || []).map(opt => {
          if (opt.val === curVal) { curLbl = opt.label; curClr = opt.val; }
          return Tpl.Symbol.item(opt, type, idx, hasClr, actsConf.update);
        }).join('');
        return Tpl.Common.popover(Tpl.Symbol.sum(curLbl, curClr, hasClr, curVal), itemsHtml, "single-summary", "");
      }
      static tbl(src) {
        const { rls, optsConf, actsConf } = src || {};
        if (!rls?.length || !optsConf) return '';
        const rows = [...rls, { isAddRow: true }];
        const cols = [
          {
            key: 'btn',
            className: 'symb-col-btn',
            render: (v, rl) => rl.isAddRow
              ? Tpl.Elements.iconBtn('+', actsConf.add)
              : Tpl.Elements.iconBtn('-', actsConf.remove, rl.key, rl.key === 'default')
          },
          ...Tpl.Symbol.COLS.map(col => ({
            key: col.key,
            className: col.className,
            render: (v, rl, idx) => {
              if (rl.isAddRow) return '';
              if (col.key === 'target' && rl.key === 'default') {
                return '<div style="padding: 4px; font-size: 12px; color: var(--grey400);">Default</div>';
              }
              return Tpl.Symbol.genSel(optsConf[col.key], rl[col.key], col.key, idx, col.hasClr, actsConf);
            }
          }))
        ];
        return Tpl.Table.build({ rows, cols, rowClass: 'symb-table-row' });
      }
    };
  }
</script>
