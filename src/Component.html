<!-- Component.html -->
<script>
  // --- UI utilities ---
  class DOM {
    static get = id => document.getElementById(id);
    static setDOM = (id, text) => { if (text !== undefined && this.get(id)) this.get(id).innerText = text; };
    static toggle = (id, isShow) => { if (this.get(id)) this.get(id).style.display = isShow ? "" : "none"; };
    static open = (id, isOpen) => { if (this.get(id)?.tagName === "DETAILS") setTimeout(() => { this.get(id).open = isOpen; }, 200); };
    static setDisabled = (id, isDisabled) => { if (this.get(id)) this.get(id).disabled = isDisabled; };
    static setAttr = (id, attr, val) => val ? this.get(id)?.setAttribute(attr, val) : this.get(id)?.removeAttribute(attr);
  }

  // --- UIパーツ生成・描画クラス ---
  class NewDOM {
    // --- 汎用処理 ---
    static #clone(templateId) { return DOM.get(templateId)?.content.cloneNode(true); }
    static #bind(el, attrs) { Object.entries(attrs).forEach(([k, v]) => v != null && el.setAttribute(k, v)); return el; }
    static #renderList(templateId, items, containerId, mapper) {
      const container = DOM.get(containerId);
      if (!container) return;
      if (!items?.length) { container.replaceChildren(); return; } // データ空でクリア（初期化対応）
      container.replaceChildren(...items.map((item, index) => mapper(this.#clone(templateId), item, index)));
    }
    static #checkboxList(arr, containerElement, targetState, allChangeState = null) {
      if (!containerElement) return;
      if (!arr?.length) { containerElement.innerHTML = '<div class="txt-btninfo">データなし</div>'; return; }
      const items = arr.map(item => {
        const clone = this.#clone("checkboxTemplate");
        const cb = this.#bind(clone.querySelector(".dataset-cb"), { value: item, 'data-change': targetState });
        cb.checked = true;
        clone.querySelector(".cb-text").textContent = item;
        return clone;
      });
      if (allChangeState) {
        const allClone = this.#clone("checkAllTemplate");
        this.#bind(allClone.querySelector("input"), { 'data-change': allChangeState }).checked = true;
        containerElement.replaceChildren(allClone, ...items);
        return;
      }
      containerElement.replaceChildren(...items);
    }

    // --- ステータスバー更新  ---
    static status(id, status = null) {
      const el = DOM.get(id);
      if (!el) return;
      [el.dataset.status, el.innerText] = status?.length ? status : ["hidden", ""];
    }

    // --- ダイアログ生成 ---
    static confirm(title, msg, barObj = null) {
      const saveStatus = barObj ? DOM.get(barObj)?.innerText : "";
      if (barObj) this.status(barObj, ["loading", "実行中..."]);
      return new Promise((resolve) => {
        const dialog = DOM.get("universalConfirm");
        DOM.setDOM("uDialogTitle", title);
        DOM.setDOM("uDialogMessage", msg);
        dialog.showModal(); 
        DOM.get("uDialogConfirmBtn").onclick = () => { dialog.close(); resolve(true); };
        DOM.get("uDialogCancelBtn").onclick = () => {
          dialog.close();
          if (barObj) this.status(barObj, saveStatus ? ["message", saveStatus] : ["hidden", ""]);
          resolve(false);
        };
      });
    }

    // --- 列選択動的生成 ---
    static selectors(arr, objID, fields, targetState, hasEmpty = true, isMultiple = false) {
      this.#renderList("selectorTemplate", fields, objID, (clone, field) => {
        clone.querySelector(".field-label").firstChild.nodeValue = `${field.label} `;
        const select = this.#bind(clone.querySelector("select"), { 'data-field': field.key, 'data-change': targetState });
        if (isMultiple) select.multiple = true;
        if (!hasEmpty || isMultiple) select.querySelector(".empty-opt")?.remove();
        select.append(...arr.map(h => new Option(h, h)));
        return clone;
      });
    }

    // --- シンボル設定行生成 ---
    static symbolRows(values, objID, targetState) {
      const container = DOM.get(objID);
      if (!container) return;
      if (!values?.length) { container.replaceChildren(); return; } // 空ならクリア
      const { symbolShapes: shapes, symbolColors: colors } = GLOBAL_CONFIG;
      this.#renderList("symbolRowTemplate", Array.from({ length: 5 }), objID, (clone, _, i) => {
        clone.querySelectorAll("select").forEach(s => this.#bind(s, { 'data-symbol-idx': i, 'data-change': targetState }));
        clone.querySelector('[data-symbol-type="target"]').append(...values.map(v => new Option(v, v)));
        clone.querySelector('[data-symbol-type="shape"]').append(...shapes.map(s => new Option(s, s)));
        clone.querySelector('[data-symbol-type="color"]').append(...colors.map(c => new Option(c.label, c.val)));
        return clone;
      });
    }

    // --- 統計表レンダリング ---
    static statsTable(stats, containerId = Tab2UI.previewStatsTable) {
      const container = DOM.get(containerId);
      if (!container) return;
      if (!stats) { container.replaceChildren(); return; } // 空ならクリア
      const rows = DataUtils.createStatsRows(stats);
      const [containerTpl, rowTpl] = [DOM.get("statsContainerTemplate"), DOM.get("statsRowTemplate")];
      if (!containerTpl || !rowTpl) return;
      const boxClone = containerTpl.content.cloneNode(true);
      const grid = boxClone.querySelector(".stats-grid");
      rows.forEach(([label, val]) => {
        const rowClone = rowTpl.content.cloneNode(true);
        [rowClone.querySelector(".stats-label").textContent, rowClone.querySelector(".stats-val").textContent] = [label, String(val)];
        grid.appendChild(rowClone);
      });
      container.replaceChildren(boxClone);
    }

    // --- 疑似ドロップダウン生成 ---
    static multiSelectDropdown(arr, objID, targetState, allChangeState = null) {
      const container = DOM.get(objID);
      if (!container) return;
      if (!arr?.length) { container.innerHTML = '<div class="txt-btninfo">データなし</div>'; return; }
      const clone = this.#clone("multiSelectTemplate");
      const [summaryBtn, optionsBox] = [clone.querySelector(".multi-select-summary"), clone.querySelector(".multi-select-options")];
      const [popoverId, anchorName] = [`popover-${objID}`, `--anchor-${objID}`];
      this.#bind(summaryBtn, { popovertarget: popoverId }).style.anchorName = anchorName;
      this.#bind(optionsBox, { id: popoverId }).style.positionAnchor = anchorName;
      this.#checkboxList(arr, optionsBox, targetState, allChangeState);
      container.replaceChildren(clone);
    }

    // --- サマリーテキスト更新 ---
    static updateMultiSelectSummary(objID, selectedValues) {
      const summary = DOM.get(objID)?.querySelector(".multi-select-summary");
      if (!summary) return;
      summary.innerHTML = selectedValues?.length
        ? selectedValues.map(v => `<span class="badge">${v}</span>`).join('')
        : '<span style="color:var(--grey400)">未選択</span>';
    }

    // --- 入力欄エラー状態更新 ---
    static inputs(mapBoxId, errorFlags) {
      DOM.get(mapBoxId)?.querySelectorAll('select, input').forEach((s, idx) => {
        s.classList.toggle('has-error', !!errorFlags?.[idx]);
      });
    }
  }
</script>
