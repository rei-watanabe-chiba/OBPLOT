<script>
  // --- サイドバーロック ---
  class SIDEFIX {
    static base = window.devicePixelRatio || 1;
    static lock() {
      if (!document.getElementById('fixed-sidebar')) return;
      const zoom = (window.devicePixelRatio || 1) / SIDEFIX.base;
      const rootStyle = document.documentElement.style;
      rootStyle.setProperty('--current-scale', zoom);
      rootStyle.setProperty('--main-margin', `${320 / zoom}px`);
      rootStyle.setProperty('--sidebar-height', `${window.innerHeight * zoom}px`);
    }
    static init() {
      ['resize', 'DOMContentLoaded'].forEach(ev => window.addEventListener(ev, () => SIDEFIX.lock()));
      window.visualViewport?.addEventListener('resize', () => SIDEFIX.lock());
      SIDEFIX.lock();
    }
  }
  SIDEFIX.init();

  // --- UIテンプレート ---
  class RptTpl {
    // --- rowAspectCtrl ---
    static rowAspectCtrl(row, aspect) {
      return `<div class="form-addon aspect-ctrl-inp" title="アスペクト比" 
                   data-addon-icon="aspect_ratio" 
                   data-addon-prefix="H:" 
                   data-addopt-color="var(--theme-color)">
        <input type="number" class="form-control" min="0.1" max="2.0" step="0.1" data-aspect-idx="${row}" value="${aspect}">
      </div>`;
    }
  }

  // --- RepoSt ---
  class RepoSt {
    // --- getSt ---
    static getSt() {
      const ui = State.get('RPTST.ui') || {}, cfg = State.get('RPTST.config') || {}, ds = State.get('RPTST.dataset') || {}, pnls = State.get('RPTST.panels') || [];
      const actId = ui.activePanelId, lyt = cfg.layout || { gridRows: 1, gridCols: 1, panelGap: 4 };
      return {
        ui, config: cfg, dataset: ds, panels: pnls, activeId: actId, layout: lyt,
        theme: cfg.theme || {}, symbology: cfg.symbology || {}, baseScales: ds.baseScales || { auto: {}, fixed: {} },
        d: ds.raw || {}, panel: pnls.find(p => p.id === actId) ?? null,
        boardMode: cfg.boardMode || 'calib', rowAspect: lyt.rowAspect || [1.0, 1.0, 1.0]
      };
    }
    // --- update ---
    static update() { RepoAct.automator?.update(); }
    // --- finalizePanel ---
    static finalizePanel() {
      document.querySelectorAll('form[data-bind-ctx]').forEach(f => CoreUIPatcher.syncFormCtx(f));
      this.update();
    }
    // --- initSt ---
    static async initSt(favObj, d) {
      const pxrf = d.pxrfDT || [];
      const exVals = k => {
        const v = [...new Set(pxrf.map(r => r[k] == null ? "" : String(r[k]).trim()).filter(Boolean))];
        return v.length ? v : null;
      };
      const optsDB = exVals(GLB.idx.key1) || [], optsItem = exVals(GLB.idx.p1) || [], optsGroup = exVals(GLB.idx.wd1) || [];
      const initFltr = (buVal, opts) => Array.isArray(buVal) ? buVal.map(String) : opts;
      const fav = favObj ? (favObj["RPTST.refs"] || favObj) : null;
      const dataset = {
        raw: d,
        filters: {
          db: initFltr(fav?.filters?.db || fav?.dataset?.filters?.db, optsDB),
          item: initFltr(fav?.filters?.item || fav?.dataset?.filters?.item, optsItem),
          group: initFltr(fav?.filters?.group || fav?.dataset?.filters?.group, optsGroup)
        },
        crct: fav?.crct || fav?.dataset?.crct || "new",
        calElms: (fav?.calElms?.length ? fav.calElms : (fav?.dataset?.calElms?.length ? fav.dataset.calElms : [...GLB.valElms])),
        useCal: fav?.useCal ?? fav?.dataset?.useCal ?? false,
        useLOD: fav?.useLOD ?? fav?.dataset?.useLOD ?? false,
        baseScales: { auto: {}, fixed: {} }
      };
      const boardMode = fav?.boardMode || fav?.config?.boardMode || RPT_CFG.defLayout.boardMode || "calib";
      document.body.setAttribute('data-board-mode', boardMode);
      const config = {
        boardMode,
        layout: {
          gridRows: fav?.gridRows || fav?.config?.layout?.gridRows || 1,
          gridCols: fav?.gridCols || fav?.config?.layout?.gridCols || 1,
          panelGap: fav?.panelGap ?? fav?.config?.layout?.panelGap ?? 4,
          rowAspect: fav?.rowAspect || fav?.config?.layout?.rowAspect || [...RPT_CFG.defLayout.rowAspect]
        },
        theme: { ...RPT_CFG.defTheme, ...(fav?.rawGph || fav?.theme || fav?.config?.theme || {}) },
        symbology: fav?.symb || fav?.symbology || fav?.config?.symbology || {
          baseKey: GLB.symbBaseKey,
          rls: [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }]
        }
      };
      const rawPanels = fav?.panels || [];
      const panels = (rawPanels.length ? rawPanels : [{ id: "p_0" }]).map((p, i) => ({ ...RPT_CFG.defPnl, ...p, id: p.id || `p_${i}` }));
      State.set({
        "RPTST.dataset": dataset,
        "RPTST.config": config,
        "RPTST.panels": panels,
        "RPTST.ui.activePanelId": panels[0]?.id || "p_0"
      });
      const _allMetrics = [...new Set([...GLB.valElms, ...(GLB.valLgc || [])])];
      RepoSt.updateBaseScales(this.getSt(), 'all', _allMetrics);
      RepoAct.oldSymbAxis = config.symbology.baseKey || GLB.symbBaseKey;
      const optsCorr = [{ label: RPT_CFG.lbl.newCorr, val: "new" }, ...(d.crctDT || []).slice(1).filter(r => r[0]).map(r => ({ label: r[0], val: r[0] }))];
      const optValLgc = [...GLB.valElms, ...GLB.valLgc].map(v => ({ label: v, val: v }));
      State.set({
        "RPTST.ui.optFields": {
          crctOpts: optsCorr,
          fontEngOpts: GLB.fontEngList.map(v => ({ label: v, val: v })),
          fontJpOpts: GLB.fontJpList.map(v => ({ label: v, val: v })),
          valLgcOpts: optValLgc,
          axisOpts: GLB.symbAxes,
          filterDBOpts: optsDB, filterItemOpts: optsItem, filterGroupOpts: optsGroup, calElmsOpts: GLB.valElms
        }
      });
      this.renewSymbState(this.getSt());
    }
    // --- updateBaseScales ---
    static updateBaseScales(st, triggerType, metricsToUpdate = null) {
      const { config, dataset, d, panels, boardMode } = st;
      if (!d?.pxrfDT || !d?.wdxrfDT) return;
      const bMode = boardMode || config?.boardMode || 'calib';
      const targetMetrics = new Set();
      if (metricsToUpdate) {
        (Array.isArray(metricsToUpdate) ? metricsToUpdate : [metricsToUpdate]).forEach(m => targetMetrics.add(m));
      } else {
        panels.forEach(p => {
          if (bMode === 'calib' && p.calbVal) targetMetrics.add(p.calbVal);
          else if (bMode === 'clus') {
            if (p.clusXVal) targetMetrics.add(p.clusXVal);
            if (p.clusYVal) targetMetrics.add(p.clusYVal);
          }
        });
      }
      if (!targetMetrics.size) return;

      // 純粋関数へ計算委譲
      const calcScales = ReportMethod.calculateBaseScales(d, dataset, targetMetrics);
      const baseScales = st.baseScales || { auto: {}, fixed: {} };
      baseScales.auto = { ...baseScales.auto, ...calcScales.auto };
      baseScales.fixed = { ...baseScales.fixed, ...calcScales.fixed };
      State.set("RPTST.dataset.baseScales", baseScales);
    }
    // --- renewSymbState ---
    static renewSymbState(st) {
      const d = st.d, symb = st.symbology;
      if (!d?.pxrfDT?.length || !symb) return;
      const vals = [...new Set(d.pxrfDT.map(pt => pt[symb.baseKey]).filter(Boolean))];
      State.set("RPTST.ui.optFields.symbSrc", {
        rls: symb.rls,
        optsConf: { target: [{ val: "", label: RPT_CFG.lbl.unsel }, ...vals.map(v => ({ val: v, label: v }))], shp: GLB.symbShapes, clr: GLB.symbColors },
        actsConf: { add: "RepoAct.addSymb", remove: "RepoAct.removeSymb", update: "RepoAct.updSymb" }
      });
    }
    // --- renewPanel ---
    static renewPanel(st) {
      const { panel, boardMode, baseScales } = st;
      const targetScales = (panel?.scaleMode === 'manual') ? baseScales.fixed : baseScales.auto;
      let tickOpts = [{ label: "自動", val: "" }], tickXOpts = [{ label: "自動", val: "" }], tickYOpts = [{ label: "自動", val: "" }];
      if (panel) {
        if (boardMode === 'calib' && panel.calbVal && targetScales[panel.calbVal]) {
          tickOpts = [{ label: "自動", val: "" }, ...(targetScales[panel.calbVal].units || []).map(u => ({ label: String(u), val: String(u) }))];
        } else if (boardMode === 'clus') {
          if (panel.clusXVal && targetScales[panel.clusXVal]) {
            tickXOpts = [{ label: "自動", val: "" }, ...(targetScales[panel.clusXVal].units || []).map(u => ({ label: String(u), val: String(u) }))];
          }
          if (panel.clusYVal && targetScales[panel.clusYVal]) {
            tickYOpts = [{ label: "自動", val: "" }, ...(targetScales[panel.clusYVal].units || []).map(u => ({ label: String(u), val: String(u) }))];
          }
        }
      }
      const ensureOpt = (opts, curVal) => {
        if (curVal != null && curVal !== "" && !opts.some(o => String(o.val) === String(curVal))) {
          opts.push({ label: `${curVal}`, val: String(curVal) });
        }
      };
      ensureOpt(tickOpts, panel?.tickUnit);
      ensureOpt(tickXOpts, panel?.tickUnitX);
      ensureOpt(tickYOpts, panel?.tickUnitY);
      State.set({
        "RPTST.ui.activePanelScaleMode": panel?.scaleMode || "auto",
        "RPTST.ui.optFields.tickOpts": tickOpts,
        "RPTST.ui.optFields.tickXOpts": tickXOpts,
        "RPTST.ui.optFields.tickYOpts": tickYOpts
      });
      this.finalizePanel();
    }
  }

  // --- RepoAct ---
  class RepoAct {
    static automator = null;
    static oldSymbAxis = GLB.symbBaseKey;
    // --- setBoardMode ---
    static setBoardMode(btn, arg) {
      const mode = arg || btn?.dataset?.param || btn?.dataset?.arg || btn?.dataset?.target || 'calib';
      if (State.get("RPTST.config.boardMode") === mode) return;
      document.body.setAttribute('data-board-mode', mode);
      State.set({
        "RPTST.config.boardMode": mode,
        "RPTST.config.layout.gridRows": 1,
        "RPTST.config.layout.gridCols": 1
      });
      const newPanel = {
        id: "p_0", title: "", xLabel: mode === 'calib' ? 'WDXRF' : '', yLabel: mode === 'calib' ? 'pXRF' : '',
        tickUnit: "", tickUnitX: "", tickUnitY: "", calbVal: "", clusXVal: "", clusYVal: "", scaleMode: "auto"
      };
      State.set("RPTST.panels", [newPanel]);
      State.set("RPTST.ui.activePanelId", newPanel.id);
    }
    // --- changePanelRef ---
    static changePanelRef(tgt) {
      const key = tgt.dataset.apKey || tgt.dataset.field || tgt.name || tgt.dataset.bind?.split('.').pop();
      const val = tgt.value ?? tgt.dataset.param ?? tgt.dataset.arg ?? tgt.dataset.target;const { panel, panels, boardMode } = RepoSt.getSt();
      if (!panel) return;
      panel[key] = ['tickUnit', 'tickUnitX', 'tickUnitY'].includes(key) ? (val === "" || isNaN(Number(val)) ? null : Number(val)) : val;
      if (key === 'scaleMode') {
        panel.tickUnit = ""; panel.tickUnitX = ""; panel.tickUnitY = "";
      }
      if (['calbVal', 'clusXVal', 'clusYVal'].includes(key)) {
        panel.tickUnit = ""; panel.tickUnitX = ""; panel.tickUnitY = "";
        State.set("RPTST.panels", [...panels]);
        const newSt = RepoSt.getSt();
        const changedMetric = val;
        if (changedMetric) RepoSt.updateBaseScales(newSt, 'metric', [changedMetric]);
        RepoSt.renewPanel(newSt);
        return;
      }
      State.set("RPTST.panels", [...panels]);
    }
    // --- valdSymbAxis ---
    static async valdSymbAxis(tgt) {
      const newVal = tgt.value, oldVal = this.oldSymbAxis;
      if (newVal === oldVal) return;
      const ok = await CoreAct.withAsync(null, { title: "確認", msg: "属性を変更してシンボル設定をリセットします" }, async () => {
        State.set({
          "RPTST.config.symbology.baseKey": newVal,
          "RPTST.config.symbology.rls": [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }]
        });
        this.oldSymbAxis = newVal;
        return null;
      });
      if (!ok) {
        tgt.value = oldVal;
        State.set("RPTST.config.symbology.baseKey", oldVal);
      }
    }
    // --- resetSymb ---
    static resetSymb() {
      State.set("RPTST.config.symbology.rls", [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }]);
    }
    // --- addSymb ---
    static addSymb() {
      const rls = State.get("RPTST.config.symbology.rls") || [];
      State.set("RPTST.config.symbology.rls", [...rls, { key: `rule_${Date.now()}`, target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }]);
    }
    // --- removeSymb ---
    static removeSymb(btn) {
      const rls = State.get("RPTST.config.symbology.rls") || [];
      State.set("RPTST.config.symbology.rls", rls.filter(rw => rw.key !== btn.dataset.ruleKey));
    }
    // --- updSymb ---
    static updSymb(btn) {
      const i = btn.dataset.symbolIdx, t = btn.dataset.symbolType;
      if (i != null && t) {
        const newSym = JSON.parse(JSON.stringify(State.get("RPTST.config.symbology.rls") || []));
        newSym[i][t] = btn.value;
        State.set("RPTST.config.symbology.rls", newSym);
      }
    }
    // --- setActiveScaleMode ---
    static setActiveScaleMode(btn, arg) {
      const mode = arg || btn?.dataset?.param || btn?.dataset?.arg;
      if (!mode) return;
      const { panel, panels } = RepoSt.getSt();
      if (panel) {
        panel.scaleMode = mode;
        panel.tickUnit = ""; panel.tickUnitX = ""; panel.tickUnitY = "";
        State.set("RPTST.panels", [...panels]);
        State.set("RPTST.ui.activePanelScaleMode", mode);
      }
    }
    // --- changeRowAspect ---
    static changeRowAspect(inp) {
      const idx = Number(inp.dataset.aspectIdx);
      let val = Number(inp.value);
      val = isNaN(val) || val < 0.1 ? 0.1 : (val > 2.0 ? 2.0 : Math.round(val * 10) / 10);
      inp.value = val;
      const lyt = { ...(State.get("RPTST.config.layout") || {}) };
      lyt.rowAspect = [...(lyt.rowAspect || [1.0, 1.0, 1.0])];
      lyt.rowAspect[idx] = val;
      State.set("RPTST.config.layout", lyt);
    }
    // --- actvTab ---
    static actvTab(btn, arg) { State.set("RPTST.ui.activeTab", arg || btn.dataset.param || btn.dataset.arg || btn.dataset.tab); }
    // --- actvSub ---
    static actvSub(btn, arg) { State.set("RPTST.ui.activeSub", arg || btn.dataset.param || btn.dataset.arg || btn.dataset.target); }
    // --- actvPanel ---
    static actvPanel(btn) { State.set("RPTST.ui.activePanelId", btn.dataset.panelId); }
    // --- updExportDesc ---
    static updExportDesc(tgt) { RepoExport.updExportDesc(tgt); }
    // --- requestExport ---
    static requestExport() { RepoExport.requestExport(); }
    // --- requestCopyConfig ---
    static requestCopyConfig() { RepoExport.requestCopyConfig(); }
    // --- syncPanelDom ---
    static syncPanelDom() { RepoRend.syncPanelDom(RepoSt.getSt()); }
    // --- toggleMarginLink ---
    static toggleMarginLink(btn) {
      const group = btn.dataset.syncGroup;
      if (!group) return;
      const linkBind = `RPTST.ui.link${group.charAt(0).toUpperCase() + group.slice(1)}Margin`;
      const isLinked = !State.get(linkBind);
      State.set(linkBind, isLinked); 
      btn.setAttribute('aria-selected', isLinked ? 'true' : 'false');
      const icon = btn.querySelector('.material-symbols-outlined') || btn;
      icon.textContent = isLinked ? 'link' : 'link_off';
      btn.title = isLinked ? '連動解除' : '4方向連動';
    }
    // --- syncMargin ---
    static syncMargin(inp) {
      const group = inp.dataset.syncGroup;
      if (!group) return;
      const linkBind = `RPTST.ui.link${group.charAt(0).toUpperCase() + group.slice(1)}Margin`;
      if (!State.get(linkBind)) return;
      const keys = group === 'canvas' ? ['bd_l', 'bd_t', 'bd_b', 'bd_r'] : ['p_l', 'p_t', 'p_b', 'p_r'];
      const val = Number(inp.value);
      keys.forEach(k => State.set(`RPTST.config.theme.${k}`, val));
      document.querySelectorAll('form[data-bind-ctx]').forEach(f => CoreUIPatcher.syncFormCtx(f));
    }
  }

  // --- RepoRend ---
  class RepoRend {
    static resizeTimer = null;
    static renderTimer = null;
    // --- _applyPanelLabels ---
    static _applyPanelLabels(idx, st) {
      const el = document.querySelector(`[data-panel-id="p_${idx}"]`);
      if (!el) return;
      const { layout, config, boardMode } = st;
      const bMode = boardMode || config?.boardMode || 'calib';
      const cols = layout?.gridCols || 1;
      const row = Math.floor(idx / cols);
      const col = idx % cols;
      
      if (row === 0) el.setAttribute('data-col-lbl', `c${col + 1}`);
      else el.removeAttribute('data-col-lbl');
      
      el.querySelector('.row-aspect-ctrl')?.remove();
      
      if (col === 0) {
        el.setAttribute('data-row-lbl', `r${row + 1}`);
        
        if (bMode === 'clus') {
          const ctrl = document.createElement('div');
          ctrl.className = 'row-aspect-ctrl';
          ctrl.innerHTML = RptTpl.rowAspectCtrl(row, layout.rowAspect?.[row] || 1.0);
          ctrl.querySelector('input').addEventListener('change', e => RepoAct.changeRowAspect(e.target));
          el.appendChild(ctrl);
        }
      } else {
        el.removeAttribute('data-row-lbl');
      }
    }
    // --- syncPanelDom ---
    static syncPanelDom(st) {
      const { layout, panels: curPanels, activeId } = st;
      const reqIds = Array.from({ length: layout.gridRows * layout.gridCols }, (_, i) => `p_${i}`);
      let panels = [...curPanels];
      reqIds.forEach(id => { if (!panels.find(p => p.id === id)) panels.push({ id, ...RPT_CFG.defPnl }); });
      panels = reqIds.map(id => panels.find(p => p.id === id));
      State.set("RPTST.panels", panels);
      if (!panels.find(p => p.id === activeId)) {
        State.set("RPTST.ui.activePanelId", panels[0]?.id || "p_0");
      }
      RepoSt.renewPanel(st);
      const cont = document.querySelector('[data-part="a4Container"]');
      if (cont) {
        cont.style.setProperty('--col-count', layout.gridCols);
        cont.style.setProperty('--row-count', layout.gridRows);
        cont.style.setProperty('--panel-gap', `${(layout.panelGap !== undefined ? Number(layout.panelGap) : 4)}mm`);
      }
      for (let i = 0; i < 9; i++) {
        const el = document.querySelector(`[data-panel-id="p_${i}"]`);
        if (!el) continue;
        el.setAttribute('aria-selected', `p_${i}` === (st.activeId || "p_0") ? 'true' : 'false'); // アクティブ枠強制同期
        if (i < layout.gridRows * layout.gridCols) this._applyPanelLabels(i, st);
        else { el.removeAttribute('data-col-lbl'); el.removeAttribute('data-row-lbl'); }
      }
      RepoSt.update();
      CoreUIPatcher.applyStaticAddons();
      if (!window.__EXPORT_CFG__) this.genCharts(st);
    }
    // --- genGph ---
    static genGph(st = null) {
      const snap = st || RepoSt.getSt();
      const theme = { ...RPT_CFG.defTheme, ...(snap.theme || {}) };
      const gphProps = ReportMethod.buildGraphStyle(theme, RPT_CFG.rng);
      const cont = document.querySelector('[data-part="a4Container"]');
      if (cont) {
        [{ p: 'top', k: 'bd_t' }, { p: 'right', k: 'bd_r' }, { p: 'bottom', k: 'bd_b' }, { p: 'left', k: 'bd_l' }].forEach(({ p, k }) => {
          cont.style.setProperty(`--margin-${p}`, `${theme[k]}${RPT_CFG.rng[k]?.unit || 'mm'}`);
        });
      }
      return gphProps;
    }
    // --- calcPanelSize ---
    static calcPanelSize(gph, st) {
      const grid = document.querySelector('[data-part="dashGrid"]');
      if (!grid) return;
      const snap = st || RepoSt.getSt();
      const { layout, panels, theme, boardMode } = snap;
      grid.style.removeProperty('--panel-w');
      grid.style.removeProperty('--panel-h');
      const MM2PX = 3.7795275591;
      const gw = window.__EXPORT_CFG__ ? (210 - (theme.bd_l || 15) - (theme.bd_r || 15)) * MM2PX : grid.clientWidth;
      const gh = window.__EXPORT_CFG__ ? (297 - (theme.bd_t || 15) - (theme.bd_b || 15)) * MM2PX : grid.clientHeight;
      if (!gw || !gh) return;
      const gapPx = (layout.panelGap !== undefined ? Number(layout.panelGap) : 4) * 3.78;
      const hasTitle = panels.some(p => p.title);
      const titleSizePx = (theme.s_title || 12) * 1.33;
      if (boardMode === 'clus' && layout.rowAspect?.length && (layout.gridRows || 1) > 0) {
        const rowCount = layout.gridRows || 1;
        const metrics = ReportMethod.calculatePanelMetricsAspect(
          gw, gh, layout.gridCols || 1, rowCount, gapPx, gph, hasTitle, titleSizePx, (layout.rowAspect || []).slice(0, rowCount)
        );
        grid.style.setProperty('--panel-w', `${metrics.panelW}px`);
        grid.style.gridTemplateRows = metrics.panelH.map(h => `${h}px`).join(' ');
        State.set("RPTST.dataset.rowPlotH", metrics.plotH);
      } else {
        const metrics = ReportMethod.calculatePanelMetrics(gw, gh, layout.gridCols || 1, layout.gridRows || 1, gapPx, gph, hasTitle, titleSizePx);
        grid.style.setProperty('--panel-w', `${metrics.panelW}px`);
        grid.style.setProperty('--panel-h', `${metrics.panelH}px`);
        grid.style.gridTemplateRows = '';
        State.set("RPTST.dataset.rowPlotH", null);
      }
      void grid.offsetHeight;
    }
    // --- genCharts ---
    static genCharts(st, pCalcDT = null) {
      const snap = st || RepoSt.getSt();
      const gph = this.genGph(snap);
      this.calcPanelSize(gph, snap);
      const { dataset, d, config, panels, baseScales, layout, boardMode } = snap;
      const lyt = layout || config?.layout || { gridRows: 1, gridCols: 1 };
      const plots = document.querySelectorAll('[data-part="dashGrid"] ui-plot');

      const draw = () => {
        panels.forEach((p, idx) => {
          this._applyPanelLabels(idx, snap);
          if (!plots[idx]) return;
          const row = Math.floor(idx / lyt.gridCols);
          const srcScales = (p.scaleMode === 'manual') ? baseScales.fixed : baseScales.auto;
          const scaleFixed = {
            x: p.clusXVal ? srcScales?.[p.clusXVal] : srcScales?.[p.calbVal],
            y: p.clusYVal ? srcScales?.[p.clusYVal] : srcScales?.[p.calbVal]
          };

          if (pCalcDT?.[idx]) {
            // 生成済データを利用
            const aspectMode = boardMode === 'clus' ? 'custom' : 'square';
            const aspectRatio = boardMode === 'clus' ? (lyt.rowAspect?.[row] ?? 1.0) : null;
            plots[idx].src = { 
              data: { prevDT: pCalcDT[idx].prevDT, statsDT: pCalcDT[idx].statsDT }, 
              symb: config.symbology, gph, panel: p, layout: { aspectMode, aspectRatio }, scaleFixed 
            };
          } else {
            // 純粋関数で構成生成
            plots[idx].src = ReportMethod.buildChartConfig(d, dataset, p, boardMode, gph, config.symbology, scaleFixed, lyt, row);
          }
        });
      };

      if (window.__EXPORT_CFG__) {
        let finishedCount = 0, printFired = false;
        const waitTime = 500 + Math.min(5000, (lyt.gridRows * lyt.gridCols) * (d?.pxrfDT?.length || 0) * 0.15);
        const executePrint = () => {
          if (printFired) return;
          printFired = true;
          const loader = document.querySelector('[data-part="print-loading"], .print-loading');
          if (loader) loader.style.display = 'none';
          if (window.__EXPORT_CFG__.autoPrint) {
            requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(() => window.parent.postMessage('PRINT_READY', '*'), waitTime)));
          }
        };
        plots.forEach(plot => plot.addEventListener('render-finished', () => { if (++finishedCount === lyt.gridRows * lyt.gridCols) executePrint(); }, { once: true }));
        setTimeout(executePrint, Math.max(8000, waitTime + 4000));
        requestAnimationFrame(draw);
      } else {
        requestAnimationFrame(draw);
      }
    }
    // --- qRend ---
    static qRend(st) {
      if (window.__EXPORT_CFG__) return;
      clearTimeout(this.renderTimer);
      this.renderTimer = setTimeout(() => this.genCharts(st || RepoSt.getSt()), 250);
    }
  }

  // --- RepoExport ---
  class RepoExport {
    static _printListenerSet = false;
    // --- _buildFavObj ---
    static _buildFavObj(st) {
      const snap = st || RepoSt.getSt();
      const { config, dataset, panels, boardMode, layout, theme, symbology } = snap;
      return {
        boardMode: boardMode || config.boardMode,
        gridRows: layout?.gridRows ?? config.layout?.gridRows,
        gridCols: layout?.gridCols ?? config.layout?.gridCols,
        panelGap: layout?.panelGap ?? config.layout?.panelGap,
        rowAspect: layout?.rowAspect ?? config.layout?.rowAspect,
        rawGph: theme || config.theme,
        symb: symbology || config.symbology,
        filters: dataset.filters,
        crct: dataset.crct,
        calElms: dataset.calElms,
        useCal: dataset.useCal,
        useLOD: dataset.useLOD,
        panels
      };
    }
    // --- getFormattedDate ---
    static getFormattedDate() {
      const d = new Date();
      return `${d.getFullYear()}${(d.getMonth() + 1).toString().padStart(2, '0')}${d.getDate().toString().padStart(2, '0')}`;
    }
    // --- downloadFile ---
    static downloadFile(filename, content) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([content], { type: 'text/html' }));
      a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    // --- updExportDesc ---
    static updExportDesc(tgt) {
      if (!tgt) return;
      const descs = { pdf: 'ブラウザ機能を使用してPDFを出力します。', html: '静的HTMLをダウンロードします。', app: '解析ボードHTMLをダウンロードします。' };
      State.set("RPTST.ui.exportDesc", descs[tgt.value] || '');
      State.set("RPTST.ui.exportStatus", "message");
      RepoSt.update();
    }
    // --- setupPrintListener ---
    static setupPrintListener() {
      if (this._printListenerSet) return;
      window.addEventListener('message', e => {
        if (e.data === 'PRINT_READY') {
          const iframe = document.querySelector('iframe.pdf-generator');
          if (iframe) { iframe.contentWindow.print(); iframe.remove(); }
          document.querySelector('[data-part="btnOutput_exec"]')?.removeAttribute('disabled');
          State.set("RPTST.ui.exportStatus", "message");
          this.updExportDesc(document.querySelector('input[name="exportType"]:checked'));
        }
      });
      this._printListenerSet = true;
    }
    // --- _prepData ---
    static _prepData(st) {
      const snap = st || RepoSt.getSt();
      const { dataset, d, config, panels, boardMode, layout } = snap;
      const lyt = layout || config?.layout || { gridRows: 1, gridCols: 1 };
      
      const pCalcDT = panels.map((p, idx) => {
        const row = Math.floor(idx / lyt.gridCols);
        // 純粋関数で生成抽出
        const cfg = ReportMethod.buildChartConfig(d, dataset, p, boardMode, {}, {}, {}, lyt, row);
        return cfg ? cfg.data : { prevDT: [], statsDT: null };
      });

      if (!pCalcDT.some(res => res.prevDT?.length)) {
        // 短い警告コメント
        CoreAct.toast("警告", "有効なグラフがありません。\nデータフィルターを確認してください。");
        return null;
      }
      return pCalcDT;
    }
    // --- _buildHTML ---
    static _buildHTML(type, pCalcDT = null, st = null) {
      const snap = st || RepoSt.getSt();
      const ttl = `OBPLOT_${type.toUpperCase()}_${this.getFormattedDate()}`;
      const esc = s => s.replace(/</g, '\\u003c').replace(/>/g, '\\u003e');
      if (type === 'app') {
        const scrTag = `<title>${ttl}</title><script>window.__INJECTED_DATA__=${esc(JSON.stringify(snap.d))}; window.__INJECTED_FAVORITE__=${esc(JSON.stringify({ "RPTST.refs": this._buildFavObj(snap) }))};<\/script></head>`;
        return { ttl, hStr: `<!DOCTYPE html>${document.documentElement.outerHTML.replace('</head>', scrTag)}` };
      }
      const cfg = JSON.stringify({ autoPrint: type === 'pdf' });
      return { ttl, hStr: `<!DOCTYPE html>${document.documentElement.outerHTML.replace('<head>', `<head><title>${ttl}</title><script>window.__EXPORT_CFG__=${cfg}; window.__PRINT_STATE__=${esc(JSON.stringify({ RPTST: State.proxy.RPTST }))}; window.__PRECALC_DATA__=${esc(JSON.stringify(pCalcDT))};<\/script>`)}` };
    }
    // --- genPDF ---
    static genPDF() {
      const st = RepoSt.getSt(), pCalcDT = this._prepData(st);
      if (!pCalcDT) return false;
      const { hStr } = this._buildHTML('pdf', pCalcDT, st);
      this.setupPrintListener();
      const iframe = document.createElement('iframe');
      iframe.className = 'pdf-generator';
      iframe.style.cssText = 'position:fixed; top:-9999px; left:-9999px; width:210mm; height:297mm; border:none; opacity:0; pointer-events:none;';
      document.body.appendChild(iframe);
      iframe.contentDocument.open();
      iframe.contentDocument.write(hStr);
      iframe.contentDocument.close();
      return true;
    }
    // --- genStaticHTML ---
    static genStaticHTML() {
      const st = RepoSt.getSt(), pCalcDT = this._prepData(st);
      if (!pCalcDT) return false;
      const { ttl, hStr } = this._buildHTML('html', pCalcDT, st);
      this.downloadFile(`${ttl}.html`, hStr);
      return true;
    }
    // --- genApp ---
    static genApp() {
      const st = RepoSt.getSt();
      const { ttl, hStr } = this._buildHTML('app', null, st);
      this.downloadFile(`${ttl}.html`, hStr);
      return true;
    }
    // --- requestExport ---
    static async requestExport() {
      const btn = document.querySelector('[data-part="btnOutput_exec"]');
      const type = document.querySelector('input[name="exportType"]:checked')?.value;
      if (btn) btn.disabled = true;
      State.set({ "RPTST.ui.exportStatus": "loading", "RPTST.ui.exportDesc": "処理中..." });
      RepoSt.update();
      const restoreUI = () => {
        if (btn) btn.disabled = false;
        State.set("RPTST.ui.exportStatus", "message");
        this.updExportDesc(document.querySelector('input[name="exportType"]:checked'));
      };
      setTimeout(() => {
        let ok = false;
        if (type === 'pdf') ok = this.genPDF();
        else if (type === 'html') ok = this.genStaticHTML();
        else if (type === 'app') ok = this.genApp();
        if (ok && type !== 'pdf') setTimeout(restoreUI, 3000);
        else if (!ok) restoreUI();
      }, 50);
    }
    // --- requestCopyConfig ---
    static async requestCopyConfig() {
      const st = RepoSt.getSt();
      const jsonStr = JSON.stringify({ "RPTST.refs": this._buildFavObj(st) }, null, 2);
      const btn = document.querySelector('[data-part="btnOutput_copyCfg"]');
      const txt = document.querySelector('[data-part="txtOutput_fallback"]');
      if (btn) btn.disabled = true;
      if (txt) txt.style.display = 'none';
      State.set({ "RPTST.ui.copyStatus": "loading", "RPTST.ui.copyDesc": "コピー中..." });
      RepoSt.update();
      let copied = false;
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(jsonStr);
          copied = true;
        }
      } catch (e) { copied = false; }
      if (copied) {
        State.set({ "RPTST.ui.copyStatus": "success", "RPTST.ui.copyDesc": "クリップボードにコピーしました" });
        RepoSt.update();
        setTimeout(() => {
          if (btn) btn.disabled = false;
          State.set({ "RPTST.ui.copyStatus": "message", "RPTST.ui.copyDesc": "設定項目をクリップボードにコピーします。" });
          RepoSt.update();
        }, 3000);
      } else {
        State.set({ "RPTST.ui.copyStatus": "alert", "RPTST.ui.copyDesc": "アクセス拒否。手動コピーしてください。" });
        RepoSt.update();
        if (txt) { txt.style.display = 'block'; txt.value = jsonStr; txt.focus(); txt.select(); }
        if (btn) btn.disabled = false;
      }
    }
  }

  // --- RepoReact ---
  class RepoReact {
    static timers = {};
    // --- debounce ---
    static debounce(key, fn, delay = 10) {
      clearTimeout(this.timers[key]);
      this.timers[key] = setTimeout(() => fn(RepoSt.getSt()), delay);
    }
    // --- setup ---
    static setup() {
      const syncAria = (sel, attr, val) => document.querySelectorAll(sel).forEach(el => el.setAttribute('aria-selected', el.dataset[attr] === val ? 'true' : 'false'));
      // ★ 同期基準を param へ統一
      State.subscribe('RPTST.ui.activeTab', v => { syncAria('[data-part="tab-icon"]', 'param', v); syncAria('[data-part="tab-pane"]', 'param', v); });
      State.subscribe('RPTST.ui.activeSub', v => syncAria('[data-part="sub-pane"]', 'param', v));
      State.subscribe('RPTST.ui.activePanelId', v => syncAria('[data-panel-id]', 'panelId', v));
      State.subscribe(['RPTST.config.layout', 'RPTST.config.layout.gridRows', 'RPTST.config.layout.gridCols', 'RPTST.config.layout.panelGap', 'RPTST.config.layout.rowAspect'], () => this.debounce('layout', st => RepoRend.syncPanelDom(st))); // layout再計算
      State.subscribe('RPTST.config.boardMode', () => this.debounce('boardMode', st => { RepoSt.updateBaseScales(st, 'metric'); RepoSt.update(); RepoSt.renewPanel(st); }));
      State.subscribe(['RPTST.dataset.filters', 'RPTST.dataset.useCal', 'RPTST.dataset.useLOD', 'RPTST.dataset.crct', 'RPTST.dataset.calElms'], () => this.debounce('dataset', st => { RepoSt.updateBaseScales(st, 'all'); RepoSt.renewPanel(st); RepoRend.qRend(st); }));
      State.subscribe(['RPTST.config.symbology', 'RPTST.config.theme', 'RPTST.panels'], () => this.debounce('config', st => RepoRend.qRend(st)));
      State.subscribe('RPTST.ui.activePanelId', () => this.debounce('activePanel', st => RepoSt.renewPanel(st)));
      State.subscribe(['RPTST.config.symbology.baseKey', 'RPTST.config.symbology.rls'], () => this.debounce('symb', st => RepoSt.renewSymbState(st)));
      // --- input連動ロジック ---
      const setupMarginSync = (group, keys) => {
        const linkBind = `RPTST.ui.link${group.charAt(0).toUpperCase() + group.slice(1)}Margin`;
        const statePaths = keys.map(k => `RPTST.config.theme.${k}`);
        const syncAll = (val) => {
          const updates = {};
          keys.forEach(k => { updates[`RPTST.config.theme.${k}`] = val; });
          State.set(updates);
          document.querySelectorAll('form[data-bind-ctx]').forEach(f => CoreUIPatcher.syncFormCtx(f));
        };
        State.subscribe(linkBind, isLinked => { 
          if (isLinked) syncAll(State.get(statePaths[0]) ?? 0); 
        });
        State.subscribe(statePaths, newVal => { 
          if (State.get(linkBind)) syncAll(newVal); 
        });
      };
      setupMarginSync('canvas', ['bd_l', 'bd_t', 'bd_b', 'bd_r']);
      setupMarginSync('panel', ['p_l', 'p_t', 'p_b', 'p_r']);
    }
  }

  // --- RepoInit ---
  class RepoInit {
    // --- init ---
    static async init() {
      CoreAct.rootGLB({ CoreAct, RepoAct, RepoSt, RepoRend, RepoExport, RepoInit, RepoReact });
      RepoAct.automator = new CoreUI(REPORT_SCHEMA, 'RPTST');
      if (window.__EXPORT_CFG__) {
        State.set(window.__PRINT_STATE__);
        document.body.setAttribute('data-state', 'printing');
        const loading = document.createElement('div');
        loading.setAttribute('data-part', 'print-loading');
        loading.textContent = window.__EXPORT_CFG__.autoPrint ? '印刷用PDF生成中...' : '静的HTML生成中...';
        document.body.appendChild(loading);
        const grid = document.querySelector('[data-part="dashGrid"]');
        grid.innerHTML = '';
        for (let i = 0; i < 9; i++) {
          const div = document.createElement('div');
          div.setAttribute('data-part', `panel-${i}`);
          div.className = 'grid-panel';
          div.dataset.panelId = `p_${i}`;
          div.dataset.action = 'RepoAct.actvPanel';
          const chart = document.createElement('ui-plot');
          chart.style.cssText = 'width: 100%; height: 100%;';
          chart.setAttribute('data-renderer', 'svg');
          div.appendChild(chart);
          grid.appendChild(div);
        }
        RepoAct.automator.build();
        requestAnimationFrame(() => {
          const st = RepoSt.getSt();
          RepoRend.syncPanelDom(st);
          void document.body.offsetHeight;
          RepoRend.genCharts(st, window.__PRECALC_DATA__);
        });
        return;
      }
      State.set({
        "RPTST.ui.activeTab": "tabLayout",
        "RPTST.ui.activeSub": "subFont",
        "RPTST.ui.linkCanvasMargin": false,
        "RPTST.ui.linkPanelMargin": false,
        "RPTST.ui.exportDesc": "ブラウザ機能を使用してPDFを出力します。",
        "RPTST.ui.copyDesc": "設定項目をクリップボードにコピーします。"
      });
      const initDataRaw = window.__INJECTED_DATA__;
      const injData = (typeof initDataRaw === 'object' && initDataRaw !== null) ? initDataRaw : { pxrfDT: [], wdxrfDT: [], crctDT: [] };
      State.set("RPTST.dataset.raw", injData);
      document.querySelectorAll('input[type="number"], input[type="range"]').forEach(el => {
        const key = el.name || el.dataset.bind?.split('.').pop();
        if (key && RPT_CFG.rng[key]) {
          const rng = RPT_CFG.rng[key];
          el.setAttribute('min', rng.min);
          el.setAttribute('max', rng.max);
          el.setAttribute('step', rng.step);
        }
      });
      CoreUIPatcher.applyStaticAddons(RPT_CFG.rng);
      RepoAct.automator.build();
      let fav = null;
      if (typeof window.__INJECTED_FAVORITE__ === 'object' && window.__INJECTED_FAVORITE__ !== null) {
        fav = window.__INJECTED_FAVORITE__;
      } else if (typeof window.__INJECTED_FAVORITE__ === 'string' && window.__INJECTED_FAVORITE__ !== 'INJECT_FAVORITE_TARGET' && window.__INJECTED_FAVORITE__ !== 'null') {
        try { fav = JSON.parse(window.__INJECTED_FAVORITE__); } catch (e) {}
      }
      await RepoSt.initSt(fav, injData);
      const st = RepoSt.getSt();
      RepoRend.syncPanelDom(st);
      RepoSt.renewPanel(st);
      RepoReact.setup();
      window.addEventListener('resize', () => {
        clearTimeout(RepoRend.resizeTimer);
        RepoRend.resizeTimer = setTimeout(() => {
          const curSt = RepoSt.getSt();
          const gph = RepoRend.genGph(curSt);
          RepoRend.calcPanelSize(gph, curSt);
          RepoRend.genCharts(curSt);
        }, 250);
      });
    }
    // --- start ---
    static start() { return this.init(); }
  }

  window.RepoAct = RepoAct;
  window.RepoInit = RepoInit;
  window.RepoSt = RepoSt;
  window.RepoRend = RepoRend;
  window.RepoExport = RepoExport;
  window.RepoReact = RepoReact;

  if (document.readyState === 'loading') {
    window.addEventListener("DOMContentLoaded", () => RepoInit.init());
  } else {
    RepoInit.init();
  }
</script>
