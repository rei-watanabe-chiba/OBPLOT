<script>
  class RepoSt {
    static oldSymbAxis = GLB.symbBaseKey; 

    static async initSt(favObj, d) {
      const pxrf = d.pxrfDT || [];
      const exVals = (key) => {
        const vals = [...new Set(pxrf.map(r => (r[key] == null) ? "" : String(r[key]).trim()).filter(v => v !== ""))];
        return vals.length > 0 ? vals : null; 
      };
      
      const optsDB = exVals(GLB.idx.key1) || [];
      const optsItem = exVals(GLB.idx.p1) || [];
      const optsGroup = exVals(GLB.idx.wd1) || [];
      const initFltr = (buVal, opts) => Array.isArray(buVal) ? buVal.map(String) : opts;

      let refs = State.get("RPTST.refs") || {};
      let favRefs = favObj ? (favObj["RPTST.refs"] || favObj) : null;

      if (favRefs) {
        if (!favRefs.rawGph) favRefs.rawGph = { ...RPT_CFG.defRawGph };
        else favRefs.rawGph = { ...RPT_CFG.defRawGph, ...favRefs.rawGph };
        
        if (favRefs.panelGap === undefined || favRefs.panelGap === 16 || favRefs.panelGap === 12) favRefs.panelGap = 4;
        if (!favRefs.calElms || favRefs.calElms.length === 0) favRefs.calElms = [...GLB.valElms]; 
        
        if (!favRefs.filters || Array.isArray(favRefs.filters)) favRefs.filters = { db: optsDB, item: optsItem, group: optsGroup };
        else {
          favRefs.filters.db = initFltr(favRefs.filters.db, optsDB);
          favRefs.filters.item = initFltr(favRefs.filters.item, optsItem);
          favRefs.filters.group = initFltr(favRefs.filters.group, optsGroup);
        }
        if (favRefs.useLOD === undefined) favRefs.useLOD = false;
        if (!favRefs.boardMode) favRefs.boardMode = RPT_CFG.defRefs.boardMode;
        if (!favRefs.modeSec) favRefs.modeSec = { graphType: favRefs.boardMode === "clus" ? "clusimination" : "calibration" };
        if (!favRefs.rowAspect || !Array.isArray(favRefs.rowAspect)) favRefs.rowAspect = [...RPT_CFG.defRefs.rowAspect];
        favRefs.panels = (favRefs.panels || []).map(p => ({ ...RPT_CFG.defPnl, ...p, graphType: favRefs.modeSec.graphType }));
        
        State.set("RPTST.refs", structuredClone(favRefs));
      } else { 
        refs.boardMode = refs.boardMode || RPT_CFG.defRefs.boardMode;
        refs.modeSec = refs.modeSec || { graphType: refs.boardMode === "clus" ? "clusimination" : "calibration" };
        refs.rowAspect = refs.rowAspect || [...RPT_CFG.defRefs.rowAspect];
        refs.filters = { db: optsDB, item: optsItem, group: optsGroup };
        refs.rawGph = { ...RPT_CFG.defRawGph };
        refs.panels = (refs.panels || []).map(p => ({ ...RPT_CFG.defPnl, ...p, graphType: refs.modeSec.graphType }));
        State.set("RPTST.refs", structuredClone(refs));
      }
      // --- BaseScale 初期化と計算 ---
      State.set("RPTST.baseScales", { auto: {}, fixed: {} });
      RepoSt.updateBaseScales('all');
      // --- END BaseScale ---
      const curAspects = State.get("RPTST.refs.rowAspect") || [1.0, 1.0, 1.0];
      curAspects.forEach((v, i) => State.set(`RPTST.refs.rowAspect.${i}`, v));
      if (State.get("RPTST.refs.boardMode") === "clus") {
        const inpCols = document.getElementById("inpGridCols");
        if (inpCols) inpCols.setAttribute("max", "2");
        if (State.get("RPTST.refs.gridCols") > 2) State.set("RPTST.refs.gridCols", 2);
      }
      this.oldSymbAxis = State.get("RPTST.refs.symb.baseKey") || GLB.symbBaseKey;

      const optsCorr = [{ label: RPT_CFG.lbl.newCorr, val: "new" }, ...(d.crctDT || []).slice(1).filter(r => r[0]).map(r => ({ label: r[0], val: r[0] }))];
      const optValLgc = [...GLB.valElms, ...GLB.valLgc].map(v => ({ label: v, val: v }));

      State.set({
        "RPTST.data.crctFields": [{ type: "select", bind: "RPTST.refs.crct", hasEmpty: false, opts: optsCorr }],
        "RPTST.data.fontEngFields": [{ type: "select", bind: "RPTST.refs.rawGph.fontEng", hasEmpty: false, opts: GLB.fontEngList.map(v => ({label:v, val:v})) }],
        "RPTST.data.fontJpFields": [{ type: "select", bind: "RPTST.refs.rawGph.fontJp", hasEmpty: false, opts: GLB.fontJpList.map(v => ({label:v, val:v})) }],
        "RPTST.data.calbValFields": [{ type: "select", bind: "RPTST.data.apCalbVal", change: "RepoSt.renewPanelRef", hasEmpty: true, opts: optValLgc }],
        "RPTST.data.clusXFields": [{ type: "select", bind: "RPTST.data.apClusXVal", change: "RepoSt.renewPanelRef", hasEmpty: true, opts: optValLgc }],
        "RPTST.data.clusYFields": [{ type: "select", bind: "RPTST.data.apClusYVal", change: "RepoSt.renewPanelRef", hasEmpty: true, opts: optValLgc }],
        "RPTST.data.tickUnitFields": [{ type: "select", bind: "RPTST.data.apTickUnit", change: "RepoSt.renewPanelRef", hasEmpty: false, field: "tickUnit", opts: [{ label: "自動", val: "" }] }],
        "RPTST.data.clusTickXFields": [{ type: "select", bind: "RPTST.data.apTickUnitX", change: "RepoSt.renewPanelRef", hasEmpty: false, field: "tickUnitX", opts: [{ label: "自動", val: "" }] }],
        "RPTST.data.clusTickYFields": [{ type: "select", bind: "RPTST.data.apTickUnitY", change: "RepoSt.renewPanelRef", hasEmpty: false, field: "tickUnitY", opts: [{ label: "自動", val: "" }] }],
        "RPTST.data.axisFields": [{ type: "select", bind: "RPTST.refs.symb.baseKey", change: "RepoSt.valdSymbAxis", hasEmpty: false, opts: GLB.symbAxes }],
        "RPTST.data.filterDBOpts": optsDB, 
        "RPTST.data.filterItemOpts": optsItem, 
        "RPTST.data.filterGroupOpts": optsGroup, 
        "RPTST.data.calElmsOpts": GLB.valElms
      });
      
      this.renewSymbState();
    }

    static updateBaseScales(triggerType, metricsToUpdate = null) {
      const d = State.get("RPTST.data.raw");
      if (!d || !d.pxrfDT || !d.wdxrfDT) return;
      const r = State.get("RPTST.refs") || {};
      const boardMode = r.modeSec?.graphType || (r.boardMode === 'clus' ? 'clusimination' : 'calibration');
      
      const targetMetrics = new Set();
      if (metricsToUpdate) {
        if (Array.isArray(metricsToUpdate)) metricsToUpdate.forEach(m => targetMetrics.add(m));
        else targetMetrics.add(metricsToUpdate);
      } else {
        (r.panels || []).forEach(p => {
          if (boardMode === 'calibration' && p.calbVal) targetMetrics.add(p.calbVal);
          else if (boardMode === 'clusimination') {
            if (p.clusXVal) targetMetrics.add(p.clusXVal);
            if (p.clusYVal) targetMetrics.add(p.clusYVal);
          }
        });
      }
      if (targetMetrics.size === 0) return;

      const baseScales = State.get("RPTST.baseScales") || { auto: {}, fixed: {} };
      if (!baseScales.auto) baseScales.auto = {};
      if (!baseScales.fixed) baseScales.fixed = {};

      const calcForMetrics = (mode, filters) => {
         const conf = { useCal: r.useCal, crctDT: d.crctDT, useLOD: r.useLOD };
         let pDT = d.pxrfDT, wDT = d.wdxrfDT;
         if (filters) {
           const { db, item, group } = filters;
           if (Array.isArray(db) && db.length > 0) {
             pDT = pDT.filter(row => db.includes(String(row[GLB.idx.key1])));
             wDT = wDT.filter(row => db.includes(String(row[GLB.idx.key1])));
           }
           if (Array.isArray(item) && item.length > 0) pDT = pDT.filter(row => item.includes(String(row[GLB.idx.p1])));
           if (Array.isArray(group) && group.length > 0) {
             pDT = pDT.filter(row => group.includes(String(row[GLB.idx.wd1])));
             wDT = wDT.filter(row => group.includes(String(row[GLB.idx.wd1])));
           }
         }
         
         const filteredCalibBase = CHARTDT.genPrev(pDT, wDT, { ...conf, val: GLB.valElms[0] });
         
         targetMetrics.forEach(metric => {
            const wVals = wDT.map(w => CoreMethod.Calc.evaluate(metric, w)).filter(v => v != null && !isNaN(v));
            const pVals = filteredCalibBase.map(p => CoreMethod.Calc.evaluate(metric, p)).filter(v => v != null && !isNaN(v));
            const combined = [...wVals, ...pVals];
            if (combined.length > 0) {
              const sc = CoreMethod.Util.calcScale(combined, combined);
              const units = CoreMethod.Util.calcNiceTickUnits(combined);
              baseScales[mode][metric] = { niceMin: sc.niceMin, niceMax: sc.niceMax, ticks: sc.niceTicks.map(t=>t.v), units };
            } else {
              baseScales[mode][metric] = null;
            }
         });
      };

      if (['all', 'db', 'metric'].includes(triggerType)) calcForMetrics('fixed', { db: r.filters?.db || [] });
      if (['all', 'item', 'group', 'db', 'calib', 'lod', 'metric'].includes(triggerType)) calcForMetrics('auto', r.filters);

      State.set("RPTST.baseScales", baseScales);
    }

    static async valdSymbAxis(tgt) {
      const newVal = tgt.value, oldVal = this.oldSymbAxis;
      if (newVal === oldVal) return;
      const isConfirmed = await CoreAct.withAsync(null, { title: "確認", msg: "属性を変更してシンボル設定をリセットします" }, async () => {
        State.set({ "RPTST.refs.symb.baseKey": newVal, "RPTST.refs.symb.rls": [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }] });
        this.oldSymbAxis = newVal;
        return null;
      });
      if (!isConfirmed) {
        tgt.value = oldVal;
        State.set("RPTST.refs.symb.baseKey", oldVal);
      }
    }

    static resetSymb() { State.set("RPTST.refs.symb.rls", [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }]); }
    static addSymb() { State.set("RPTST.refs.symb.rls", [...State.get("RPTST.refs.symb.rls"), { key: `rule_${Date.now()}`, target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }]); }
    static removeSymb(btn) { State.set("RPTST.refs.symb.rls", State.get("RPTST.refs.symb.rls").filter(rw => rw.key !== btn.dataset.ruleKey)); }
    static updSymb(btn) {
      const i = btn.dataset.symbolIdx, t = btn.dataset.symbolType;
      if (i != null && t) { 
        const newSym = JSON.parse(JSON.stringify(State.get("RPTST.refs.symb.rls")));
        newSym[i][t] = btn.value; 
        State.set("RPTST.refs.symb.rls", newSym);
      }
    }

    static renewSymbState() {
      const d = State.get("RPTST.data.raw"), r = State.get("RPTST.refs");
      if (!d?.pxrfDT?.length) return;
      const vals = [...new Set(d.pxrfDT.map(pt => pt[r.symb.baseKey]).filter(Boolean))];
      State.set("RPTST.data.symbSrc", { rls: r.symb.rls, optsConf: { target: [{ val: "", label: RPT_CFG.lbl.unsel }, ...vals.map(v => ({ val: v, label: v }))], shp: GLB.symbShapes, clr: GLB.symbColors }, actsConf: { add: "RepoSt.addSymb", remove: "RepoSt.removeSymb", update: "RepoSt.updSymb"} });
    }

    static renewPanelRef(tgt) {
      const key = tgt.dataset.apKey || tgt.dataset.field || tgt.dataset.bind?.split('.').pop().replace('ap', '');
      const apKey = key.charAt(0).toLowerCase() + key.slice(1);
      const val = tgt.value || tgt.dataset.target;
      const activeId = State.get("RPTST.refs.activePanelId");
      const panels = State.get("RPTST.refs.panels") || [];
      const panel = panels.find(p => p.id === activeId);
      
      if (panel) {
         if (['tickUnit', 'tickUnitX', 'tickUnitY'].includes(apKey)) {
           panel[apKey] = (val === "" || isNaN(Number(val))) ? null : Number(val);
         } else {
           panel[apKey] = val;
         }
         if (apKey === 'scaleMode') {
           panel.tickUnit = "";
           panel.tickUnitX = "";
           panel.tickUnitY = "";
         }

         if (['calbVal', 'clusXVal', 'clusYVal'].includes(apKey)) {
            panel.tickUnit = "";
            panel.tickUnitX = "";
            panel.tickUnitY = "";
            const boardMode = State.get("RPTST.refs.modeSec.graphType") || (State.get("RPTST.refs.boardMode") === 'clus' ? 'clusimination' : 'calibration');
            if (boardMode === 'calibration') {
              panel.title = panel.calbVal || ""; panel.xLabel = "WDXRF"; panel.yLabel = "pXRF";
            } else {
              const xV = panel.clusXVal || "", yV = panel.clusYVal || "";
              panel.title = (xV || yV) ? `${xV} vs ${yV}` : ""; panel.xLabel = xV; panel.yLabel = yV;
            }
            RepoSt.updateBaseScales('metric', [val]);
         }
         State.set("RPTST.refs.panels", [...panels]);
         this.renewPanel();
         if (apKey === 'scaleMode') RepoRend.qRend();
      }
    }

    static renewPanel() {
      const activeId = State.get("RPTST.refs.activePanelId");
      const panels = State.get("RPTST.refs.panels") || [];
      const panel = panels.find(p => p.id === activeId);
      const r = State.get("RPTST.refs") || {};
      const d = State.get("RPTST.data.raw") || {};
      const boardMode = r.modeSec?.graphType || (r.boardMode === 'clus' ? 'clusimination' : 'calibration');

      const baseScales = State.get("RPTST.baseScales") || { auto: {}, fixed: {} };
      const isManual = panel?.scaleMode === 'manual';
      const targetScales = isManual ? baseScales.fixed : baseScales.auto;

      let tickOpts = [{ label: "自動", val: "" }];
      let tickXOpts = [{ label: "自動", val: "" }];
      let tickYOpts = [{ label: "自動", val: "" }];

      if (panel) {
          if (boardMode === 'calibration' && panel.calbVal && targetScales[panel.calbVal]) {
             const units = targetScales[panel.calbVal].units || [];
             tickOpts = [{ label: "自動", val: "" }, ...units.map(u => ({ label: String(u), val: String(u) }))];
          } else if (boardMode === 'clusimination') {
             if (panel.clusXVal && targetScales[panel.clusXVal]) {
                const units = targetScales[panel.clusXVal].units || [];
                tickXOpts = [{ label: "自動", val: "" }, ...units.map(u => ({ label: String(u), val: String(u) }))];
             }
             if (panel.clusYVal && targetScales[panel.clusYVal]) {
                const units = targetScales[panel.clusYVal].units || [];
                tickYOpts = [{ label: "自動", val: "" }, ...units.map(u => ({ label: String(u), val: String(u) }))];
             }
          }
      }

      const ensureOpt = (opts, curVal) => {
        if (curVal != null && curVal !== "" && !opts.some(o => String(o.val) === String(curVal))) {
          opts.push({ label: `${curVal}`, val: String(curVal) });
        }
      };
      ensureOpt(tickOpts, panel?.tickUnit);
      ensureOpt(tickXOpts, panel?.tickUnitX);
      ensureOpt(tickYOpts, panel?.tickUnitY);

      State.set({
        "RPTST.data.apGraphType": boardMode, 
        "RPTST.data.apCalbVal": panel?.calbVal || "", 
        "RPTST.data.apClusXVal": panel?.clusXVal || "", 
        "RPTST.data.apClusYVal": panel?.clusYVal || "",
        "RPTST.data.apTitle": panel?.title || "", 
        "RPTST.data.apXLabel": panel?.xLabel || "", 
        "RPTST.data.apYLabel": panel?.yLabel || "",
        "RPTST.data.apTickUnit": (panel?.tickUnit != null && panel.tickUnit !== "") ? String(panel.tickUnit) : "",
        "RPTST.data.apTickUnitX": (panel?.tickUnitX != null && panel.tickUnitX !== "") ? String(panel.tickUnitX) : "",
        "RPTST.data.apTickUnitY": (panel?.tickUnitY != null && panel.tickUnitY !== "") ? String(panel.tickUnitY) : "",
        "RPTST.data.tickUnitFields": [{ type: "select", bind: "RPTST.data.apTickUnit", change: "RepoSt.renewPanelRef", hasEmpty: false, field: "tickUnit", opts: tickOpts }],
        "RPTST.data.clusTickXFields": [{ type: "select", bind: "RPTST.data.apTickUnitX", change: "RepoSt.renewPanelRef", hasEmpty: false, field: "tickUnitX", opts: tickXOpts }],
        "RPTST.data.clusTickYFields": [{ type: "select", bind: "RPTST.data.apTickUnitY", change: "RepoSt.renewPanelRef", hasEmpty: false, field: "tickUnitY", opts: tickYOpts }],
        "RPTST.data.apScaleMode": panel?.scaleMode || "auto"
      });
      RepoAct.automator.update();
    }
  }

  class RepoAct {
    static automator = null;

    // --- ボード設定操作 ---
    static setBoardMode(btnOrMode) {
      const mode = typeof btnOrMode === 'string' ? btnOrMode : (btnOrMode?.dataset?.target || btnOrMode?.dataset?.mode || 'calib');
      const curMode = State.get("RPTST.refs.boardMode");
      if (curMode === mode) return;

      const tgtType = mode === 'clus' ? 'clusimination' : 'calibration';
      State.set("RPTST.refs.boardMode", mode);
      State.set("RPTST.refs.modeSec.graphType", tgtType);
      const panels = State.get("RPTST.refs.panels") || [];
      panels.forEach(p => {
        p.graphType = tgtType;
        p.tickUnit = ""; p.tickUnitX = ""; p.tickUnitY = "";
        if (tgtType === 'calibration') {
          p.title = p.calbVal || ""; p.xLabel = "WDXRF"; p.yLabel = "pXRF";
        } else {
          const xV = p.clusXVal || "", yV = p.clusYVal || "";
          p.title = (xV || yV) ? `${xV} vs ${yV}` : ""; p.xLabel = xV; p.yLabel = yV;
        }
      });
      State.set("RPTST.refs.panels", [...panels]);

      const inpCols = document.getElementById('inpGridCols');
      if (mode === 'clus') {
        if (inpCols) inpCols.setAttribute('max', '2');
        if (State.get("RPTST.refs.gridCols") > 2) State.set("RPTST.refs.gridCols", 2);
      } else {
        if (inpCols) inpCols.setAttribute('max', '3');
      }

      RepoRend.syncPanelDom();
      RepoSt.renewPanel();
      this.automator.update();
    }

    static changeGridCols(inp) {
      const mode = State.get("RPTST.refs.boardMode") || 'calib';
      let val = Number(inp.value);
      if (mode === 'clus' && val > 2) {
        val = 2;
        inp.value = 2;
        State.set("RPTST.refs.gridCols", 2);
      }
    }

    static changeRowAspect(inp) {
      const idx = Number(inp.dataset.aspectIdx);
      let val = Number(inp.value);
      if (isNaN(val) || val < 0.1) val = 0.1;
      if (val > 2.0) val = 2.0;
      val = Math.round(val * 10) / 10;
      inp.value = val;
      const rowAspect = [...(State.get("RPTST.refs.rowAspect") || [1.0, 1.0, 1.0])];
      rowAspect[idx] = val;
      State.set("RPTST.refs.rowAspect", rowAspect);
      State.set(`RPTST.refs.rowAspect.${idx}`, val);
    }

    // --- タブ・パネル操作 ---
    static actvTab(btn) {
      State.set("RPTST.ui.activeTab", btn.dataset.tab);
      this.automator.update();
    }

    static actvSub(btn) {
      State.set("RPTST.ui.activeSub", btn.dataset.target);
      this.automator.update();
    }

    static actvPanel(btn) {
      State.set("RPTST.refs.activePanelId", btn.dataset.panelId);
    }

    // --- 出力中継・委譲 ---
    static updExportDesc(tgt) { RepoExport.updExportDesc(tgt); }
    static requestExport() { RepoExport.requestExport(); }
    static requestCopyConfig() { RepoExport.requestCopyConfig(); }
    static syncPanelDom() { RepoRend.syncPanelDom(); }

    // --- 余白一括同期・リンク ---
    static toggleMarginLink(btn) {
      const group = btn.dataset.syncGroup;
      if (!group) return;
      const linkBind = `RPTST.ui.link${group.charAt(0).toUpperCase() + group.slice(1)}Margin`;
      const isLinked = !State.get(linkBind);
      State.set(linkBind, isLinked);
      btn.classList.toggle('active', isLinked);
      const icon = btn.querySelector('.material-symbols-outlined') || btn;
      icon.textContent = isLinked ? 'link' : 'link_off';
      btn.title = isLinked ? '連動解除' : '4方向連動';
    }

    static syncMargin(inp) {
      const group = inp.dataset.syncGroup;
      if (!group) return;
      const linkBind = `RPTST.ui.link${group.charAt(0).toUpperCase() + group.slice(1)}Margin`;
      if (!State.get(linkBind)) return;
      
      const keys = group === 'canvas' ? ['bd_l','bd_t','bd_b','bd_r'] : ['p_l','p_t','p_b','p_r'];
      const val = Number(inp.value);
      keys.forEach(k => State.set(`RPTST.refs.rawGph.${k}`, val));
      RepoAct.automator.build();
    }
  }

  class RepoRend {
    static resizeTimer = null;
    static renderTimer = null;

    // --- DOM・レイアウト同期 ---
    static syncPanelDom() {
      const r = State.get("RPTST.refs");
      const reqIds = [];
      for (let i = 0; i < r.gridRows * r.gridCols; i++) reqIds.push(`p_${i}`);
      
      let panels = State.get("RPTST.refs.panels") || [];
      reqIds.forEach(id => { if (!panels.find(p => p.id === id)) panels.push({ id, ...RPT_CFG.defPnl }); });
      panels = reqIds.map(id => panels.find(p => p.id === id));
      State.set("RPTST.refs.panels", panels);
      
      if (!panels.find(p => p.id === r.activePanelId)) State.set("RPTST.refs.activePanelId", panels[0]?.id || "p_0");

      RepoSt.renewPanel();

      const cont = document.getElementById('a4Container');
      cont.style.setProperty('--col-count', r.gridCols); 
      cont.style.setProperty('--row-count', r.gridRows);
      cont.style.setProperty('--panel-gap', `${(r.panelGap !== undefined ? Number(r.panelGap) : 4)}mm`);

      for (let i = 0; i < 9; i++) {
        const el = document.getElementById(`p_${i}`);
        if (!el) continue;
        if (i < r.gridRows * r.gridCols) {
          const row = Math.floor(i / r.gridCols);
          const col = i % r.gridCols;
          if (row === 0) el.setAttribute('data-col-lbl', `c${col + 1}`);
          else el.removeAttribute('data-col-lbl');
          if (col === 0) el.setAttribute('data-row-lbl', `r${row + 1}`);
          else el.removeAttribute('data-row-lbl');
        } else {
          el.removeAttribute('data-col-lbl');
          el.removeAttribute('data-row-lbl');
        }
      }
      
      RepoAct.automator.update();
      this.fitA4Scale();
      if (!window.__EXPORT_CFG__) this.genCharts();
    }

    static fitA4Scale() {
      if (window.__EXPORT_CFG__) return;
      const main = document.querySelector('.dash-main'), a4 = document.getElementById('a4Container');
      a4.style.transform = 'none';
      const scale = Math.min((main.clientWidth - 48) / a4.offsetWidth, (main.clientHeight - 48) / a4.offsetHeight, 1);
      a4.style.transform = `scale(${scale})`;
      a4.style.marginBottom = `-${a4.offsetHeight * (1 - scale)}px`;
    }

    static genGph() {
      const raw = { ...RPT_CFG.defRawGph, ...(State.get("RPTST.refs.rawGph") || {}) };
      const gphProps = ReportMethod.buildGraphStyle(raw, RPT_CFG.rng);

      const cont = document.getElementById('a4Container');
      if (cont) {
        const dirs = [{p:'top', k:'bd_t'}, {p:'right', k:'bd_r'}, {p:'bottom', k:'bd_b'}, {p:'left', k:'bd_l'}];
        dirs.forEach(({p, k}) => {
          const unit = RPT_CFG.rng[k]?.unit || 'mm';
          cont.style.setProperty(`--margin-${p}`, `${raw[k]}${unit}`);
        });
      }

      return gphProps;
    }

    static calcPanelSize(gph) {
      const grid = document.getElementById('dashGrid'), r = State.get("RPTST.refs");
      grid.style.removeProperty('--panel-w'); grid.style.removeProperty('--panel-h');

      let gw, gh;
      if (window.__EXPORT_CFG__) {
        const MM2PX = 3.7795275591;
        const raw = { ...RPT_CFG.defRawGph, ...(State.get("RPTST.refs.rawGph") || {}) };
        const usableW = (210 - (raw.bd_l || 15) - (raw.bd_r || 15)) * MM2PX;
        const usableH = (297 - (raw.bd_t || 15) - (raw.bd_b || 15)) * MM2PX;
        gw = usableW;
        gh = usableH;
      } else {
        gw = grid.clientWidth;
        gh = grid.clientHeight;
      }

      if (gw === 0 || gh === 0) return;

      const gapPx = (r.panelGap !== undefined ? Number(r.panelGap) : 4) * 3.78;
      const hasTitle = r.panels.some(p => p.title);
      const titleSizePx = (r.rawGph?.s_title || 12) * 1.33;
      const boardMode = r.boardMode || 'calib';

      if (boardMode === 'clus' && r.rowAspect?.length && (r.gridRows || 1) > 0) {
        // --- 判別図: rowAspect 対応（非正方形）---
        const rowCount = r.gridRows || 1;
        const aspects = (r.rowAspect || []).slice(0, rowCount);
        const metrics = ReportMethod.calculatePanelMetricsAspect(
          gw, gh, r.gridCols || 1, rowCount, gapPx, gph, hasTitle, titleSizePx, aspects
        );
        grid.style.setProperty('--panel-w', `${metrics.panelW}px`);
        // grid-template-rows を明示的な行高さリストで上書き（CSS変数ベースのrepeat()を無効化）
        grid.style.gridTemplateRows = metrics.panelH.map(h => `${h}px`).join(' ');
        // rowPlotH を State に保存（genCharts で ui-plot へ渡すため）
        State.set("RPTST.data.rowPlotH", metrics.plotH);
      } else {
        // --- 検量線: 既存の正方形ロジック ---
        const metrics = ReportMethod.calculatePanelMetrics(gw, gh, r.gridCols || 1, r.gridRows || 1, gapPx, gph, hasTitle, titleSizePx);
        grid.style.setProperty('--panel-w', `${metrics.panelW}px`);
        grid.style.setProperty('--panel-h', `${metrics.panelH}px`);
        grid.style.gridTemplateRows = ''; // inline style をクリアして CSS 変数ベースに戻す
        State.set("RPTST.data.rowPlotH", null);
      }
      void grid.offsetHeight;
    }

    static genCharts(pCalcDT = null) {
      const gph = this.genGph();
      this.calcPanelSize(gph);
      const r = State.get("RPTST.refs"), d = State.get("RPTST.data.raw");
      const plots = document.getElementById('dashGrid').querySelectorAll('ui-plot');
      
      const draw = () => {
        const rowPlotH = State.get("RPTST.data.rowPlotH"); // 判別図時の行ごとのplotH配列、calib時はnull
        const baseScales = State.get("RPTST.baseScales") || {};
        r.panels.forEach((p, idx) => {
          const el = document.getElementById(`p_${idx}`);
          if (el) {
            const row = Math.floor(idx / r.gridCols);
            const col = idx % r.gridCols;
            if (row === 0) el.setAttribute('data-col-lbl', `c${col + 1}`);
            else el.removeAttribute('data-col-lbl');
            if (col === 0) el.setAttribute('data-row-lbl', `r${row + 1}`);
            else el.removeAttribute('data-row-lbl');
          }
          if (!plots[idx]) return;
          const row = Math.floor(idx / r.gridCols);
          // plotH: 判別図モードの行単位プロット高さ（px）。calib時は null（正方形ロジック）
          const plotH = rowPlotH?.[row] ?? null;
          
          const isManual = p.scaleMode === 'manual';
          const baseScales = State.get("RPTST.baseScales") || { auto: {}, fixed: {} };
          const srcScales = isManual ? baseScales.fixed : baseScales.auto;

          const scaleFixed = {
            x: p.clusXVal ? srcScales[p.clusXVal] : srcScales[p.calbVal],
            y: p.clusYVal ? srcScales[p.clusYVal] : srcScales[p.calbVal]
          };

          if (pCalcDT?.[idx]) {
            plots[idx].src = { prevDT: pCalcDT[idx].prevDT, statsDT: pCalcDT[idx].statsDT, symb: r.symb, gph: gph, panel: p, plotH, scaleFixed };
          } else {
            if (!d?.pxrfDT?.length) return;
            const graphType = r.modeSec?.graphType || (r.boardMode === 'clus' ? 'clusimination' : 'calibration');
            const conf = { useCal: r.useCal, calElms: r.calElms, crct: r.crct, crctDT: d.crctDT, useLOD: r.useLOD, filters: r.filters, graphType: graphType, calbVal: p.calbVal, clusXVal: p.clusXVal, clusYVal: p.clusYVal };
            const { prevDT, statsDT } = CHARTDT.generateChartData(d.pxrfDT, d.wdxrfDT, conf);
            plots[idx].src = { prevDT, statsDT, symb: r.symb, gph: gph, panel: p, plotH, scaleFixed };
          }
        });
      };

      if (window.__EXPORT_CFG__) {
         let finishedCount = 0, printFired = false;

         const variableDelay = Math.min(5000, (r.gridRows * r.gridCols) * (d?.pxrfDT?.length || 0) * 0.15);
         const waitTime = 500 + variableDelay;
         const fallbackTime = Math.max(8000, waitTime + 4000);

         const executePrint = () => { 
           if (printFired) return; 
           printFired = true; 
           const loader = document.querySelector('.print-loading');
           if (loader) loader.style.display = 'none';
           if (window.__EXPORT_CFG__.autoPrint) {
             requestAnimationFrame(() => {
               requestAnimationFrame(() => {
                 setTimeout(() => { 
                   window.parent.postMessage('PRINT_READY', '*');
                 }, waitTime);
               });
             });
           }
         };
         plots.forEach(plot => { plot.addEventListener('render-finished', () => { finishedCount++; if (finishedCount === r.gridRows * r.gridCols) executePrint(); }, { once: true }); });
         setTimeout(executePrint, fallbackTime);
         requestAnimationFrame(draw);
      } else {
         requestAnimationFrame(draw);
      }
    }

    static qRend() {
      if (window.__EXPORT_CFG__) return;
      clearTimeout(this.renderTimer);
      this.renderTimer = setTimeout(() => this.genCharts(), 250);
    }
  }

  class RepoExport {
    static _printListenerSet = false;

    static getFormattedDate() {
      const d = new Date();
      return `${d.getFullYear()}${(d.getMonth()+1).toString().padStart(2,'0')}${d.getDate().toString().padStart(2,'0')}`;
    }

    static downloadFile(filename, content) {
      const blob = new Blob([content], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    static updExportDesc(tgt) {
      if (!tgt) return;
      const type = tgt.value;
      if (type === 'pdf') {
        State.set("RPTST.ui.exportDesc", 'ブラウザ機能を使用してPDFを出力します。');
      } else if (type === 'html') {
        State.set("RPTST.ui.exportDesc", '静的HTMLをダウンロードします。');
      } else if (type === 'app') {
        State.set("RPTST.ui.exportDesc", '解析ボードHTMLをダウンロードします。');
      }
      State.set("RPTST.ui.exportStatus", "message");
      RepoAct.automator.update();
    }

    static setupPrintListener() {
      if (this._printListenerSet) return;
      window.addEventListener('message', (e) => {
        if (e.data === 'PRINT_READY') {
          const iframe = document.querySelector('iframe.pdf-generator');
          if (iframe) {
            iframe.contentWindow.print();
            iframe.remove();
          }
          CoreAct.toast("完了", "PDFを出力しました。", "success");
          const btn = document.getElementById('btnOutput_exec');
          if (btn) btn.disabled = false;
          State.set("RPTST.ui.exportStatus", "message");
          this.updExportDesc(document.querySelector('input[name="exportType"]:checked'));
        }
      });
      this._printListenerSet = true;
    }

    static _prepData() {
      const r = State.get("RPTST.refs"), d = State.get("RPTST.data.raw");
      const graphType = r.modeSec?.graphType || (r.boardMode === 'clus' ? 'clusimination' : 'calibration');
      const pCalcDT = r.panels.map(p => {
        if (!d.pxrfDT?.length) return { prevDT: [], statsDT: null };
        const conf = { useCal: r.useCal, calElms: r.calElms, crct: r.crct, crctDT: d.crctDT, useLOD: r.useLOD, filters: r.filters, graphType: graphType, calbVal: p.calbVal, clusXVal: p.clusXVal, clusYVal: p.clusYVal };
        return CHARTDT.generateChartData(d.pxrfDT, d.wdxrfDT, conf);
      });
      if (!pCalcDT.some(res => res.prevDT?.length > 0)) {
        CoreAct.toast("警告", "有効なグラフがありません。\nデータフィルターを確認してください。");
        return null;
      }
      return pCalcDT;
    }

    static _buildHTML(type, pCalcDT = null) {
      const dateStr = this.getFormattedDate();
      const outerHTML = document.documentElement.outerHTML;
      const data = {
        raw: State.get("RPTST.data.raw"),
        fav: { "RPTST.refs": State.get("RPTST.refs") },
        state: { RPTST: State.proxy.RPTST },
        pCalcDT: pCalcDT
      };
      return ReportMethod.generateExportHTML(type, outerHTML, dateStr, data);
    }

    static genPDF() {
      const pCalcDT = this._prepData();
      if (!pCalcDT) return false;
      const { hStr } = this._buildHTML('pdf', pCalcDT);
      
      this.setupPrintListener();
      
      const iframe = document.createElement('iframe');
      iframe.className = 'pdf-generator';
      iframe.style.cssText = 'position:fixed; top:-9999px; left:-9999px; width:210mm; height:297mm; border:none; opacity:0; pointer-events:none;';
      document.body.appendChild(iframe);
      iframe.contentDocument.open();
      iframe.contentDocument.write(hStr);
      iframe.contentDocument.close();
      
      return true;
    }

    static genStaticHTML() {
      const pCalcDT = this._prepData();
      if (!pCalcDT) return false;
      const { ttl, hStr } = this._buildHTML('html', pCalcDT);
      this.downloadFile(`${ttl}.html`, hStr);
      return true;
    }

    static genApp() {
      const { ttl, hStr } = this._buildHTML('app');
      this.downloadFile(`${ttl}.html`, hStr);
    }

    static requestExport() {
      const btn = document.getElementById('btnOutput_exec');
      const type = document.querySelector('input[name="exportType"]:checked')?.value;
      
      if (btn) btn.disabled = true;
      State.set({
        "RPTST.ui.exportStatus": "loading",
        "RPTST.ui.exportDesc": "処理中..."
      });
      RepoAct.automator.update();

      setTimeout(() => {
        const restoreUI = () => {
          if (btn) btn.disabled = false;
          State.set("RPTST.ui.exportStatus", "message");
          this.updExportDesc(document.querySelector('input[name="exportType"]:checked'));
        };

        if (type === 'pdf') {
          if (this.genPDF() === false) restoreUI();
        } else if (type === 'html') {
          if (this.genStaticHTML() === false) {
            restoreUI();
          } else {
            setTimeout(restoreUI, 3000);
          }
        } else if (type === 'app') {
          this.genApp();
          setTimeout(restoreUI, 3000);
        }
      }, 50);
    }

    static async requestCopyConfig() {
      const refs = State.get("RPTST.refs");
      const jsonStr = JSON.stringify({ "RPTST.refs": refs }, null, 2);
      
      const btn = document.getElementById('btnOutput_copyCfg');
      const txt = document.getElementById("txtOutput_fallback");
      if (btn) btn.disabled = true;
      if (txt) txt.style.display = 'none';

      State.set({ "RPTST.ui.copyStatus": "loading", "RPTST.ui.copyDesc": "コピー中..." });
      RepoAct.automator.update();

      let copied = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(jsonStr);
          copied = true;
        }
      } catch (e) {
        copied = false;
      }
      
      if (copied) {
        State.set({ "RPTST.ui.copyStatus": "success", "RPTST.ui.copyDesc": "クリップボードにコピーしました" });
        RepoAct.automator.update();
        setTimeout(() => {
          if (btn) btn.disabled = false;
          State.set({ "RPTST.ui.copyStatus": "message", "RPTST.ui.copyDesc": "設定項目をクリップボードにコピーします。" });
          RepoAct.automator.update();
        }, 3000);
      } else {
        State.set({ "RPTST.ui.copyStatus": "alert", "RPTST.ui.copyDesc": "アクセス拒否。手動コピーしてください。" });
        RepoAct.automator.update();
        if (txt) {
          txt.style.display = 'block';
          txt.value = jsonStr;
          txt.focus();
          txt.select();
        }
        if (btn) btn.disabled = false;
      }
    }
  }

  class RepoInit {
    static async init() {
      CoreAct.rootGLB({ CoreAct, RepoAct, RepoSt, RepoRend, RepoExport, RepoInit });
      RepoAct.automator = new CoreUI(REPORT_SCHEMA, 'RPTST');

      if (window.__EXPORT_CFG__) {
         State.set(window.__PRINT_STATE__);
         document.body.classList.add('is-print'); 
         const loading = document.createElement('div');
         loading.className = 'print-loading'; loading.textContent = window.__EXPORT_CFG__.autoPrint ? '印刷用PDF生成中...' : '静的HTML生成中...';
         document.body.appendChild(loading);
         
         const grid = document.getElementById('dashGrid');
         grid.innerHTML = ''; 
         
         for (let i = 0; i < 9; i++) {
           const div = document.createElement('div');
           div.id = `p_${i}`;
           div.className = 'grid-panel';
           div.dataset.panelId = `p_${i}`;
           div.dataset.action = 'RepoAct.actvPanel';
           
           const chart = document.createElement('ui-plot');
           chart.style.cssText = 'width: 100%; height: 100%;';
           chart.setAttribute('data-renderer', 'svg');
           
           div.appendChild(chart);
           grid.appendChild(div);
         }
         
         RepoAct.automator.build();
         
         requestAnimationFrame(() => {
           RepoRend.syncPanelDom();
           void document.body.offsetHeight;
           RepoRend.genCharts(window.__PRECALC_DATA__);
         });
         return;
      }

      State.set({
        "RPTST.ui.activeTab": "tabLayout", 
        "RPTST.ui.activeSub": "subFont",
        "RPTST.ui.linkCanvasMargin": false,
        "RPTST.ui.linkPanelMargin": false,
        "RPTST.ui.exportStatus": "message",
        "RPTST.ui.exportDesc": "ブラウザ機能を使用してPDFを出力します。",
        "RPTST.ui.copyStatus": "message",
        "RPTST.ui.copyDesc": "設定項目をクリップボードにコピーします。"
      });
      
      const initDataRaw = window.__INJECTED_DATA__;
      const injData = (typeof initDataRaw === 'object' && initDataRaw !== null) ? initDataRaw : { pxrfDT: [], wdxrfDT: [], crctDT: [] };
      State.set("RPTST.data.raw", injData);

      document.querySelectorAll('input[type="number"], input[type="range"]').forEach(el => {
        const bindPath = el.dataset.bind;
        if (!bindPath) return;
        const cfgKey = bindPath.split('.').pop();
        if (cfgKey && RPT_CFG.rng[cfgKey]) {
          const rng = RPT_CFG.rng[cfgKey];
          el.setAttribute('min', rng.min);
          el.setAttribute('max', rng.max);
          el.setAttribute('step', rng.step);
          
          if (rng.unit && el.type === 'number' && !el.classList.contains('inline-icon-input')) {
            const parent = el.parentElement;
            if (parent && !parent.classList.contains('with-unit')) {
              const wrap = document.createElement('div');
              wrap.className = 'with-unit';
              wrap.dataset.unit = rng.unit;
              el.parentNode.insertBefore(wrap, el);
              wrap.appendChild(el);
            }
          }
        }
      });
      
      RepoAct.automator.build();

      let fav = null;
      if (typeof window.__INJECTED_FAVORITE__ === 'object' && window.__INJECTED_FAVORITE__ !== null) {
        fav = window.__INJECTED_FAVORITE__;
      } else if (typeof window.__INJECTED_FAVORITE__ === 'string' && window.__INJECTED_FAVORITE__ !== 'INJECT_FAVORITE_TARGET' && window.__INJECTED_FAVORITE__ !== 'null') {
        try { fav = JSON.parse(window.__INJECTED_FAVORITE__); } catch (e) {}
      }
      await RepoSt.initSt(fav, injData);

      RepoRend.syncPanelDom();
      RepoSt.renewPanel();

      State.subscribe(['RPTST.refs.gridRows', 'RPTST.refs.gridCols', 'RPTST.refs.panelGap'], () => {
          RepoRend.syncPanelDom();
      });
      State.subscribe(['RPTST.refs.boardMode', 'RPTST.refs.modeSec.graphType'], () => {
          RepoSt.updateBaseScales('metric');
          RepoAct.automator.update();
          RepoSt.renewPanel();
      });
      
      State.subscribe(['RPTST.refs.filters', 'RPTST.refs.useCal', 'RPTST.refs.useLOD', 'RPTST.refs.crct', 'RPTST.refs.calElms'], () => {
          RepoSt.updateBaseScales('all');
          RepoSt.renewPanel();
          RepoRend.qRend();
      });

      State.subscribe(['RPTST.refs.symb', 'RPTST.refs.rawGph', 'RPTST.refs.panels'], () => {
          RepoRend.qRend();
      });

      State.subscribe('RPTST.refs.activePanelId', () => {
          RepoSt.renewPanel();
      });

      State.subscribe('RPTST.refs.symb.baseKey', () => RepoSt.renewSymbState());
      State.subscribe('RPTST.refs.symb.rls', () => RepoSt.renewSymbState());

      window.addEventListener('resize', () => {
         clearTimeout(RepoRend.resizeTimer);
         RepoRend.resizeTimer = setTimeout(() => {
             RepoRend.fitA4Scale();
             const gph = RepoRend.genGph();
             RepoRend.calcPanelSize(gph);
             const plots = document.getElementById('dashGrid').querySelectorAll('ui-plot');
             plots.forEach(plot => { plot.src = { ...plot.src, gph: gph }; });
         }, 100);
      });
    }

    static start() { return this.init(); }
  }

  window.RepoAct = RepoAct;
  window.RepoInit = RepoInit;
  window.RepoSt = RepoSt;
  window.RepoRend = RepoRend;
  window.RepoExport = RepoExport;

  if (document.readyState === 'loading') {
    window.addEventListener("DOMContentLoaded", () => RepoInit.init());
  } else {
    RepoInit.init();
  }
</script>
