<script>
  class RptTpl {
    static rowAspectCtrl(row, aspect) {
      return `<button type="button" class="row-lbl-btn" popovertarget="pop_aspect_${row}" title="アスペクト比を変更">r${row + 1} ⚙️</button><div popover id="pop_aspect_${row}" class="row-aspect-popover"><div class="pop-header">r${row + 1} 縦横比 (W1.0 : H)</div><div class="pop-body"><input type="number" class="form-control" min="0.1" max="2.0" step="0.1" data-aspect-idx="${row}" value="${aspect}"></div></div>`;
    }
  }

  class RepoSt {
    static oldSymbAxis = GLB.symbBaseKey;

    static getSt(...keys) {
      const s = new Set(keys);
      if (s.has('panel'))     { s.add('activeId'); s.add('panels'); }
      if (s.has('graphType')) { s.add('config'); }
      if (s.has('d'))         { s.add('dataset'); }
      const o = {};
      if (s.has('activeId'))   o.activeId   = State.get('RPTST.ui.activePanelId');
      if (s.has('panels'))     o.panels     = State.get('RPTST.panels') || [];
      if (s.has('config'))     o.config     = State.get('RPTST.config') || {};
      if (s.has('dataset'))    o.dataset    = State.get('RPTST.dataset') || {};
      if (s.has('layout'))     o.layout     = State.get('RPTST.config.layout') || { gridRows: 1, gridCols: 1, panelGap: 4 };
      if (s.has('theme'))      o.theme      = State.get('RPTST.config.theme') || {};
      if (s.has('baseScales')) o.baseScales = State.get('RPTST.dataset.baseScales') || { auto: {}, fixed: {} };
      if (s.has('rowPlotH'))   o.rowPlotH   = State.get('RPTST.dataset.rowPlotH');
      if (s.has('panel'))     o.panel     = o.panels.find(p => p.id === o.activeId) ?? null;
      if (s.has('graphType')) o.graphType = o.config.boardMode || 'calib';
      if (s.has('d'))         o.d         = o.dataset.raw || {};
      return keys.length === 1 ? o[keys[0]] : o;
    }
    static update() { RepoAct.automator?.update(); }
    static finalizePanel() {
      document.querySelectorAll('form[data-bind-ctx]').forEach(f => CoreUIPatcher.syncFormCtx(f));
      this.update();
    }

    static async initSt(favObj, d) {
      const pxrf = d.pxrfDT || [];
      const exVals = (key) => {
        const vals = [...new Set(pxrf.map(r => (r[key] == null) ? "" : String(r[key]).trim()).filter(v => v !== ""))];
        return vals.length > 0 ? vals : null; 
      };
      
      const optsDB = exVals(GLB.idx.key1) || [];
      const optsItem = exVals(GLB.idx.p1) || [];
      const optsGroup = exVals(GLB.idx.wd1) || [];
      const initFltr = (buVal, opts) => Array.isArray(buVal) ? buVal.map(String) : opts;

      let fav = favObj ? (favObj["RPTST.refs"] || favObj) : null;

      // --- 4層分離 State の初期化・マイグレーション ---
      const dataset = {
        raw: d,
        filters: {
          db: initFltr(fav?.filters?.db || fav?.dataset?.filters?.db, optsDB),
          item: initFltr(fav?.filters?.item || fav?.dataset?.filters?.item, optsItem),
          group: initFltr(fav?.filters?.group || fav?.dataset?.filters?.group, optsGroup)
        },
        crct: fav?.crct || fav?.dataset?.crct || "new",
        calElms: (fav?.calElms?.length ? fav.calElms : (fav?.dataset?.calElms?.length ? fav.dataset.calElms : [...GLB.valElms])),
        useCal: fav?.useCal ?? fav?.dataset?.useCal ?? false,
        useLOD: fav?.useLOD ?? fav?.dataset?.useLOD ?? false,
        baseScales: { auto: {}, fixed: {} }
      };

      const boardMode = fav?.boardMode || fav?.config?.boardMode || RPT_CFG.defLayout.boardMode || "calib";
      document.body.setAttribute('data-board-mode', boardMode);

      const config = {
        boardMode: boardMode,
        layout: {
          gridRows: fav?.gridRows || fav?.config?.layout?.gridRows || 1,
          gridCols: fav?.gridCols || fav?.config?.layout?.gridCols || 1,
          panelGap: fav?.panelGap ?? fav?.config?.layout?.panelGap ?? 4,
          rowAspect: fav?.rowAspect || fav?.config?.layout?.rowAspect || [...RPT_CFG.defLayout.rowAspect]
        },
        theme: { ...RPT_CFG.defTheme, ...(fav?.rawGph || fav?.theme || fav?.config?.theme || {}) },
        symbology: fav?.symb || fav?.symbology || fav?.config?.symbology || {
          baseKey: GLB.symbBaseKey,
          rls: [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }]
        }
      };

      const rawPanels = fav?.panels || [];
      const panels = (rawPanels.length > 0 ? rawPanels : [{ id: "p_0" }]).map((p, i) => ({
        ...RPT_CFG.defPnl,
        ...p,
        id: p.id || `p_${i}`
      }));

      State.set({
        "RPTST.dataset": dataset,
        "RPTST.config": config,
        "RPTST.panels": panels,
        "RPTST.ui.activePanelId": panels[0]?.id || "p_0"
      });

      // --- BaseScale 計算 ---
      RepoSt.updateBaseScales('all');

      this.oldSymbAxis = config.symbology.baseKey || GLB.symbBaseKey;

      const optsCorr = [{ label: RPT_CFG.lbl.newCorr, val: "new" }, ...(d.crctDT || []).slice(1).filter(r => r[0]).map(r => ({ label: r[0], val: r[0] }))];
      const optValLgc = [...GLB.valElms, ...GLB.valLgc].map(v => ({ label: v, val: v }));

      State.set({
        "RPTST.ui.optFields": {
          crctFields: [{ type: "select", bind: "RPTST.dataset.crct", hasEmpty: false, opts: optsCorr }],
          fontEngFields: [{ type: "select", bind: "RPTST.config.theme.fontEng", hasEmpty: false, opts: GLB.fontEngList.map(v => ({label:v, val:v})) }],
          fontJpFields: [{ type: "select", bind: "RPTST.config.theme.fontJp", hasEmpty: false, opts: GLB.fontJpList.map(v => ({label:v, val:v})) }],
          calbValFields: [{ type: "select", bind: "RPTST.panels.$active.calbVal", change: "RepoSt.renewPanelRef", hasEmpty: true, opts: optValLgc }],
          clusXFields: [{ type: "select", bind: "RPTST.panels.$active.clusXVal", change: "RepoSt.renewPanelRef", hasEmpty: true, opts: optValLgc }],
          clusYFields: [{ type: "select", bind: "RPTST.panels.$active.clusYVal", change: "RepoSt.renewPanelRef", hasEmpty: true, opts: optValLgc }],
          tickUnitFields: [{ type: "select", bind: "RPTST.panels.$active.tickUnit", change: "RepoSt.renewPanelRef", hasEmpty: false, field: "tickUnit", opts: [{ label: "自動", val: "" }] }],
          clusTickXFields: [{ type: "select", bind: "RPTST.panels.$active.tickUnitX", change: "RepoSt.renewPanelRef", hasEmpty: false, field: "tickUnitX", opts: [{ label: "自動", val: "" }] }],
          clusTickYFields: [{ type: "select", bind: "RPTST.panels.$active.tickUnitY", change: "RepoSt.renewPanelRef", hasEmpty: false, field: "tickUnitY", opts: [{ label: "自動", val: "" }] }],
          axisFields: [{ type: "select", bind: "RPTST.config.symbology.baseKey", change: "RepoSt.valdSymbAxis", hasEmpty: false, opts: GLB.symbAxes }],
          filterDBOpts: optsDB, 
          filterItemOpts: optsItem, 
          filterGroupOpts: optsGroup, 
          calElmsOpts: GLB.valElms
        }
      });
      
      this.renewSymbState();
    }

    static updateBaseScales(triggerType, metricsToUpdate = null) {
      const { config, dataset, d, panels } = this.getSt('config', 'dataset', 'd', 'panels');
      if (!d || !d.pxrfDT || !d.wdxrfDT) return;
      const boardMode = config.boardMode || 'calib';
      
      const targetMetrics = new Set();
      if (metricsToUpdate) {
        if (Array.isArray(metricsToUpdate)) metricsToUpdate.forEach(m => targetMetrics.add(m));
        else targetMetrics.add(metricsToUpdate);
      } else {
        panels.forEach(p => {
          if (boardMode === 'calib' && p.calbVal) targetMetrics.add(p.calbVal);
          else if (boardMode === 'clus') {
            if (p.clusXVal) targetMetrics.add(p.clusXVal);
            if (p.clusYVal) targetMetrics.add(p.clusYVal);
          }
        });
      }
      if (targetMetrics.size === 0) return;

      const baseScales = State.get("RPTST.dataset.baseScales") || { auto: {}, fixed: {} };
      if (!baseScales.auto) baseScales.auto = {};
      if (!baseScales.fixed) baseScales.fixed = {};

      const calcForMetrics = (mode, filters) => {
         const conf = { useCal: dataset.useCal, crctDT: d.crctDT, useLOD: dataset.useLOD };
         let pDT = d.pxrfDT, wDT = d.wdxrfDT;
         if (filters) {
           const { db, item, group } = filters;
           if (Array.isArray(db) && db.length > 0) {
             pDT = pDT.filter(row => db.includes(String(row[GLB.idx.key1])));
             wDT = wDT.filter(row => db.includes(String(row[GLB.idx.key1])));
           }
           if (Array.isArray(item) && item.length > 0) pDT = pDT.filter(row => item.includes(String(row[GLB.idx.p1])));
           if (Array.isArray(group) && group.length > 0) {
             pDT = pDT.filter(row => group.includes(String(row[GLB.idx.wd1])));
             wDT = wDT.filter(row => group.includes(String(row[GLB.idx.wd1])));
           }
         }
         
         const filteredCalibBase = CHARTDT.genPrev(pDT, wDT, { ...conf, val: GLB.valElms[0] });
         
         targetMetrics.forEach(metric => {
            const wVals = wDT.map(w => CoreMethod.Calc.evaluate(metric, w)).filter(v => v != null && !isNaN(v));
            const pVals = filteredCalibBase.map(p => CoreMethod.Calc.evaluate(metric, p)).filter(v => v != null && !isNaN(v));
            const combined = [...wVals, ...pVals];
            if (combined.length > 0) {
              const sc = CoreMethod.Util.calcScale(combined, combined);
              const units = CoreMethod.Util.calcNiceTickUnits(combined);
              baseScales[mode][metric] = { niceMin: sc.niceMin, niceMax: sc.niceMax, ticks: sc.niceTicks.map(t=>t.v), units };
            } else {
              baseScales[mode][metric] = null;
            }
         });
      };

      if (['all', 'db', 'metric'].includes(triggerType)) calcForMetrics('fixed', { db: dataset.filters?.db || [] });
      if (['all', 'item', 'group', 'db', 'calib', 'lod', 'metric'].includes(triggerType)) calcForMetrics('auto', dataset.filters);

      State.set("RPTST.dataset.baseScales", baseScales);
    }

    static async valdSymbAxis(tgt) {
      const newVal = tgt.value, oldVal = this.oldSymbAxis;
      if (newVal === oldVal) return;
      const isConfirmed = await CoreAct.withAsync(null, { title: "確認", msg: "属性を変更してシンボル設定をリセットします" }, async () => {
        State.set({
          "RPTST.config.symbology.baseKey": newVal,
          "RPTST.config.symbology.rls": [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }]
        });
        this.oldSymbAxis = newVal;
        return null;
      });
      if (!isConfirmed) {
        tgt.value = oldVal;
        State.set("RPTST.config.symbology.baseKey", oldVal);
      }
    }

    static resetSymb() {
      State.set("RPTST.config.symbology.rls", [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }]);
    }
    static addSymb() {
      const rls = State.get("RPTST.config.symbology.rls") || [];
      State.set("RPTST.config.symbology.rls", [...rls, { key: `rule_${Date.now()}`, target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }]);
    }
    static removeSymb(btn) {
      const rls = State.get("RPTST.config.symbology.rls") || [];
      State.set("RPTST.config.symbology.rls", rls.filter(rw => rw.key !== btn.dataset.ruleKey));
    }
    static updSymb(btn) {
      const i = btn.dataset.symbolIdx, t = btn.dataset.symbolType;
      if (i != null && t) { 
        const newSym = JSON.parse(JSON.stringify(State.get("RPTST.config.symbology.rls") || []));
        newSym[i][t] = btn.value; 
        State.set("RPTST.config.symbology.rls", newSym);
      }
    }

    static renewSymbState() {
      const d = State.get("RPTST.dataset.raw"), symb = State.get("RPTST.config.symbology");
      if (!d?.pxrfDT?.length || !symb) return;
      const vals = [...new Set(d.pxrfDT.map(pt => pt[symb.baseKey]).filter(Boolean))];
      State.set("RPTST.ui.optFields.symbSrc", {
        rls: symb.rls,
        optsConf: { target: [{ val: "", label: RPT_CFG.lbl.unsel }, ...vals.map(v => ({ val: v, label: v }))], shp: GLB.symbShapes, clr: GLB.symbColors },
        actsConf: { add: "RepoSt.addSymb", remove: "RepoSt.removeSymb", update: "RepoSt.updSymb"}
      });
    }

    static renewPanelRef(tgt) {
      const key = tgt.dataset.apKey || tgt.dataset.field || tgt.name || tgt.dataset.bind?.split('.').pop();
      const val = tgt.value ?? tgt.dataset.arg ?? tgt.dataset.target;
      const { panel, panels, graphType: boardMode } = this.getSt('panel', 'panels', 'graphType');
      
      if (panel) {
         if (['tickUnit', 'tickUnitX', 'tickUnitY'].includes(key)) {
           panel[key] = (val === "" || isNaN(Number(val))) ? null : Number(val);
         } else {
           panel[key] = val;
         }
         if (key === 'scaleMode') {
           panel.tickUnit = "";
           panel.tickUnitX = "";
           panel.tickUnitY = "";
         }

         if (['calbVal', 'clusXVal', 'clusYVal'].includes(key)) {
            panel.tickUnit = "";
            panel.tickUnitX = "";
            panel.tickUnitY = "";
            if (boardMode === 'calib') {
              panel.title = panel.calbVal || ""; panel.xLabel = "WDXRF"; panel.yLabel = "pXRF";
            } else {
              const xV = panel.clusXVal || "", yV = panel.clusYVal || "";
              panel.title = (xV || yV) ? `${xV} vs ${yV}` : ""; panel.xLabel = xV; panel.yLabel = yV;
            }
            RepoSt.updateBaseScales('metric', [val]);
         }
         State.set("RPTST.panels", [...panels]);
         this.renewPanel();
         RepoRend.qRend();
      }
    }

    static renewPanel() {
      const { panel, graphType: boardMode, baseScales } = this.getSt('activeId', 'panels', 'panel', 'config', 'graphType', 'baseScales');
      const isManual = panel?.scaleMode === 'manual';
      const targetScales = isManual ? baseScales.fixed : baseScales.auto;

      let tickOpts = [{ label: "自動", val: "" }];
      let tickXOpts = [{ label: "自動", val: "" }];
      let tickYOpts = [{ label: "自動", val: "" }];

      if (panel) {
          if (boardMode === 'calib' && panel.calbVal && targetScales[panel.calbVal]) {
             const units = targetScales[panel.calbVal].units || [];
             tickOpts = [{ label: "自動", val: "" }, ...units.map(u => ({ label: String(u), val: String(u) }))];
          } else if (boardMode === 'clus') {
             if (panel.clusXVal && targetScales[panel.clusXVal]) {
                const units = targetScales[panel.clusXVal].units || [];
                tickXOpts = [{ label: "自動", val: "" }, ...units.map(u => ({ label: String(u), val: String(u) }))];
             }
             if (panel.clusYVal && targetScales[panel.clusYVal]) {
                const units = targetScales[panel.clusYVal].units || [];
                tickYOpts = [{ label: "自動", val: "" }, ...units.map(u => ({ label: String(u), val: String(u) }))];
             }
          }
      }

      const ensureOpt = (opts, curVal) => {
        if (curVal != null && curVal !== "" && !opts.some(o => String(o.val) === String(curVal))) {
          opts.push({ label: `${curVal}`, val: String(curVal) });
        }
      };
      ensureOpt(tickOpts, panel?.tickUnit);
      ensureOpt(tickXOpts, panel?.tickUnitX);
      ensureOpt(tickYOpts, panel?.tickUnitY);

      State.set({
        "RPTST.ui.activePanelScaleMode": panel?.scaleMode || "auto",
        "RPTST.ui.optFields.tickUnitFields": [{ type: "select", bind: "RPTST.panels.$active.tickUnit", change: "RepoSt.renewPanelRef", hasEmpty: false, field: "tickUnit", opts: tickOpts }],
        "RPTST.ui.optFields.clusTickXFields": [{ type: "select", bind: "RPTST.panels.$active.tickUnitX", change: "RepoSt.renewPanelRef", hasEmpty: false, field: "tickUnitX", opts: tickXOpts }],
        "RPTST.ui.optFields.clusTickYFields": [{ type: "select", bind: "RPTST.panels.$active.tickUnitY", change: "RepoSt.renewPanelRef", hasEmpty: false, field: "tickUnitY", opts: tickYOpts }]
      });

      this.finalizePanel();
    }
  }

  class RepoAct {
    static automator = null;

    // --- ボード設定操作 ---
    static setBoardMode(btn, arg) {
      const mode = arg || btn?.dataset?.arg || btn?.dataset?.target || 'calib';
      const curMode = State.get("RPTST.config.boardMode");
      if (curMode === mode) return;

      document.body.setAttribute('data-board-mode', mode);

      State.set("RPTST.config.boardMode", mode);
      State.set("RPTST.config.layout.gridRows", 1);
      State.set("RPTST.config.layout.gridCols", 1);

      const newPanel = {
        id: "p_0",
        title: "",
        xLabel: mode === 'calib' ? 'WDXRF' : '',
        yLabel: mode === 'calib' ? 'pXRF' : '',
        tickUnit: "",
        tickUnitX: "",
        tickUnitY: "",
        calbVal: "",
        clusXVal: "",
        clusYVal: "",
        scaleMode: "auto"
      };
      State.set("RPTST.panels", [newPanel]);
      State.set("RPTST.ui.activePanelId", newPanel.id);

      RepoRend.syncPanelDom();
      RepoSt.renewPanel();
      RepoSt.update();
    }

    static onLayoutChange() {
      RepoRend.syncPanelDom();
    }

    static onThemeChange() {
      RepoRend.qRend();
    }

    static onActivePanelFormChange() {
      RepoRend.qRend();
    }

    static setActiveScaleMode(btn, arg) {
      const mode = arg || btn?.dataset?.arg;
      if (!mode) return;
      const { panel, panels } = RepoSt.getSt('panel', 'panels');
      if (panel) {
        panel.scaleMode = mode;
        panel.tickUnit = ""; panel.tickUnitX = ""; panel.tickUnitY = "";
        State.set("RPTST.panels", [...panels]);
        State.set("RPTST.ui.activePanelScaleMode", mode);
        RepoSt.renewPanel();
        RepoRend.qRend();
      }
    }

    static changeRowAspect(inp) {
      const idx = Number(inp.dataset.aspectIdx);
      let val = Number(inp.value);
      if (isNaN(val) || val < 0.1) val = 0.1;
      if (val > 2.0) val = 2.0;
      val = Math.round(val * 10) / 10;
      inp.value = val;
      const rowAspect = [...(State.get("RPTST.config.layout.rowAspect") || [1.0, 1.0, 1.0])];
      rowAspect[idx] = val;
      State.set("RPTST.config.layout.rowAspect", rowAspect);
      RepoRend.qRend();
    }

    // --- タブ・パネル操作 ---
    static actvTab(btn, arg) {
      const tab = arg || btn.dataset.arg || btn.dataset.tab;
      State.set("RPTST.ui.activeTab", tab);
      document.querySelectorAll('[data-part="tab-icon"]').forEach(b => {
        const isCur = (b.dataset.arg === tab || b.dataset.tab === tab);
        b.setAttribute('aria-selected', isCur ? 'true' : 'false');
      });
      document.querySelectorAll('[data-part="tab-pane"]').forEach(p => {
        const isCur = p.dataset.tab === tab;
        p.setAttribute('aria-selected', isCur ? 'true' : 'false');
      });
      RepoSt.update();
    }

    static actvSub(btn, arg) {
      const sub = arg || btn.dataset.arg || btn.dataset.target;
      State.set("RPTST.ui.activeSub", sub);
      document.querySelectorAll('[data-part="sub-pane"]').forEach(p => {
        const isCur = p.dataset.sub === sub;
        p.setAttribute('aria-selected', isCur ? 'true' : 'false');
      });
      RepoSt.update();
    }

    static actvPanel(btn) {
      const panelId = btn.dataset.panelId;
      State.set("RPTST.ui.activePanelId", panelId);
      document.querySelectorAll('[data-panel-id]').forEach(p => {
        p.setAttribute('aria-selected', p.dataset.panelId === panelId ? 'true' : 'false');
      });
      RepoSt.renewPanel();
    }

    // --- 出力中継・委譲 ---
    static updExportDesc(tgt) { RepoExport.updExportDesc(tgt); }
    static requestExport() { RepoExport.requestExport(); }
    static requestCopyConfig() { RepoExport.requestCopyConfig(); }
    static syncPanelDom() { RepoRend.syncPanelDom(); }

    // --- 余白一括同期・リンク ---
    static toggleMarginLink(btn) {
      const group = btn.dataset.syncGroup;
      if (!group) return;
      const linkBind = `RPTST.ui.link${group.charAt(0).toUpperCase() + group.slice(1)}Margin`;
      const isLinked = !State.get(linkBind);
      State.set(linkBind, isLinked);
      btn.setAttribute('aria-selected', isLinked ? 'true' : 'false');
      const icon = btn.querySelector('.material-symbols-outlined') || btn;
      icon.textContent = isLinked ? 'link' : 'link_off';
      btn.title = isLinked ? '連動解除' : '4方向連動';
    }

    static syncMargin(inp) {
      const group = inp.dataset.syncGroup;
      if (!group) return;
      const linkBind = `RPTST.ui.link${group.charAt(0).toUpperCase() + group.slice(1)}Margin`;
      if (!State.get(linkBind)) return;
      
      const keys = group === 'canvas' ? ['bd_l','bd_t','bd_b','bd_r'] : ['p_l','p_t','p_b','p_r'];
      const val = Number(inp.value);
      keys.forEach(k => State.set(`RPTST.config.theme.${k}`, val));
      document.querySelectorAll('form[data-bind-ctx]').forEach(f => CoreUIPatcher.syncFormCtx(f));
    }
  }

  class RepoRend {
    static resizeTimer = null;
    static renderTimer = null;

    static _applyPanelLabels(idx, layout, config) {
      const el = document.querySelector(`[data-panel-id="p_${idx}"]`);
      if (!el) return;
      const row = Math.floor(idx / layout.gridCols);
      const col = idx % layout.gridCols;
      if (row === 0) el.setAttribute('data-col-lbl', `c${col + 1}`);
      else el.removeAttribute('data-col-lbl');
      const existingCtrl = el.querySelector('.row-aspect-ctrl');
      if (existingCtrl) existingCtrl.remove();
      if (col === 0) {
        if (config.boardMode === 'clus') {
          el.removeAttribute('data-row-lbl');
          const ctrl = document.createElement('div');
          ctrl.className = 'row-aspect-ctrl';
          ctrl.innerHTML = RptTpl.rowAspectCtrl(row, layout.rowAspect?.[row] || 1.0);
          ctrl.querySelector('input').addEventListener('change', e => RepoAct.changeRowAspect(e.target));
          el.appendChild(ctrl);
        } else {
          el.setAttribute('data-row-lbl', `r${row + 1}`);
        }
      } else {
        el.removeAttribute('data-row-lbl');
      }
    }

    // --- DOM・レイアウト同期 ---
    static syncPanelDom() {
      const { layout, panels: curPanels, activeId } = RepoSt.getSt('layout', 'panels', 'activeId');
      const reqIds = [];
      for (let i = 0; i < layout.gridRows * layout.gridCols; i++) reqIds.push(`p_${i}`);
      
      let panels = [...curPanels];
      reqIds.forEach(id => { if (!panels.find(p => p.id === id)) panels.push({ id, ...RPT_CFG.defPnl }); });
      panels = reqIds.map(id => panels.find(p => p.id === id));
      State.set("RPTST.panels", panels);
      
      if (!panels.find(p => p.id === activeId)) {
        State.set("RPTST.ui.activePanelId", panels[0]?.id || "p_0");
      }

      RepoSt.renewPanel();

      const cont = document.querySelector('[data-part="a4Container"]');
      if (cont) {
        cont.style.setProperty('--col-count', layout.gridCols); 
        cont.style.setProperty('--row-count', layout.gridRows);
        cont.style.setProperty('--panel-gap', `${(layout.panelGap !== undefined ? Number(layout.panelGap) : 4)}mm`);
      }

      const curActive = State.get("RPTST.ui.activePanelId");
      const config = RepoSt.getSt('config');
      for (let i = 0; i < 9; i++) {
        const el = document.querySelector(`[data-panel-id="p_${i}"]`);
        if (!el) continue;
        el.setAttribute('aria-selected', `p_${i}` === curActive ? 'true' : 'false');
        if (i < layout.gridRows * layout.gridCols) {
          this._applyPanelLabels(i, layout, config);
        } else {
          el.removeAttribute('data-col-lbl');
          el.removeAttribute('data-row-lbl');
        }
      }
      
      RepoSt.update();
      this.fitA4Scale();
      if (!window.__EXPORT_CFG__) this.genCharts();
    }

    static fitA4Scale() {
      if (window.__EXPORT_CFG__) return;
      const main = document.querySelector('.dash-main'), a4 = document.querySelector('[data-part="a4Container"]');
      if (!main || !a4) return;
      a4.style.transform = 'none';
      const scale = Math.min((main.clientWidth - 48) / a4.offsetWidth, (main.clientHeight - 48) / a4.offsetHeight, 1);
      a4.style.transform = `scale(${scale})`;
      a4.style.marginBottom = `-${a4.offsetHeight * (1 - scale)}px`;
    }

    static genGph() {
      const theme = { ...RPT_CFG.defTheme, ...(State.get("RPTST.config.theme") || {}) };
      const gphProps = ReportMethod.buildGraphStyle(theme, RPT_CFG.rng);

      const cont = document.querySelector('[data-part="a4Container"]');
      if (cont) {
        const dirs = [{p:'top', k:'bd_t'}, {p:'right', k:'bd_r'}, {p:'bottom', k:'bd_b'}, {p:'left', k:'bd_l'}];
        dirs.forEach(({p, k}) => {
          const unit = RPT_CFG.rng[k]?.unit || 'mm';
          cont.style.setProperty(`--margin-${p}`, `${theme[k]}${unit}`);
        });
      }

      return gphProps;
    }

    static calcPanelSize(gph) {
      const grid = document.querySelector('[data-part="dashGrid"]');
      if (!grid) return;
      const layout = State.get("RPTST.config.layout") || { gridRows: 1, gridCols: 1, panelGap: 4 };
      const panels = State.get("RPTST.panels") || [];
      const theme = State.get("RPTST.config.theme") || {};
      const boardMode = State.get("RPTST.config.boardMode") || 'calib';

      grid.style.removeProperty('--panel-w'); grid.style.removeProperty('--panel-h');

      let gw, gh;
      if (window.__EXPORT_CFG__) {
        const MM2PX = 3.7795275591;
        const usableW = (210 - (theme.bd_l || 15) - (theme.bd_r || 15)) * MM2PX;
        const usableH = (297 - (theme.bd_t || 15) - (theme.bd_b || 15)) * MM2PX;
        gw = usableW;
        gh = usableH;
      } else {
        gw = grid.clientWidth;
        gh = grid.clientHeight;
      }

      if (gw === 0 || gh === 0) return;

      const gapPx = (layout.panelGap !== undefined ? Number(layout.panelGap) : 4) * 3.78;
      const hasTitle = panels.some(p => p.title);
      const titleSizePx = (theme.s_title || 12) * 1.33;

      if (boardMode === 'clus' && layout.rowAspect?.length && (layout.gridRows || 1) > 0) {
        const rowCount = layout.gridRows || 1;
        const aspects = (layout.rowAspect || []).slice(0, rowCount);
        const metrics = ReportMethod.calculatePanelMetricsAspect(
          gw, gh, layout.gridCols || 1, rowCount, gapPx, gph, hasTitle, titleSizePx, aspects
        );
        grid.style.setProperty('--panel-w', `${metrics.panelW}px`);
        grid.style.gridTemplateRows = metrics.panelH.map(h => `${h}px`).join(' ');
        State.set("RPTST.dataset.rowPlotH", metrics.plotH);
      } else {
        const metrics = ReportMethod.calculatePanelMetrics(gw, gh, layout.gridCols || 1, layout.gridRows || 1, gapPx, gph, hasTitle, titleSizePx);
        grid.style.setProperty('--panel-w', `${metrics.panelW}px`);
        grid.style.setProperty('--panel-h', `${metrics.panelH}px`);
        grid.style.gridTemplateRows = '';
        State.set("RPTST.dataset.rowPlotH", null);
      }
      void grid.offsetHeight;
    }

    static genCharts(pCalcDT = null) {
      const gph = this.genGph();
      this.calcPanelSize(gph);
      const { dataset, d, config, panels, rowPlotH, baseScales } = RepoSt.getSt('dataset', 'd', 'config', 'panels', 'rowPlotH', 'baseScales');
      const layout = config.layout || { gridRows: 1, gridCols: 1 };
      const plots = document.querySelectorAll('[data-part="dashGrid"] ui-plot');
      
      const draw = () => {
        panels.forEach((p, idx) => {
          this._applyPanelLabels(idx, layout, config);
          if (!plots[idx]) return;
          const row = Math.floor(idx / layout.gridCols);
          const plotH = rowPlotH?.[row] ?? null;
          
          const isManual = p.scaleMode === 'manual';
          const srcScales = isManual ? baseScales.fixed : baseScales.auto;

          const scaleFixed = {
            x: p.clusXVal ? srcScales?.[p.clusXVal] : srcScales?.[p.calbVal],
            y: p.clusYVal ? srcScales?.[p.clusYVal] : srcScales?.[p.calbVal]
          };

          if (pCalcDT?.[idx]) {
            plots[idx].src = { prevDT: pCalcDT[idx].prevDT, statsDT: pCalcDT[idx].statsDT, symb: config.symbology, gph: gph, panel: p, plotH, scaleFixed };
          } else {
            if (!d?.pxrfDT?.length) return;
            const graphType = config.boardMode || 'calib';
            const conf = { useCal: dataset.useCal, calElms: dataset.calElms, crct: dataset.crct, crctDT: d.crctDT, useLOD: dataset.useLOD, filters: dataset.filters, graphType: graphType, calbVal: p.calbVal, clusXVal: p.clusXVal, clusYVal: p.clusYVal };
            const { prevDT, statsDT } = CHARTDT.generateChartData(d.pxrfDT, d.wdxrfDT, conf);
            plots[idx].src = { prevDT, statsDT, symb: config.symbology, gph: gph, panel: p, plotH, scaleFixed };
          }
        });
      };

      if (window.__EXPORT_CFG__) {
         let finishedCount = 0, printFired = false;
         const variableDelay = Math.min(5000, (layout.gridRows * layout.gridCols) * (d?.pxrfDT?.length || 0) * 0.15);
         const waitTime = 500 + variableDelay;
         const fallbackTime = Math.max(8000, waitTime + 4000);

         const executePrint = () => { 
           if (printFired) return; 
           printFired = true; 
           const loader = document.querySelector('[data-part="print-loading"], .print-loading');
           if (loader) loader.style.display = 'none';
           if (window.__EXPORT_CFG__.autoPrint) {
             requestAnimationFrame(() => {
               requestAnimationFrame(() => {
                 setTimeout(() => { 
                   window.parent.postMessage('PRINT_READY', '*');
                 }, waitTime);
               });
             });
           }
         };
         plots.forEach(plot => { plot.addEventListener('render-finished', () => { finishedCount++; if (finishedCount === layout.gridRows * layout.gridCols) executePrint(); }, { once: true }); });
         setTimeout(executePrint, fallbackTime);
         requestAnimationFrame(draw);
      } else {
         requestAnimationFrame(draw);
      }
    }

    static qRend() {
      if (window.__EXPORT_CFG__) return;
      clearTimeout(this.renderTimer);
      this.renderTimer = setTimeout(() => this.genCharts(), 250);
    }
  }

  class RepoExport {
    static _printListenerSet = false;

    static _buildFavObj() {
      const { config, dataset, panels } = RepoSt.getSt('config', 'dataset', 'panels');
      return {
        boardMode: config.boardMode,
        gridRows:  config.layout?.gridRows,
        gridCols:  config.layout?.gridCols,
        panelGap:  config.layout?.panelGap,
        rowAspect: config.layout?.rowAspect,
        rawGph:    config.theme,
        symb:      config.symbology,
        filters:   dataset.filters,
        crct:      dataset.crct,
        calElms:   dataset.calElms,
        useCal:    dataset.useCal,
        useLOD:    dataset.useLOD,
        panels
      };
    }

    static getFormattedDate() {
      const d = new Date();
      return `${d.getFullYear()}${(d.getMonth()+1).toString().padStart(2,'0')}${d.getDate().toString().padStart(2,'0')}`;
    }

    static downloadFile(filename, content) {
      const blob = new Blob([content], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    static updExportDesc(tgt) {
      if (!tgt) return;
      const type = tgt.value;
      if (type === 'pdf') {
        State.set("RPTST.ui.exportDesc", 'ブラウザ機能を使用してPDFを出力します。');
      } else if (type === 'html') {
        State.set("RPTST.ui.exportDesc", '静的HTMLをダウンロードします。');
      } else if (type === 'app') {
        State.set("RPTST.ui.exportDesc", '解析ボードHTMLをダウンロードします。');
      }
      State.set("RPTST.ui.exportStatus", "message");
      RepoSt.update();
    }

    static setupPrintListener() {
      if (this._printListenerSet) return;
      window.addEventListener('message', (e) => {
        if (e.data === 'PRINT_READY') {
          const iframe = document.querySelector('iframe.pdf-generator');
          if (iframe) {
            iframe.contentWindow.print();
            iframe.remove();
          }
          CoreAct.toast("完了", "PDFを出力しました。", "success");
          const btn = document.querySelector('[data-part="btnOutput_exec"]');
          if (btn) btn.disabled = false;
          State.set("RPTST.ui.exportStatus", "message");
          this.updExportDesc(document.querySelector('input[name="exportType"]:checked'));
        }
      });
      this._printListenerSet = true;
    }

    static _prepData() {
      const { dataset, d, config, panels } = RepoSt.getSt('dataset', 'd', 'config', 'panels');
      const graphType = config.boardMode || 'calib';
      const pCalcDT = panels.map(p => {
        if (!d.pxrfDT?.length) return { prevDT: [], statsDT: null };
        const conf = { useCal: dataset.useCal, calElms: dataset.calElms, crct: dataset.crct, crctDT: d.crctDT, useLOD: dataset.useLOD, filters: dataset.filters, graphType: graphType, calbVal: p.calbVal, clusXVal: p.clusXVal, clusYVal: p.clusYVal };
        return CHARTDT.generateChartData(d.pxrfDT, d.wdxrfDT, conf);
      });
      if (!pCalcDT.some(res => res.prevDT?.length > 0)) {
        CoreAct.toast("警告", "有効なグラフがありません。\nデータフィルターを確認してください。");
        return null;
      }
      return pCalcDT;
    }

    static _buildHTML(type, pCalcDT = null) {
      const dateStr = this.getFormattedDate();
      const outerHTML = document.documentElement.outerHTML;
      const data = {
        raw: RepoSt.getSt('d'),
        fav: {
          "RPTST.refs": this._buildFavObj()
        },
        state: { RPTST: State.proxy.RPTST },
        pCalcDT: pCalcDT
      };
      return ReportMethod.generateExportHTML(type, outerHTML, dateStr, data);
    }

    static genPDF() {
      const pCalcDT = this._prepData();
      if (!pCalcDT) return false;
      const { hStr } = this._buildHTML('pdf', pCalcDT);
      
      this.setupPrintListener();
      
      const iframe = document.createElement('iframe');
      iframe.className = 'pdf-generator';
      iframe.style.cssText = 'position:fixed; top:-9999px; left:-9999px; width:210mm; height:297mm; border:none; opacity:0; pointer-events:none;';
      document.body.appendChild(iframe);
      iframe.contentDocument.open();
      iframe.contentDocument.write(hStr);
      iframe.contentDocument.close();
      
      return true;
    }

    static genStaticHTML() {
      const pCalcDT = this._prepData();
      if (!pCalcDT) return false;
      const { ttl, hStr } = this._buildHTML('html', pCalcDT);
      this.downloadFile(`${ttl}.html`, hStr);
      return true;
    }

    static genApp() {
      const { ttl, hStr } = this._buildHTML('app');
      this.downloadFile(`${ttl}.html`, hStr);
    }

    static requestExport() {
      const btn = document.querySelector('[data-part="btnOutput_exec"]');
      const type = document.querySelector('input[name="exportType"]:checked')?.value;
      
      if (btn) btn.disabled = true;
      State.set({
        "RPTST.ui.exportStatus": "loading",
        "RPTST.ui.exportDesc": "処理中..."
      });
      RepoSt.update();

      setTimeout(() => {
        const restoreUI = () => {
          if (btn) btn.disabled = false;
          State.set("RPTST.ui.exportStatus", "message");
          this.updExportDesc(document.querySelector('input[name="exportType"]:checked'));
        };

        if (type === 'pdf') {
          if (this.genPDF() === false) restoreUI();
        } else if (type === 'html') {
          if (this.genStaticHTML() === false) {
            restoreUI();
          } else {
            setTimeout(restoreUI, 3000);
          }
        } else if (type === 'app') {
          this.genApp();
          setTimeout(restoreUI, 3000);
        }
      }, 50);
    }

    static async requestCopyConfig() {
      const exportObj = {
        "RPTST.refs": this._buildFavObj()
      };
      const jsonStr = JSON.stringify(exportObj, null, 2);
      
      const btn = document.querySelector('[data-part="btnOutput_copyCfg"]');
      const txt = document.querySelector('[data-part="txtOutput_fallback"]');
      if (btn) btn.disabled = true;
      if (txt) txt.style.display = 'none';

      State.set({ "RPTST.ui.copyStatus": "loading", "RPTST.ui.copyDesc": "コピー中..." });
      RepoSt.update();

      let copied = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(jsonStr);
          copied = true;
        }
      } catch (e) {
        copied = false;
      }
      
      if (copied) {
        State.set({ "RPTST.ui.copyStatus": "success", "RPTST.ui.copyDesc": "クリップボードにコピーしました" });
        RepoSt.update();
        setTimeout(() => {
          if (btn) btn.disabled = false;
          State.set({ "RPTST.ui.copyStatus": "message", "RPTST.ui.copyDesc": "設定項目をクリップボードにコピーします。" });
          RepoSt.update();
        }, 3000);
      } else {
        State.set({ "RPTST.ui.copyStatus": "alert", "RPTST.ui.copyDesc": "アクセス拒否。手動コピーしてください。" });
        RepoSt.update();
        if (txt) {
          txt.style.display = 'block';
          txt.value = jsonStr;
          txt.focus();
          txt.select();
        }
        if (btn) btn.disabled = false;
      }
    }
  }

  class RepoInit {
    static async init() {
      CoreAct.rootGLB({ CoreAct, RepoAct, RepoSt, RepoRend, RepoExport, RepoInit });
      RepoAct.automator = new CoreUI(REPORT_SCHEMA, 'RPTST');

      if (window.__EXPORT_CFG__) {
         State.set(window.__PRINT_STATE__);
         document.body.setAttribute('data-state', 'printing');
         const loading = document.createElement('div');
         loading.setAttribute('data-part', 'print-loading');
         loading.textContent = window.__EXPORT_CFG__.autoPrint ? '印刷用PDF生成中...' : '静的HTML生成中...';
         document.body.appendChild(loading);
         
         const grid = document.querySelector('[data-part="dashGrid"]');
         grid.innerHTML = ''; 
         
         for (let i = 0; i < 9; i++) {
           const div = document.createElement('div');
           div.setAttribute('data-part', `panel-${i}`);
           div.className = 'grid-panel';
           div.dataset.panelId = `p_${i}`;
           div.dataset.action = 'RepoAct.actvPanel';
           
           const chart = document.createElement('ui-plot');
           chart.style.cssText = 'width: 100%; height: 100%;';
           chart.setAttribute('data-renderer', 'svg');
           
           div.appendChild(chart);
           grid.appendChild(div);
         }
         
         RepoAct.automator.build();
         
         requestAnimationFrame(() => {
           RepoRend.syncPanelDom();
           void document.body.offsetHeight;
           RepoRend.genCharts(window.__PRECALC_DATA__);
         });
         return;
      }

      State.set({
        "RPTST.ui.linkCanvasMargin": false,
        "RPTST.ui.linkPanelMargin": false,
        "RPTST.ui.exportDesc": "ブラウザ機能を使用してPDFを出力します。",
        "RPTST.ui.copyDesc": "設定項目をクリップボードにコピーします。"
      });
      
      const initDataRaw = window.__INJECTED_DATA__;
      const injData = (typeof initDataRaw === 'object' && initDataRaw !== null) ? initDataRaw : { pxrfDT: [], wdxrfDT: [], crctDT: [] };
      State.set("RPTST.dataset.raw", injData);

      document.querySelectorAll('input[type="number"], input[type="range"]').forEach(el => {
        const key = el.name || el.dataset.bind?.split('.').pop();
        if (key && RPT_CFG.rng[key]) {
          const rng = RPT_CFG.rng[key];
          el.setAttribute('min', rng.min);
          el.setAttribute('max', rng.max);
          el.setAttribute('step', rng.step);
        }
      });
      
      RepoAct.automator.build();

      let fav = null;
      if (typeof window.__INJECTED_FAVORITE__ === 'object' && window.__INJECTED_FAVORITE__ !== null) {
        fav = window.__INJECTED_FAVORITE__;
      } else if (typeof window.__INJECTED_FAVORITE__ === 'string' && window.__INJECTED_FAVORITE__ !== 'INJECT_FAVORITE_TARGET' && window.__INJECTED_FAVORITE__ !== 'null') {
        try { fav = JSON.parse(window.__INJECTED_FAVORITE__); } catch (e) {}
      }
      await RepoSt.initSt(fav, injData);

      RepoRend.syncPanelDom();
      RepoSt.renewPanel();

      // --- 4層 State の購読設定 ---
      // 1. レイアウト変更 (再配置)
      State.subscribe(['RPTST.config.layout.gridRows', 'RPTST.config.layout.gridCols', 'RPTST.config.layout.panelGap'], () => {
          RepoRend.syncPanelDom();
      });
      // 2. モード変更 (メトリクススケール再計算)
      State.subscribe('RPTST.config.boardMode', () => {
          RepoSt.updateBaseScales('metric');
          RepoSt.update();
          RepoSt.renewPanel();
      });
      // 3. データ変更 (データ再計算フロー)
      State.subscribe(['RPTST.dataset.filters', 'RPTST.dataset.useCal', 'RPTST.dataset.useLOD', 'RPTST.dataset.crct', 'RPTST.dataset.calElms'], () => {
          RepoSt.updateBaseScales('all');
          RepoSt.renewPanel();
          RepoRend.qRend();
      });
      // 4. 設定変更 (軽量再描画フロー)
      State.subscribe(['RPTST.config.symbology', 'RPTST.config.theme', 'RPTST.panels', 'RPTST.config.layout.rowAspect'], () => {
          RepoRend.qRend();
      });
      // 5. アクティブパネル切り替え
      State.subscribe('RPTST.ui.activePanelId', () => {
          RepoSt.renewPanel();
      });

      State.subscribe('RPTST.config.symbology.baseKey', () => RepoSt.renewSymbState());
      State.subscribe('RPTST.config.symbology.rls', () => RepoSt.renewSymbState());

      window.addEventListener('resize', () => {
         clearTimeout(RepoRend.resizeTimer);
         RepoRend.resizeTimer = setTimeout(() => {
             RepoRend.fitA4Scale();
             const gph = RepoRend.genGph();
             RepoRend.calcPanelSize(gph);
             const plots = document.querySelectorAll('[data-part="dashGrid"] ui-plot');
             plots.forEach(plot => { plot.src = { ...plot.src, gph: gph }; });
         }, 100);
      });
    }

    static start() { return this.init(); }
  }

  window.RepoAct = RepoAct;
  window.RepoInit = RepoInit;
  window.RepoSt = RepoSt;
  window.RepoRend = RepoRend;
  window.RepoExport = RepoExport;

  if (document.readyState === 'loading') {
    window.addEventListener("DOMContentLoaded", () => RepoInit.init());
  } else {
    RepoInit.init();
  }
</script>
