<script>
  // --- UI utilities ---
  class DOM {
    static get = id => document.getElementById(id);
    static setDOM = (id, text) => { if (text !== undefined && this.get(id)) this.get(id).innerText = text; };
    static toggle = (id, isShow) => { if (this.get(id)) this.get(id).style.display = isShow ? "" : "none"; };
    static open = (id, isOpen) => { if (this.get(id)?.tagName === "DETAILS") setTimeout(() => { this.get(id).open = isOpen; }, 200); };
    static setDisabled = (id, isDisabled) => { if (this.get(id)) this.get(id).disabled = isDisabled; };
    static setAttr = (id, attr, val) => val ? this.get(id)?.setAttribute(attr, val) : this.get(id)?.removeAttribute(attr);
  }

  // --- 汎用UIパーツ生成・描画クラス ---
  class UICreate {
    // --- テンプレート汎用リスト生成 ---
    static #renderTemplateList(templateId, items, containerId, mapper) {
      const container = DOM.get(containerId);
      const template = DOM.get(templateId);
      if (!container || !template || !items?.length) return;
      container.replaceChildren(...items.map((item, index) => mapper(template.content.cloneNode(true), item, index)));
    }

    // --- ステータスバー更新 ---
    static status(id, status = null) {
      const el = DOM.get(id);
      if (!el) return;
      if (!status?.length) {
        el.dataset.status = "hidden";
        el.innerText = "";
        return;
      }
      [el.dataset.status, el.innerText] = status;
    }

    // --- ダイアログ生成 ---
    static confirm(title, msg, barObj = null) {
      const prefix = String(barObj).split("StatusBar")[0];
      const saveStatus = State.get(`Tab1ST.${prefix}.status`);
      if (barObj) this.status(barObj, ["loading", "実行中..."]);
      return new Promise((resolve) => {
        const dialog = DOM.get("universalConfirm");
        DOM.setDOM("uDialogTitle", title);
        DOM.setDOM("uDialogMessage", msg);
        dialog.showModal(); 
        DOM.get("uDialogConfirmBtn").onclick = () => { dialog.close(); resolve(true); };
        DOM.get("uDialogCancelBtn").onclick = () => {
          dialog.close();
          if (barObj) this.status(barObj, saveStatus);
          resolve(false);
        };
      });
    }

    // --- 列選択動的生成 ---
    static selectors(arr, objID, fields, targetState, hasEmpty = true, isMultiple = false) {
      this.#renderTemplateList("selectorTemplate", fields, objID, (clone, field) => {
        clone.querySelector(".field-label").firstChild.nodeValue = `${field.label} `;
        const select = clone.querySelector("select");
        select.setAttribute('data-field', field.key);
        select.setAttribute('data-change', targetState);
        if (isMultiple) select.multiple = true;
        if (!hasEmpty || isMultiple) select.querySelector(".empty-opt")?.remove();
        select.append(...arr.map(h => new Option(h, h)));
        return clone;
      });
    }

    // --- チェックボックス生成 ---
    static checkboxes(arr, objID) {
      const container = DOM.get(objID);
      if (!container) return;
      if (!arr?.length) { container.innerHTML = '<div class="txt-btninfo">データがありません</div>'; return; }
      const template = DOM.get("checkboxTemplate");
      const items = arr.map(item => {
        const clone = template.content.cloneNode(true);
        clone.querySelector(".dataset-cb").value = item;
        clone.querySelector(".cb-text").textContent = item;
        return clone;
      });
      container.replaceChildren(DOM.get("checkAllTemplate").content.cloneNode(true), ...items);
    }

    // --- シンボル設定行生成 ---
    static symbolRows(values, objID, rawNum, targetState) {
      const { symbolShapes: shapes, symbolColors: colors } = GLOBAL_CONFIG;
      this.#renderTemplateList("symbolRowTemplate", Array.from({ length: rawNum }), objID, (clone, _, i) => {
        clone.querySelectorAll("select").forEach(s => {
          s.setAttribute('data-symbol-idx', i);
          s.setAttribute('data-change', targetState);
        });
        clone.querySelector('[data-symbol-type="target"]').append(...values.map(v => new Option(v, v)));
        clone.querySelector('[data-symbol-type="shape"]').append(...shapes.map(s => new Option(s, s)));
        clone.querySelector('[data-symbol-type="color"]').append(...colors.map(c => new Option(c.label, c.val)));
        return clone;
      });
    }

    // --- ラジオボタン生成 ---
    static radioGroup(elements, boxId, targetState, initValue) {
      const box = DOM.get(boxId);
      const template = DOM.get("previewModeTemplate");
      if (!box || !template || !elements?.length) return {};
      const initialMap = {};
      const items = elements.map(el => {
        initialMap[el] = initValue;
        const clone = template.content.cloneNode(true);
        clone.querySelector(".radio-label").textContent = el;
        clone.querySelectorAll('input[type="radio"]').forEach(radio => {
          radio.setAttribute('name', `mode_${el}`);
          radio.setAttribute('data-element', el);
          radio.setAttribute('data-change', targetState);
          if (radio.value === initValue) radio.checked = true;
        });
        return clone;
      });
      box.replaceChildren(...items);
      return initialMap;
    }

    // --- 統計表レンダリング ---
    static statsTable(stats, containerId = Tab2UI.previewStatsTable) {
      const container = DOM.get(containerId);
      if (!container) return;
      if (!stats) { container.replaceChildren(); return; }

      const fmt = (v, digits = 4) => (v != null && !isNaN(v)) ? v.toFixed(digits) : "-";
      const sign = (stats.intercept ?? 0) >= 0 ? "+" : "-";
      const absIntercept = Math.abs(stats.intercept ?? 0);
      const eqStr = `y = ${fmt(stats.slope)}x ${sign} ${fmt(absIntercept)}`;

      const rows = [
        ["データ個数", stats.count ?? 0],
        ["相関/決定係数", `${fmt(stats.r)} / ${fmt(stats.r2)}`],
        ["回帰直線", eqStr],
        ["残差標準偏差", fmt(stats.resStdDev)],
        ["器械Err3σ", fmt(stats.err3Sigma)]
      ];

      const containerTpl = DOM.get("statsContainerTemplate");
      const rowTpl = DOM.get("statsRowTemplate");
      if (!containerTpl || !rowTpl) return;

      const boxClone = containerTpl.content.cloneNode(true);
      const grid = boxClone.querySelector(".stats-grid");

      rows.forEach(([label, val]) => {
        const rowClone = rowTpl.content.cloneNode(true);
        rowClone.querySelector(".stats-label").textContent = label;
        rowClone.querySelector(".stats-val").textContent = String(val);
        grid.appendChild(rowClone);
      });

      container.replaceChildren(boxClone);
    }

    // --- 疑似ドロップダウン生成 (Popover API) ---
    static multiSelectDropdown(arr, objID, targetState, hasSelectAll = false, initialSelected = arr) {
      const container = DOM.get(objID);
      if (!container) return;
      if (!arr?.length) { container.innerHTML = '<div class="txt-btninfo">データなし</div>'; return; }

      const clone = DOM.get("multiSelectTemplate").content.cloneNode(true);
      const summaryBtn = clone.querySelector(".multi-select-summary");
      const optionsBox = clone.querySelector(".multi-select-options");

      const popoverId = `popover-${objID}`;
      const anchorName = `--anchor-${objID}`;
      
      summaryBtn.setAttribute("popovertarget", popoverId);
      summaryBtn.style.anchorName = anchorName;
      
      optionsBox.id = popoverId;
      optionsBox.style.positionAnchor = anchorName;

      if (hasSelectAll) optionsBox.appendChild(DOM.get("checkAllTemplate").content.cloneNode(true));

      const items = arr.map(item => {
        const itemClone = DOM.get("checkboxTemplate").content.cloneNode(true);
        const cb = itemClone.querySelector(".dataset-cb");
        cb.value = item;
        // 初期選択状態の厳格な適用
        cb.checked = initialSelected.includes(item);
        cb.setAttribute('data-change', targetState);
        itemClone.querySelector(".cb-text").textContent = item;
        return itemClone;
      });
      
      optionsBox.append(...items);
      container.replaceChildren(clone);
    }

    // --- サマリーテキスト(Badge)更新 ---
    static updateMultiSelectSummary(objID, selectedValues) {
      const summary = DOM.get(objID)?.querySelector(".multi-select-summary");
      if (!summary) return;
      if (!selectedValues?.length) {
        summary.innerHTML = '<span style="color:var(--grey400)">未選択</span>';
        return;
      }
      summary.replaceChildren(...selectedValues.map(v => {
        const span = document.createElement('span');
        span.className = 'badge';
        span.textContent = v;
        return span;
      }));
    }

    // --- セレクタ・インプットUI更新 ---
    static inputs(mapBoxId, errorFlags) {
      DOM.get(mapBoxId)?.querySelectorAll('select, input').forEach((s, idx) => {
        s.classList.toggle('has-error', !!errorFlags?.[idx]);
      });
    }
  }

  // --- 動的DOM構築クラス ---
  class UIBuildInit {
    static buildTab1() {
      // モード選択 (Select)
      const modeBox = DOM.get(Tab1UI.configModeBox);
      if (modeBox) {
        const select = document.createElement("select");
        select.setAttribute('data-bind', "Tab1ST.config.mode");
        GLOBAL_CONFIG.configModes.forEach(({ label, value, disabled, hidden }) => {
          const opt = new Option(label, value);
          if (disabled) opt.disabled = true;
          if (hidden) opt.hidden = true;
          if (value === "") opt.selected = true;
          select.add(opt);
        });
        modeBox.appendChild(select);
      }
      // 計測属性 (Inputs)
      const exacBox = DOM.get(Tab1UI.exacBox);
      if (exacBox) {
        GLOBAL_CONFIG.exacFields.forEach(f => {
          const clone = DOM.get("inputTemplate").content.cloneNode(true);
          clone.querySelector(".field-label").firstChild.nodeValue = `${f.label} `;
          const input = clone.querySelector("input");
          input.placeholder = f.placeholder;
          input.setAttribute('data-bind', f.bind);
          exacBox.appendChild(clone);
        });
      }
    }

    static buildTab2() {
      // シンボル分類軸 (Select)
      const axisBox = DOM.get(Tab2UI.symbolAxisBox);
      if (axisBox) {
        const select = document.createElement("select");
        select.id = Tab2UI.symbolAxis;
        select.setAttribute('data-bind', "Tab2ST.symbol.baseKey");
        GLOBAL_CONFIG.symbolAxes.forEach(a => select.add(new Option(a.label, a.value)));
        axisBox.appendChild(select);
      }
    }

    // シンボル設定群
    static buildSymbols() {
      const baseData = State.get("Tab2ST.basePXRF") ?? [];
      const baseKey = State.get("Tab2ST.symbol.baseKey");
      const values = [...new Set(baseData.map(d => d[baseKey]).filter(Boolean))];
      UICreate.symbolRows(values, Tab2UI.symbolBox, 5, "Tab2.updateSymbol");
    }

    static buildPreview() {
      // プレビュー: モード選択 (全選択で初期化)
      const previewMode = DOM.get(Tab2UI.previewModeBox);
      if (previewMode) {
        const opts = GLOBAL_CONFIG.optionalElements;
        UICreate.multiSelectDropdown(opts, Tab2UI.previewModeBox, "Tab2.updatePreviewMode", true, opts);
        State.set("Tab2ST.modeMap", [...opts]); // Stateも全選択で初期化
      }

      // プレビュー: 補正方法
      const previewCorrection = DOM.get(Tab2UI.previewCorrectionBox);
      if (previewCorrection) {
        const select = document.createElement("select");
        select.setAttribute('data-bind', "Tab2ST.preview.correction");
        select.add(new Option("補正なし", "rawdata"));
        select.add(new Option("新規検量線", "new"));
        previewCorrection.replaceChildren(select);
        State.set("Tab2ST.preview.correction", "rawdata");
      }

      // プレビュー: プレビュー値
      const previewValue = DOM.get(Tab2UI.previewValueBox);
      if (previewValue) {
        const select = document.createElement("select");
        select.setAttribute('data-bind', "Tab2ST.preview.value");
        GLOBAL_CONFIG.valueLogic.forEach(v => select.add(new Option(v, v)));
        previewValue.replaceChildren(select);
        State.set("Tab2ST.preview.value", GLOBAL_CONFIG.valueLogic[0]);
      }
    }

    static build() {
      this.buildTab1();
      this.buildTab2();
      this.buildPreview();
    }
  }

  // --- フェーズ連動UI制御 ---
  class UIPhase {
    static #applyRules(rules) {
      Object.entries(rules).forEach(([id, { show, disabled, active, text, className }]) => {
        if (show !== undefined) DOM.toggle(id, show);
        if (disabled !== undefined) DOM.setDisabled(id, disabled);
        if (!id.includes('configSection') && active !== undefined) DOM.open(id, active);
        if (text !== undefined) DOM.setDOM(id, text);
        if (className !== undefined && DOM.get(id)) DOM.get(id).className = className;
        if (id.includes('Section')) {
          DOM.setAttr(id, "data-state", active ? "active" : null);
          DOM.setAttr(id, "data-type", disabled ? "disabled" : null);
        }
      });
    }

    static updateTab1PhaseUI(phase) {
      const p = TAB1_PHASE;
      const fileErr = State.get("Tab1ST.file.isMapError").some(Boolean);
      const exacErr = State.get("Tab1ST.exac.isMapError").some(Boolean);
      const rules = {
        [Tab1UI.fileLoadBtn]:   { text: phase <= p.READY ? "データを取得" : "データを再取得", disabled: false },
        [Tab1UI.fileMakeBtn]:   { disabled: phase < p.READY },
        [Tab1UI.fileValdBtn]:   { disabled: phase < p.INVALID || fileErr, className: phase === p.INVALID ? "" : "outline" },
        [Tab1UI.fileArea]:      { show: phase >= p.LOAD },
        [Tab1UI.fileBtnBox]:    { show: phase >= p.LOAD },
        [Tab1UI.exacArea]:      { show: phase >= p.VALID },
        [Tab1UI.exacBar]:       { show: phase >= p.VALID },
        [Tab1UI.exacBtn]:       { disabled: phase < p.VALID || exacErr },
        [Tab1UI.exacPushBtn]:   { show: phase >= p.EXTRACT, disabled: phase < p.EXTRACT },
        [Tab1UI.configSection]: { active: phase === p.INIT, disabled: false },
        [Tab1UI.fileSection]:   { active: phase >= p.READY && phase < p.VALID, disabled: phase < p.READY },
        [Tab1UI.exacSection]:   { active: phase >= p.VALID && phase < p.OUTPUT, disabled: phase < p.VALID }
      };
      this.#applyRules(rules);
      if (phase >= p.VALID && phase < p.EXTRACT) State.set("Tab1ST.exac.cachedStatus", ["hidden", ""]);
      if (phase >= p.EXTRACT) State.set("Tab1ST.exac.cachedStatus", State.get("Tab1ST.exac.status"));
    }

    static updateTab2PhaseUI(phase) {
        const p = TAB2_PHASE;
        const rules = {
          [Tab2UI.datasetLoadBtn]:   { disabled: false },
          [Tab2UI.datasetfilterBtn]: { disabled: phase < p.LOADED },
          [Tab2UI.datasetArea]:      { show: phase >= p.LOADED },
          [Tab2UI.datasetSection]:   { active: phase < p.FILTERED, disabled: false },
          [Tab2UI.symbolAxis]:       { disabled: phase < p.FILTERED },
          [Tab2UI.symbolBtn]:        { disabled: phase < p.FILTERED },
          [Tab2UI.symbolArea]:       { show: phase >= p.FILTERED },
          [Tab2UI.symbolSection]:    { active: phase >= p.FILTERED && phase < p.MAPPED, disabled: phase < p.FILTERED },
          [Tab2UI.previewMakeBtn]:   { disabled: phase < p.MAPPED },
          [Tab2UI.previewSection]:   { active: phase >= p.MAPPED, disabled: phase < p.MAPPED },
          [Tab2UI.reppBtn]:          { disabled: phase < p.PREVIEWED },
          [Tab2UI.reportSection]:    { active: phase >= p.PREVIEWED, disabled: phase < p.PREVIEWED }
        };
        this.#applyRules(rules);
      }
    }

  // --- UI更新 - state同期 ---
  class UIStateUpdater {
    constructor() {
      const stateMap = {
        "GLB.isLocked": v => DOM.setDisabled(Tab1UI.tabSet, v),
        "Tab1ST.config.status": v => UICreate.status(Tab1UI.configBar, v),
        "Tab1ST.file.status": v => UICreate.status(Tab1UI.fileBar, v),
        "Tab1ST.exac.status": v => UICreate.status(Tab1UI.exacBar, v),
        "Tab2ST.datasetload.status": v => UICreate.status(Tab2UI.datasetloadBar, v),
        "Tab2ST.symbol.status": v => UICreate.status(Tab2UI.symbolBar, v),
        "Tab2ST.repoStatus": v => UICreate.status(Tab2UI.repoBar, v),
        "Tab1ST.phase": v => UIPhase.updateTab1PhaseUI(v),
        "Tab2ST.phase": v => UIPhase.updateTab2PhaseUI(v),
        "Tab1ST.file.data": data => {
          if (data?.[0]) UICreate.selectors(data[0], Tab1UI.fileBox, GLOBAL_CONFIG.fileFields, "Tab1.updateFileMap");
        },
        "Tab2ST.availableDatasets": datasets => {
          UICreate.multiSelectDropdown(datasets, Tab2UI.datasetBox, "Tab2.toggleDataset", true, datasets);
        },
        "Tab2ST.filter.datasets": vals => {
          UICreate.updateMultiSelectSummary(Tab2UI.datasetBox, vals);
        },
        "Tab2ST.modeMap": vals => {
          UICreate.updateMultiSelectSummary(Tab2UI.previewModeBox, vals);
        },
        "Tab2ST.basePXRF": () => UIBuildInit.buildSymbols(),
        "Tab2ST.symbol.baseKey": () => UIBuildInit.buildSymbols(),
        "Tab1ST.file.isMapError": flags => {
          UICreate.inputs(Tab1UI.fileBox, flags);
          if (State.get("Tab1ST.phase") === TAB1_PHASE.LOAD) UIPhase.updateTab1PhaseUI(TAB1_PHASE.LOAD);
        },
        "Tab1ST.exac.isMapError": flags => {
          UICreate.inputs(Tab1UI.exacBox, flags);
          if (State.get("Tab1ST.phase") === TAB1_PHASE.VALID) UIPhase.updateTab1PhaseUI(TAB1_PHASE.VALID);
        },
        "Tab2ST.preview.statsData": stats => UICreate.statsTable(stats)
      };
      Object.entries(stateMap).forEach(([path, cb]) => State.subscribe(path, cb));
    }
  }

  const UI = UICreate;
  const UINew = UIBuildInit;
  const UIState = new UIStateUpdater();
</script>
