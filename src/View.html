<!-- View.html -->
<script>
  // --- UI utilities ---
  class DOM {
    static get = id => document.getElementById(id);
    static setDOM = (id, text) => { if (text !== undefined && this.get(id)) this.get(id).innerText = text; };
    static toggle = (id, isShow) => { if (this.get(id)) this.get(id).style.display = isShow ? "" : "none"; };
    static open = (id, isOpen) => { if (this.get(id)?.tagName === "DETAILS") setTimeout(() => { this.get(id).open = isOpen; }, 200); };
    static setDisabled = (id, isDisabled) => { if (this.get(id)) this.get(id).disabled = isDisabled; };
    static setAttr = (id, attr, val) => val ? this.get(id)?.setAttribute(attr, val) : this.get(id)?.removeAttribute(attr);
  }

  // --- UI更新・生成処理群 ---
  class UIController {
    // --- 初期UI動的構築 ---
    static buildInitUI() {
      // モード選択 (Select)
      const modeBox = DOM.get(Tab1UI.configModeBox);
      if (modeBox) {
        const select = document.createElement("select");
        select.dataset.bind = "Tab1ST.config.mode";
        GLOBAL_CONFIG.configModes.forEach(({ label, value, disabled, hidden }) => {
          const opt = new Option(label, value);
          if (disabled) opt.disabled = true;
          if (hidden) opt.hidden = true;
          if (value === "") opt.selected = true;
          select.add(opt);
        });
        modeBox.appendChild(select);
      }
      // 計測属性 (Inputs)
      const exacBox = DOM.get(Tab1UI.exacBox);
      if (exacBox) {
        GLOBAL_CONFIG.exacFields.forEach(f => {
          const clone = DOM.get("inputTemplate").content.cloneNode(true);
          clone.querySelector(".field-label").firstChild.nodeValue = `${f.label} `;
          const input = clone.querySelector("input");
          input.placeholder = f.placeholder;
          input.dataset.bind = f.bind;
          exacBox.appendChild(clone);
        });
      }
      // シンボル分類軸 (Select)
      const axisBox = DOM.get(Tab2UI.symbolAxisBox);
      if (axisBox) {
        const select = document.createElement("select");
        select.id = Tab2UI.symbolAxis;
        select.dataset.bind = "Tab2ST.symbol.baseKey";
        GLOBAL_CONFIG.symbolAxes.forEach(a => select.add(new Option(a.label, a.value)));
        axisBox.appendChild(select);
      }
      // プレビュー: モード選択ラジオボタンの生成
      this.renderPreviewModes(GLOBAL_CONFIG.optionalElements, Tab2UI.previewModeBox);

      // プレビュー: 補正方法
      const pCorrBox = DOM.get(Tab2UI.previewCorrectionBox);
      if (pCorrBox) {
        const select = document.createElement("select");
        select.dataset.bind = "Tab2ST.preview.correction";
        select.add(new Option("補正なし", "rawdata"));
        select.add(new Option("新規検量線", "new"));
        pCorrBox.appendChild(select);
        State.set("Tab2ST.preview.correction", "rawdata"); // 初期化
      }

      // プレビュー: プレビュー値
      const pValBox = DOM.get(Tab2UI.previewValueBox);
      if (pValBox) {
        const select = document.createElement("select");
        select.dataset.bind = "Tab2ST.preview.value";
        GLOBAL_CONFIG.valueLogic.forEach(v => select.add(new Option(v, v)));
        pValBox.appendChild(select);
        State.set("Tab2ST.preview.value", GLOBAL_CONFIG.valueLogic[0]); // 初期化
      }
    }

    // --- ステータスバー更新 ---
    static loadingStatsBar(id, status = null) {
      const el = DOM.get(id);
      if (!el) return;
      if (!status?.length) {
        el.dataset.status = "hidden";
        el.innerText = "";
        return;
      }
      [el.dataset.status, el.innerText] = status;
    }

    // --- ダイアログ生成 ---
    static confirm(title, msg, barObj = null) {
      const prefix = String(barObj).split("StatusBar")[0];
      const saveStatus = State.get(`Tab1ST.${prefix}.status`);
      if (barObj) this.loadingStatsBar(barObj, ["loading", "実行中..."]);
      return new Promise((resolve) => {
        const dialog = DOM.get("universalConfirm");
        DOM.setDOM("uDialogTitle", title);
        DOM.setDOM("uDialogMessage", msg);
        dialog.showModal(); 
        DOM.get("uDialogConfirmBtn").onclick = () => { dialog.close(); resolve(true); };
        DOM.get("uDialogCancelBtn").onclick = () => {
          dialog.close();
          if (barObj) this.loadingStatsBar(barObj, saveStatus);
          resolve(false);
        };
      });
    }

    // --- テンプレート生成 ---
    static #renderTemplateList(templateId, items, containerId, mapper) {
      const container = DOM.get(containerId);
      const template = DOM.get(templateId);
      if (!container || !template || !items?.length) return;
      container.replaceChildren(...items.map((item, index) => mapper(template.content.cloneNode(true), item, index)));
    }

    // --- 列選択動的生成 ---
    static renderSelectors(arr, objID, fields, hasEmpty = true) {
      this.#renderTemplateList("selectorTemplate", fields, objID, (clone, field) => {
        clone.querySelector(".field-label").firstChild.nodeValue = `${field.label} `;
        const select = clone.querySelector("select");
        select.dataset.field = field.key;
        select.dataset.change = "Tab1.updateFileMap"; // ルーティング付与
        if (!hasEmpty) select.querySelector(".empty-opt")?.remove();
        select.append(...arr.map(h => new Option(h, h)));
        return clone;
      });
    }

    // --- チェックボックス生成 ---
    static renderCheckboxes(arr, objID) {
      const container = DOM.get(objID);
      if (!container) return;
      if (!arr?.length) { container.innerHTML = '<div class="txt-btninfo">データがありません</div>'; return; }
      const template = DOM.get("checkboxTemplate");
      const items = arr.map(item => {
        const clone = template.content.cloneNode(true);
        clone.querySelector(".dataset-cb").value = item;
        clone.querySelector(".cb-text").textContent = item;
        return clone;
      });
      container.replaceChildren(DOM.get("checkAllTemplate").content.cloneNode(true), ...items);
    }

    // --- シンボル設定行生成 ---
    static renderSymbolRows(values, objID, rawNum) {
      const shapes = ['circle', 'triangle', 'square'];
      const colors = [
        { val: 'var(--main-blue)', label: 'Blue' }, { val: 'var(--main-green)', label: 'Green' },
        { val: 'var(--main-red)', label: 'Red' }, { val: '#fbbc04', label: 'Yellow' },
        { val: 'var(--grey600)', label: 'Gray' }
      ];
      this.#renderTemplateList("symbolRowTemplate", Array.from({ length: rawNum }), objID, (clone, _, i) => {
        clone.querySelectorAll("select").forEach(s => {
          s.dataset.symbolIdx = i;
          s.dataset.change = "Tab2.updateSymbol";
        });
        clone.querySelector('[data-symbol-type="target"]').append(...values.map(v => new Option(v, v)));
        clone.querySelector('[data-symbol-type="shape"]').append(...shapes.map(s => new Option(s, s)));
        clone.querySelector('[data-symbol-type="color"]').append(...colors.map(c => new Option(c.label, c.val)));
        return clone;
      });
    }

    // --- ラジオボタン生成 ---
    static renderPreviewModes(elements, boxId) {
      const box = DOM.get(boxId);
      if (!box || !elements?.length) return;
      const initialMap = {};
      const items = elements.map(el => {
        initialMap[el] = "obsidian"; // デフォルト値
        const div = document.createElement("div");
        div.className = "radio-row";
        div.innerHTML = `
          <span class="radio-label">${el}</span>
          <div class="radio-group">
            <label class="radio-item">
              <input type="radio" name="mode_${el}" value="obsidian" data-element="${el}" data-change="Tab2.updatePreviewMode" checked> obsidian
            </label>
            <label class="radio-item">
              <input type="radio" name="mode_${el}" value="mudrock" data-element="${el}" data-change="Tab2.updatePreviewMode"> mudrock
            </label>
          </div>
        `;
        return div;
      });
      box.replaceChildren(...items);
      State.set("Tab2ST.modeMap", initialMap);
    }

    // --- セレクタ・インプットUI更新 ---
    static updateInputs(mapBoxId, errorFlags) {
      DOM.get(mapBoxId)?.querySelectorAll('select, input').forEach((s, idx) => {
        s.classList.toggle('has-error', !!errorFlags?.[idx]);
      });
    }
  }

  // --- フェーズ連動UI制御 ---
  class UIPhase {
    static #applyRules(rules) {
      Object.entries(rules).forEach(([id, { show, disabled, active, text, className }]) => {
        if (show !== undefined) DOM.toggle(id, show);
        if (disabled !== undefined) DOM.setDisabled(id, disabled);
        if (!id.includes('configSection') && active !== undefined) DOM.open(id, active);
        if (text !== undefined) DOM.setDOM(id, text);
        if (className !== undefined && DOM.get(id)) DOM.get(id).className = className;
        if (id.includes('Section')) {
          DOM.setAttr(id, "data-state", active ? "active" : null);
          DOM.setAttr(id, "data-type", disabled ? "disabled" : null);
        }
      });
    }

    static updateTab1PhaseUI(phase) {
      const p = TAB1_PHASE;
      const fileErr = State.get("Tab1ST.file.isMapError").some(Boolean);
      const exacErr = State.get("Tab1ST.exac.isMapError").some(Boolean);
      const rules = {
        [Tab1UI.fileLoadBtn]:   { text: phase <= p.READY ? "データを取得" : "データを再取得", disabled: false },
        [Tab1UI.fileMakeBtn]:   { disabled: phase < p.READY },
        [Tab1UI.fileValdBtn]:   { disabled: phase < p.INVALID || fileErr, className: phase === p.INVALID ? "" : "outline" },
        [Tab1UI.fileArea]:      { show: phase >= p.LOAD },
        [Tab1UI.fileBtnBox]:    { show: phase >= p.LOAD },
        [Tab1UI.exacArea]:      { show: phase >= p.VALID },
        [Tab1UI.exacBar]:       { show: phase >= p.VALID },
        [Tab1UI.exacBtn]:       { disabled: phase < p.VALID || exacErr },
        [Tab1UI.exacPushBtn]:   { show: phase >= p.EXTRACT, disabled: phase < p.EXTRACT },
        [Tab1UI.configSection]: { active: phase === p.INIT, disabled: false },
        [Tab1UI.fileSection]:   { active: phase >= p.READY && phase < p.VALID, disabled: phase < p.READY },
        [Tab1UI.exacSection]:   { active: phase >= p.VALID && phase < p.OUTPUT, disabled: phase < p.VALID }
      };
      this.#applyRules(rules);
      if (phase >= p.VALID && phase < p.EXTRACT) State.set("Tab1ST.exac.cachedStatus", ["hidden", ""]);
      if (phase >= p.EXTRACT) State.set("Tab1ST.exac.cachedStatus", State.get("Tab1ST.exac.status"));
    }

    static updateTab2PhaseUI(phase) {
      const p = TAB2_PHASE;
      const rules = {
        [Tab2UI.datasetLoadBtn]:   { disabled: false },
        [Tab2UI.datasetfilterBtn]: { disabled: phase < p.LOADED },
        [Tab2UI.datasetArea]:      { show: phase >= p.LOADED },
        [Tab2UI.symbolArea]:       { show: phase >= p.FILTERED },
        [Tab2UI.symbolAxis]:       { disabled: phase < p.FILTERED },
        [Tab2UI.symbolBtn]:        { disabled: phase < p.FILTERED },
        [Tab2UI.datasetSection]:   { active: phase < p.FILTERED, disabled: false },
        [Tab2UI.symbolSection]:    { active: phase >= p.FILTERED && phase < p.MAPPED, disabled: phase < p.FILTERED },
        // プレビューとレポートの活性制御を追加
        [Tab2UI.previewSection]:   { active: phase >= p.FILTERED, disabled: phase < p.FILTERED },
        [Tab2UI.previewMakeBtn]:   { disabled: phase < p.FILTERED },
        [Tab2UI.reportSection]:    { active: phase >= p.MAPPED, disabled: phase < p.MAPPED }
      };
      this.#applyRules(rules);
      if (phase === p.FILTERED) {
        const baseData = State.get("Tab2ST.basePXRF") ?? [];
        const baseKey = State.get("Tab2ST.symbol.baseKey");
        UIController.renderSymbolRows([...new Set(baseData.map(d => d[baseKey]).filter(Boolean))], Tab2UI.symbolBox, 5); // 修正: d[baseKey]
      }
    }
  }

  // --- UI更新 - state同期 ---
  class UIStateUpdater {
    constructor() {
      const stateMap = {
        "GLB.isLocked": v => DOM.setDisabled(Tab1UI.tabSet, v),
        "Tab1ST.config.status": v => UIController.loadingStatsBar(Tab1UI.configBar, v),
        "Tab1ST.file.status": v => UIController.loadingStatsBar(Tab1UI.fileBar, v),
        "Tab1ST.exac.status": v => UIController.loadingStatsBar(Tab1UI.exacBar, v),
        "Tab2ST.datasetload.status": v => UIController.loadingStatsBar(Tab2UI.datasetloadBar, v),
        "Tab2ST.repoStatus": v => UIController.loadingStatsBar(Tab2UI.repoBar, v),
        "Tab1ST.phase": v => UIPhase.updateTab1PhaseUI(v),
        "Tab2ST.phase": v => UIPhase.updateTab2PhaseUI(v),
        "Tab1ST.file.isMapError": flags => {
          UIController.updateInputs(Tab1UI.fileBox, flags);
          if (State.get("Tab1ST.phase") === TAB1_PHASE.LOAD) UIPhase.updateTab1PhaseUI(TAB1_PHASE.LOAD);
        },
        "Tab1ST.exac.isMapError": flags => {
          UIController.updateInputs(Tab1UI.exacBox, flags);
          if (State.get("Tab1ST.phase") === TAB1_PHASE.VALID) UIPhase.updateTab1PhaseUI(TAB1_PHASE.VALID);
        },
        "Tab2ST.symbol.baseKey": key => {
          const baseData = State.get("Tab2ST.basePXRF") ?? [];
          UIController.renderSymbolRows([...new Set(baseData.map(d => d[key]).filter(Boolean))], Tab2UI.symbolBox, 5);
        },
        "Tab2ST.preview.stats": v => UIController.loadingStatsBar(Tab2UI.previewBar, ["message", v])
      };
      Object.entries(stateMap).forEach(([path, cb]) => State.subscribe(path, cb));
    }
  }

  const UI = UIController;
  const UIState = new UIStateUpdater();
</script>
