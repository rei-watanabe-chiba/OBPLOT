<!-- View.html -->
<script>
  // --- 起動時DOM構築 ---
  class UIInit {
    static buildTab1() {
      // --- Tab1 モード選択---
      const modeBox = DOM.get(Tab1UI.configModeBox);
      if (modeBox && !modeBox.hasChildNodes()) {
        const select = document.createElement("select");
        select.setAttribute('data-bind', "Tab1ST.config.mode");
        GLOBAL_CONFIG.configModes.forEach(({ label, value, disabled, hidden }) => {
          const opt = new Option(label, value);
          if (disabled) opt.disabled = true;
          if (hidden) opt.hidden = true;
          if (value === "") opt.selected = true;
          select.add(opt);
        });
        modeBox.appendChild(select);
      }
      // --- Tab1 抽出属性---
      const exacBox = DOM.get(Tab1UI.exacBox);
      if (exacBox && !exacBox.hasChildNodes()) {
        GLOBAL_CONFIG.exacFields.forEach(f => {
          const clone = DOM.get("inputTemplate").content.cloneNode(true);
          clone.querySelector(".field-label").firstChild.nodeValue = `${f.label} `;
          const input = clone.querySelector("input");
          input.placeholder = f.placeholder;
          input.setAttribute('data-bind', f.bind);
          exacBox.appendChild(clone);
        });
      }
    }

    static buildTab2() {
      // --- Tab2 シンボル属性---
      const axisBox = DOM.get(Tab2UI.symbolAxisBox);
      if (axisBox && !axisBox.hasChildNodes()) {
        const select = document.createElement("select");
        select.id = Tab2UI.symbolAxis;
        select.setAttribute('data-bind', "Tab2ST.symbol.baseKey");
        GLOBAL_CONFIG.symbolAxes.forEach(a => select.add(new Option(a.label, a.value)));
        axisBox.appendChild(select);
      }
      // --- Tab2 補正方法--
      const previewCorrection = DOM.get(Tab2UI.previewCorrectionBox);
      if (previewCorrection && !previewCorrection.hasChildNodes()) {
        const select = document.createElement("select");
        select.setAttribute('data-bind', "Tab2ST.preview.correction");
        select.add(new Option("補正なし", "rawdata"));
        select.add(new Option("新規検量線", "new"));
        previewCorrection.replaceChildren(select);
      }
      // --- Tab2 プレビュー対象---
      const previewValue = DOM.get(Tab2UI.previewValueBox);
      if (previewValue && !previewValue.hasChildNodes()) {
        const select = document.createElement("select");
        select.setAttribute('data-bind', "Tab2ST.preview.value");
        GLOBAL_CONFIG.valueLogic.forEach(v => select.add(new Option(v, v)));
        previewValue.replaceChildren(select);
        if (GLOBAL_CONFIG.valueLogic.length) {
          State.set("Tab2ST.preview.value", GLOBAL_CONFIG.valueLogic[0]);
        }
      }
    }

    static build() {
      this.buildTab1();
      this.buildTab2();
    }
  }

  // --- フェーズ連動UI制御 ---
  class UIPhase {
    // ルール定義
    static #TAB1_RULES = {
      [Tab1UI.fileLoadBtn]: p => ({ text: p <= TAB1_PHASE.READY ? "データを取得" : "データを再取得", disabled: false }),
      [Tab1UI.fileMakeBtn]: p => ({ disabled: p < TAB1_PHASE.READY }),
      [Tab1UI.fileValdBtn]: p => ({ 
        disabled: p < TAB1_PHASE.INVALID || State.get("Tab1ST.file.isMapError").some(Boolean), 
        className: p === TAB1_PHASE.INVALID ? "" : "outline" 
      }),
      [Tab1UI.fileArea]: p => ({ show: p >= TAB1_PHASE.LOAD }),
      [Tab1UI.fileBtnBox]: p => ({ show: p >= TAB1_PHASE.LOAD }),
      [Tab1UI.exacArea]: p => ({ show: p >= TAB1_PHASE.VALID }),
      [Tab1UI.exacBar]: p => ({ show: p >= TAB1_PHASE.VALID }),
      [Tab1UI.exacBtn]: p => ({ disabled: p < TAB1_PHASE.VALID || State.get("Tab1ST.exac.isMapError").some(Boolean) }),
      [Tab1UI.exacPushBtn]: p => ({ show: p >= TAB1_PHASE.EXTRACT, disabled: p < TAB1_PHASE.EXTRACT }),
      [Tab1UI.configSection]: p => ({ active: p === TAB1_PHASE.INIT, disabled: false }),
      [Tab1UI.fileSection]: p => ({ active: p >= TAB1_PHASE.READY && p < TAB1_PHASE.VALID, disabled: p < TAB1_PHASE.READY }),
      [Tab1UI.exacSection]: p => ({ active: p >= TAB1_PHASE.VALID && p < TAB1_PHASE.OUTPUT, disabled: p < TAB1_PHASE.VALID })
    };
    static #TAB2_RULES = {
      [Tab2UI.datasetLoadBtn]: () => ({ disabled: false }),
      [Tab2UI.datasetfilterBtn]: p => ({ disabled: p < TAB2_PHASE.LOADED }),
      [Tab2UI.datasetArea]: p => ({ show: p >= TAB2_PHASE.LOADED }),
      [Tab2UI.datasetSection]: p => ({ active: p < TAB2_PHASE.FILTERED, disabled: false }),
      [Tab2UI.symbolAxis]: p => ({ disabled: p < TAB2_PHASE.FILTERED }),
      [Tab2UI.symbolBtn]: p => ({ disabled: p < TAB2_PHASE.FILTERED }),
      [Tab2UI.symbolArea]: p => ({ show: p >= TAB2_PHASE.FILTERED }),
      [Tab2UI.symbolSection]: p => ({ active: p >= TAB2_PHASE.FILTERED && p < TAB2_PHASE.MAPPED, disabled: p < TAB2_PHASE.FILTERED }),
      [Tab2UI.previewMakeBtn]: p => ({ disabled: p < TAB2_PHASE.MAPPED }),
      [Tab2UI.previewSection]: p => ({ active: p >= TAB2_PHASE.MAPPED, disabled: p < TAB2_PHASE.MAPPED }),
      [Tab2UI.reppBtn]: p => ({ disabled: p < TAB2_PHASE.PREVIEWED }),
      [Tab2UI.reportSection]: p => ({ active: p >= TAB2_PHASE.PREVIEWED, disabled: p < TAB2_PHASE.PREVIEWED })
    };
    // 一括適用
    static #apply(rulesObj, phase) {
      Object.entries(rulesObj).forEach(([id, ruleFn]) => {
        const rule = ruleFn(phase);
        if (rule.show !== undefined) DOM.toggle(id, rule.show);
        if (rule.disabled !== undefined) DOM.setDisabled(id, rule.disabled);
        if (!id.includes('configSection') && rule.active !== undefined) DOM.open(id, rule.active);
        if (rule.text !== undefined) DOM.setDOM(id, rule.text);
        if (rule.className !== undefined && DOM.get(id)) DOM.get(id).className = rule.className;
        if (id.includes('Section')) {
          DOM.setAttr(id, "data-state", rule.active ? "active" : null);
          DOM.setAttr(id, "data-type", rule.disabled ? "disabled" : null);
        }
      });
    }
    static updateTab1PhaseUI(p) {
      this.#apply(this.#TAB1_RULES, p);
      if (p >= TAB1_PHASE.VALID && p < TAB1_PHASE.EXTRACT) State.set("Tab1ST.exac.cachedStatus", ["hidden", ""]);
      if (p >= TAB1_PHASE.EXTRACT) State.set("Tab1ST.exac.cachedStatus", State.get("Tab1ST.exac.status"));
    }
    static updateTab2PhaseUI(p) {
      this.#apply(this.#TAB2_RULES, p);
    }
  }

  // --- state-UI 同期 ---
  class UIStateUpdater {
    constructor() {
      const stateMap = {
        // 表示UI
        "GLB.isLocked": v => DOM.setDisabled(Tab1UI.tabSet, v),
        "Tab1ST.config.status": v => NewDOM.status(Tab1UI.configBar, v),
        "Tab1ST.file.status": v => NewDOM.status(Tab1UI.fileBar, v),
        "Tab1ST.exac.status": v => NewDOM.status(Tab1UI.exacBar, v),
        "Tab2ST.dataset.status": v => NewDOM.status(Tab2UI.datasetloadBar, v),
        "Tab2ST.symbol.status": v => NewDOM.status(Tab2UI.symbolBar, v),
        "Tab2ST.preview.status": v => NewDOM.status(Tab2UI.previewBar, v),
        "Tab2ST.report.status": v => NewDOM.status(Tab2UI.repoBar, v),
        "Tab1ST.phase": v => UIPhase.updateTab1PhaseUI(v),
        "Tab2ST.phase": v => UIPhase.updateTab2PhaseUI(v),
        // 動的UI
        "Tab1ST.file.data": data => {
          if (data?.[0]) NewDOM.selectors(data[0], Tab1UI.fileBox, GLOBAL_CONFIG.fileFields, "Tab1.updateFileMap");
          else DOM.get(Tab1UI.fileBox)?.replaceChildren();
        },
        "Tab2ST.dataset.availableDatasets": datasets => {
          NewDOM.multiSelectDropdown(datasets, Tab2UI.datasetBox, "Tab2.toggleDataset", "Tab2.toggleAllDataset");
        },
        "Tab2ST.dataset.filter": vals => {
          NewDOM.updateMultiSelectSummary(Tab2UI.datasetBox, vals);
        },
        "Tab2ST.preview.modeMap": vals => {
          // UIチェックボックスの描画同期
          const optionsBox = document.getElementById(`popover-${Tab2UI.previewModeBox}`);
          if (optionsBox) {
            optionsBox.querySelectorAll('.dataset-cb').forEach(cb => {
              cb.checked = Array.isArray(vals) && vals.includes(cb.value);
            });
            const allCb = optionsBox.querySelector('.select-all input[type="checkbox"]');
            if (allCb) {
              const itemCbs = [...optionsBox.querySelectorAll('.dataset-cb')];
              allCb.checked = itemCbs.length > 0 && itemCbs.every(cb => cb.checked);
            }
          }
          NewDOM.updateMultiSelectSummary(Tab2UI.previewModeBox, vals);
        },
        "Tab2ST.preview.itemMap": vals => {
          NewDOM.updateMultiSelectSummary(Tab2UI.previewItemBox, vals);
        },
        "Tab2ST.dataset.basePXRF": () => {
          this.#renderSymbols();
          this.#renderItems();
        },
        "Tab2ST.symbol.baseKey": () => this.#renderSymbols(),
        "Tab1ST.file.isMapError": flags => {
          NewDOM.inputs(Tab1UI.fileBox, flags);
          if (State.get("Tab1ST.phase") === TAB1_PHASE.LOAD) UIPhase.updateTab1PhaseUI(TAB1_PHASE.LOAD);
        },
        "Tab1ST.exac.isMapError": flags => {
          NewDOM.inputs(Tab1UI.exacBox, flags);
          if (State.get("Tab1ST.phase") === TAB1_PHASE.VALID) UIPhase.updateTab1PhaseUI(TAB1_PHASE.VALID);
        },
        "Tab2ST.preview.statsData": stats => NewDOM.statsTable(stats),
        "Tab1ST.phase": v => UIPhase.updateTab1PhaseUI(v),
        "Tab2ST.phase": v => {
          UIPhase.updateTab2PhaseUI(v);
          // 要素のID指定を変更
          if (v < TAB2_PHASE.PREVIEWED) DOM.get('ob-cal-plot-el')?.clear();
        },
        // --- 描画データのDI注入 (カスタム要素へ) ---
        "Tab2ST.preview.previewData": data => {
          const stats = State.get("Tab2ST.preview.statsData");
          const symbol = State.get("Tab2ST.symbol");
          // 要素のID指定を変更
          let chartEl = DOM.get('ob-cal-plot-el');
          // 未生成の場合はコンテナ内に初期化
          if (!chartEl) {
            // 生成するタグ名と付与するIDを変更
            chartEl = document.createElement('ob-cal-plot');
            chartEl.id = 'ob-cal-plot-el';
            DOM.get(Tab2UI.previewChartBox).replaceChildren(chartEl);
          }
          // プロパティへの代入で内部の再描画をトリガー
          chartEl.drawData = { previewData: data, statsData: stats, symbolData: symbol };
        }
      };
      Object.entries(stateMap).forEach(([path, cb]) => State.subscribe(path, cb));
    }
    // シンボル設定動的リセット
    #renderSymbols() {
      const baseData = State.get("Tab2ST.dataset.basePXRF");
      const baseKey = State.get("Tab2ST.symbol.baseKey");
      if (!baseData || !baseData.length) {
        DOM.get(Tab2UI.symbolBox)?.replaceChildren();
        return;
      }
      const values = [...new Set(baseData.map(d => d[baseKey]).filter(Boolean))];
      NewDOM.symbolRows(values, Tab2UI.symbolBox, "Tab2.updateSymbol");
    }
    // --- Item選択ドロップダウン生成 ---
    #renderItems() {
      const baseData = State.get("Tab2ST.dataset.basePXRF");
      if (!baseData?.length) {
        DOM.get(Tab2UI.previewItemBox)?.replaceChildren();
        return;
      }
      const items = [...new Set(baseData.map(d => d.item ?? d.Item).filter(Boolean))];
      NewDOM.multiSelectDropdown(items, Tab2UI.previewItemBox, "Tab2.togglePreviewItem", "Tab2.toggleAllPreviewItem");
      State.set("Tab2ST.preview.itemMap", items);
    }
  }

  const UIState = new UIStateUpdater();
</script>
