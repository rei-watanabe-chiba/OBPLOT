<!-- View.html -->
<script>
  // --- UI utilities ---
  class DOM {
    // --- 共通：DOM取得 ---
    static get(id) { return document.getElementById(id); }
    // --- 共通：DOMテキスト ---
    static setDOM(id, text) { if (text !== undefined && this.get(id)) this.get(id).innerText = text; }
    // --- 共通：DOM表示切替 (非表示<=>表示 固定化対応) ---
    static toggle(id, isShow) { if (this.get(id)) this.get(id).style.display = isShow ? "" : "none"; }
    // --- 共通：コンテナ開閉 (details専用) ---
    static open(id, isOpen) { if (this.get(id)?.tagName === "DETAILS") setTimeout(() => { this.get(id).open = isOpen; }, 200); }
    // --- 共通：無効/有効切替 ---
    static setDisabled(id, isDisabled) { if (this.get(id)) this.get(id).disabled = isDisabled; }
    // --- 共通：カスタム属性付与/削除 ---
    static setAttribute(id, attr, value) { value ? this.get(id)?.setAttribute(attr, value) : this.get(id)?.removeAttribute(attr); }
  }

  // --- UI更新・生成処理群 ---
  class UIController {
    // --- 共通：ステータスバー更新 ---
    static loadingStatsBar(id, status = null) {
      const el = DOM.get(id);
      if (!el) return;
      if (!status || status.length === 0) {
        el.dataset.status = "hidden";
        el.innerText = "";
        return;
      }
      el.dataset.status = status[0];
      el.innerText = status[1];
    }

    // --- 共通：HTML5ネイティブ ダイアログ生成 ---
    static confirm(title, msg, barObj = null) {
      const prefix = String(barObj).split("StatusBar")[0];
      const saveStatus = State.get(`Tab1ST.${prefix}.status`);
      if(barObj) this.loadingStatsBar(barObj, ["loading", "実行中..."]);
      // ダイアログ生成
      return new Promise((resolve) => {
        const dialog = DOM.get("universalConfirm");
        DOM.setDOM("uDialogTitle", title);
        DOM.setDOM("uDialogMessage", msg);
        dialog.showModal(); 
        const confirmBtn = DOM.get("uDialogConfirmBtn");
        const cancelBtn = DOM.get("uDialogCancelBtn");
        // ボタン処理
        confirmBtn.onclick = () => { dialog.close(); resolve(true); };
        cancelBtn.onclick = () => {
          dialog.close();
          if(barObj) this.loadingStatsBar(barObj, saveStatus);
          resolve(false);
        };
      });
    }

    // --- 共通：テンプレートリスト生成 ---
    static #renderTemplateList(templateId, items, containerId, mapper) {
      const container = DOM.get(containerId);
      const template = DOM.get(templateId);
      if (!container || !template || !items?.length) return;
      container.replaceChildren(
        items.reduce((frag, item, index) => {
          frag.appendChild(mapper(template.content.cloneNode(true), item, index));
          return frag;
        }, document.createDocumentFragment())
      );
    }

    // --- 共通：列選択動的生成 ---
    static renderSelectors(arr, objID, fields, hasEmpty = true) {
      this.#renderTemplateList("selectorTemplate", fields, objID, (clone, field) => {
        clone.querySelector(".field-label").firstChild.nodeValue = `${field.label} `;
        const select = clone.querySelector("select");
        select.dataset.field = field.key;
        if (!hasEmpty) select.querySelector(".empty-opt")?.remove();
        select.append(...arr.map(h => new Option(h, h)));
        return clone;
      });
    }

    // --- 共通：チェックボックス群動的生成 ---
    static renderCheckboxes(arr, objID) {
      const container = DOM.get(objID);
      if (!container) return;
      if (!arr?.length) {
        container.innerHTML = '<div class="txt-btninfo">データがありません</div>';
        return;
      }
      this.#renderTemplateList("checkboxTemplate", arr, objID, (clone, item) => {
        clone.querySelector("input").value = item;
        clone.querySelector(".cb-text").textContent = item;
        return clone;
      });
    }

    // --- 共通：シンボル設定行生成 ---
    static renderSymbolRows(values, objID, rawNum) {
      const shapes = ['circle', 'triangle', 'square'];
      const colors = [
        { val: 'var(--main-blue)', label: 'Blue' }, { val: 'var(--main-green)', label: 'Green' },
        { val: 'var(--main-red)', label: 'Red' }, { val: '#fbbc04', label: 'Yellow' },
        { val: 'var(--grey600)', label: 'Gray' }
      ];
      this.#renderTemplateList("symbolRowTemplate", Array.from({ length: rawNum }), objID, (clone, _, i) => {
        clone.querySelectorAll("select").forEach(s => s.dataset.symbolIdx = i);
        clone.querySelector('[data-symbol-type="target"]').append(...values.map(v => new Option(v, v)));
        clone.querySelector('[data-symbol-type="shape"]').append(...shapes.map(s => new Option(s, s)));
        clone.querySelector('[data-symbol-type="color"]').append(...colors.map(c => new Option(c.label, c.val)));
        return clone;
      });
    }

    // --- 共通：セレクタスタイル更新 ---
    static updateInputs(mapBoxId, errorFlags) {
      const mapBox = DOM.get(mapBoxId);
      mapBox?.querySelectorAll('select, input').forEach((s, idx) => {
        s.classList.toggle('has-error', !!errorFlags?.[idx]);
      });
    }
  }

  // --- フェーズ連動UI制御 ---
  class UIPhase {
    // --- Phase状態一括反映ヘルパー ---
    static #applyRules(rules) {
      Object.entries(rules).forEach(([id, r]) => {
        if (r.show !== undefined) DOM.toggle(id, r.show);
        if (r.disabled !== undefined) DOM.setDisabled(id, r.disabled);
        if (r.open !== undefined) DOM.open(id, r.open);
        if (r.text !== undefined) DOM.setDOM(id, r.text);
        if (r.className !== undefined && DOM.get(id)) DOM.get(id).className = r.className;
        if (id.includes('Section')) {
          DOM.setAttribute(id, "data-state", r.open ? "active" : null);
          DOM.setAttribute(id, "data-type", r.disabled ? "disabled" : null);
        }
      });
    }

    // --- Tab1 フェーズ連動UI更新 ---
    static updateTab1PhaseUI(phase) {
      const fileErr = State.get("Tab1ST.file.isMapError").some(Boolean);
      const exacErr = State.get("Tab1ST.exac.isMapError").some(Boolean);
      // UIルールマップ定義 
      const rules = {
        [Tab1UI.fileLoadBtn]:   { text: phase <= TAB1_PHASE.READY.val ? "データを取得" : "データを再取得", disabled: false },
        [Tab1UI.fileMakeBtn]:   { disabled: phase < TAB1_PHASE.READY.val },
        [Tab1UI.fileValdBtn]:   { disabled: phase < TAB1_PHASE.INVALID.val || fileErr, className: phase === TAB1_PHASE.INVALID.val ? "" : "outline" },
        [Tab1UI.fileArea]:      { show: phase >= TAB1_PHASE.LOAD.val },
        [Tab1UI.fileBtnBox]:    { show: phase >= TAB1_PHASE.LOAD.val },
        [Tab1UI.exacArea]:      { show: phase >= TAB1_PHASE.VALID.val },
        [Tab1UI.exacBar]:       { show: phase >= TAB1_PHASE.VALID.val },
        [Tab1UI.exacBtn]:       { disabled: phase < TAB1_PHASE.VALID.val || exacErr },
        [Tab1UI.exacPushBtn]:   { show: phase >= TAB1_PHASE.EXTRACT.val, disabled: phase < TAB1_PHASE.EXTRACT.val },
        [Tab1UI.configSection]: { open: phase === TAB1_PHASE.INIT.val, disabled: false },
        [Tab1UI.fileSection]:   { open: phase >= TAB1_PHASE.READY.val && phase < TAB1_PHASE.VALID.val, disabled: phase < TAB1_PHASE.READY.val },
        [Tab1UI.exacSection]:   { open: phase >= TAB1_PHASE.VALID.val && phase < TAB1_PHASE.OUTPUT.val, disabled: phase < TAB1_PHASE.VALID.val }
      };
      this.#applyRules(rules);
      if (phase === TAB1_PHASE.VALID.val) {
        State.set("Tab1ST.exac.cachedStatus", ["hidden", ""]);
      } else if (phase === TAB1_PHASE.EXTRACT.val) {
        State.set("Tab1ST.exac.cachedStatus", State.get("Tab1ST.exac.status"));
      }
    }

    // --- Tab2 フェーズ連動UI更新 ---
    static updateTab2PhaseUI(phase) {
      const isLoaded = phase >= TAB2_PHASE.LOADED.val;
      const isFiltered = phase >= TAB2_PHASE.FILTERED.val;
      const isMapped = phase >= TAB2_PHASE.MAPPED.val;
      // UIルールマップ定義
      const rules = {
        [Tab2UI.datasetLoadBtn]:   { disabled: false },
        [Tab2UI.datasetfilterBtn]: { disabled: !isLoaded },
        [Tab2UI.datasetArea]:      { show: isLoaded },
        [Tab2UI.symbolArea]:       { show: isFiltered },
        [Tab2UI.symbolAxis]:       { disabled: !isFiltered },
        [Tab2UI.symbolBtn]:        { disabled: !isFiltered },
        [Tab2UI.datasetSection]:   { open: !isFiltered, disabled: false },
        [Tab2UI.symbolSection]:    { open: isFiltered && !isMapped, disabled: !isFiltered },
        [Tab2UI.reportSection]:    { open: isMapped, disabled: !isMapped }
      };
      this.#applyRules(rules);
      // マッピング行の生成 (FILTERED突入時のみ)
      if (phase === TAB2_PHASE.FILTERED.val) {
        const baseData = State.get("Tab2ST.basePXRF") ?? [];
        const baseKey = State.get("Tab2ST.symbol.baseKey");
        UIController.renderSymbolRows([...new Set(baseData.map(d => d[baseKey]).filter(Boolean))], Tab2UI.symbolBox, 5);
      }
    }
  }

  // --- UI更新 - state同期 ---
  class UIStateUpdater {
    // --- 状態マッピングと購読 ---
    constructor() {
      const stateMap = {
        "GLB.isLocked": (v) => DOM.setDisabled(Tab1UI.tabSet, v),
        "Tab1ST.config.status": (v) => UIController.loadingStatsBar(Tab1UI.configBar, v),
        "Tab1ST.file.status": (v) => UIController.loadingStatsBar(Tab1UI.fileBar, v),
        "Tab1ST.exac.status": (v) => UIController.loadingStatsBar(Tab1UI.exacBar, v),
        "Tab2ST.datasetload.status": (v) => UIController.loadingStatsBar(Tab2UI.datasetloadBar, v),
        "Tab2ST.repoStatus": (v) => UIController.loadingStatsBar(Tab2UI.repoBar, v),
        "Tab1ST.phase": (v) => UIPhase.updateTab1PhaseUI(v),
        "Tab2ST.phase": (v) => UIPhase.updateTab2PhaseUI(v),
        "Tab1ST.file.isMapError": (flags) => {
          UIController.updateInputs(Tab1UI.fileBox, flags);
          if (State.get("Tab1ST.phase") === TAB1_PHASE.LOAD.val) UIPhase.updateTab1PhaseUI(TAB1_PHASE.LOAD.val);
        },
        "Tab1ST.exac.isMapError": (flags) => {
          UIController.updateInputs(Tab1UI.exacBox, flags);
          if (State.get("Tab1ST.phase") === TAB1_PHASE.VALID.val) UIPhase.updateTab1PhaseUI(TAB1_PHASE.VALID.val);
        },
        "Tab2ST.symbol.baseKey": (key) => {
          const baseData = State.get("Tab2ST.basePXRF") ?? [];
          UIController.renderSymbolRows([...new Set(baseData.map(d => d[key]).filter(Boolean))], Tab2UI.symbolBox, 5);
        }
      };
      Object.entries(stateMap).forEach(([path, callback]) => State.subscribe(path, callback));
    }
  }

  // --- 初期化と短縮 ---
  const UI = UIController;
  const UIState = new UIStateUpdater();
</script>
