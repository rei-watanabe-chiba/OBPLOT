<script>
  // --- LocalStorage ---
  class DashBU {
    static K = "OBP_DASH_BU";
    static save(refs) { localStorage.setItem(this.K, JSON.stringify(refs)); }
    static load() { try { return JSON.parse(localStorage.getItem(this.K)); } catch(e){ return null; } }
    static clear() { localStorage.removeItem(this.K); }
  }

  const DASH_BU_KEY = "OBP_DASH_BU";

  // --- 初期値 ---
  const getInitRawGph = () => {
    const fts = (GLB.defaultGraphStyle.font || "").split(',').map(s => s.trim().replace(/['"]/g, ''));
    return {
      fontEng: GLB.fontEngList.find(f => f.includes(fts[0])) || GLB.fontEngList[0],
      fontJp: GLB.fontJpList.find(f => f.includes(fts[1])) || GLB.fontJpList[0],
      s_title: 12, s_name: 8.5, s_tick: 7.5, s_stats: 8.5, c_base: 60, c_stats: 60, 
      sym_size: 4.5, sym_bw: 0.8, lw_axis: 0.6, c_axis: 40, lw_grid: 0.2, c_grid: 10,
      lw_reg: 0.5, g_name: 4, g_tick: 4, p_t: 0, p_b: 0, p_l: 0, p_r: 0
    };
  };
  const getDefPnl = () => ({ graphType: "calibration", calibVal: "", discrXVal: "", discrYVal: "", title: "", xLabel: "WDXRF", yLabel: "pXRF" });

  // ==========================================
  // ReportApp
  // ==========================================
  class ReportApp {
    static state = {
      data: window.__INJECTED_DATA__ || { pxrfDT: [], wdxrfDT: [], corrDT: [] },
      refs: {
        correction: "new", useCal: false, useLOD: false, calElms: [...GLB.valElms], 
        filters: { db: [], item: [], group: [] }, gridRows: 1, gridCols: 1, panelGap: 4,
        margins: { top: 15, bottom: 15, left: 15, right: 15 },
        activePanelId: "p_0",
        symb: { baseKey: GLB.symbBaseKey, rls: [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }] },
        rawGph: getInitRawGph(),
        panels: [{ id: "p_0", ...getDefPnl() }]
      }
    };
    
    static oldSymbAxis = GLB.symbBaseKey; 

    // --- 初期化 ---
    static async init() {
      if (window.__IS_PRINT_TAB__) {
         this.state = window.__PRINT_STATE__;
         document.body.classList.add('is-print'); 
         const loading = document.createElement('div');
         loading.className = 'print-loading'; loading.textContent = '印刷用PDF生成中...';
         document.body.appendChild(loading);
         this.render(); return;
      }
      const buStr = StorageAPI.load(DASH_BU_KEY);
      let bu = null;
      if (buStr) try { bu = JSON.parse(buStr); } catch(e) {}
      
      const pxrf = this.state.data.pxrfDT || [];
      const exVals = (key) => {
        const vals = [...new Set(pxrf.map(r => (r[key] == null) ? "" : String(r[key]).trim()).filter(v => v !== ""))];
        return vals.length > 0 ? vals : null; 
      };
      
      const optsDB = exVals(GLB.idx.key1);
      const optsItem = exVals(GLB.idx.p1);
      const optsGroup = exVals(GLB.idx.wd1);
      const initFltr = (buVal, opts) => Array.isArray(buVal) ? buVal.map(String) : opts;

      if (bu && await NewDOM.confirm("復元", "前回のダッシュボード状態を復元しますか？")) {
        bu.rawGph = { ...getInitRawGph(), ...(bu.rawGph || {}) };
        if(!bu.symb) bu.symb = this.state.refs.symb;
        if(bu.panelGap === undefined || bu.panelGap === 16 || bu.panelGap === 12) bu.panelGap = 4;
        if(!bu.calElms || bu.calElms.length === 0) bu.calElms = [...GLB.valElms]; 
        
        if(!bu.filters || Array.isArray(bu.filters)) {
          bu.filters = { db: optsDB, item: optsItem, group: optsGroup };
        } else {
          bu.filters.db = initFltr(bu.filters.db, optsDB);
          bu.filters.item = initFltr(bu.filters.item, optsItem);
          bu.filters.group = initFltr(bu.filters.group, optsGroup);
        }
        
        if(bu.useLOD === undefined) bu.useLOD = false;
        bu.panels = (bu.panels || []).map(p => ({ ...getDefPnl(), ...p }));
        this.state.refs = bu;
      } else { 
        StorageAPI.clear(DASH_BU_KEY);
        this.state.refs.filters = { db: optsDB, item: optsItem, group: optsGroup };
      }
      this.oldSymbAxis = this.state.refs.symb.baseKey;

      const mSchema = REPORT_SCHEMA.multiSelects;
      mSchema.find(m => m.id === "boxFilterDB").opts = optsDB;
      mSchema.find(m => m.id === "boxFilterItem").opts = optsItem;
      mSchema.find(m => m.id === "boxFilterGroup").opts = optsGroup;
      const setLbl = (id, text) => { const e = document.getElementById(id); if(e) e.textContent = text; };
      setLbl("lblFilterDB", GLB.idx.key1); setLbl("lblFilterItem", GLB.idx.p1); setLbl("lblFilterGroup", GLB.idx.wd1);
      
      this.syncPanels();

      const stateProvider = {
        get: (path) => {
          if (path === 'data') return this.state.data;
          if (path.startsWith('activePanel.')) return this.activePanel?.[path.split('.')[1]] ?? "";
          return path.split('.').reduce((o, i) => o?.[i], this.state.refs);
        },
        set: (path, val) => {
          if (path.startsWith('activePanel.')) {
            if (this.activePanel) this.activePanel[path.split('.')[1]] = val;
            if (['activePanel.graphType', 'activePanel.calibVal', 'activePanel.discrXVal', 'activePanel.discrYVal'].includes(path)) {
              this.updatePanelLabels();
            }
          } else {
            const keys = path.split('.'), last = keys.pop();
            keys.reduce((o, i) => o[i], this.state.refs)[last] = val;
          }
        },
        save: (isQueue) => isQueue ? this.queueSave() : this.saveState()
      };

      const actionRouter = {
        execute: (btn, action) => {
          if (typeof ReportApp[action] === 'function') ReportApp[action](btn);
        },
        executeHook: async (hook, target) => {
          if (hook === 'checkSymbAxis') {
            if (await NewDOM.confirm("確認", "リセットしますか？")) {
               stateProvider.set('symb.baseKey', target.value);
               this.state.refs.symb.rls = [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }];
               this.oldSymbAxis = target.value; 
               this.renderSymbTable();
               return true;
            } else { 
               target.value = this.oldSymbAxis; 
               return false; 
            }
          }
          return true;
        }
      };

      this.automator = new CoreUIAutomator(REPORT_SCHEMA, stateProvider, RPT_CFG, actionRouter);
      this.automator.build();
      this.automator.bindEvents('dashSidebar');
      
      this.renderSymbTable();
      this.render();
      window.addEventListener('resize', () => {
         clearTimeout(this.resizeTimer);
         this.resizeTimer = setTimeout(() => {
             this.fitA4Scale();
             const gph = this.buildGph();
             this.calcPanelSize(gph);
             const grid = document.getElementById('dashGrid');
             const plots = grid.querySelectorAll('ob-cal-plot');
             this.state.refs.panels.forEach((p, i) => { if (plots[i]) this.drawChart(p, plots[i], gph, i); });
         }, 100);
      });
    }

    static updatePanelLabels() {
      const ap = this.activePanel;
      if (!ap) return;
      if (ap.graphType === 'calibration') {
        ap.title = ap.calibVal || ""; ap.xLabel = "WDXRF"; ap.yLabel = "pXRF";
      } else if (ap.graphType === 'discrimination') {
        const xV = ap.discrXVal || "", yV = ap.discrYVal || "";
        ap.title = (xV || yV) ? `${xV} vs ${yV}` : ""; 
        ap.xLabel = xV; ap.yLabel = yV;
      }
      const sInp = (k, v) => { const el = document.querySelector(`[data-bind="activePanel.${k}"]`); if(el) el.value = v; };
      sInp("title", ap.title); sInp("xLabel", ap.xLabel); sInp("yLabel", ap.yLabel);
      document.getElementById('panelConfigSec').dataset.graphtype = ap.graphType;
    }

    static switchTab(btn) {
      const tId = btn.dataset.tab;
      document.querySelectorAll('.tab-icon').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.sidebar-tab-pane').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tId).classList.add('active');
    }
    static switchSub(btn) {
      const tId = btn.dataset.target;
      document.querySelectorAll('.segment-btn').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.sub-pane').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tId).classList.add('active');
    }
    static printPDF() {
      const r = this.state.refs, d = this.state.data;
      const preCalc = r.panels.map(p => {
        if (!d.pxrfDT?.length) return { prevDT: [], statsDT: null };
        const conf = { useCal: r.useCal, calElms: r.calElms, correction: r.correction, corrDT: d.corrDT, useLOD: r.useLOD, filters: r.filters, graphType: p.graphType, calibVal: p.calibVal, discrXVal: p.discrXVal, discrYVal: p.discrYVal };
        return Mtd.T3.mgmPrev.generateChartData(d.pxrfDT, d.wdxrfDT, conf);
      });
      if (!preCalc.some(res => res.prevDT?.length > 0)) return NewDOM.toast("警告", "有効なグラフが一つもありません。\n指標設定やデータを確認してください。");
      const safeState = JSON.stringify(this.state).replace(/</g, '\\u003c').replace(/>/g, '\\u003e');
      const safePreCalc = JSON.stringify(preCalc).replace(/</g, '\\u003c').replace(/>/g, '\\u003e');
      const htmlStr = document.documentElement.outerHTML.replace('<head>', `<head><script>window.__IS_PRINT_TAB__=true; window.__PRINT_STATE__=${safeState}; window.__PRECALC_DATA__=${safePreCalc};<\/script>`);
      window.open(URL.createObjectURL(new Blob(['<!DOCTYPE html>' + htmlStr], { type: 'text/html' })), '_blank');
    }
    static resetSymb() { this.state.refs.symb.rls = [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }]; this.renderSymbTable(); this.saveState(); }
    static addSymb() { 
      this.state.refs.symb.rls = [...this.state.refs.symb.rls, { key: `rule_${Date.now()}`, target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }]; 
      this.renderSymbTable(); this.saveState(); 
    }
    static removeSymb(btn) { 
      this.state.refs.symb.rls = this.state.refs.symb.rls.filter(rw => rw.key !== btn.dataset.ruleKey); 
      this.renderSymbTable(); this.saveState(); 
    }
    static renewSymb(btn) {
      const { symbolIdx: i, symbolType: t } = btn.dataset;
      if (i != null && t && this.state.refs.symb.rls[i]) { 
        const newSym = JSON.parse(JSON.stringify(this.state.refs.symb.rls));
        newSym[i][t] = btn.value; 
        this.state.refs.symb.rls = newSym;
        this.renderSymbTable(); this.saveState(); 
      }
    }
    static saveState() { if (window.__IS_PRINT_TAB__) return; this.syncPanels(); StorageAPI.save(DASH_BU_KEY, JSON.stringify(this.state.refs)); this.render(); }
    static queueSave() { clearTimeout(this.gphTimer); this.gphTimer = setTimeout(() => this.saveState(), 100); }
    static get activePanel() { return this.state.refs.panels.find(p => p.id === this.state.refs.activePanelId); }
    static syncPanels() {
      const { gridRows, gridCols } = this.state.refs;
      const activeIds = [];
      for (let r = 0; r < gridRows; r++) for (let c = 0; c < gridCols; c++) activeIds.push(`p_${r * 3 + c}`);
      activeIds.forEach(id => { if (!this.state.refs.panels.find(p => p.id === id)) this.state.refs.panels.push({ id, ...getDefPnl() }); });
      this.state.refs.panels = activeIds.map(id => this.state.refs.panels.find(p => p.id === id));
      if (!this.state.refs.panels.find(p => p.id === this.state.refs.activePanelId)) this.state.refs.activePanelId = this.state.refs.panels[0]?.id || "p_0";
    }
    static fitA4Scale() {
      if (window.__IS_PRINT_TAB__) return;
      const main = document.querySelector('.dash-main'), a4 = document.getElementById('a4Container');
      a4.style.transform = 'none';
      const scale = Math.min((main.clientWidth - 48) / a4.offsetWidth, (main.clientHeight - 48) / a4.offsetHeight, 1);
      a4.style.transform = `scale(${scale})`;
      a4.style.marginBottom = `-${a4.offsetHeight * (1 - scale)}px`;
    }
    static buildGph() {
      const raw = this.state.refs.rawGph;
      const pt2px = pt => Number(pt) * 1.33;
      const mm2px = mm => Number(mm) * 3.78; 
      const [s_title, s_stats, sym_base, lw_reg, s_tick, s_name, g_name, g_tick, sym_bw, lw_axis, lw_grid] = 
        [raw.s_title, raw.s_stats, raw.sym_size, raw.lw_reg, raw.s_tick, raw.s_name, raw.g_name, raw.g_tick, raw.sym_bw, raw.lw_axis, raw.lw_grid].map(pt2px);
      const [p_t, p_b, p_l, p_r] = [raw.p_t, raw.p_b, raw.p_l, raw.p_r].map(mm2px);
      let finalPadT = p_t;
      let finalPadR = p_r;
      if (p_r < s_tick) finalPadR = p_r + s_tick;
      return {
        style: {
          font: `${raw.fontEng}, ${raw.fontJp}, sans-serif`, fontS: { title: s_title, tick: s_tick, name: s_name, stats: s_stats, tip: s_stats },
          fontC: { base: `hsl(0, 0%, ${100 - raw.c_base}%)`, stats: `hsl(0, 0%, ${100 - raw.c_stats}%)`, tip: 'var(--text-main)' },
          symbol: { baseSize: sym_base, pathSize: sym_base * 1.2, borderW: sym_bw },
          lineW: { axis: lw_axis, grid: lw_grid, regW: lw_reg, regD: Number(raw.lw_reg) <= 0.4 ? [3,3] : [5,5] },
          lineC: { axis: `hsl(0, 0%, ${100 - raw.c_axis}%)`, grid: `hsl(0, 0%, ${100 - raw.c_grid}%)`, reg: `hsl(0, 0%, ${100 - raw.c_base}%)` },
          bgPlot: 'transparent', bgOuter: 'transparent', bgTip: 'rgba(255,255,255,0.95)'
        },
        gap: { name: g_name, tick: g_tick, padT: finalPadT, padB: p_b, padL: p_l, padR: finalPadR }
      };
    }
    static renderSymbTable() {
      const d = this.state.data, r = this.state.refs, symbElm = document.getElementById('tblSymb');
      if (!symbElm || !d.pxrfDT?.length) return;
      const vals = [...new Set(d.pxrfDT.map(pt => pt[r.symb.baseKey]).filter(Boolean))];
      symbElm.src = { rls: r.symb.rls, optsConf: { target: [{ val: "", label: RPT_CFG.lbl.unsel }, ...vals.map(v => ({ val: v, label: v }))], shp: GLB.symbShapes, clr: GLB.symbColors }, actsConf: { add: "addSymb", remove: "removeSymb", update: "renewSymb"} };
    }
    static calcPanelSize(gph) {
      const grid = document.getElementById('dashGrid'), r = this.state.refs;
      grid.style.removeProperty('--panel-w'); grid.style.removeProperty('--panel-h');
      const gw = grid.clientWidth, gh = grid.clientHeight;
      if (gw === 0 || gh === 0) return;
      const gapPx = (r.panelGap !== undefined ? Number(r.panelGap) : 4) * 3.78;
      const maxW = (gw - (r.gridCols - 1) * gapPx) / r.gridCols, maxH = (gh - (r.gridRows - 1) * gapPx) / r.gridRows;
      const style = gph.style;
      const gap = gph.gap;
      const charWidth = style.fontS.tick * 0.6;
      const overY = (4 * charWidth) / 2;
      const overX = (2 * charWidth) / 2;
      const titleSizePx = (r.rawGph.s_title || 12) * 1.33;
      let hasTitle = r.panels.some(p => p.title);
      const requiredPadT = Math.max(style.fontS.tick, hasTitle ? titleSizePx + gap.tick : 0);
      const safePadT = gap.padT < requiredPadT ? gap.padT + requiredPadT : gap.padT;
      const safePadR = gap.padR < style.fontS.tick ? gap.padR + style.fontS.tick : gap.padR;
      const gridTop = safePadT + overY;
      const gridBottom = gap.padB + style.fontS.name + gap.name + style.fontS.tick + gap.tick;
      const gridLeft = gap.padL + overX + style.fontS.name + gap.name + style.fontS.tick + gap.tick;
      const gridRight = safePadR + overX;
      const totalPadX = gridLeft + gridRight;
      const totalPadY = gridTop + gridBottom;
      const plotLen = Math.max(10, Math.min(maxW - totalPadX, maxH - totalPadY));
      grid.style.setProperty('--panel-w', `${plotLen + totalPadX}px`);
      grid.style.setProperty('--panel-h', `${plotLen + totalPadY}px`);
    }
    static render() {
      const r = this.state.refs, cont = document.getElementById('a4Container');
      cont.style.setProperty('--col-count', r.gridCols); cont.style.setProperty('--row-count', r.gridRows);
      cont.style.setProperty('--panel-gap', `${(r.panelGap !== undefined ? Number(r.panelGap) : 4)}mm`);
      ['top','right','bottom','left'].forEach(p => cont.style.setProperty(`--margin-${p}`, `${r.margins[p]}mm`));
      const gph = this.buildGph(), grid = document.getElementById('dashGrid');
      grid.innerHTML = ''; const chartsToDraw = [];
      r.panels.forEach(p => {
        const div = document.createElement('div');
        div.className = `grid-panel ${(!window.__IS_PRINT_TAB__ && p.id === r.activePanelId) ? 'active' : ''}`;
        const chart = document.createElement('ob-cal-plot');
        chart.style.cssText = 'width: 100%; height: 100%;';
        chart.setAttribute('data-renderer', window.__IS_PRINT_TAB__ ? 'svg' : 'canvas');
        div.appendChild(chart); div.onclick = () => { r.activePanelId = p.id; this.saveState(); };
        grid.appendChild(div); chartsToDraw.push({ p, chart });
      });
      requestAnimationFrame(() => {
         this.fitA4Scale(); this.calcPanelSize(gph);
         requestAnimationFrame(() => {
            if (window.__IS_PRINT_TAB__) {
               let finishedCount = 0, printFired = false;
               const executePrint = () => { 
                 if (printFired) return; 
                 printFired = true; 
                 document.querySelectorAll('.grid-panel').forEach(el => el.classList.remove('active'));
                 const loader = document.querySelector('.print-loading');
                 if (loader) loader.style.display = 'none';
                 setTimeout(() => { window.print(); window.close(); }, 500); 
               };
               chartsToDraw.forEach(item => { item.chart.addEventListener('render-finished', () => { finishedCount++; if (finishedCount === chartsToDraw.length) executePrint(); }, { once: true }); });
               setTimeout(executePrint, 5000);
            }
            chartsToDraw.forEach((item, idx) => this.drawChart(item.p, item.chart, gph, idx));
         });
      });
      const ap = this.activePanel;
      if (ap && !window.__IS_PRINT_TAB__) {
        const pSec = document.getElementById('panelConfigSec');
        pSec.style.display = 'block';
        pSec.dataset.graphtype = ap.graphType;
        this.automator.build(); 
        const setVal = (b, v) => { const el = document.querySelector(`[data-bind="activePanel.${b}"]`); if(el) el.value = v || ""; };
        setVal("graphType", ap.graphType); setVal("calibVal", ap.calibVal); setVal("discrXVal", ap.discrXVal); setVal("discrYVal", ap.discrYVal);
        setVal("title", ap.title); setVal("xLabel", ap.xLabel); setVal("yLabel", ap.yLabel);
      } else if (!window.__IS_PRINT_TAB__) { document.getElementById('panelConfigSec').style.display = 'none'; }
    }
    static drawChart(panel, chart, gph, idx) {
      const r = this.state.refs, d = this.state.data;
      if (!d.pxrfDT?.length) return;
      let prevDT, statsDT;
      if (window.__IS_PRINT_TAB__ && window.__PRECALC_DATA__?.[idx]) {
        ({ prevDT, statsDT } = window.__PRECALC_DATA__[idx]);
      } else {
        const conf = { useCal: r.useCal, calElms: r.calElms, correction: r.correction, corrDT: d.corrDT, useLOD: r.useLOD, filters: r.filters, graphType: panel.graphType, calibVal: panel.calibVal, discrXVal: panel.discrXVal, discrYVal: panel.discrYVal };
        ({ prevDT, statsDT } = Mtd.T3.mgmPrev.generateChartData(d.pxrfDT, d.wdxrfDT, conf));
      }
      chart.src = { prevDT, statsDT, symb: r.symb, gph: gph, panel: panel };
    }
  }
  window.addEventListener("DOMContentLoaded", () => ReportApp.init());
</script>
