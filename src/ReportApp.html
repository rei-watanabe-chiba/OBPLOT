<script>
  class DashBU {
    static K = "OBP_DASH_BU";
    static save(refs) { StorageAPI.save(this.K, JSON.stringify(refs)); }
    static load() { try { return JSON.parse(StorageAPI.load(this.K)); } catch(e){ return null; } }
    static clear() { StorageAPI.clear(this.K); }
  }

  const getInitRawGph = () => {
    const fts = (GLB.defaultGraphStyle.font || "").split(',').map(s => s.trim().replace(/['"]/g, ''));
    return {
      fontEng: GLB.fontEngList.find(f => f.includes(fts[0])) || GLB.fontEngList[0],
      fontJp: GLB.fontJpList.find(f => f.includes(fts[1])) || GLB.fontJpList[0],
      s_title: 12, s_name: 8.5, s_tick: 7.5, s_stats: 8.5, c_base: 60, c_stats: 60, 
      sym_size: 4.5, sym_bw: 0.8, lw_axis: 0.6, c_axis: 40, lw_grid: 0.2, c_grid: 10,
      lw_reg: 0.5, g_name: 4, g_tick: 4, p_t: 0, p_b: 0, p_l: 0, p_r: 0
    };
  };
  const getDefPnl = () => ({ graphType: "calibration", calibVal: "", discrXVal: "", discrYVal: "", title: "", xLabel: "WDXRF", yLabel: "pXRF" });

  class ReportApp {
    static oldSymbAxis = GLB.symbBaseKey; 
    static gphTimer = null;
    static resizeTimer = null;

    static async init() {
      if (window.__IS_PRINT_TAB__) {
         State.set(window.__PRINT_STATE__);
         document.body.classList.add('is-print'); 
         const loading = document.createElement('div');
         loading.className = 'print-loading'; loading.textContent = '印刷用PDF生成中...';
         document.body.appendChild(loading);
         
         this.syncPanelDom();
         this.drawCharts(window.__PRECALC_DATA__);
         return;
      }

      CoreAction.initGlobalRouter({ CoreAction, ReportApp });
      ReportApp.automator = new CoreUIAutomator(REPORT_SCHEMA, 'RPTST');
      State.set({"RPTST.ui.activeTab": "tabLayout", "RPTST.ui.activeSub": "subFont"});
      ReportApp.automator.build();

      // 【修正】文字列のままStateに注入されてエラーになるのを防ぐため、厳密にオブジェクト型か判定
      const initDataRaw = window.__INJECTED_DATA__;
      const injData = (typeof initDataRaw === 'object' && initDataRaw !== null) ? initDataRaw : { pxrfDT: [], wdxrfDT: [], corrDT: [] };
      State.set("RPTST.data.raw", injData);

      // 【修正】プロパティ代入ではなくHTML属性として明示的にセットし、ルーター側で正しくブロックさせる
      document.querySelectorAll('input[type="number"], input[type="range"]').forEach(el => {
        const bindPath = el.dataset.bind;
        if (!bindPath) return;
        const cfgKey = Object.keys(RPT_CFG.rng).find(k => bindPath.endsWith(k));
        if (cfgKey && RPT_CFG.rng[cfgKey]) {
          el.setAttribute('min', RPT_CFG.rng[cfgKey].min);
          el.setAttribute('max', RPT_CFG.rng[cfgKey].max);
          el.setAttribute('step', RPT_CFG.rng[cfgKey].step);
        }
      });

      const bu = DashBU.load();
      await this.setupInitialState(bu, injData);

      this.syncPanelDom();
      this.drawCharts();

      State.subscribe(['RPTST.refs.gridRows', 'RPTST.refs.gridCols', 'RPTST.refs.panelGap', 'RPTST.refs.margins'], () => {
          this.syncPanelDom();
          this.queueSave();
      });
      
      State.subscribe(['RPTST.refs.filters', 'RPTST.refs.useCal', 'RPTST.refs.useLOD', 'RPTST.refs.correction', 'RPTST.refs.calElms', 'RPTST.refs.symb', 'RPTST.refs.rawGph', 'RPTST.refs.panels'], () => {
          this.queueRender();
      });

      State.subscribe('RPTST.refs.activePanelId', () => {
          this.updateActivePanelContext();
          this.queueSave();
      });

      State.subscribe('RPTST.refs.symb.baseKey', () => this.updateDerivedSymbState());
      State.subscribe('RPTST.refs.symb.rls', () => this.updateDerivedSymbState());

      window.addEventListener('resize', () => {
         clearTimeout(this.resizeTimer);
         this.resizeTimer = setTimeout(() => {
             this.fitA4Scale();
             const gph = this.buildGph();
             this.calcPanelSize(gph);
             const plots = document.getElementById('dashGrid').querySelectorAll('ob-cal-plot');
             plots.forEach(plot => { plot.src = { ...plot.src, gph: gph }; });
         }, 100);
      });
    }

    static async setupInitialState(bu, d) {
      const pxrf = d.pxrfDT || [];
      const exVals = (key) => {
        const vals = [...new Set(pxrf.map(r => (r[key] == null) ? "" : String(r[key]).trim()).filter(v => v !== ""))];
        return vals.length > 0 ? vals : null; 
      };
      
      const optsDB = exVals(GLB.idx.key1) || [];
      const optsItem = exVals(GLB.idx.p1) || [];
      const optsGroup = exVals(GLB.idx.wd1) || [];
      const initFltr = (buVal, opts) => Array.isArray(buVal) ? buVal.map(String) : opts;

      let refs = State.get("RPTST.refs");
      if (bu && await CoreAction.confirm("復元", "前回のダッシュボード状態を復元しますか？")) {
        bu.rawGph = { ...getInitRawGph(), ...(bu.rawGph || {}) };
        if (!bu.symb) bu.symb = refs.symb;
        if (bu.panelGap === undefined || bu.panelGap === 16 || bu.panelGap === 12) bu.panelGap = 4;
        if (!bu.calElms || bu.calElms.length === 0) bu.calElms = [...GLB.valElms]; 
        if (!bu.filters || Array.isArray(bu.filters)) bu.filters = { db: optsDB, item: optsItem, group: optsGroup };
        else {
          bu.filters.db = initFltr(bu.filters.db, optsDB);
          bu.filters.item = initFltr(bu.filters.item, optsItem);
          bu.filters.group = initFltr(bu.filters.group, optsGroup);
        }
        if (bu.useLOD === undefined) bu.useLOD = false;
        bu.panels = (bu.panels || []).map(p => ({ ...getDefPnl(), ...p }));
        refs = bu;
      } else { 
        DashBU.clear();
        refs.filters = { db: optsDB, item: optsItem, group: optsGroup };
        // 【修正】新規作成・リセット時にレイアウト用の初期値を明示的に注入し、NaN崩壊を防ぐ
        refs.rawGph = getInitRawGph();
      }
      this.oldSymbAxis = refs.symb.baseKey;
      State.set("RPTST.refs", structuredClone(refs));



      const optsCorr = [{ label: RPT_CFG.lbl.newCorr, val: "new" }, ...(d.corrDT || []).slice(1).filter(r => r[0]).map(r => ({ label: r[0], val: r[0] }))];
      const optValLgc = [...GLB.valElms, ...GLB.valLgc].map(v => ({ label: v, val: v }));

      State.set({
        "RPTST.data.corrFields": [{ type: "select", bind: "RPTST.refs.correction", hasEmpty: false, opts: optsCorr }],
        "RPTST.data.fontEngFields": [{ type: "select", bind: "RPTST.refs.rawGph.fontEng", hasEmpty: false, opts: GLB.fontEngList.map(v => ({label:v, val:v})) }],
        "RPTST.data.fontJpFields": [{ type: "select", bind: "RPTST.refs.rawGph.fontJp", hasEmpty: false, opts: GLB.fontJpList.map(v => ({label:v, val:v})) }],
        "RPTST.data.graphTypeFields": [{ type: "select", bind: "RPTST.data.apGraphType", change: "ReportApp.updateActivePanelRef", hasEmpty: false, opts: [{label: RPT_CFG.lbl.calib, val: "calibration"}, {label: RPT_CFG.lbl.discr, val: "discrimination"}] }],
        "RPTST.data.calibValFields": [{ type: "select", bind: "RPTST.data.apCalibVal", change: "ReportApp.updateActivePanelRef", hasEmpty: true, opts: optValLgc }],
        "RPTST.data.discrXFields": [{ type: "select", bind: "RPTST.data.apDiscrXVal", change: "ReportApp.updateActivePanelRef", hasEmpty: true, opts: optValLgc }],
        "RPTST.data.discrYFields": [{ type: "select", bind: "RPTST.data.apDiscrYVal", change: "ReportApp.updateActivePanelRef", hasEmpty: true, opts: optValLgc }],
        "RPTST.data.axisFields": [{ type: "select", bind: "RPTST.refs.symb.baseKey", change: "ReportApp.checkSymbAxis", hasEmpty: false, opts: GLB.symbAxes }],
        "RPTST.data.filterDBOpts": optsDB, 
        "RPTST.data.filterItemOpts": optsItem, 
        "RPTST.data.filterGroupOpts": optsGroup, 
        "RPTST.data.calElmsOpts": GLB.valElms
      });
      
      this.updateDerivedSymbState();
    }

    static tglMulti(tgt) {
      const cntr = tgt.closest('ob-multi-select');
      if (!cntr) return;
      const bindPath = cntr.dataset.bind;
      const itemCbs = [...cntr.querySelectorAll('.dataset-cb')], allCb = cntr.querySelector('.select-all-cb');
      if (allCb) allCb.checked = itemCbs.length > 0 && itemCbs.every(cb => cb.checked);
      if (bindPath) State.set(bindPath, itemCbs.filter(cb => cb.checked).map(cb => cb.value));
    }

    static tglAllMulti(tgt) {
      const cntr = tgt.closest('ob-multi-select');
      if (!cntr) return;
      const bindPath = cntr.dataset.bind;
      const itemCbs = cntr.querySelectorAll('.dataset-cb');
      itemCbs.forEach(cb => cb.checked = tgt.checked);
      if (bindPath) State.set(bindPath, tgt.checked ? [...itemCbs].map(cb => cb.value) : []);
    }

    static updateActivePanelRef(tgt) {
      const key = tgt.dataset.apKey || tgt.dataset.bind?.split('.').pop().replace('ap', '');
      const apKey = key.charAt(0).toLowerCase() + key.slice(1);
      const val = tgt.value;
      const activeId = State.get("RPTST.refs.activePanelId");
      const panels = State.get("RPTST.refs.panels");
      const panel = panels.find(p => p.id === activeId);
      
      if (panel) {
         panel[apKey] = val;
         if (['graphType', 'calibVal', 'discrXVal', 'discrYVal'].includes(apKey)) {
            if (panel.graphType === 'calibration') {
              panel.title = panel.calibVal || ""; panel.xLabel = "WDXRF"; panel.yLabel = "pXRF";
            } else if (panel.graphType === 'discrimination') {
              const xV = panel.discrXVal || "", yV = panel.discrYVal || "";
              panel.title = (xV || yV) ? `${xV} vs ${yV}` : ""; panel.xLabel = xV; panel.yLabel = yV;
            }
         }
         State.set("RPTST.refs.panels", [...panels]);
         this.updateActivePanelContext();
         this.queueSave();
      }
    }

    static updateActivePanelContext() {
      const activeId = State.get("RPTST.refs.activePanelId");
      const panels = State.get("RPTST.refs.panels") || [];
      const panel = panels.find(p => p.id === activeId);
      
      State.set({
        "RPTST.data.apGraphType": panel?.graphType || "", 
        "RPTST.data.apCalibVal": panel?.calibVal || "", 
        "RPTST.data.apDiscrXVal": panel?.discrXVal || "", 
        "RPTST.data.apDiscrYVal": panel?.discrYVal || "",
        "RPTST.data.apTitle": panel?.title || "", 
        "RPTST.data.apXLabel": panel?.xLabel || "", 
        "RPTST.data.apYLabel": panel?.yLabel || ""
      });
      ReportApp.automator.update();
    }



    static switchTab(btn) {
      State.set("RPTST.ui.activeTab", btn.dataset.tab);
      ReportApp.automator.update();
    }

    static switchSub(btn) {
      State.set("RPTST.ui.activeSub", btn.dataset.target);
      ReportApp.automator.update();
    }

    static printPDF() {
      const r = State.get("RPTST.refs"), d = State.get("RPTST.data.raw");
      const preCalc = r.panels.map(p => {
        if (!d.pxrfDT?.length) return { prevDT: [], statsDT: null };
        const conf = { useCal: r.useCal, calElms: r.calElms, correction: r.correction, corrDT: d.corrDT, useLOD: r.useLOD, filters: r.filters, graphType: p.graphType, calibVal: p.calibVal, discrXVal: p.discrXVal, discrYVal: p.discrYVal };
        return Mtd.T3.mgmPrev.generateChartData(d.pxrfDT, d.wdxrfDT, conf);
      });
      if (!preCalc.some(res => res.prevDT?.length > 0)) return CoreAction.toast("警告", "有効なグラフが一つもありません。\n標準化設定やデータを確認してください。");
      const safeState = JSON.stringify({ RPTST: State.proxy.RPTST }).replace(/</g, '\\u003c').replace(/>/g, '\\u003e');
      const safePreCalc = JSON.stringify(preCalc).replace(/</g, '\\u003c').replace(/>/g, '\\u003e');
      const htmlStr = document.documentElement.outerHTML.replace('<head>', `<head><script>window.__IS_PRINT_TAB__=true; window.__PRINT_STATE__=${safeState}; window.__PRECALC_DATA__=${safePreCalc};<\/script>`);
      window.open(URL.createObjectURL(new Blob(['<!DOCTYPE html>' + htmlStr], { type: 'text/html' })), '_blank');
    }

    static async checkSymbAxis(tgt) {
      const newVal = tgt.value, oldVal = this.oldSymbAxis;
      if (newVal === oldVal) return;
      const isConfirmed = await CoreAction.withAsync(null, { title: "確認", msg: "属性を変更するとシンボル設定がリセットされます。よろしいですか？" }, async () => {
        State.set({ "RPTST.refs.symb.baseKey": newVal, "RPTST.refs.symb.rls": [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }] });
        this.oldSymbAxis = newVal;
        this.queueSave();
        return null;
      });
      if (!isConfirmed) {
        tgt.value = oldVal;
        State.set("RPTST.refs.symb.baseKey", oldVal);
      }
    }

    static resetSymb() { State.set("RPTST.refs.symb.rls", [{ key: "default", target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }]); this.queueSave(); }
    static addSymb() { State.set("RPTST.refs.symb.rls", [...State.get("RPTST.refs.symb.rls"), { key: `rule_${Date.now()}`, target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }]); this.queueSave(); }
    static removeSymb(btn) { State.set("RPTST.refs.symb.rls", State.get("RPTST.refs.symb.rls").filter(rw => rw.key !== btn.dataset.ruleKey)); this.queueSave(); }
    static renewSymb(btn) {
      const i = btn.dataset.symbolIdx, t = btn.dataset.symbolType;
      if (i != null && t) { 
        const newSym = JSON.parse(JSON.stringify(State.get("RPTST.refs.symb.rls")));
        newSym[i][t] = btn.value; 
        State.set("RPTST.refs.symb.rls", newSym);
        this.queueSave(); 
      }
    }

    static updateDerivedSymbState() {
      const d = State.get("RPTST.data.raw"), r = State.get("RPTST.refs");
      if (!d?.pxrfDT?.length) return;
      const vals = [...new Set(d.pxrfDT.map(pt => pt[r.symb.baseKey]).filter(Boolean))];
      State.set("RPTST.data.symbSrc", { rls: r.symb.rls, optsConf: { target: [{ val: "", label: RPT_CFG.lbl.unsel }, ...vals.map(v => ({ val: v, label: v }))], shp: GLB.symbShapes, clr: GLB.symbColors }, actsConf: { add: "ReportApp.addSymb", remove: "ReportApp.removeSymb", update: "ReportApp.renewSymb"} });
    }

    static queueSave() { 
      if (window.__IS_PRINT_TAB__) return;
      clearTimeout(this.gphTimer); 
      this.gphTimer = setTimeout(() => DashBU.save(State.get("RPTST.refs")), 100); 
    }
    
    static queueRender() {
      if (window.__IS_PRINT_TAB__) return;
      clearTimeout(this.renderTimer);
      this.renderTimer = setTimeout(() => this.drawCharts(), 50);
      this.queueSave();
    }

    static syncPanelDom() {
      const r = State.get("RPTST.refs");
      const grid = document.getElementById('dashGrid');
      const reqIds = [];
      for (let i = 0; i < r.gridRows * r.gridCols; i++) reqIds.push(`p_${i}`);
      
      let panels = [...State.get("RPTST.refs.panels")];
      reqIds.forEach(id => { if (!panels.find(p => p.id === id)) panels.push({ id, ...getDefPnl() }); });
      panels = reqIds.map(id => panels.find(p => p.id === id));
      State.set("RPTST.refs.panels", panels);
      
      if (!panels.find(p => p.id === r.activePanelId)) State.set("RPTST.refs.activePanelId", panels[0]?.id || "p_0");

      const existing = Array.from(grid.children);
      const existingIds = existing.map(el => el.dataset.panelId);
      
      existing.forEach(el => { 
        if (!reqIds.includes(el.dataset.panelId)) {
          grid.removeChild(el); 
          const idx = REPORT_SCHEMA.elements.findIndex(e => e.id === el.id);
          if (idx > -1) REPORT_SCHEMA.elements.splice(idx, 1);
        } 
      });
      
      reqIds.forEach(id => {
        if (!existingIds.includes(id)) {
          const div = document.createElement('div');
          div.id = id;
          div.className = 'grid-panel';
          div.dataset.panelId = id;
          div.onclick = () => State.set("RPTST.refs.activePanelId", id);
          const chart = document.createElement('ob-cal-plot');
          chart.style.cssText = 'width: 100%; height: 100%;';
          chart.setAttribute('data-renderer', window.__IS_PRINT_TAB__ ? 'svg' : 'canvas');
          div.appendChild(chart);
          grid.appendChild(div);
        }
        if (!REPORT_SCHEMA.elements.find(e => e.id === id)) {
           REPORT_SCHEMA.elements.push({ 
             id: id, 
             className: () => (!window.__IS_PRINT_TAB__ && State.get("RPTST.refs.activePanelId") === id) ? "grid-panel active" : "grid-panel" 
           });
        }
      });
      
      this.updateActivePanelContext();

      const cont = document.getElementById('a4Container');
      cont.style.setProperty('--col-count', r.gridCols); 
      cont.style.setProperty('--row-count', r.gridRows);
      cont.style.setProperty('--panel-gap', `${(r.panelGap !== undefined ? Number(r.panelGap) : 4)}mm`);
      ['top','right','bottom','left'].forEach(p => cont.style.setProperty(`--margin-${p}`, `${r.margins[p]}mm`));
      
      this.fitA4Scale();
      this.drawCharts();
    }

    static fitA4Scale() {
      if (window.__IS_PRINT_TAB__) return;
      const main = document.querySelector('.dash-main'), a4 = document.getElementById('a4Container');
      a4.style.transform = 'none';
      const scale = Math.min((main.clientWidth - 48) / a4.offsetWidth, (main.clientHeight - 48) / a4.offsetHeight, 1);
      a4.style.transform = `scale(${scale})`;
      a4.style.marginBottom = `-${a4.offsetHeight * (1 - scale)}px`;
    }

    static buildGph() {
      // 【修正】生のStateからフェイルセーフでマージして読み取る
      const raw = { ...getInitRawGph(), ...(State.get("RPTST.refs.rawGph") || {}) };
      const pt2px = pt => Number(pt) * 1.33;
      const mm2px = mm => Number(mm) * 3.78; 
      const [s_title, s_stats, sym_base, lw_reg, s_tick, s_name, g_name, g_tick, sym_bw, lw_axis, lw_grid] = 
        [raw.s_title, raw.s_stats, raw.sym_size, raw.lw_reg, raw.s_tick, raw.s_name, raw.g_name, raw.g_tick, raw.sym_bw, raw.lw_axis, raw.lw_grid].map(pt2px);
      const [p_t, p_b, p_l, p_r] = [raw.p_t, raw.p_b, raw.p_l, raw.p_r].map(mm2px);
      let finalPadR = p_r < s_tick ? p_r + s_tick : p_r;
      return {
        style: {
          font: `${raw.fontEng}, ${raw.fontJp}, sans-serif`, fontS: { title: s_title, tick: s_tick, name: s_name, stats: s_stats, tip: s_stats },
          fontC: { base: `hsl(0, 0%, ${100 - raw.c_base}%)`, stats: `hsl(0, 0%, ${100 - raw.c_stats}%)`, tip: 'var(--text-main)' },
          symbol: { baseSize: sym_base, pathSize: sym_base * 1.2, borderW: sym_bw },
          lineW: { axis: lw_axis, grid: lw_grid, regW: lw_reg, regD: Number(raw.lw_reg) <= 0.4 ? [3,3] : [5,5] },
          lineC: { axis: `hsl(0, 0%, ${100 - raw.c_axis}%)`, grid: `hsl(0, 0%, ${100 - raw.c_grid}%)`, reg: `hsl(0, 0%, ${100 - raw.c_base}%)` },
          bgPlot: 'transparent', bgOuter: 'transparent', bgTip: 'rgba(255,255,255,0.95)'
        },
        gap: { name: g_name, tick: g_tick, padT: p_t, padB: p_b, padL: p_l, padR: finalPadR }
      };
    }

    static calcPanelSize(gph) {
      const grid = document.getElementById('dashGrid'), r = State.get("RPTST.refs");
      grid.style.removeProperty('--panel-w'); grid.style.removeProperty('--panel-h');
      const gw = grid.clientWidth, gh = grid.clientHeight;
      if (gw === 0 || gh === 0) return;
      const gapPx = (r.panelGap !== undefined ? Number(r.panelGap) : 4) * 3.78;
      const maxW = (gw - (r.gridCols - 1) * gapPx) / r.gridCols, maxH = (gh - (r.gridRows - 1) * gapPx) / r.gridRows;
      const style = gph.style, gap = gph.gap;
      const charWidth = style.fontS.tick * 0.6;
      const titleSizePx = (r.rawGph.s_title || 12) * 1.33;
      const requiredPadT = Math.max(style.fontS.tick, r.panels.some(p => p.title) ? titleSizePx + gap.tick : 0);
      const gridTop = (gap.padT < requiredPadT ? gap.padT + requiredPadT : gap.padT) + ((4 * charWidth) / 2);
      const gridBottom = gap.padB + style.fontS.name + gap.name + style.fontS.tick + gap.tick;
      const gridLeft = gap.padL + ((2 * charWidth) / 2) + style.fontS.name + gap.name + style.fontS.tick + gap.tick;
      const gridRight = (gap.padR < style.fontS.tick ? gap.padR + style.fontS.tick : gap.padR) + ((2 * charWidth) / 2);
      const plotLen = Math.max(10, Math.min(maxW - (gridLeft + gridRight), maxH - (gridTop + gridBottom)));
      grid.style.setProperty('--panel-w', `${plotLen + gridLeft + gridRight}px`);
      grid.style.setProperty('--panel-h', `${plotLen + gridTop + gridBottom}px`);
    }

    static drawCharts(preCalcData = null) {
      const gph = this.buildGph();
      this.calcPanelSize(gph);
      const r = State.get("RPTST.refs"), d = State.get("RPTST.data.raw");
      const plots = document.getElementById('dashGrid').querySelectorAll('ob-cal-plot');
      
      const draw = () => {
        r.panels.forEach((p, idx) => {
          if (!plots[idx]) return;
          if (preCalcData?.[idx]) {
            plots[idx].src = { prevDT: preCalcData[idx].prevDT, statsDT: preCalcData[idx].statsDT, symb: r.symb, gph: gph, panel: p };
          } else {
            if (!d?.pxrfDT?.length) return;
            const conf = { useCal: r.useCal, calElms: r.calElms, correction: r.correction, corrDT: d.corrDT, useLOD: r.useLOD, filters: r.filters, graphType: p.graphType, calibVal: p.calibVal, discrXVal: p.discrXVal, discrYVal: p.discrYVal };
            const { prevDT, statsDT } = Mtd.T3.mgmPrev.generateChartData(d.pxrfDT, d.wdxrfDT, conf);
            plots[idx].src = { prevDT, statsDT, symb: r.symb, gph: gph, panel: p };
          }
        });
      };

      if (window.__IS_PRINT_TAB__) {
         let finishedCount = 0, printFired = false;
         const executePrint = () => { 
           if (printFired) return; 
           printFired = true; 
           const loader = document.querySelector('.print-loading');
           if (loader) loader.style.display = 'none';
           setTimeout(() => { window.print(); window.close(); }, 500); 
         };
         plots.forEach(plot => { plot.addEventListener('render-finished', () => { finishedCount++; if (finishedCount === plots.length) executePrint(); }, { once: true }); });
         setTimeout(executePrint, 5000);
         requestAnimationFrame(draw);
      } else {
         requestAnimationFrame(draw);
      }
    }
  }

  window.addEventListener("DOMContentLoaded", () => ReportApp.init());
</script>
