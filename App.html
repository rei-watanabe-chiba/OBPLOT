<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <script src="https://cdn.jsdelivr.net/npm/simple-statistics@7.8.3/dist/simple-statistics.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script>google.charts.load('current', {'packages':['corechart']});</script>
    <!-- src/CSS.html -->
<style>
  /* --- レイヤー定義 --- */
  @layer reset, base, components, utilities;
  /* --- 1. Reset --- */
  @layer reset {
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    fieldset { border: none; }
  }
  /* --- 2. Base --- */
  @layer base {
    :root {
      --unit: 4px;
      --control-height: calc(var(--unit) * 8.5);
      --main-blue: #1A73E8;
      --main-blue-hover: #1F41B6;
      --main-green: #34A853;
      --main-green-hover: #1F843C;
      --main-red: #ea4335;
      --grey50: #ECEFF1;
      --grey200: #B0BEC5;
      --grey400: #78909C;
      --grey600: #546E7A;
      --bg-color: #FFF;
      --bg-color-hover: #F5F5F5;
      --text-main: #202124;
      --transition-speed: 0.2s;
      interpolate-size: allow-keywords;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    body {
      --theme-color: var(--main-blue);
      --theme-hover: var(--main-blue-hover);
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      font-family: 'Roboto', 'Noto Sans JP', sans-serif;
      font-size: 13px;
      color: var(--text-main);
      background-color: var(--bg-color);
      overflow-x: hidden;
      /* user-select: none;*/
    }
    body[data-theme="tab2"] {
      --theme-color: var(--main-green);
      --theme-hover: var(--main-green-hover);
    }
    main {
      padding: calc(var(--unit) * 2) calc(var(--unit) * 3) calc(var(--unit) * 3);
      overflow-x: hidden;
    }
    hr {
      margin: calc(var(--unit) * 3) 0;
      border: none;
      border-top: 1.5px solid var(--grey200);
    }
  }
  /* --- 3. Utilities --- */
  @layer utilities {
    .scroll-y {
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--grey200) transparent;
    }
    .flex-row {
      display: flex;
      align-items: center;
      gap: 0;
    }
    .field-row {
      display: flex;
      align-items: center;
      gap: 0 var(--unit);
      width: 100%;
      margin: calc(var(--unit) * 2) 0;
      & > * {
        flex: 1;
        min-width: 0;
        margin: var(--unit);
      }
    }
    .field-col {
      flex: 1;
      min-width: 0;
    }
    .txt-btninfo {
      margin-left: calc(var(--unit) * 2);
      font-size: 11px;
      color: var(--grey600);
    }
    .badge {
      display: inline-block;
      vertical-align: middle;
      margin-right: var(--unit);
      padding: calc(var(--unit) * 0.5) calc(var(--unit) * 1.5);
      font-size: 12px;
      line-height: 1.2;
      color: var(--text-main);
      background-color: var(--grey50);
      border: 1px solid var(--grey200);
      border-radius: var(--unit);
    }
    .badge-wrapper {
      display: flex;
      align-items: center;
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      mask-image: linear-gradient(to right, black 85%, transparent 100%);
      .badge { flex-shrink: 0; }
    }
    .color-box {
      display: inline-block;
      flex: 0 0 12px;
      height: 12px;
      margin-right: 6px;
      border: 1px solid var(--grey400);
      border-radius: 2px;
    }
  }
  /* --- 4. Components --- */
  @layer components {
    /* --- タブナビ --- */
    .nav-tabs { display: none; }
    .tab-content { display: none; &.active { display: block; } }
    /* --- フォーム --- */
    label {
      display: block;
      margin: var(--unit) calc(var(--unit) * 0.5);
      color: var(--grey600);
    }
    .form-control, input, select {
      box-sizing: border-box;
      height: var(--control-height);
      font-family: inherit;
      font-size: 13px;
      color: var(--text-main);
      background-color: var(--bg-color);
      border: 1px solid var(--grey400);
      border-radius: var(--unit);
      transition: all var(--transition-speed);
      &:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
      &:not(:disabled) {
        cursor: pointer;
        &:hover { filter: brightness(0.95); }
      }
      &:focus {
        outline: none;
        border-color: var(--theme-color);
      }
      &.has-error {
        background-color: color-mix(in srgb, var(--main-red) 10%, #fff);
        border-color: var(--main-red);
      }
    }
    input, select {
      flex: 1;
      width: 100%;
      padding: 0 calc(var(--unit) * 2);
    }
    input[type="text"]:not(:disabled) { cursor: text; }
    /* --- ボタン --- */
    button {
      --btn-bg: transparent;
      --btn-color: var(--text-main);
      --btn-border: transparent;
      flex: 1;
      height: var(--control-height);
      padding: 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--btn-color);
      background-color: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: var(--unit);
      cursor: pointer;
      transition: all var(--transition-speed);
      &:focus { outline: none; }
      &:focus-visible {
        box-shadow: 0 0 6px color-mix(in srgb, var(--theme-color) 70%, transparent);
      }
      &[data-type="primary"] {
        --btn-bg: var(--theme-color);
        --btn-color: #fff;
        --btn-border: var(--theme-color);
        &:not(:disabled):hover {
          --btn-bg: var(--theme-hover);
          --btn-border: var(--theme-hover);
        }
      }
      &.outline {
        --btn-bg: var(--bg-color);
        --btn-border: currentColor;
        &[data-type="primary"] { --btn-color: var(--theme-color); }
        &:not(:disabled):hover { --btn-bg: color-mix(in srgb, currentColor 10%, var(--bg-color);); }
      }
      &:disabled {
        --btn-bg: var(--grey200);
        --btn-color: #fff;
        --btn-border: transparent;
        cursor: not-allowed;
        &.outline {
          --btn-bg: var(--bg-color);
          --btn-color: var(--grey400);
          --btn-border: var(--grey400);
        }
      }
    }
    .icon-btn {
      flex: none;
      width: calc(var(--unit) * 5);
      height: calc(var(--unit) * 5);
      padding: 0;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      line-height: 0.5;
      --btn-color: var(--grey600);
      --btn-border: var(--grey200);
      &:not(:disabled):hover {
        --btn-bg: var(--bg-color-hover);
        --btn-color: var(--theme-color);
        --btn-border: var(--theme-color);
      }
      &:disabled {
        opacity: 0.2;
        --btn-bg: transparent;
        --btn-color: var(--grey400);
        --btn-border: var(--grey400);
      }
    }
    /* --- アコーディオン --- */
    details {
      margin: var(--unit) 0;
      transition: opacity var(--transition-speed);
      &[data-type="disabled"] {
        opacity: 0.5;
        pointer-events: none;
      }
      &[data-state="active"] summary {
        margin-bottom: calc(var(--unit) * 2);
        color: var(--theme-color);
      }
      &[data-state="disabled"] summary { cursor: not-allowed; }
      &::details-content {
        height: 0;
        opacity: 0;
        overflow: clip;
        transition: height 0.4s ease, opacity 0.4s ease, content-visibility 0.4s ease allow-discrete;
      }
      &[open]::details-content {
        height: auto;
        height: calc-size(auto, size);
        opacity: 1;
      }
    }
    summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(var(--unit) * 1.5);
      font-size: 14px;
      font-weight: 600;
      list-style: none;
      color: var(--grey600);
      cursor: pointer;
      transition: color var(--transition-speed);
      &::marker { display: none; }
      &::after {
        display: block;
        width: calc(var(--unit) * 1.5);
        height: calc(var(--unit) * 1.5);
        content: "";
        border-right: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        transform: rotate(45deg);
        transition: transform 0.2s ease;
      }
    }
    details[open] summary::after { transform: rotate(-135deg); }
    details.sub-sec {
      background-color: var(--grey50);
      border: 1px solid var(--grey200);
      border-radius: var(--unit);
      padding: calc(var(--unit) * 2);
      padding-bottom: calc(var(--unit) * 0.5);
      &[open]{ padding-bottom: calc(var(--unit) * 2); }
    }
    details.sub-sec summary {
      font-size: 13px;
      padding: 0;
    }
    /* --- ダイアログ --- */
    dialog {
      width: calc(var(--unit) * 70);
      margin: auto;
      padding: calc(var(--unit) * 5);
      border: none;
      border-radius: calc(var(--unit) * 2);
      h3 {
        margin-bottom: calc(var(--unit) * 3);
        font-size: 16px;
        color: var(--text-main);
      }
      p {
        margin-bottom: calc(var(--unit) * 5);
        line-height: 1.5;
        color: var(--grey600);
      }
      .field-row {
        gap: calc(var(--unit) * 3);
        margin-bottom: 0;
      }
      &::backdrop {
        background-color: color-mix(in srgb, var(--text-main) 30%, transparent);
        backdrop-filter: blur(2px);
      }
    }
    /* --- ステータスバー --- */
    .status-bar {
      --status-color: transparent;
      display: flex;
      align-items: center;
      gap: calc(var(--unit) * 2);
      max-height: calc(var(--unit) * 12.5);
      margin: calc(var(--unit) * 1.5) 0;
      padding: calc(var(--unit) * 2) calc(var(--unit) * 3);
      font-size: 13px;
      font-weight: 500;
      color: var(--status-color);
      background-color: color-mix(in srgb, var(--status-color) 10%, transparent);
      border: 1px solid transparent;
      border-radius: var(--unit);
      opacity: 1;
      transition: all 0.3s ease;
      &[data-status="hidden"] {
        max-height: 0;
        margin-bottom: 0;
        padding-top: 0;
        padding-bottom: 0;
        border-width: 0;
        opacity: 0;
        pointer-events: none;
      }
      &[data-status="loading"], &[data-status="message"] {
        --status-color: var(--grey600);
        background-color: transparent;
      }
      &[data-status="loading"]::before {
        display: block;
        width: calc(var(--unit) * 3.5);
        height: calc(var(--unit) * 3.5);
        content: "";
        border: 2px solid var(--grey200);
        border-top-color: var(--theme-color);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      &[data-status="message"] { padding:calc(var(--unit) * 0.5) calc(var(--unit) * 3) }
      &[data-status="success"] { --status-color: var(--main-green); }
      &[data-status="error"], &[data-status="alert"] { --status-color: var(--main-red); }
    }
    /* --- ポップオーバー --- */
    ob-popover {
      display: block;
      box-sizing: border-box;
      width: 100%;
    }
    .popover-summary {
      display: flex;
      align-items: center;
      box-sizing: border-box;
      width: 100%;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .popover-content {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      border: 1px solid var(--grey200);
      border-radius: var(--unit);
      box-shadow: 0 var(--unit) calc(var(--unit) * 2) color-mix(in srgb, var(--text-main) 20%, transparent);
      top: calc(anchor(bottom) + 2px);
      left: anchor(left);
      min-width: anchor-size(width);
      max-width: fit-content;
      max-height: calc(var(--unit) * 40);
    }
    /* --- ob-multi-select --- */
    ob-multi-select {
      display: block;
      margin: var(--unit) 0;
    }
    ob-multi-select .popover-summary {
      height: var(--control-height);
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center; 
      padding: 0 calc(var(--unit) * 6) 0 calc(var(--unit) * 2);
      font-weight: normal;
      &:hover { background-color: var(--bg-color-hover); }
    }
    /* --- ob-symbol-table --- */
    .single-summary {
      height: calc(var(--unit) * 7);
      padding: var(--unit) calc(var(--unit) * 1.5);
      font-size: 12px;
      background-color: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      border-radius: 0;
      &:hover {
        background-color: var(--bg-color-hover);
        border-bottom: 1px solid var(--grey200);
      }
    }
    .single-select-item {
      display: flex;
      align-items: center;
      width: 100%;
      padding: calc(var(--unit) * 1.5) calc(var(--unit) * 2);
      font-size: 12px;
      text-align: left;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--grey50);
      cursor: pointer;
      &:hover { background-color: var(--bg-color-hover); }
    }
    #symbBox {
      max-height: calc(var(--unit) * 50);
      border: 1px solid var(--grey200);
      border-radius: var(--unit);
      padding: var(--unit) calc(var(--unit) * 2);
    }
    .symb-table-row {
      display: flex;
      align-items: center;
      gap: var(--unit);
      margin-bottom: var(--unit);
      padding-bottom: calc(var(--unit) * 0.5);
      border-bottom: 1px solid var(--grey50);
      .symb-col-btn {
        flex: 0 0 calc(var(--unit) * 6);
        text-align: center;
      }
      .symb-col-target {
        flex: 2.5;
        min-width: 0;
      }
      .symb-col-shape {
        flex: 1;
        min-width: 0;
      }
      .symb-col-color {
        flex: 1.5;
        min-width: 0;
      }
    }
    /* --- リスト・チェック --- */
    .cb-container {
      max-height: calc(var(--unit) * 35);
      overflow-y: auto;
    }
    .cb-item {
      display: flex;
      align-items: center;
      gap: calc(var(--unit) * 2);
      margin: 0;
      padding: var(--unit) calc(var(--unit) * 2);
      border-bottom: 1px solid var(--grey200);
      cursor: pointer;
      &:last-child { border-bottom: none; }
      input[type="checkbox"] {
        flex: none;
        width: 14px;
        height: 14px;
        margin: 0;
        padding: 0;
        cursor: pointer;
      }
      span {
        flex: 1;
        font-size: 12px;
        font-weight: normal;
      }
      &.select-all {
        border-bottom: 1px solid var(--grey400);
        span { font-weight: 500; }
      }
    }
    /* --- トグルスイッチ --- */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: calc(var(--unit) * 3);
      margin: calc(var(--unit) * 1.5) 0;
    }
    .toggle-label {
      font-size: 13px;
      color: var(--grey600);
      line-height: 1.2;
    }
    .toggle-switch {
      position: relative;
      display: inline-flex;
      width: calc(var(--unit) * 9);
      height: calc(var(--unit) * 5);
      flex: none;
      margin: 0;
      input {
        opacity: 0;
        width: 0;
        height: 0;
        margin: 0;
        padding: 0;
      }
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--grey200);
      border-radius: calc(var(--unit) * 2.5);
      transition: all var(--transition-speed);
      &::before {
        position: absolute;
        content: "";
        height: calc(var(--unit) * 3.5);
        width: calc(var(--unit) * 3.5);
        left: calc(var(--unit) * 0.75);
        bottom: calc(var(--unit) * 0.75);
        background-color: #fff;
        border-radius: 50%;
        transition: all var(--transition-speed);
      }
    }
    .toggle-switch input:checked + .toggle-slider { background-color: var(--theme-color); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(calc(var(--unit) * 4)); }
    /* --- 統計テーブル --- */
    .stats-container {
      margin-top: calc(var(--unit) * 1.5);
      padding: calc(var(--unit) * 2);
      font-size: 11px;
      background-color: var(--grey50);
      border: 1px solid var(--grey200);
      border-radius: var(--unit);
      user-select: text;
      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 2fr;
        align-items: center;
        row-gap: var(--unit);
        column-gap: calc(var(--unit) * 2);
      }
      .stats-label {
        font-weight: 500;
        color: var(--grey600);
      }
      .stats-val { font-weight: 700; }
    }
  }
</style>

        chart.draw(data, options);
      }
    </script>
  </head>

  </body>
</html>`;</script></head>

  <!-- sidebar上部タブ -->

    <nav class="nav-tabs" id="nav">
      <button class="tab-btn active" data-target="tab1">データ抽出</button>
      <button class="tab-btn" data-target="tab2">グラフ作成</button>
    </nav>

    <!-- sidebarメイン -->
    <main class="scroll-y">

              <div data-ui="box"></div>

          <hr>
          <!-- extr -->
          <details id="extrSec" data-type="disabled">
            <summary>抽出と格納</summary>

              <button data-ui="btn-extr" data-type="primary" disabled>データを抽出</button>
              <span class="txt-btninfo">読込シート「Results」</span>
            </div>
            <div data-ui="area" style="display: none;">
              <div data-ui="box"></div>
            </div>
            <div class="field-row">
              <button data-ui="btn-push" data-type="primary" class="outline" style="display: none;" disabled>PXRFに格納</button>
            </div>
          </details>
          <div id="extrBar" class="status-bar" data-status="hidden" data-bind-status="T1ST.extr.status"></div>
        </fieldset>
      </div>

      <!-- Tab2 グラフ作成 -->
      <div id="tab2" class="tab-content">
        <fieldset id="tab2Fieldset">

          <details id="asgnSec" open>

            <div data-ui="area" style="display: none;">

              <ob-multi-select data-ui="dset-box" data-change-item="T2.tglDB" data-change-all="T2.tglAllDB" data-bind-opts="T2ST.asgn.refs.available" data-bind-refs="T2ST.asgn.refs.filter"></ob-multi-select>

          </details>

          <hr>
          <!-- symb -->
          <details id="symbSec" data-type="disabled">
            <summary>シンボル設定</summary>
            <div data-ui="area" style="display: none;">
              <label>属性選択</label>
              <div class="field-row" style="margin-top: var(--unit)">
                <div data-ui="axis-box"></div>
                <button data-ui="btn-reset" data-type="primary" class="outline">リセット</button>
              </div>
              <label>シンボル設定</label>
              <div class="scroll-y" style="max-height: calc(var(--unit) * 50); border: 1px solid var(--grey200); border-radius: var(--unit); padding: var(--unit) calc(var(--unit) * 2);">
                <ob-symbol-table data-ui="symb-tbl"></ob-symbol-table>

<script>
  // --- Excel用ストレージ ---
  class OfficeStorageAdapter {
    static save(key, data) {
      Office.context.document.settings.set(key, data);
      Office.context.document.settings.saveAsync();
    }
    static load(key) {
      return Office.context.document.settings.get(key);
    }
    static clear(key) {
      Office.context.document.settings.remove(key);
      Office.context.document.settings.saveAsync();
    }
  }

  // --- Excel用通信API ---
  class ExcelAdapter {
    static async #run(fn) {
      try { return await Excel.run(fn); }
      catch (e) { throw new Error(`[EXCEL_ERR] ${e.message}`); }
    }

    // --- データ取得 ---
    static async fetchDT(shtName, qCol = null, lCol = null) {
      return this.#run(async (ctx) => {
        const sht = ctx.workbook.worksheets.getItemOrNullObject(shtName);
        await ctx.sync();
        if (sht.isNullObject) throw new Error(`シート「${shtName}」不在`);
        const rng = sht.getUsedRangeOrNullObject();
        rng.load("values");
        await ctx.sync();
        if (rng.isNullObject || !rng.values || rng.values.length <= 1) throw new Error("データが1行以下");
        const raw = rng.values;
        if (qCol && raw[0].length < qCol) throw new Error("データ列不足");
        const data = lCol ? raw.map(r => r.slice(0, lCol)) : raw;
        return { data, message: `取得: ${data.length} 行` };
      });
    }

    // --- データ出力 ---
    static async writeData(shtName, data, opts = "clear") {
      return this.#run(async (ctx) => {
        const sht = ctx.workbook.worksheets.getItemOrNullObject(shtName);
        await ctx.sync();
        if (sht.isNullObject) throw new Error(`シート「${shtName}」不在`);
        const oArr = [].concat(opts);
        if (oArr.includes("clear")) {
          sht.getUsedRangeOrNullObject().clear();
          await ctx.sync();
        }
        let sRow = 0;
        if (oArr.includes("append")) {
          const uRng = sht.getUsedRangeOrNullObject();
          uRng.load("rowCount");
          await ctx.sync();
          sRow = uRng.isNullObject ? 0 : uRng.rowCount;
        }
        const tRng = sht.getRangeByIndexes(sRow, 0, data.length, data[0].length);
        tRng.values = data;
        // ※Excel版での書式ルール拡張(rule)は安全のためスキップ
        await ctx.sync();
        return "書き出し完了";
      });
    }

    // --- レポートテンプレート取得 ---
    static async getReportTemplate() {
      if (window.__REPORT_TEMPLATE__) return window.__REPORT_TEMPLATE__;
      const res = await fetch('Report.html');
      if (!res.ok) throw new Error("テンプレート取得失敗");
      return await res.text();
    }

    // --- 環境セットアップ ---
    static async setupEnvironment(ordShts, valElms, pxrfHdr, flHdr, isForce) {
      return this.#run(async (ctx) => {
        const shts = ctx.workbook.worksheets;
        shts.load("items/name");
        await ctx.sync();
        const rls = {
          'PXRF': { hdr: pxrfHdr, lock: true, vald: h => JSON.stringify(h) === JSON.stringify(pxrfHdr) ? null : "・PXRFヘッダー不正" },
          'WDXRF': { lock: true, vald: h => { const ms = valElms.filter(e => !h.includes(e)); return ms.length ? `・WDXRF元素不足: ${ms.join(', ')}` : null; } },
          '抽出データ': { hdr: pxrfHdr, clr: true },
          'ファイルリスト': { hdr: flHdr, clr: true }
        };
        const drv = { // Excel操作Driver
          getMap: () => new Map(shts.items.map(s => [s.name, s])),
          add: n => shts.add(n),
          clr: s => s.getUsedRangeOrNullObject().clear(),
          setHdr: (s, h) => { s.getRangeByIndexes(0, 0, 1, h.length).values = [h]; },
          getHdr: async s => {
            const rng = s.getUsedRangeOrNullObject();
            rng.load("columnCount");
            await ctx.sync();
            if (rng.isNullObject || rng.columnCount === 0) return [];
            const hRng = s.getRangeByIndexes(0, 0, 1, rng.columnCount);
            hRng.load("values");
            await ctx.sync();
            return hRng.values[0];
          },
          setPos: (s, i) => { s.position = i; },
          lock: s => {
            const r1 = s.getRange("1:1");
            r1.dataValidation.rule = { custom: { formula: "=FALSE" } };
            r1.dataValidation.errorAlert = { message: "システム保護: 編集禁止", showAlert: true, style: "Stop", title: "保護" };
          }
        };
        const exMap = drv.getMap(), msShts = ordShts.filter(n => !exMap.has(n));
        if (msShts.length > 0 && !isForce) return { reqConfirm: true, missing: msShts }; // 不足時確認要求
        const errs = [];
        for (const n of ordShts) {
          const r = rls[n] || {};
          let sht = exMap.get(n);
          if (!sht) {
            sht = drv.add(n);
            if (r.hdr) drv.setHdr(sht, r.hdr);
            exMap.set(n, sht);
          } else {
            if (r.clr) { drv.clr(sht); if (r.hdr) drv.setHdr(sht, r.hdr); }
            if (r.vald) { const err = r.vald(await drv.getHdr(sht)); if (err) errs.push(err); }
          }
        }
        if (errs.length > 0) throw new Error(`【検証エラー】\n${errs.join('\n')}\n\nGitHub仕様をご確認ください。`); // 統合エラー送出
        ordShts.forEach((n, i) => drv.setPos(exMap.get(n), i));
        ordShts.forEach(n => { if (rls[n]?.lock) drv.lock(exMap.get(n)); });
        await ctx.sync();
        return { reqConfirm: false };
      });
    }

  // --- フェーズ定義 ---
  const T1_PHS = { INIT: 1, READY: 2, LOAD: 3, INVALID: 4, VALID: 5, EXTRACT: 6, OUTPUT: 7 };
  const T2_PHS = { INIT: 1, LOADED: 2, FILTERED: 3, MAPPED: 4, PREVIEWED: 5 };
  // --- AppState ---
  class AppState {
    #state; #initialState; #listeners; 
    // --- セクション単位のstate生成 ---
    constructor() {
      const createSec = (overrides = {}) => ({ status: [], data: null, refs: {}, flags: [], ...overrides }); // 共通構造の強制
      const initDef = {
        GLB: { activeTab: "tab1", isLocked: false, ssId: "" },

          prev: createSec({ refs: { itemMap: [], val: GLB.Conf.valElms[0], saveIndexName: "" }, data: { correctionLogic: {}, prevDT: null, statsDT: null } }),
          gph: { style: GLB.Conf.defaultGraphStyle, gap: GLB.Conf.defaultGraphGap },
          repo: createSec({ refs: { values: [], corrections: [] } })
        }
      };
      this.#initialState = JSON.parse(JSON.stringify(initDef));
      this.#state = JSON.parse(JSON.stringify(initDef));
      this.#listeners = {};
    }
    // --- Proxy取得 ---
    get proxy() { return this.#state; }
    // --- State取得 ---
    get(paths) {
      const res = p => (Array.isArray(p) ? p : p.split('.')).reduce((o, k) => o?.[k], this.#state);
      return Array.isArray(paths) ? paths.map(res) : res(paths);
    }
    // --- State設定 ---
    set(updates, v) {
      if (typeof updates === 'object' && !Array.isArray(updates)) return Object.entries(updates).forEach(([k, val]) => this.set(k, val)); // 一括更新対応
      const keys = Array.isArray(updates) ? updates : updates.split('.');
      const last = keys.pop();
      const tgt = keys.reduce((o, k) => o[k] ??= {}, this.#state);
      if (tgt[last] !== v) {
        tgt[last] = v;
        this.#listeners[[...keys, last].join('.')]?.forEach(cb => cb(v)); // 個別変更通知
        this.#listeners['*']?.forEach(cb => cb()); // 全体変更通知
      }
    }
    // --- 変更購読 ---
    subscribe(path, cb) {
      const key = Array.isArray(path) ? path.join('.') : path;
      (this.#listeners[key] ??= []).push(cb);
    }
    // --- State初期化 ---
    reset(paths) {
      const updates = {};
      (Array.isArray(paths) ? paths : [paths]).forEach(p => {
        const initVal = p.split('.').reduce((o, k) => o?.[k], this.#initialState);
        updates[p] = initVal !== undefined ? JSON.parse(JSON.stringify(initVal)) : null; // 初期値の復元
      });
      this.set(updates);
    }
  }
  // --- Gas通信Service ---
  class GasService {

    static #serverCall(funcName, ...args) {

          .withFailureHandler(e => reject(new Error(`[NET_ERR] ${e.message}`)))
          [funcName](...args);
      });
    }
    // --- GAS通信処理をバインド ---
    static fetchDT(ssId, sht, qCol = null, lCol = null) { return this.#serverCall("fetchDT", ssId, sht, qCol, lCol); }

  }
  // --- ローカルストレージ ---
  class LocalStorageAdapter {

    static load(key) { return localStorage.getItem(key); }
    static clear(key) { localStorage.removeItem(key); }
  }
  // --- 環境判定とDI ---
  const isExcelEnv = typeof Office !== 'undefined';

  const State = new AppState();

<script>
  const Mtd = {
    Util: class {
      // --- 再配列処理 ---
      static remapArry(data, idxArr, newHdr = null) {
        if (!data?.length) return [];
        const remap = r => idxArr.map(idx => idx !== -1 ? (r?.[idx] ?? "") : "");
        return [newHdr ?? remap(data[0]), ...data.slice(1).map(remap)];
      }
      // --- セレクタ配列判定 ---
      static validateSelect(vals, quota = vals.length) {
        const chkVals = vals.slice(0, quota);
        return vals.map((v, i) => i < quota ? (!v || chkVals.indexOf(v) !== chkVals.lastIndexOf(v)) : false);
      }
      // --- 汎用キーソート ---
      static sortKeysByVal = obj => Object.keys(obj).sort((a, b) => obj[a] - obj[b]);
      // --- 有効数値の抽出 ---
      static getValidNums = (arr, reqPos = false) => arr.map(Number).filter(v => !isNaN(v) && (!reqPos || v > 0));
      // --- 統計表データ生成 ---
      static buildStats(statsDT, digits = 3, fmlRls = null) {
        if (!statsDT) return [];
        const fmt = v => (v != null && !isNaN(v)) ? Number(v).toFixed(digits) : "-";
        const meta = { ...statsDT, sign: statsDT.intercept >= 0 ? "+" : "-", abs_intercept: Math.abs(statsDT.intercept ?? 0) };
        if (fmlRls?.length) {
          return fmlRls.map(({ key, label }) => {
            if (!key) return [label ?? "", ""];
            const valStr = meta[key] !== undefined ? (meta[key] === meta.sign ? meta[key] : fmt(meta[key])) : key.replace(/\{(\w+)\}/g, (m, k) => meta[k] !== undefined ? (k === "sign" ? meta[k] : fmt(meta[k])) : m);
            return [label ?? "", valStr];
          });
        }
        return [
          statsDT.count != null ? ["データ個数", statsDT.count] : null,
          (statsDT.r != null && statsDT.r2 != null) ? ["相関係数", `R = ${fmt(statsDT.r)} , R² = ${fmt(statsDT.r2)}`] : null,
          (statsDT.slope != null && statsDT.intercept != null) ? ["回帰直線", `y = ${fmt(statsDT.slope)}x ${meta.sign} ${fmt(meta.abs_intercept)}`] : null,
          statsDT.resStdDev != null ? ["残差標準偏差", fmt(statsDT.resStdDev)] : null,
          statsDT.err3Sigma != null ? ["器械Err3σ", fmt(statsDT.err3Sigma)] : null
        ].filter(Boolean);
      }
      // --- Nice Numbers計算 ---
      static calcScale(xVals, yVals, desiredTicks = 4) {
        if (!xVals?.length || !yVals?.length) return { niceMin: 0, niceMax: 0, niceTicks: [] };
        const [xMin, xMax, yMin, yMax] = [Math.min(...xVals), Math.max(...xVals), Math.min(...yVals), Math.max(...yVals)];
        const isAllPos = xMin >= 0 && yMin >= 0;
        const rawMin = isAllPos ? 0 : Math.min(xMin, yMin);
        const rawMax = Math.max(xMax, yMax);
        const rawStep = (rawMax - rawMin || 1) / (desiredTicks - 1);

      static row(label, bindPath, changePath, isCheck) { return html`<div class="toggle-row"><span class="toggle-label">${label}</span><label class="toggle-switch"><input type="checkbox" ${bindPath ? html`data-bind="${bindPath}"` : ""} ${changePath ? html`data-change="${changePath}"` : ""} ${isCheck ? "checked" : ""}><span class="toggle-slider"></span></label></div>`; }
    };
    static Stats = class {
      static row(label, val) { return html`<div class="stats-label">${label}</div><div class="stats-val">${val}</div>`; }
      static cntr(rowsHtml) { return html`<div class="stats-container"><div class="stats-grid">${rowsHtml}</div></div>`; }
    };
    static MultiSelect = class {
      static item(val, dataChange) { return html`<label class="cb-item"><input type="checkbox" class="dataset-cb" value="${val}" data-change="${dataChange}" checked><span class="cb-text">${val}</span></label>`; }
      static selectAll(dataChange) { return html`<label class="cb-item select-all"><input type="checkbox" class="select-all-cb" data-change="${dataChange}" checked><span>すべて選択</span></label>`; }

      static item(opt, type, idx, hasClr, action) { return html`<button type="button" class="single-select-item" data-action="${action}" data-symbol-idx="${idx}" data-symbol-type="${type}" value="${opt.val}" popovertargetaction="hide">${hasClr ? Tpl.Common.colorBox(opt.val) : ""}${opt.label}</button>`; }
      static btn(action, key, text, dis) { return html`<button type="button" class="icon-btn" data-action="${action}" ${key ? html`data-rule-key="${key}"` : ""} ${dis ? "disabled" : ""}>${text}</button>`; }
      static col(clsName, cntHtml) { return html`<div class="${clsName}">${cntHtml}</div>`; }
      static row(btnHtml, colsHtml) { return html`<div class="symb-table-row"><div class="symb-col-btn">${btnHtml}</div>${colsHtml}</div>`; }
      static addRow(actionAdd, colsArr) { return this.row(this.btn(actionAdd, "", "+", false), colsArr.map(c => this.col(c.className, "")).join('')); }
    };
  }
  customElements.define('ob-popover', ObPopover); customElements.define('ob-multi-select', ObMultiSelect); customElements.define('ob-symbol-table', ObSymbolTable);

<script>
  // --- テーマキャッシュ ---
  class CSSToken {
    static #cache = new Map();
    // --- カラー変数変換 ---
    static get(varStr) {
      if (!varStr?.startsWith('var(')) return varStr;
      const mch = varStr.match(/var\((--[^,\s)]+)/);
      if (!mch) return varStr; // 変数以外は返却
      const key = mch[1];
      if (!this.#cache.has(key)) this.#cache.set(key, getComputedStyle(document.body).getPropertyValue(key).trim() || varStr); // 計算値保持
      return this.#cache.get(key);
    }
  }
  // --- プロット描画クラス ---
  class ObCalPlot extends HTMLElement {
    #box; #chart = null; #observer; #src = null; #lastW = 0;
    constructor() {
      super();
      this.#box = document.createElement('div');
      this.#box.style.cssText = 'width: 100%; position: relative;';
      // **超重要**高さ変動による無限ループ防止
      this.#observer = new ResizeObserver(() => {
        const curW = this.clientWidth;
        if (curW > 0 && curW !== this.#lastW && this.#src) {
          this.#lastW = curW;
          if (this.#chart) this.#chart.resize();
          this.#render();
        }
      });
    }
    // --- 接続コールバック ---
    connectedCallback() {
      this.style.display = 'grid';
      // **超重要**幅拡張を防止（minmax制約）
      this.style.gridTemplateColumns = 'minmax(0, 1fr)';
      this.style.width = '100%';
      this.appendChild(this.#box);
      this.#observer.observe(this.#box);
    }
    // --- 切断コールバック ---
    disconnectedCallback() {
      this.#observer.disconnect();
      if (this.#chart) { this.#chart.dispose(); this.#chart = null; } // メモリ解放
    }
    // --- データ注入と描画 ---
    set src(data) {
      this.#src = data;
      this.#render();
    }
    // --- 描画消去 ---
    clear() {
      this.#src = null;
      if (this.#chart) this.#chart.clear();
      this.#box.style.height = '0px'; // 領域リセット
    }
    // --- 散布図描画本体 ---
    #render() {
      const { prevDT, statsDT, symb, gph } = this.#src || {};
      if (!prevDT?.length || typeof echarts === 'undefined') return this.clear();
      
      const containerWidth = this.clientWidth;
      if (containerWidth === 0) return; // 非表示時はスキップ
      this.#lastW = containerWidth;
      
      const rS = gph?.style || GLB.Conf.defaultGraphStyle;
      const STYLE = {
        font: rS.font,
        fontS: { ...rS.fontS },
        fontC: { base: CSSToken.get(rS.fontC.base), stats: CSSToken.get(rS.fontC.stats), tip: CSSToken.get(rS.fontC.tip) },
        symbol: { ...rS.symbol },
        lineW: { ...rS.lineW },
        lineC: { grid: CSSToken.get(rS.lineC.grid), axis: CSSToken.get(rS.lineC.axis), reg: CSSToken.get(rS.lineC.reg)},
        bgPlot: rS.bgPlot, bgOuter: rS.bgOuter, bgTip: rS.bgTip
      };
      const GAP = { ...(gph?.gap || GLB.Conf.defaultGraphGap) };
      // 動的計算と設定値注入
      const charWidth = STYLE.fontS.tick * 0.6, overY = (4 * charWidth) / 2, overX = (2 * charWidth) / 2;
      const gridTop = GAP.padT + overY, gridBottom = GAP.padB + STYLE.fontS.name + GAP.name + STYLE.fontS.tick + GAP.tick;
      const gridLeft = GAP.padL + overX + STYLE.fontS.name + GAP.name + STYLE.fontS.tick + GAP.tick, gridRight = GAP.padR;
      const plotSize = containerWidth - gridLeft - gridRight, containerHeight = plotSize + gridTop + gridBottom;
      this.#box.style.width = `${containerWidth}px`; this.#box.style.height = `${containerHeight}px`;
      this.#box.style.backgroundColor = STYLE.bgOuter;
      if (!this.#chart) this.#chart = echarts.init(this.#box);
      const { niceMin, niceMax, niceTicks } = Mtd.Util.calcScale(prevDT.map(d => d.x), prevDT.map(d => d.y));
      const itv = niceTicks.length >= 2 ? (niceTicks[1].v - niceTicks[0].v) : undefined;
      const fmtTick = v => { const tck = niceTicks.find(t => Math.abs(t.v - v) < 1e-8); return tck ? tck.f : v; }; // 刻みフォーマット
      const graphText = Mtd.Util.buildStats(statsDT, 3, [{ key: 'R² = {r2}', label: '' }, { key: 'y = {slope}x {sign} {abs_intercept}', label: '' }]).map(r => r[1]).join('\n');
      const baseKey = symb?.baseKey, rls = symb?.rls || [], defRl = rls.find(r => r.key === "default");
      const plotDT = prevDT.map(d => {
        const rl = rls.find(r => r.target !== "" && r.target === d[baseKey]) || defRl; // ルール適用
        const isEmpty = rl.shp === 'emptyCircle', shp = isEmpty ? 'circle' : (rl.shp || 'circle');
        const bClr = CSSToken.get(rl.clr);
        return {
          value: [d.x, d.y], id: d.id, group: d.group,
          symbol: shp, symbolSize: shp.startsWith('path://') ? STYLE.symbol.pathSize : STYLE.symbol.baseSize,
          itemStyle: { color: isEmpty ? 'transparent' : bClr, borderColor: bClr, borderWidth: STYLE.symbol.borderW }
        };
      });
      const series = [{ type: 'scatter', data: plotDT, animation: false }];
      if (statsDT?.slope != null && statsDT?.intercept != null) {
        const { slope, intercept } = statsDT;
        series.push({
          type: 'line', data: [[niceMin, slope * niceMin + intercept], [niceMax, slope * niceMax + intercept]], // 回帰直線
          symbol: 'none', lineStyle: { color: STYLE.lineC.reg, width: STYLE.lineW.regW, type: STYLE.lineW.regD, opacity: 0.5 },
          animation: false, silent: true
        });
      }
      const opt = {
        animation: false,
        textStyle: { fontFamily: STYLE.font },
        grid: { left: gridLeft, top: gridTop, width: plotSize, height: plotSize, show: true, backgroundColor: STYLE.bgPlot, borderColor: STYLE.lineC.axis, borderWidth: STYLE.lineW.axis },
        tooltip: { formatter: p => p.componentSubType === 'line' ? '' : `ID: ${p.data.id || '-'}<br/>Group: ${p.data.group || '-'}`, backgroundColor: STYLE.bgTip, textStyle: { fontFamily: STYLE.font, fontSize: STYLE.fontS.tip, color: STYLE.fontC.tip } },
        xAxis: {
          type: 'value', name: 'WDXRF', nameLocation: 'middle',
          nameGap: GAP.tick + STYLE.fontS.tick + GAP.name, nameTextStyle: { fontFamily: STYLE.font, fontSize: STYLE.fontS.name, color: STYLE.fontC.base },
          min: niceMin, max: niceMax, interval: itv,
          axisLabel: { margin: GAP.tick, fontSize: STYLE.fontS.tick, color: STYLE.fontC.base, formatter: v => fmtTick(v) },
          splitLine: { show: true, lineStyle: { color: STYLE.lineC.grid, type: 'solid', width: STYLE.lineW.grid } },
          axisLine: { show: true, onZero: false, lineStyle: { color: STYLE.lineC.axis, width: STYLE.lineW.axis } },
          axisTick: { show: false, inside: true }
        },
        yAxis: {
          type: 'value', name: 'PXRF', nameLocation: 'middle',
          nameGap: GAP.tick + STYLE.fontS.tick + GAP.name, nameTextStyle: { fontFamily: STYLE.font, fontSize: STYLE.fontS.name, color: STYLE.fontC.base },
          min: niceMin, max: niceMax, interval: itv,
          axisLabel: { rotate: 90, margin: GAP.tick, fontSize: STYLE.fontS.tick, color: STYLE.fontC.base, formatter: v => (Math.abs(v - niceMin) < 1e-8) ? '' : fmtTick(v) },
          splitLine: { show: true, lineStyle: { color: STYLE.lineC.grid, type: 'solid', width: STYLE.lineW.grid } },
          axisLine: { show: true, onZero: false, lineStyle: { color: STYLE.lineC.axis, width: STYLE.lineW.axis } },
          axisTick: { show: false, inside: true }
        },
        graphic: [{ type: 'text', left: gridLeft + STYLE.fontS.tick, top: gridTop + STYLE.fontS.tick, style: { text: graphText, fontFamily: STYLE.font, fontSize: STYLE.fontS.stats, fill: STYLE.fontC.stats } }],
        series: series
      };
      this.#chart.setOption(opt);
    }
  }
  customElements.define('ob-cal-plot', ObCalPlot);
</script>

<script>
  // --- UIInit ---
  class UIInit {
    // --- Tab1初期化 ---
    static buildTab1() {
      const pref = DOM.el("prefSec"), raw = DOM.el("rawSec"), extr = DOM.el("extrSec");
      NewDOM.buildFormFields([{ type: "select", opts: GLB.Conf.confMods, bind: "T1ST.pref.refs.mode", hasEmpty: false }], pref?.querySelector('[data-ui="mode-box"]'));
      NewDOM.buildFormFields(GLB.Conf.extrFields.map(f => ({ type: "text", label: f.label, bind: f.bind, placeholder: f.placeholder })), extr?.querySelector('[data-ui="box"]'));
    }
    // --- Tab2初期化 ---
    static buildTab2() {
      const symb = DOM.el("symbSec"), prev = DOM.el("prevSec"), calb = DOM.el("calbSec");
      NewDOM.buildFormFields([{ type: "select", opts: GLB.Conf.symbAxes, change: "T2.checkAxis", hasEmpty: false }], symb?.querySelector('[data-ui="axis-box"]'));
      NewDOM.buildFormFields([{ type: "select", bind: "T2ST.calb.refs.correction", hasEmpty: false, opts: [{ label: "新規検量線", val: "new" }] }], calb?.querySelector('[data-ui="corr-box"]'));
      NewDOM.buildFormFields([{ type: "select", bind: "T2ST.prev.refs.val", hasEmpty: false, opts: [...GLB.Conf.valElms, ...GLB.Conf.valLgc].map(v => ({ label: v, val: v })) }], prev?.querySelector('[data-ui="val-box"]'));
      if (GLB.Conf.valLgc.length) State.set("T2ST.prev.refs.val", GLB.Conf.valLgc[0]);
      NewDOM.buildToggle({ label: "LOD置換", bind: "T2ST.calb.refs.useLOD" }, calb?.querySelector('[data-ui="lod-box"]'));
      NewDOM.buildToggle({ label: "検量線適用", bind: "T2ST.calb.refs.useCal" }, calb?.querySelector('[data-ui="cal-tgl-box"]'));
      const prevModeElm = calb?.querySelector('[data-ui="mode-box"]');
      if (prevModeElm) prevModeElm.opts = GLB.Conf.optElms;
      const prevCalElm = calb?.querySelector('[data-ui="cal-elm-box"]');
      if (prevCalElm) prevCalElm.opts = GLB.Conf.valElms;
    }
    static build() { this.buildTab1(); this.buildTab2(); }
  }
  // --- UIPhase（セクション単位でネスト） ---
  class UIPhase {
    // --- Tab1ルール ---
    static #T1_RLS = {
      pref: { sec: p => ({ isActive: p === T1_PHS.INIT, isDis: false }) },
      raw: {
        sec: p => ({ isOpen: p >= T1_PHS.READY && p < T1_PHS.VALID, isDis: p < T1_PHS.READY }),
        'btn-load': p => ({ text: p <= T1_PHS.READY ? "データを取得" : "再取得", isDis: false }),
        'btn-make': p => ({ isDis: p < T1_PHS.READY }),
        'btn-vald': p => ({ isDis: p < T1_PHS.INVALID || State.get("T1ST.raw.flags").some(Boolean), className: p === T1_PHS.INVALID ? "" : "outline" }),
        area: p => ({ isShow: p >= T1_PHS.LOAD }),
        'btn-box': p => ({ isShow: p >= T1_PHS.LOAD })
      },
      extr: {
        sec: p => ({ isOpen: p >= T1_PHS.VALID && p < T1_PHS.OUTPUT, isDis: p < T1_PHS.VALID }),
        'btn-extr': p => ({ isDis: p < T1_PHS.VALID || State.get("T1ST.extr.flags").some(Boolean) }),
        'btn-push': p => ({ isShow: p >= T1_PHS.EXTRACT, isDis: p < T1_PHS.EXTRACT }),
        area: p => ({ isShow: p >= T1_PHS.VALID })
      }
    };
    // --- Tab2ルール ---
    static #T2_RLS = {
      asgn: {
        sec: p => ({ isOpen: p < T2_PHS.FILTERED, isDis: false }),
        'btn-load': p => ({ isDis: false }),
        'btn-fltr': p => ({ isDis: p < T2_PHS.LOADED }),
        area: p => ({ isShow: p >= T2_PHS.LOADED })
      },
      symb: {
        sec: p => ({ isOpen: p >= T2_PHS.FILTERED && p < T2_PHS.MAPPED, isDis: p < T2_PHS.FILTERED }),
        'btn-symb': p => ({ isDis: p < T2_PHS.FILTERED }),
        'axis-box': p => ({ isDis: p < T2_PHS.FILTERED }),
        area: p => ({ isShow: p >= T2_PHS.FILTERED })
      },
      prev: {
        sec: p => ({ isOpen: p >= T2_PHS.MAPPED, isDis: p < T2_PHS.MAPPED }),
        'btn-make': p => ({ isDis: p < T2_PHS.MAPPED }),
        'save-box': p => ({ isShow: p >= T2_PHS.MAPPED && State.get("T2ST.calb.refs.correction") === "new" })
      },
      calb: {
        sec: p => ({ isOpen: p === T2_PHS.MAPPED ? true : undefined, isActive: p >= T2_PHS.MAPPED })
      },
      repo: {
        sec: p => ({ isOpen: p >= T2_PHS.PREVIEWED, isDis: p < T2_PHS.PREVIEWED }),
        'btn-repo': p => ({ isDis: p < T2_PHS.PREVIEWED })
      }
    };
    // --- 宣言的UI適用 ---
    static #apply(rlsMap, phs) {
      Object.entries(rlsMap).forEach(([secKey, roles]) => {
        const secElm = DOM.el(`${secKey}Sec`);
        if (!secElm) return;
        Object.entries(roles).forEach(([role, rlFn]) => {
          const target = role === 'sec' ? secElm : secElm.querySelector(`[data-ui="${role}"]`);
          if (!target) return;
          const { isShow, isDis, isOpen, isActive, text, className } = rlFn(phs); // isActiveを追加
          isShow !== undefined && DOM.tgl(target, isShow);
          isDis !== undefined && DOM.setDis(target, isDis);
          isOpen !== undefined && DOM.open(target, isOpen);
          text !== undefined && DOM.updateText(target, text);
          if (className !== undefined) target.className = className;
          if (role === 'sec') { 
            DOM.setAttr(target, "data-state", (isActive ?? isOpen) ? "active" : null); 
            DOM.setAttr(target, "data-type", isDis ? "disabled" : null); 
          }
        });
      });
    }
    static renewT1Phs(p) { this.#apply(this.#T1_RLS, p); }
    static renewT2Phs(p) { this.#apply(this.#T2_RLS, p); }
  }
  // --- UIStateUpdater ---
  class UIStateUpdater {
    constructor() {
      // stete-UI同期
      document.querySelectorAll('[data-bind-opts]').forEach(elm => State.subscribe(elm.dataset.bindOpts, v => elm.opts = v));
      document.querySelectorAll('[data-bind-refs]').forEach(elm => State.subscribe(elm.dataset.bindRefs, v => elm.refs = v));
      document.querySelectorAll('[data-bind-status]').forEach(elm => State.subscribe(elm.dataset.bindStatus, v => NewDOM.status(elm, v)));
      document.querySelectorAll('[data-bind]').forEach(elm => { if (elm.tagName === 'INPUT' && elm.type === 'text') State.subscribe(elm.dataset.bind, v => elm.value = v); });
      const bindErr = (secId, role, tgtPhs) => flags => { 
        NewDOM.inputs(DOM.el(secId)?.querySelector(`[data-ui="${role}"]`), flags); 
        if (State.get("T1ST.phase") === tgtPhs) UI.Phs.renewT1Phs(tgtPhs); 
      };
      // ダウングレード対応
      State.subscribe("T1ST.raw.flags", bindErr("rawSec", "box", T1_PHS.LOAD));
      State.subscribe("T1ST.extr.flags", bindErr("extrSec", "box", T1_PHS.VALID));
      Object.entries({
        // ▼ GLOBAL --------------------------------
        "GLB.isLocked": v => { DOM.setDis(DOM.el("tab1Fieldset"), v); DOM.setDis(DOM.el("tab2Fieldset"), v); },
        // ▼ T1: Tab1全般 --------------------------
        "T1ST.phase": v => UI.Phs.renewT1Phs(v),
        "T1ST.raw.data": data => {
          const bx = DOM.el("rawSec")?.querySelector('[data-ui="box"]');
          if (data?.[0]) NewDOM.buildFormFields(GLB.Conf.fileFields.map(f => ({ type: "select", label: f.label, field: f.key, change: "T1.renewRawRefs", opts: data[0].map(h => ({ label: h, val: h })), hasEmpty: true })), bx, true);
          else if (bx) bx.replaceChildren();
        },
        // ▼ T2: Tab2全般 --------------------------
        "T2ST.phase": v => { 
          UI.Phs.renewT2Phs(v); 
          if (v < T2_PHS.PREVIEWED) { 
            DOM.el(DOM.el("prevSec")?.querySelector('ob-cal-plot'))?.clear(); 
            NewDOM.buildStats(null, DOM.el("prevSec")?.querySelector('[data-ui="stats-tbl"]')); 
          } 
        },
        // ▼ T2: Asgn (データ読込) -----------------
        "T2ST.asgn.data.pxrfDT": () => { this.#renderSymbs(); this.#renderItems(); },
        "T2ST.asgn.data.corrDT": data => {
          if (!data) return;
          const bx = DOM.el("calbSec")?.querySelector('[data-ui="corr-box"]');
          const opts = [{ label: "新規検量線", val: "new" }, ...data.slice(1).filter(r => r[0]).map(r => ({ label: r[0], val: r[0] }))];
          NewDOM.buildFormFields([{ type: "select", bind: "T2ST.calb.refs.correction", hasEmpty: false, opts: opts }], bx, true);
          const elm = bx?.querySelector('select');
          if (elm) elm.value = State.get("T2ST.calb.refs.correction");
        },
        // ▼ T2: Symb (シンボル設定) ---------------
        "T2ST.symb.refs.baseKey": val => {
          const sel = DOM.el("symbSec")?.querySelector('[data-ui="axis-box"] select');
          if (sel && sel.value !== val) sel.value = val;
          this.#renderSymbs();
        },
        "T2ST.symb.refs.rls": () => this.#renderSymbs(),
        // ▼ T2: Calb (補正設定) -------------------
        "T2ST.calb.refs.correction": () => UI.Phs.renewT2Phs(State.get("T2ST.phase")),
        // ▼ T2: Prev (プレビュー表示) -------------
        "T2ST.prev.data.statsDT": statsDT => NewDOM.buildStats(statsDT, DOM.el("prevSec")?.querySelector('[data-ui="stats-tbl"]')),
        "T2ST.prev.data.prevDT": data => {
          const bx = DOM.el("prevSec")?.querySelector('[data-ui="chart-box"]');
          let chartElm = bx?.querySelector('ob-cal-plot');
          if (!chartElm && bx) { chartElm = document.createElement('ob-cal-plot'); bx.replaceChildren(chartElm); }
          if (chartElm) chartElm.src = { prevDT: data, statsDT: State.get("T2ST.prev.data.statsDT"), symb: State.get("T2ST.symb.refs"), gph: State.get("T2ST.gph") };
          if (data?.length && State.get("T2ST.phase") === T2_PHS.MAPPED) DOM.open("calbSec", false);
        }
      }).forEach(([path, cb]) => State.subscribe(path, cb));
    }
    // --- シンボルDI ---
    #renderSymbs() {
      const baseDT = State.get("T2ST.asgn.data.pxrfDT"), baseKey = State.get("T2ST.symb.refs.baseKey"), symbElm = DOM.el("symbSec")?.querySelector('[data-ui="symb-tbl"]');
      if (!symbElm) return;
      if (!baseDT || !baseDT.length) return symbElm.clear();
      const vals = [...new Set(baseDT.map(d => d[baseKey]).filter(Boolean))];
      symbElm.src = {
        rls: State.get("T2ST.symb.refs.rls"),
        optsConf: { target: [{ val: "", label: "未選択" }, ...vals.map(v => ({ val: v, label: v }))], shp: GLB.Conf.symbShapes, clr: GLB.Conf.symbColors },
        actsConf: { add: "T2.addSymb", remove: "T2.removeSymb", update: "T2.renewSymb"}
      };
    }
    // --- Item抽出DI ---
    #renderItems() {
      const baseDT = State.get("T2ST.asgn.data.pxrfDT"), elm = DOM.el("prevSec")?.querySelector('[data-ui="item-box"]');
      if (!baseDT?.length) { if(elm) elm.opts = []; return; }
      const items = [...new Set(baseDT.map(d => d.item ?? d.Item).filter(Boolean))];
      if(elm) elm.opts = items;
      State.set("T2ST.prev.refs.itemMap", items);
    }
  }
  const UI = { Init: UIInit, Phs: UIPhase, StateUpd: UIStateUpdater };
  const uiState = new UI.StateUpd();
</script>

<script>
  class CoreCtrl {
    // --- 最新ID取得 ---
    static get #ssId() { return State.get("GLB.ssId"); }
    
    // --- 非同期ラッパー ---
    static async withAsyncLock(statusPath, processFn, finallyFn = null) {
      State.set("GLB.isLocked", true);
      try {
        const res = await processFn();
        if (typeof res === "string") State.set(statusPath, ["success", res]);
        else if (Array.isArray(res)) State.set(statusPath, res);
      } catch (err) { State.set(statusPath, ["error", err.message]); }
      finally { if (finallyFn) await finallyFn(); State.set("GLB.isLocked", false); }
    }

    // --- アプリ接続フロー ---
    static async connectApp(ssId) {

      State.set({
        "T2ST.symb.refs.baseKey": bu.symb.r.baseKey, "T2ST.symb.refs.rls": bu.symb.r.rls,
        "T2ST.calb.refs.modeMap": bu.calb.r.modeMap, "T2ST.calb.refs.calElms": bu.calb.r.calElms, "T2ST.calb.refs.correction": bu.calb.r.correction, "T2ST.calb.refs.useLOD": bu.calb.r.useLOD, "T2ST.calb.refs.useCal": bu.calb.r.useCal,
        "T2ST.prev.refs.itemMap": bu.prev.r.itemMap, "T2ST.prev.refs.val": bu.prev.r.val, "T2ST.prev.refs.saveIndexName": bu.prev.r.saveIndexName
      });
      if (bu.phase >= T2_PHS.PREVIEWED) await T2Ctrl.buildPrev();
      if (State.get("T2ST.phase") === bu.phase) {
        State.set({ "T2ST.asgn.status": bu.asgn.s, "T2ST.symb.status": bu.symb.s, "T2ST.calb.status": bu.calb.s, "T2ST.prev.status": bu.prev.s });
      }
      return true;
    }

    // --- セッション開始 (接続完了後) ---
    static async startSession(ssId) {
      const isConnected = await Ctrl.CoreCtrl.connectApp(ssId);
      if (!isConnected) return; 
      if (!(await this.#restore(MakeBU.load()))) { 
        MakeBU.clear(); 
        this.switchAPP(State.get("GLB.activeTab")); 
      }
      MakeBU.init(); 
      State.set({ "GLB.isLocked": false, "T1ST.pref.status": ["hidden", ""], "T1ST.phase": T1_PHS.INIT });
      UI.Phs.renewT1Phs(State.get("T1ST.phase")); 
      UI.Phs.renewT2Phs(State.get("T2ST.phase"));
    }

    // --- 初期化 ---
    static async init() {
      UI.Init.build();
      State.subscribe("T1ST.pref.refs.mode", Evt.T1.checkT1Pref);
      State.subscribe("T1ST.extr.refs.DB", Evt.T1.checkExtrRefs);
      document.addEventListener("click", this.#handleClick.bind(this)); 
      document.addEventListener("change", this.#handleChange.bind(this));
      IdlTm.init();
      const urlParams = new URLSearchParams(window.location.search);
      const activeMode = window.__APP_MODE__ || urlParams.get('mode') || 'tab1';
      this.switchAPP(activeMode); // 該当のUIだけをアクティブ化

      const initSsId = window.__INITIAL_SSID__ || "";
      if (initSsId) {
        this.startSession(initSsId);
      }
    }
  }
  // --- 起動イベントバインド ---
  if (isExcelEnv) Office.onReady(() => Evt.init());
  else window.addEventListener("DOMContentLoaded", () => Evt.init());
</script>
