<script>
  // --- バックアップ管理 ---
  class MakeBU {
    static #K = "OBP_BU";
    static #isQ = false;
    static init() { State.subscribe('*', () => this.#queue()); }
    static #queue() {
      if (this.#isQ) return;
      this.#isQ = true;
      queueMicrotask(() => { this.save(); this.#isQ = false; });
    }
    static save() {
      const { phase, asgn, symb, calb, prev, stdz } = State.proxy.T2ST;
      phase < T2_PHS.LOADED ? this.clear() : StorageAPI.save(this.#K, JSON.stringify({ phase, asgn: { r: asgn.refs, s: asgn.status }, symb: { r: symb.refs, s: symb.status }, calb: { r: calb.refs, s: calb.status }, prev: { r: prev.refs, s: prev.status }, stdz: { r: stdz.refs, s: stdz.status } }));
    }
    static load() {
      try { return JSON.parse(StorageAPI.load(this.#K)); } catch (e) { return null; } 
    }
    static clear() { StorageAPI.clear(this.#K); }
  }
  // --- アイドル検知 ---
  class IdlTm {
    static #MS = 5 * 60000;
    static #tm = null;
    static init() {
      if (isExcelEnv) return;
      const rst = () => { 
        clearTimeout(this.#tm); 
        this.#tm = setTimeout(() => {
          const forceReload = () => {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
              google.script.run.withFailureHandler(() => google.script.host.close()).showSidebar();
            } else { window.location.reload(); }
          };
          NewDOM.toast("GAS通信エラー", "一定時間操作がなかったため、サイドバーを再起動してください", forceReload);
        }, this.#MS); 
      };
      ['mousemove', 'keydown', 'touchstart', 'click', 'scroll'].forEach(e => document.addEventListener(e, rst, { passive: true })); 
      rst();
    }
  }
  // --- メインクラス ---
  class Evt {
    // --- アクション辞書 ---
    static #ACTION_MAP = {
      rawSec:  { 'btn-load': 'T1Ctrl.loadRaw', 'btn-make': 'T1Ctrl.makeList', 'btn-vald': 'T1Ctrl.valdList' },
      extrSec: { 'btn-extr': 'T1Ctrl.runExtr', 'btn-push': 'T1Ctrl.pushExtr' },
      asgnSec: { 'btn-load': 'T2Ctrl.loadDB', 'btn-fltr': 'T2Ctrl.fltrDB' },
      symbSec: { 'btn-reset': 'T2Ctrl.resetSymb', 'btn-symb': 'T2Ctrl.setSymb' },
      prevSec: { 'btn-make': 'T2Ctrl.buildPrev' },
      stdzSec: { 'btn-save': 'T2Ctrl.saveCorr', 'btn-push': 'T2Ctrl.pushStdz' },
      instSec: { 'btn-load': 'T3Ctrl.loadDB' },
      repoSec: { 'btn-repo': 'T3Ctrl.openRepo' }
    };
    // --- マルチセレクト切替 ---
    static tglMulti(tgt, statePath) {
      const cntr = tgt.closest('ob-multi-select');
      if (!cntr) return;
      const itemCbs = [...cntr.querySelectorAll('.dataset-cb')], allCb = cntr.querySelector('.select-all-cb');
      if (allCb) allCb.checked = itemCbs.length > 0 && itemCbs.every(cb => cb.checked);
      State.set(statePath, itemCbs.filter(cb => cb.checked).map(cb => cb.value));
    }
    // --- 全選択切替 ---
    static tglAllMulti(tgt, statePath) {
      const cntr = tgt.closest('ob-multi-select');
      if (!cntr) return;
      const itemCbs = cntr.querySelectorAll('.dataset-cb');
      itemCbs.forEach(cb => cb.checked = tgt.checked);
      State.set(statePath, tgt.checked ? [...itemCbs].map(cb => cb.value) : []);
    }
    static #bindMulti = path => tgt => this.tglMulti(tgt, path);
    static #bindAll = path => tgt => this.tglAllMulti(tgt, path);
    // --- Tab1イベント群 ---
    static T1 = {
      checkT1Pref: mode => {
        if (!mode) return;
        const phs = State.get("T1ST.phase"), isInit = phs === T1_PHS.INIT, isInvalid = phs >= T1_PHS.INVALID;
        if (isInvalid) { 
          const errStat = ["error", "設定変更検知: リストの再生成・検証が必要です"];
          State.set({ "T1ST.raw.status": errStat, "T1ST.raw.cachedStatus": errStat, "T1ST.extr.status": ["hidden", ""] });
        }
        State.set({ "T1ST.pref.status": ["message", mode === "Dual" ? "Obsidian/mudrockセット抽出対応" : "1ファイル単位抽出（モード混在可）"], ...(isInit || isInvalid ? { "T1ST.phase": isInit ? T1_PHS.READY : T1_PHS.INVALID } : {}) });
      },
      renewRawRefs: tgt => {
        State.set(`T1ST.raw.refs.${tgt.dataset.field}`, tgt.value);
        Evt.T1.checkRawRefs();
      },
      checkRawRefs: () => {
        const flags = Mtd.Util.validateSelect(GLB.fileFields.map(f => State.get(`T1ST.raw.refs.${f.key}`) || ""), 3);
        State.set({ "T1ST.raw.flags": flags, "T1ST.raw.status": flags.some(Boolean) ? ["error", "エラー: 列選択"] : State.get("T1ST.raw.cachedStatus") }); 
      },
      checkExtrRefs: () => {
        const isErr = !(State.get(`T1ST.extr.refs.${GLB.idx.key1}`)?.trim());
        State.set({ "T1ST.extr.flags": [isErr, false, false], "T1ST.extr.status": isErr ? ["error", `エラー: ${GLB.idx.key1}未入力`] : ["hidden", ""] }); 
      }
    };
    // --- Tab2/3イベント群 ---
    static T2 = {
      tglDB: this.#bindMulti("T2ST.asgn.refs.filter"),
      tglAllDB: this.#bindAll("T2ST.asgn.refs.filter"),
      checkAxis: async tgtSelect => {
        const newVal = tgtSelect.value, oldVal = State.get("T2ST.symb.refs.baseKey");
        if (newVal === oldVal) return;
        if (!await NewDOM.confirm("確認", "リセットしますか？")) return (tgtSelect.value = oldVal);
        State.set({ "T2ST.symb.refs.baseKey": newVal }); State.reset("T2ST.symb.refs.rls");
      },
      addSymb: () => State.set("T2ST.symb.refs.rls", [...(State.get("T2ST.symb.refs.rls") || []), { key: `rule_${Date.now()}`, target: "", shp: GLB.symbDefShp, clr: GLB.symbDefClr }]),
      removeSymb: tgtBtn => {
        const key = tgtBtn.dataset.ruleKey;
        if (key) State.set("T2ST.symb.refs.rls", (State.get("T2ST.symb.refs.rls") || []).filter(r => r.key !== key));
      },
      renewSymb: tgtBtn => {
        const idx = tgtBtn.dataset.symbolIdx, type = tgtBtn.dataset.symbolType;
        if (idx == null || !type) return;
        const rls = [...(State.get("T2ST.symb.refs.rls") || [])];
        if (rls[idx]) { rls[idx][type] = tgtBtn.value; State.set("T2ST.symb.refs.rls", rls); }
      },
      tglPrevMode: this.#bindMulti("T2ST.calb.refs.modeMap"),
      tglAllPrevMode: this.#bindAll("T2ST.calb.refs.modeMap"),
      tglCalElm: this.#bindMulti("T2ST.calb.refs.calElms"),
      tglAllCalElm: this.#bindAll("T2ST.calb.refs.calElms"),
      tglPrevItem: this.#bindMulti("T2ST.prev.refs.itemMap"),
      tglAllPrevItem: this.#bindAll("T2ST.prev.refs.itemMap"),
      tglStdzMode: this.#bindMulti("T2ST.stdz.refs.modeMap"),
      tglAllStdzMode: this.#bindAll("T2ST.stdz.refs.modeMap"),
      tglStdzItem: this.#bindMulti("T2ST.stdz.refs.itemMap"),
      tglAllStdzItem: this.#bindAll("T2ST.stdz.refs.itemMap")
    };
    // --- クリック監視 ---
    static #handleClick(e) {
      const tabBtn = e.target.closest('.tab-btn');
      if (tabBtn) return this.switchAPP(tabBtn.dataset.target);
      let actPath = null, btn = null;
      const actBtn = e.target.closest('[data-action]');
      if (actBtn) {
        btn = actBtn;
        actPath = btn.dataset.action;
      } else {
        btn = e.target.closest('[data-ui^="btn-"]');
        if (btn) {
          const secId = btn.closest('details')?.id;
          actPath = this.#ACTION_MAP[secId]?.[btn.dataset.ui];
        }
      }
      if (actPath) {
        const [ns, method] = actPath.split('.');
        if (Ctrl[ns]?.[method]) {
          Ctrl[ns][method](btn);
        } else if (this[ns]?.[method]) {
          this[ns][method](btn);
        }
      }
    }
    // --- 変更監視 ---
    static #handleChange(e) {
      const tgt = e.target, bindPath = tgt.dataset.bind, changePath = tgt.dataset.change;
      if (bindPath) State.set(bindPath, tgt.type === "checkbox" ? tgt.checked : tgt.value);
      if (changePath) {
        const [ns, method] = changePath.split('.');
        this[ns]?.[method]?.(tgt);
      }
    }
    // --- タブ切替 ---
    static switchAPP(tabId) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
      document.getElementById(tabId)?.classList.add("active");
      document.body.setAttribute('data-theme', tabId);
      State.set("GLB.activeTab", tabId);
      Evt.startSession(State.get("GLB.ssId") || "EXCEL_LOCAL_RUN", true);
    }
    // --- 状態復元 ---
    static async #restore(bu) {
      if (!bu || !(await NewDOM.confirm("復元", "前回の作業状態を復元しますか？"))) return false;
      await T2Ctrl.loadDB();
      if (State.get("T2ST.phase") < T2_PHS.LOADED) return true;
      State.set({ "T2ST.asgn.refs.available": bu.asgn.r.available, "T2ST.asgn.refs.filter": bu.asgn.r.filter });
      if (bu.phase < T2_PHS.FILTERED) { State.set("T2ST.asgn.status", bu.asgn.s); return true; } 
      await T2Ctrl.fltrDB();
      if (State.get("T2ST.phase") < T2_PHS.FILTERED) return true;
      State.set({
        "T2ST.symb.refs.baseKey": bu.symb.r.baseKey, "T2ST.symb.refs.rls": bu.symb.r.rls,
        "T2ST.calb.refs.modeMap": bu.calb.r.modeMap, "T2ST.calb.refs.calElms": bu.calb.r.calElms, "T2ST.calb.refs.correction": bu.calb.r.correction, "T2ST.calb.refs.useLOD": bu.calb.r.useLOD, "T2ST.calb.refs.useCal": bu.calb.r.useCal,
        "T2ST.prev.refs.itemMap": bu.prev.r.itemMap, "T2ST.prev.refs.val": bu.prev.r.val, "T2ST.prev.refs.saveIndexName": bu.prev.r.saveIndexName,
        "T2ST.stdz.refs.itemMap": bu.stdz?.r.itemMap || [], "T2ST.stdz.refs.modeMap": bu.stdz?.r.modeMap || [...GLB.optElms], "T2ST.stdz.refs.useLOD": bu.stdz?.r.useLOD || false, "T2ST.stdz.refs.saveIndexName": bu.stdz?.r.saveIndexName || ""
      });
      if (bu.phase >= T2_PHS.PREVIEWED) await T2Ctrl.buildPrev();
      if (State.get("T2ST.phase") === bu.phase) {
        State.set({ "T2ST.asgn.status": bu.asgn.s, "T2ST.symb.status": bu.symb.s, "T2ST.calb.status": bu.calb.s, "T2ST.prev.status": bu.prev.s, "T2ST.stdz.status": bu.stdz?.s || ["hidden", ""] });
      }
      return true;
    }
    // --- セッション開始 ---
    static async startSession(ssId, isSwitch = false) {
      if (!isSwitch) {
        const isConnected = await Ctrl.CoreCtrl.connectApp(ssId);
        if (!isConnected) return; 
      }
      const activeTab = State.get("GLB.activeTab");
      if (activeTab === "tab2" && !isSwitch) {
        if (!(await this.#restore(MakeBU.load()))) { MakeBU.clear(); }
      }
      if (!isSwitch) MakeBU.init(); 
      State.set({ "GLB.isLocked": false, "T1ST.pref.status": ["hidden", ""], "T1ST.phase": T1_PHS.INIT });
      UI.Phs.renewT1Phs(State.get("T1ST.phase")); 
      UI.Phs.renewT2Phs(State.get("T2ST.phase"));
      UI.Phs.renewT3Phs(State.get("T3ST.phase"));
    }
    // --- 初期化 ---
    static async init() {
      UI.Init.build();
      State.subscribe("T1ST.pref.refs.mode", Evt.T1.checkT1Pref);
      State.subscribe(`T1ST.extr.refs.${GLB.idx.key1}`, Evt.T1.checkExtrRefs);
      document.addEventListener("click", this.#handleClick.bind(this)); 
      document.addEventListener("change", this.#handleChange.bind(this));
      IdlTm.init();
      const urlParams = new URLSearchParams(window.location.search);
      const activeMode = window.__APP_MODE__ || urlParams.get('mode') || 'tab1';
      document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
      document.getElementById(activeMode)?.classList.add("active");
      document.body.setAttribute('data-theme', activeMode);
      State.set("GLB.activeTab", activeMode);
      const initSsId = window.__INITIAL_SSID__ || "";
      if (initSsId || isExcelEnv) {
        this.startSession(initSsId || "EXCEL_LOCAL_RUN");
      }
    }
  }
  if (isExcelEnv) {
    Office.onReady(() => Evt.init());
  } else {
    if (document.readyState === 'loading') {
      window.addEventListener("DOMContentLoaded", () => Evt.init());
    } else {
      Evt.init();
    }
  }
</script>
