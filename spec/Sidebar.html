<!-- src/Sidebar.html -->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top">    
    <script src="https://cdn.jsdelivr.net/npm/simple-statistics@7.8.3/dist/simple-statistics.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.1/lib/browser/math.min.js"></script>
    <?!= include("CSS"); ?>
  </head>

  <body data-theme="tab1">
    <nav class="nav-tabs" id="nav">
      <button class="tab-btn active" data-target="tab1">データ抽出</button>
      <button class="tab-btn" data-target="tab2">検量線・標準化</button>
      <button class="tab-btn" data-target="tab3">ダッシュボード</button>
    </nav>

    <main class="scroll-y">
      <!-- Tab1 データ抽出-->
      <div id="tab1" class="tab-content active">
        <fieldset id="tab1Fieldset">
          <details id="prefSec" data-state="active" open>
            <summary>抽出設定</summary>
            <div data-ui="area">
              <div data-ui="mode-box"></div>
            </div>
            <div id="prefBar" class="status-bar" data-status="hidden" data-bind-status="T1ST.pref.status"></div>
          </details>
          <hr>
          <details id="rawSec" data-type="disabled">
            <summary>読込と検証</summary>
            <div class="flex-row">
              <button data-ui="btn-load" data-type="primary">データを取得</button>
              <span class="txt-btninfo">読込シート「File」</span>
            </div>
            <div data-ui="area" style="display: none;">
              <div data-ui="box"></div>
            </div>
            <div data-ui="btn-box" class="field-row" style="display: none;">
              <button data-ui="btn-make" data-type="primary" class="outline" disabled>リスト生成</button>
              <button data-ui="btn-vald" data-type="primary" class="outline" disabled>検証</button>
            </div>
          </details>
          <div id="rawBar" class="status-bar" data-status="hidden" data-bind-status="T1ST.raw.status"></div>
          <hr>
          <details id="extrSec" data-type="disabled">
            <summary>抽出と格納</summary>
            <div class="flex-row">
              <button data-ui="btn-extr" data-type="primary" disabled>データを抽出</button>
              <span class="txt-btninfo">読込シート「Results」</span>
            </div>
            <div data-ui="area" style="display: none;">
              <div data-ui="box"></div>
            </div>
            <div class="field-row">
              <button data-ui="btn-push" data-type="primary" class="outline" style="display: none;" disabled>tracer5iに格納</button>
            </div>
          </details>
          <div id="extrBar" class="status-bar" data-status="hidden" data-bind-status="T1ST.extr.status"></div>
        </fieldset>
      </div>

      <!-- Tab2 検量線・標準化 -->
      <div id="tab2" class="tab-content">
        <fieldset id="tab2Fieldset">
          <details id="asgnSec" open>
            <summary>データ読込・選択</summary>
            <div data-ui="area" style="display: none;">
              <label>データセット選択</label>
              <ob-multi-select data-ui="dset-box" data-change-item="T2.tglDB" data-change-all="T2.tglAllDB" data-bind-opts="T2ST.asgn.refs.available" data-bind-refs="T2ST.asgn.refs.filter"></ob-multi-select>
            </div>
            <div class="field-row">
              <button data-ui="btn-load" data-type="primary">データを読込</button>
              <button data-ui="btn-fltr" data-type="primary" class="outline" disabled>データを確定</button>
            </div>
          </details>
          <div id="asgnBar" class="status-bar" data-status="hidden" data-bind-status="T2ST.asgn.status"></div>
          <hr>
          <details id="symbSec" data-type="disabled">
            <summary>シンボル設定</summary>
            <div data-ui="area" style="display: none;">
              <label>属性選択</label>
              <div class="field-row" style="margin-top: var(--unit)">
                <div data-ui="axis-box"></div>
                <button data-ui="btn-reset" data-type="primary" class="outline">リセット</button>
              </div>
              <label>シンボル設定</label>
              <div class="scroll-y" style="max-height: calc(var(--unit) * 50); border: 1px solid var(--grey200); border-radius: var(--unit); padding: var(--unit) calc(var(--unit) * 2);">
                <ob-symbol-table data-ui="symb-tbl"></ob-symbol-table>
              </div>
            </div>
            <div class="field-row">
              <button data-ui="btn-symb" data-type="primary" disabled>シンボル確定</button>
            </div>
          </details>
          <div id="symbBar" class="status-bar" data-status="hidden" data-bind-status="T2ST.symb.status"></div>
          <hr>
          <details id="prevSec" data-type="disabled">
            <summary>プレビュー</summary>
            <div data-ui="chart-box"></div>
            <div data-ui="stats-tbl"></div>
            <div data-ui="area">
              <div class="field-row">
                <div class="field-col">
                  <label>プレビュー値</label>
                  <div data-ui="val-box"></div>
                </div>
              </div>
              <label>対象Item</label>
              <ob-multi-select data-ui="item-box" data-change-item="T2.tglPrevItem" data-change-all="T2.tglAllPrevItem" data-bind-refs="T2ST.prev.refs.itemMap"></ob-multi-select>
              <div class="field-row">
                <button data-ui="btn-make" data-type="primary" disabled>プレビュー更新</button>
              </div>
              <hr style="margin: calc(var(--unit) * 4) 0 calc(var(--unit) * 2);">
              <details id="calbSec" class="sub-sec" open>
                <summary>プレビュー補正設定</summary>
                <div class="field-row">
                  <div class="field-col">
                    <label>補正方法</label>
                    <div data-ui="corr-box"></div>
                  </div>
                </div>
                <label>Obsidianモード計測値</label>
                <ob-multi-select data-ui="mode-box" data-change-item="T2.tglPrevMode" data-change-all="T2.tglAllPrevMode" data-bind-refs="T2ST.calb.refs.modeMap"></ob-multi-select>
                <label>検量線適用対象</label>
                <ob-multi-select data-ui="cal-elm-box" data-change-item="T2.tglCalElm" data-change-all="T2.tglAllCalElm" data-bind-refs="T2ST.calb.refs.calElms"></ob-multi-select>
                <div class="field-row">
                  <div data-ui="lod-box" class="field-col"></div>
                  <div data-ui="cal-tgl-box" class="field-col"></div>
                </div>
              </details>
            </div>
          </details>
          <div id="prevBar" class="status-bar" data-status="hidden" data-bind-status="T2ST.prev.status"></div>
          <hr>
          <details id="stdzSec" data-type="disabled">
            <summary>標準化と出力</summary>
            <label>対象Item（検量線計算用）</label>
            <ob-multi-select data-ui="item-box" data-change-item="T2.tglStdzItem" data-change-all="T2.tglAllStdzItem" data-bind-refs="T2ST.stdz.refs.itemMap"></ob-multi-select>
            <label>Obsidianモード計測値</label>
            <ob-multi-select data-ui="mode-box" data-change-item="T2.tglStdzMode" data-change-all="T2.tglAllStdzMode" data-bind-refs="T2ST.stdz.refs.modeMap"></ob-multi-select>
            <div class="field-row">
              <div data-ui="lod-box" class="field-col"></div>
            </div>
            <div class="field-row" style="margin-top: calc(var(--unit) * 3);">
              <input type="text" class="form-control" placeholder="インデックス名を入力" data-bind="T2ST.stdz.refs.saveIndexName">
              <button data-ui="btn-save" data-type="primary">検量線出力</button>
            </div>
            <div class="field-row">
              <button data-ui="btn-push" data-type="primary" class="outline">新PXRFシート出力</button>
            </div>
          </details>
          <div id="stdzBar" class="status-bar" data-status="hidden" data-bind-status="T2ST.stdz.status"></div>
        </fieldset>
      </div>

      <!-- Tab3 ダッシュボード -->
      <div id="tab3" class="tab-content">
        <fieldset id="tab3Fieldset">
          <details id="instSec" open>
            <summary>データ読込</summary>
            <div class="field-row">
              <button data-ui="btn-load" data-type="primary">データを読込</button>
            </div>
          </details>
          <div id="instBar" class="status-bar" data-status="hidden" data-bind-status="T3ST.inst.status"></div>
          <hr>
          <details id="repoSec" data-type="disabled">
            <summary>レポート作成</summary>
            <div class="field-row">
              <button data-ui="btn-repo" data-type="primary">ダッシュボードを展開</button>
            </div>
          </details>
          <div id="repoBar" class="status-bar" data-status="hidden" data-bind-status="T3ST.repo.status"></div>
           <div style="flex-grow: 1; min-height: calc(var(--unit) * 2);"></div>
          <img src="https://pingu.jp/SOP/assets/img/kv/chara_14_1.png" alt="ピング" style="position: sticky; bottom: 0; display: block; margin: 0 auto; width: 200px;">
        </fieldset>
      </div>
    </main>

    <dialog id="universalConfirm">
      <h3 id="uDialogTitle">確認</h3>
      <p id="uDialogMessage"></p>
      <div class="field-row">
        <button id="uDialogCancelBtn" data-type="primary" class="outline">キャンセル</button>
        <button id="uDialogConfirmBtn" data-type="primary">OK</button>
      </div>
    </dialog>

    <dialog id="idleToast">
      <h3 id="idleToastTitle"></h3>
      <p id="idleToastMessage"></p>
      <div class="field-row">
        <button id="idleToastOkBtn" data-type="primary">OK</button>
      </div>
    </dialog>

    <script>
      window.__INITIAL_SSID__ = "<?= typeof initialSsId !== 'undefined' ? initialSsId : '' ?>";
      window.__APP_MODE__ = "<?= typeof appMode !== 'undefined' ? appMode : '' ?>";
    </script>

    <?!= include('Global'); ?>
    <?!= include('PlatformAdapter'); ?>
    <?!= include('Model'); ?>
    <?!= include('Method'); ?>
    <?!= include('Component'); ?>
    <?!= include('Chart'); ?>
    <?!= include('View'); ?>
    <?!= include('Controller'); ?>
    <?!= include('Event'); ?>
  </body>
</html>
